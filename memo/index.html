<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MD Memo</title>
<style>
:root{--bg:#f1f5f9;--surface:#ffffff;--text:#0f172a;--muted:#64748b;--border:#cbd5e1;--accent:#2563eb;--accent-hover:#1d4ed8;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0b1120;--surface:#111827;--text:#f1f5f9;--muted:#94a3b8;--border:#334155;--accent:#3b82f6;--accent-hover:#2563eb;--bad:#f87171}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font:15px/1.6 "Pretendard",-apple-system,BlinkMacSystemFont,"Malgun Gothic","Segoe UI",sans-serif;padding:16px}
form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px;box-shadow:0 12px 32px rgba(0,0,0,.25)}
h1{font-size:1.2rem;margin:0 0 4px;display:flex;align-items:center;gap:8px}p.sub{margin:0 0 18px;color:var(--muted);font-size:.88rem}
input[type=password]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
label{display:flex;align-items:center;gap:7px;margin:12px 0 16px;font-size:.85rem;color:var(--muted);cursor:pointer;user-select:none}
button{width:100%;font:inherit;font-weight:700;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;transition:background .15s}
button:hover:not(:disabled){background:var(--accent-hover)}
button:disabled{opacity:.6;cursor:default}#msg{min-height:1.4em;margin:10px 0 0;font-size:.85rem;color:var(--muted)}#msg.err{color:var(--bad)}
</style></head><body>
<form id="f" autocomplete="on">
<h1>📝 MD Memo</h1><p class="sub">지정된 페이지 접근 키를 입력해야 열 수 있습니다.</p>
<input type="text" name="username" value="md-memo" autocomplete="username" hidden>
<input type="password" id="pw" autocomplete="current-password" placeholder="페이지 접근 키 입력" aria-label="페이지 접근 키" required autofocus>
<label><input type="checkbox" id="keep"> 이 브라우저에서 잠금 해제 유지</label>
<button id="go" type="submit">복호화하여 열기</button><p id="msg" role="status"></p>
</form>

<script>
(function () {
  var P = document.getElementById('payload'), KEY = 'memo-md-unlock-v1', SRC_KEY = '__memo_clean_app_html_v1__';
  var dec = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var enc = function (u) { var s = ''; for (var i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
  function get(store) { try { return store.getItem(KEY); } catch (e) { return null; } }
  function put(store, v) { try { store.setItem(KEY, v); } catch (e) {} }
  function drop() { try { sessionStorage.removeItem(KEY); localStorage.removeItem(KEY); sessionStorage.removeItem(SRC_KEY); } catch (e) {} }
  async function deriveRaw(pw) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: dec(P.dataset.salt), iterations: +P.dataset.iter, hash: 'SHA-256' }, base, 256));
  }
  async function openWith(raw, onVerified) {
    var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    var gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: dec(P.dataset.iv) }, key, dec(P.textContent));
    var html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    if (onVerified) onVerified();
    try { sessionStorage.setItem(SRC_KEY, html); } catch (e) {}
    window.__MEMO_CLEAN_APP_HTML__ = html;
    document.open(); document.write(html); document.close();
  }
  var f = document.getElementById('f'), msg = document.getElementById('msg'), go = document.getElementById('go');
  if (!window.crypto || !window.crypto.subtle) {
    msg.className = 'err'; msg.textContent = 'HTTPS(github.io) 또는 로컬 파일 환경에서 열어주세요.'; return;
  }
  var saved = get(sessionStorage) || get(localStorage);
  if (saved) Promise.resolve().then(function () { return openWith(dec(saved)); }).catch(function () { drop(); });
  f.addEventListener('submit', async function (e) {
    e.preventDefault();
    go.disabled = true; msg.className = ''; msg.textContent = '복호화 중입니다...';
    try {
      var keep = document.getElementById('keep').checked;
      var raw = await deriveRaw(document.getElementById('pw').value);
      await openWith(raw, function () {
        put(sessionStorage, enc(raw));
        if (keep) put(localStorage, enc(raw)); else { try { localStorage.removeItem(KEY); } catch (x) {} }
      });
    } catch (err) {
      go.disabled = false; msg.className = 'err'; msg.textContent = '페이지 접근 키가 맞지 않습니다.';
    }
  });
})();
</script>
