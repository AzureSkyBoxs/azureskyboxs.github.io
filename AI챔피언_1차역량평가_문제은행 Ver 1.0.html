/* ─────────── 문항 렌더 ─────────── */
function renderQuestion(){
  stopTimer();
  $('#homeBtn').style.display='';
  const ss = S.session, q = ss.queue[ss.idx];
  const total = ss.queue.length;
  const modeName = {practice:'🌱 연습',exam:'⏱️ 실전',retry:'🔁 오답 트레이닝'}[ss.mode];
  const srcTag = q.src==='word'
    ? `<span class="qtag src-word">모의평가 ${parseInt(q.id.slice(1),10)}번</span>`
    : `<span class="qtag src-lec">${LEC_LABEL[q.lec]}</span>`;

  view().innerHTML = `
  <div class="quiz-head">
    <div class="qprog">
      <div class="txt"><span>${modeName}</span><span>${ss.idx+1} / ${total}</span></div>
      <div class="bar"><i style="width:${ss.idx/total*100}%"></i></div>
    </div>
    <button class="quit" onclick="quitSession()">그만두기</button>
  </div>
  <div class="timer-zone">
    <div class="ring-wrap" id="ring">
      <svg width="100%" height="100%" viewBox="0 0 92 92">
        <circle class="ring-bg" cx="46" cy="46" r="40"/>
        <circle class="ring-fg" id="ringFg" cx="46" cy="46" r="40" stroke-dasharray="251.3" stroke-dashoffset="0"/>
      </svg>
      <div class="ring-num" id="ringNum">${timeLimit()}</div>
    </div>
  </div>
  <div class="qcard">
    <div class="qtags">
      ${srcTag}
      <span class="qtag type">${q.orig ? TYPE_LABEL[q.orig]+' 기반' : '객관식'}</span>
      <span class="qtag cat">${esc(q.cat)}</span>
      <span class="qtag d-${q.diff}">난이도 ${q.diff}</span>
    </div>
    <div class="qtext">${esc(q.q)}</div>
    <div class="choices" id="choices">${q.opts.map((o,i)=>
      `<button class="choice" data-i="${i}" onclick="pickAnswer(${i})"><span class="key">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="revealSlot"></div>
  </div>
  <div class="kbd-hint">키보드 1~4 로 선택 · Enter 다음 문항</div>`;

  startCountdown();
}

function startCountdown(){
  const fg = $('#ringFg'), num = $('#ringNum'), ring = $('#ring');
  const C = 251.3;
  const LIMIT = timeLimit();
  const warnAt = Math.ceil(LIMIT/2), dangerAt = Math.max(3, Math.round(LIMIT/5));
  const deadline = Date.now() + LIMIT*1000;
  S.timer = setInterval(()=>{
    const remainMs = deadline - Date.now();
    const left = Math.max(0, Math.ceil(remainMs/1000));
    if(!document.body.contains(ring)){ stopTimer(); return; }
    num.textContent = left;
    fg.style.strokeDashoffset = C * Math.min(1, Math.max(0, 1 - remainMs/(LIMIT*1000)));
    ring.classList.toggle('warn', left<=warnAt && left>dangerAt);
    ring.classList.toggle('danger', left<=dangerAt && left>0);
    if (remainMs<=0){ stopTimer(); onTimeout(); }
  }, 120);
}

function markTimerDone(label){
  const ring=$('#ring'); if(!ring) return;
  ring.classList.remove('warn','danger'); ring.classList.add('done');
  $('#ringNum').textContent=label;
  $('#ringFg').style.strokeDashoffset = 0;
}

/* ─────────── 응답 처리 ─────────── */
function recordAnswer(q, correct, pickedIdx){
  const ss = S.session;
  ss.answers.push({ id:q.id, correct, picked:pickedIdx });
  S.history.solved++; if(correct) S.history.correct++;
  if (correct){
    ss.correct++; ss.streak++;
    if (ss.mode==='retry') removeWrong(q.id);
  } else {
    ss.streak=0;
    addWrong(q.id);
  }
  saveState();
}

function pickAnswer(i){
  const ss=S.session; if(!ss) return;
  const q=ss.queue[ss.idx];
  if(ss.answers.length>ss.idx) return;
  stopTimer();
  const correct = i===q.a;
  recordAnswer(q, correct, i);
  if (ss.mode==='exam'){
    document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
    const el=document.querySelector(`.choice[data-i="${i}"]`); if(el) el.classList.add('picked');
    markTimerDone('제출');
    setTimeout(nextQuestion, 320);
  } else {
    revealMcq(q, i, correct, false);
  }
}

function onTimeout(){
  const ss=S.session; if(!ss) return;
  const q=ss.queue[ss.idx];
  if (ss.answers.length>ss.idx) return;
  recordAnswer(q, false, null);
  if (ss.mode==='exam'){ markTimerDone('시간초과'); setTimeout(nextQuestion, 320); }
  else revealMcq(q, null, false, true);
}

function revealMcq(q, pickedIdx, correct, timeout){
  markTimerDone(correct?'정답':'오답');
  document.querySelectorAll('.choice').forEach(b=>{
    b.disabled=true;
    const i = +b.dataset.i;
    if (i===q.a) b.classList.add('correct');
    else if (i===pickedIdx) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  if (correct) fxCorrect(S.session.streak); else fxWrong(timeout);
  $('#revealSlot').innerHTML = `
    <div class="reveal ${correct?'ok':'no'}">
      <div class="verdict">${correct?'🎉 정답!':(timeout?'⏰ 시간 초과!':'❌ 오답')}</div>
      <div class="ans-line">정답 : <b>${'ABCD'[q.a]}. ${esc(q.opts[q.a])}</b></div>
      <div class="expl-label">해설</div>
      <div class="expl">${esc(q.expl)}</div>
    </div>
    <button class="next-btn" onclick="nextQuestion()">다음 문항 →</button>`;
  $('.next-btn').focus();
}


function nextQuestion(){
  const ss=S.session; if(!ss) return;
  stopTimer();
  if (ss.idx+1 >= ss.queue.length){ renderResult(); return; }
  ss.idx++;
  renderQuestion();
}
function quitSession(){
  const ss=S.session; if(!ss) return goHome();
  if (ss.answers.length && ss.mode!=='practice') { renderResult(true); }
  else goHome();
}

/* ─────────── 이펙트 ─────────── */
function fxCorrect(streak){
  const fx=$('#fx');
  const colors=['#0E7C66','#18A184','#F5A623','#2F5FD0','#FF9A3D'];
  for(let i=0;i<26;i++){
    const c=document.createElement('div'); c.className='confetti';
    c.style.left=(35+Math.random()*30)+'%';
    c.style.top='-12px';
    c.style.background=colors[i%colors.length];
    c.style.animationDuration=(0.9+Math.random()*0.9)+'s';
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    fx.appendChild(c); setTimeout(()=>c.remove(),1900);
  }
  stampFx('⭕');
  if (streak>=2){
    const cb=$('#combo'); cb.style.display='block'; cb.textContent=`🔥 ${streak} COMBO`;
    clearTimeout(cb._t); cb._t=setTimeout(()=>cb.style.display='none',1500);
  }
}
function fxWrong(timeout){ stampFx(timeout?'⏰':'❌'); }
function stampFx(ch){
  const s=document.createElement('div'); s.className='stamp'; s.textContent=ch;
  document.body.appendChild(s); setTimeout(()=>s.remove(),620);
}

/* ─────────── 결과 화면 ─────────── */
function renderResult(partial){
  stopTimer();
  const ss=S.session;
  const answered = ss.answers.length;
  const total = ss.mode==='exam' ? ss.queue.length : answered;
  const correct = ss.correct;
  const pct = total ? Math.round(correct/total*100) : 0;
  const wrong = ss.answers.filter(a=>!a.correct);

  let gradeEmoji='💪', gradeMsg='조금만 더!';
  if (pct>=90){gradeEmoji='🏆'; gradeMsg='완벽에 가까워요!';}
  else if (pct>=75){gradeEmoji='✅'; gradeMsg='통과권! 이 흐름 유지하세요';}
  else if (pct>=60){gradeEmoji='📈'; gradeMsg='커트라인까지 한 걸음';}

  if (ss.mode==='exam' && !partial){
    if (S.history.examBest===null || pct>S.history.examBest) S.history.examBest=pct;
    saveState();
  }
  const passTag = ss.mode==='exam'
    ? `<div class="pass-tag ${pct>=75?'pass':'fail'}">${pct>=75?'통과 기준(75점) 충족 🎓':'통과 기준(75점) 미달 — 오답 트레이닝 추천'}</div>` : '';

  $('#homeBtn').style.display='';
  view().innerHTML = `
  <div class="result-hero">
    <div class="grade">${gradeEmoji}</div>
    <h2>${partial?'중간 결과':'세션 완료'} · ${gradeMsg}</h2>
    <p>${{practice:'연습 모드',exam:'실전 모드 (객관식 60문항)',retry:'오답 트레이닝'}[ss.mode]}</p>
    <div class="score-row">
      <div class="score-item"><b>${pct}점</b><span>100점 환산</span></div>
      <div class="score-item"><b>${correct}/${total}</b><span>정답 수</span></div>
      <div class="score-item"><b>${wrong.length}</b><span>오답</span></div>
    </div>
    ${passTag}
  </div>
  ${wrong.length ? `
  <div class="wrong-list">
    <h3>❌ 틀린 문항 정답·해설 (${wrong.length}문항)</h3>
    ${wrong.map(a=>{
      const q=byId(a.id);
      const src = q.src==='word' ? `모의평가 ${parseInt(q.id.slice(1),10)}번` : LEC_LABEL[q.lec];
      const yourAns = a.picked===null ? '⏰ 시간 초과 (무응답)' : `내 답 : ${'ABCD'[a.picked]}. ${esc(q.opts[a.picked])}`;
      const realAns = `정답 : ${'ABCD'[q.a]}. ${esc(q.opts[q.a])}`;
      const ex = q.expl;
      return `<div class="wrong-item">
        <div class="qtags"><span class="qtag ${q.src==='word'?'src-word':'src-lec'}">${src}</span><span class="qtag type">${q.orig ? TYPE_LABEL[q.orig]+" 기반" : "객관식"}</span><span class="qtag d-${q.diff}">난이도 ${q.diff}</span></div>
        <div class="wq">${esc(q.q)}</div>
        <div class="wa user">${yourAns}</div>
        <div class="wa real">${realAns}</div>
        <div class="wex">${esc(ex)}</div>
      </div>`;
    }).join('')}
  </div>` : `<div class="empty"><div class="big">🌟</div><p><b>전 문항 정답!</b><br>오늘의 컨디션이면 실전도 문제없어요.</p></div>`}
  <div class="res-actions">
    ${wrong.length?`<button class="primary" onclick="renderWrongNote()">🔁 방금 틀린 문제 포함 오답노트 관리·트레이닝 (${S.wrongIds.length}문항)</button>`:''}
    <button class="primary" style="${wrong.length?'background:var(--ink)':''}" onclick="${ss.mode==='exam'?'startExam()':'renderPracticeSetup()'}">한 번 더 도전</button>
    <button class="ghost" onclick="goHome()">홈으로</button>
  </div>`;
  S.session=null;
  window.scrollTo({top:0});
}


/* ─────────── 작업형 대비 ─────────── */
function renderWorkList(){
  stopTimer(); S.session=null;
  $('#homeBtn').style.display='';
  view().innerHTML = `
  <div class="wt-note">
    <b>📌 공통 조건 — 모든 작업형 과제에 적용</b>
    <ul>${WORK_COMMON.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
  </div>
  <div class="wt-note" style="border-color:#F3DFAE;background:#FFFBF0">
    <b style="color:#8A5B00">🎯 실전 작업형은 45점 · 20분 · AI 이용 허용</b>
    <ul><li>완성보다 프롬프트 설계의 논리(데이터 정의 → 규칙 명시 → 제약 조건 → 검증 방법)가 평가 핵심입니다.</li>
    <li>각 과제의 '공략 포인트'를 읽고, 실제로 AI에게 시켜 20분 안에 산출물을 뽑는 연습을 해보세요.</li></ul>
  </div>
  <div class="wt-list">
    ${WORKS.map(w=>`<button class="wt-item" onclick="renderWorkDetail(${w.n})">
      <span class="no">${String(w.n).padStart(2,'0')}</span>
      <span><h4>${esc(w.title)}</h4><p>원본 ${w.orig}번 · 수행 과제 ${w.todo.length}개 · 제출물 ${w.deliv.length}종</p></span>
      <span class="arrow">→</span>
    </button>`).join('')}
  </div>`;
  window.scrollTo({top:0});
}

function renderWorkDetail(n){
  const w = WORKS.find(x=>x.n===n);
  $('#homeBtn').style.display='';
  const colsTable = w.cols.length ? `
    ${w.files.map(f=>`<span class="wd-file">📄 ${esc(f)}</span>`).join(' ')}
    <table class="wd-cols"><tr><th>컬럼</th><th>설명</th></tr>
    ${w.cols.map(c=>`<tr><td>${esc(c[0])}</td><td>${esc(c[1])}</td></tr>`).join('')}</table>` : '<p style="font-size:.82rem;color:var(--sub)">별도 데이터 명세 없음</p>';
  const prev = WORKS.find(x=>x.n===n-1), next = WORKS.find(x=>x.n===n+1);
  view().innerHTML = `
  <div class="qcard">
    <div class="qtags">
      <span class="qtag src-word">작업형 ${w.n} / 10</span>
      <span class="qtag cat">원본 ${w.orig}번</span>
      <span class="qtag type">AI 활용 허용</span>
    </div>
    <div class="qtext" style="margin-bottom:4px">${esc(w.title)}</div>

    <div class="wd-sec"><div class="sec-label">📖 시나리오</div>
      <div class="scenario">${esc(w.scenario)}</div></div>

    <div class="wd-sec"><div class="sec-label">🗂️ 제공 데이터</div>${colsTable}</div>

    <div class="wd-sec"><div class="sec-label">✅ 수행 과제</div>
      <ul class="wd-steps">${w.todo.map((t,i)=>`<li><span class="n">${i+1}</span><span>${esc(t)}</span></li>`).join('')}</ul></div>

    <div class="wd-sec"><div class="sec-label">📦 제출물</div>
      <ul class="wd-steps deliv">${w.deliv.map((t,i)=>`<li><span class="n">${i+1}</span><span>${esc(t)}</span></li>`).join('')}</ul></div>

    <div class="wd-sec">
      <div class="wd-tip"><div class="tip-head">💡 프롬프트 공략 포인트</div>${esc(w.tip)}</div>
    </div>

    <div class="wd-sec"><div class="sec-label">🧑‍⚖️ 공통 채점 기준</div>
      <ul class="wd-rubric">${WORK_RUBRIC.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>
  </div>
  <div class="wd-nav">
    ${prev?`<button onclick="renderWorkDetail(${prev.n})">← ${String(prev.n).padStart(2,'0')} ${esc(prev.title.slice(0,12))}…</button>`:''}
    <button onclick="renderWorkList()">목록</button>
    ${next?`<button onclick="renderWorkDetail(${next.n})">${String(next.n).padStart(2,'0')} ${esc(next.title.slice(0,12))}… →</button>`:''}
  </div>`;
  window.scrollTo({top:0});
}

/* ─────────── 키보드 ─────────── */
document.addEventListener('keydown', e=>{
  const ss=S.session; if(!ss) return;
  if (['1','2','3','4'].includes(e.key)){
    const q=ss.queue[ss.idx];
    if (q && ss.answers.length<=ss.idx){
      const btn=document.querySelector(`.choice[data-i="${+e.key-1}"]`);
      if(btn && !btn.disabled) pickAnswer(+e.key-1);
    }
  }
  if (e.key==='Enter'){
    const nb=document.querySelector('.next-btn');
    if(nb){ e.preventDefault(); nextQuestion(); }
  }
});

/* ─────────── 부팅 ─────────── */
(async ()=>{ await loadState(); renderHome(); })();

</script>
</body>
</html>
