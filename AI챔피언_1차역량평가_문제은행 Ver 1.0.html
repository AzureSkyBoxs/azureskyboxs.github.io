<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI 챔피언 1차 역량평가 대비 문제은행</title>
<style>
:root{
  --bg:#EDF1F5; --card:#FFFFFF; --ink:#17263B; --sub:#5B6B80; --line:#D7E0EA;
  --pine:#0E7C66; --pine-deep:#0A5B4B; --pine-soft:#E2F3EE;
  --amber:#F5A623; --amber-soft:#FEF3DD;
  --red:#DE4B54; --red-soft:#FCE9EA;
  --blue:#2F5FD0; --blue-soft:#E8EEFB;
  --shadow:0 2px 6px rgba(23,38,59,.06), 0 10px 24px rgba(23,38,59,.07);
  --mono:ui-monospace,'Cascadia Code','JetBrains Mono','D2Coding',Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.6; min-height:100vh;
  background-image:radial-gradient(circle at 12% -8%, #DDEBE6 0, transparent 42%),radial-gradient(circle at 105% 8%, #E4EAF7 0, transparent 40%);
  background-attachment:fixed;
}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 80px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ── 헤더 ── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--pine) 0%,var(--pine-deep) 100%);display:grid;place-items:center;color:#fff;font-weight:800;font-size:.95rem;letter-spacing:-.5px;box-shadow:var(--shadow)}
.brand h1{font-size:1.02rem;font-weight:800;letter-spacing:-.3px;line-height:1.25}
.brand small{display:block;font-size:.72rem;color:var(--sub);font-weight:600}
.home-btn{font-size:.8rem;font-weight:700;color:var(--sub);padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card)}
.home-btn:hover{color:var(--pine);border-color:var(--pine)}

/* ── 홈 ── */
.hero{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:26px 24px;box-shadow:var(--shadow);margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"7.9 ~ 7.10 시험";position:absolute;top:20px;right:-38px;transform:rotate(35deg);background:var(--amber);color:#5C3E00;font-size:.66rem;font-weight:800;padding:4px 44px;letter-spacing:1px}
.hero .eyebrow{font-size:.72rem;font-weight:800;color:var(--pine);letter-spacing:1.5px;margin-bottom:6px}
.hero h2{font-size:1.5rem;font-weight:800;letter-spacing:-.8px;line-height:1.35;margin-bottom:8px;word-break:keep-all}
.hero p{font-size:.86rem;color:var(--sub)}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font-size:.72rem;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--pine-soft);color:var(--pine-deep)}
.chip.warn{background:var(--amber-soft);color:#8A5B00}
.chip.info{background:var(--blue-soft);color:var(--blue)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 12px;text-align:center}
.stat b{display:block;font-size:1.35rem;font-weight:800;font-family:var(--mono);letter-spacing:-1px}
.stat span{font-size:.7rem;color:var(--sub);font-weight:700}
.stat.g b{color:var(--pine)} .stat.a b{color:#C77E00} .stat.r b{color:var(--red)} .stat.b b{color:var(--blue)}

.modes{display:grid;gap:12px;margin-bottom:16px}
.mode{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:20px;display:flex;gap:16px;align-items:center;text-align:left;box-shadow:var(--shadow);transition:transform .12s,border-color .12s;width:100%}
.mode:hover{transform:translateY(-2px);border-color:var(--pine)}
.mode:active{transform:scale(.99)}
.mode .icon{flex:0 0 54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:1.5rem}
.mode.practice .icon{background:var(--pine-soft)} .mode.exam .icon{background:var(--amber-soft)} .mode.retry .icon{background:var(--red-soft)}
.mode h3{font-size:1.05rem;font-weight:800;letter-spacing:-.4px}
.mode p{font-size:.8rem;color:var(--sub);margin-top:2px;word-break:keep-all}
.mode .badge{margin-left:auto;flex:0 0 auto;font-size:.72rem;font-weight:800;color:var(--sub);background:var(--bg);padding:6px 11px;border-radius:999px;font-family:var(--mono)}
.mode.retry .badge.hot{background:var(--red-soft);color:var(--red)}

/* ── 필터 시트 ── */
.sheet{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.sheet h3{font-size:1.05rem;font-weight:800;margin-bottom:4px}
.sheet .sub{font-size:.8rem;color:var(--sub);margin-bottom:16px}
.fgroup{margin-bottom:16px}
.fgroup label{display:block;font-size:.74rem;font-weight:800;color:var(--sub);letter-spacing:.5px;margin-bottom:8px}
.opts-row{display:flex;flex-wrap:wrap;gap:8px}
.fopt{font-size:.8rem;font-weight:700;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--sub);transition:.12s}
.fopt.on{background:var(--pine);border-color:var(--pine);color:#fff}
.start-btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--pine);color:#fff;font-size:.95rem;font-weight:800;letter-spacing:-.3px;margin-top:6px;transition:.12s;text-align:center}
.start-btn:hover{background:var(--pine-deep)}
.start-btn:disabled{background:var(--line);color:var(--sub);cursor:not-allowed}

/* ── 퀴즈 화면 ── */
.quiz-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qprog{flex:1}
.qprog .txt{display:flex;justify-content:space-between;font-size:.72rem;font-weight:800;color:var(--sub);margin-bottom:5px;font-family:var(--mono)}
.bar{height:8px;background:#DBE4ED;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pine),#18A184);border-radius:99px;transition:width .3s}
.quit{font-size:.74rem;font-weight:700;color:var(--sub);padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);flex:0 0 auto}

/* 타이머 링 — 시그니처 */
.timer-zone{display:flex;justify-content:center;margin:4px 0 14px}
.ring-wrap{position:relative;width:92px;height:92px}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:#DBE4ED;stroke-width:7}
.ring-fg{fill:none;stroke:var(--pine);stroke-width:7;stroke-linecap:round;transition:stroke .3s}
.ring-num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:1.7rem;font-weight:800;letter-spacing:-1px}
.ring-wrap.warn .ring-fg{stroke:var(--amber)} .ring-wrap.warn .ring-num{color:#C77E00}
.ring-wrap.danger .ring-fg{stroke:var(--red)} .ring-wrap.danger .ring-num{color:var(--red)}
.ring-wrap.danger{animation:pulse .55s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.ring-wrap.done .ring-fg{stroke:var(--line)} .ring-wrap.done .ring-num{font-size:.85rem;color:var(--sub)}

.combo{position:fixed;top:14px;right:14px;z-index:50;background:linear-gradient(135deg,#FF9A3D,#F5622E);color:#fff;font-weight:800;font-size:.85rem;font-family:var(--mono);padding:8px 15px;border-radius:999px;box-shadow:0 6px 18px rgba(245,98,46,.4);display:none;animation:comboPop .3s}
@keyframes comboPop{0%{transform:scale(.5)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

.qcard{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.qtags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.qtag{font-size:.68rem;font-weight:800;padding:4px 10px;border-radius:7px;letter-spacing:.3px}
.qtag.src-word{background:var(--blue-soft);color:var(--blue)}
.qtag.src-lec{background:var(--pine-soft);color:var(--pine-deep)}
.qtag.cat{background:#F0F3F7;color:var(--sub)}
.qtag.d-하{background:#EAF6EC;color:#2E7D46} .qtag.d-중{background:var(--amber-soft);color:#8A5B00} .qtag.d-상{background:var(--red-soft);color:var(--red)}
.qtag.type{background:#EFEAFB;color:#6741C6}
.qtext{font-size:1.01rem;font-weight:700;letter-spacing:-.3px;line-height:1.65;margin-bottom:18px;word-break:keep-all}

.choices{display:grid;gap:9px}
.choice{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;padding:13px 15px;border-radius:13px;border:1.5px solid var(--line);background:#FBFCFE;font-size:.9rem;line-height:1.55;transition:.12s;word-break:keep-all}
.choice .key{flex:0 0 26px;height:26px;border-radius:8px;background:#E8EDF3;color:var(--sub);display:grid;place-items:center;font-weight:800;font-size:.78rem;font-family:var(--mono);margin-top:1px}
.choice:not(:disabled):hover{border-color:var(--pine);background:#F5FBF9}
.choice.picked{border-color:var(--blue);background:var(--blue-soft)}
.choice.correct{border-color:var(--pine);background:var(--pine-soft)}
.choice.correct .key{background:var(--pine);color:#fff}
.choice.wrong{border-color:var(--red);background:var(--red-soft)}
.choice.wrong .key{background:var(--red);color:#fff}
.choice:disabled{cursor:default;opacity:1}
.choice.dim{opacity:.5}

.think-box{border:1.5px dashed var(--line);border-radius:13px;padding:16px;background:#FBFCFE;font-size:.85rem;color:var(--sub);text-align:center;margin-bottom:4px;word-break:keep-all}
.think-box b{color:var(--ink)}

.reveal{margin-top:16px;border-radius:14px;padding:16px;animation:fadeUp .3s}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.reveal.ok{background:var(--pine-soft);border:1.5px solid #BCE3D8}
.reveal.no{background:var(--red-soft);border:1.5px solid #F3C4C7}
.reveal.neutral{background:var(--blue-soft);border:1.5px solid #C9D8F5}
.reveal .verdict{font-size:.95rem;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.reveal.ok .verdict{color:var(--pine-deep)} .reveal.no .verdict{color:var(--red)} .reveal.neutral .verdict{color:var(--blue)}
.reveal .ans-line{font-size:.84rem;font-weight:700;margin-bottom:8px;word-break:keep-all}
.reveal .expl{font-size:.84rem;line-height:1.7;color:#2B3B52;word-break:keep-all}
.reveal .expl-label{font-size:.68rem;font-weight:800;letter-spacing:1px;color:var(--sub);margin:10px 0 4px}

.self-grade{display:flex;gap:9px;margin-top:14px}
.self-grade button{flex:1;padding:12px;border-radius:12px;font-size:.86rem;font-weight:800;border:1.5px solid}
.sg-ok{background:var(--pine-soft);border-color:#BCE3D8;color:var(--pine-deep)}
.sg-ok:hover{background:#CFEDE4}
.sg-no{background:var(--red-soft);border-color:#F3C4C7;color:var(--red)}
.sg-no:hover{background:#F8D9DB}

.next-btn{width:100%;margin-top:14px;padding:14px;border-radius:13px;background:var(--ink);color:#fff;font-size:.92rem;font-weight:800;transition:.12s}
.next-btn:hover{background:#22344E}
.kbd-hint{text-align:center;font-size:.68rem;color:#93A2B5;margin-top:10px;font-family:var(--mono)}

/* ── 결과 화면 ── */
.result-hero{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:28px 22px;text-align:center;box-shadow:var(--shadow);margin-bottom:14px}
.result-hero .grade{font-size:3rem;line-height:1}
.result-hero h2{font-size:1.35rem;font-weight:800;letter-spacing:-.5px;margin:10px 0 4px}
.result-hero p{font-size:.84rem;color:var(--sub)}
.score-row{display:flex;justify-content:center;gap:22px;margin-top:18px}
.score-item b{display:block;font-size:1.5rem;font-weight:800;font-family:var(--mono);letter-spacing:-1px}
.score-item span{font-size:.7rem;color:var(--sub);font-weight:700}
.pass-tag{display:inline-block;margin-top:14px;font-size:.78rem;font-weight:800;padding:7px 16px;border-radius:999px}
.pass-tag.pass{background:var(--pine-soft);color:var(--pine-deep)}
.pass-tag.fail{background:var(--red-soft);color:var(--red)}
.wrong-list h3{font-size:.95rem;font-weight:800;margin:18px 4px 10px}
.wrong-item{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px}
.wrong-item .wq{font-size:.86rem;font-weight:700;margin:6px 0 10px;word-break:keep-all}
.wrong-item .wa{font-size:.8rem;margin-bottom:4px;word-break:keep-all}
.wrong-item .wa.user{color:var(--red)} .wrong-item .wa.real{color:var(--pine-deep);font-weight:700}
.wrong-item .wex{font-size:.79rem;color:#40506A;line-height:1.65;background:#F6F8FB;border-radius:10px;padding:11px 13px;margin-top:8px;word-break:keep-all}
.res-actions{display:grid;gap:9px;margin-top:16px}
.res-actions .primary{padding:14px;border-radius:13px;background:var(--pine);color:#fff;font-weight:800;font-size:.9rem}
.res-actions .ghost{padding:14px;border-radius:13px;background:var(--card);border:1.5px solid var(--line);font-weight:800;font-size:.9rem;color:var(--sub)}

/* 정답 이펙트 */
.fx-layer{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.confetti{position:absolute;width:9px;height:9px;border-radius:2px;animation:confFall linear forwards}
@keyframes confFall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}
.stamp{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%) scale(.4);font-size:4.2rem;z-index:98;pointer-events:none;animation:stampIn .55s forwards;filter:drop-shadow(0 6px 14px rgba(0,0,0,.18))}
@keyframes stampIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-14deg)}45%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(4deg)}70%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}

.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:20px;padding:44px 20px;text-align:center}
.empty .big{font-size:2.6rem;margin-bottom:10px}
.empty p{font-size:.88rem;color:var(--sub);word-break:keep-all}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:.8rem;font-weight:700;padding:11px 20px;border-radius:999px;z-index:100;animation:fadeUp .25s;box-shadow:0 8px 22px rgba(0,0,0,.25)}


/* ── 작업형 대비 ── */
.mode.work .icon{background:var(--blue-soft)}
.wt-list{display:grid;gap:10px}
.wt-item{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;gap:13px;align-items:center;text-align:left;width:100%;transition:.12s;box-shadow:var(--shadow)}
.wt-item:hover{border-color:var(--blue);transform:translateY(-1px)}
.wt-item .no{flex:0 0 38px;height:38px;border-radius:11px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:800;font-family:var(--mono);font-size:.85rem}
.wt-item h4{font-size:.92rem;font-weight:800;letter-spacing:-.3px;word-break:keep-all}
.wt-item p{font-size:.74rem;color:var(--sub);margin-top:2px}
.wt-item .arrow{margin-left:auto;color:var(--sub);font-weight:800}
.wt-note{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:15px 18px;margin-bottom:12px}
.wt-note b{font-size:.82rem}
.wt-note ul{margin:7px 0 0 2px;list-style:none}
.wt-note li{font-size:.76rem;color:var(--sub);line-height:1.7;padding-left:16px;position:relative;word-break:keep-all}
.wt-note li::before{content:"·";position:absolute;left:4px;color:var(--blue);font-weight:800}
.wd-sec{margin-top:18px}
.wd-sec .sec-label{font-size:.7rem;font-weight:800;letter-spacing:1.2px;color:var(--sub);margin-bottom:7px;display:flex;align-items:center;gap:6px}
.wd-sec .scenario{font-size:.9rem;line-height:1.75;word-break:keep-all;background:#F6F8FB;border-radius:12px;padding:14px 16px}
.wd-cols{width:100%;border-collapse:collapse;font-size:.8rem}
.wd-cols th,.wd-cols td{border:1px solid var(--line);padding:7px 11px;text-align:left}
.wd-cols th{background:#F0F4F8;font-weight:800;font-size:.72rem;color:var(--sub)}
.wd-cols td:first-child{font-family:var(--mono);font-size:.76rem;color:var(--blue);white-space:nowrap}
.wd-file{display:inline-block;font-family:var(--mono);font-size:.74rem;font-weight:700;background:var(--blue-soft);color:var(--blue);padding:4px 10px;border-radius:7px;margin-bottom:8px}
.wd-steps{list-style:none;display:grid;gap:7px}
.wd-steps li{display:flex;gap:10px;font-size:.86rem;line-height:1.6;word-break:keep-all}
.wd-steps .n{flex:0 0 22px;height:22px;border-radius:7px;background:var(--pine-soft);color:var(--pine-deep);display:grid;place-items:center;font-family:var(--mono);font-weight:800;font-size:.7rem;margin-top:2px}
.wd-steps.deliv .n{background:var(--amber-soft);color:#8A5B00}
.wd-tip{background:linear-gradient(135deg,#FFF9EC,#FFF3D9);border:1.5px solid #F3DFAE;border-radius:14px;padding:15px 17px;font-size:.85rem;line-height:1.75;word-break:keep-all}
.wd-tip .tip-head{font-weight:800;color:#8A5B00;font-size:.8rem;margin-bottom:5px}
.wd-rubric{background:#F6F8FB;border:1.5px solid var(--line);border-radius:14px;padding:15px 17px}
.wd-rubric li{font-size:.8rem;color:#2B3B52;line-height:1.75;list-style:none;padding-left:22px;position:relative;word-break:keep-all}
.wd-rubric li::before{content:"✓";position:absolute;left:2px;color:var(--pine);font-weight:800}
.wd-nav{display:flex;gap:9px;margin-top:16px}
.wd-nav button{flex:1;padding:13px;border-radius:12px;font-weight:800;font-size:.85rem;border:1.5px solid var(--line);background:var(--card);color:var(--sub)}
.wd-nav button:hover{border-color:var(--blue);color:var(--blue)}


/* ── 오답노트 관리 ── */
.wn-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.wn-head h3{font-size:1.05rem;font-weight:800}
.wn-head .cnt{font-family:var(--mono);color:var(--red);font-weight:800}
.wn-tools{display:flex;gap:8px;flex-wrap:wrap}
.wn-btn{font-size:.78rem;font-weight:800;padding:9px 14px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);color:var(--sub);transition:.12s}
.wn-btn:hover{border-color:var(--blue);color:var(--blue)}
.wn-btn.go{background:var(--red);border-color:var(--red);color:#fff}
.wn-btn.go:hover{background:#C43A43}
.wn-btn.pdf{border-color:#C9D8F5;background:var(--blue-soft);color:var(--blue)}
.wn-btn.danger:hover{border-color:var(--red);color:var(--red)}
.wn-item{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 44px 16px 16px;margin-bottom:10px}
.wn-del{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:9px;background:var(--bg);color:var(--sub);font-weight:800;font-size:.85rem;display:grid;place-items:center;transition:.12s}
.wn-del:hover{background:var(--red-soft);color:var(--red)}
.wn-q{font-size:.86rem;font-weight:700;margin:6px 0 8px;word-break:keep-all}
.wn-ans{font-size:.8rem;color:var(--pine-deep);font-weight:700;margin-bottom:6px;word-break:keep-all}
.wn-ex{font-size:.79rem;color:#40506A;line-height:1.65;background:#F6F8FB;border-radius:10px;padding:11px 13px;word-break:keep-all}
.wn-toggle{font-size:.74rem;font-weight:800;color:var(--blue);margin-top:6px}

/* ── 인쇄(PDF) ── */
#printArea{display:none}
@media print{
  body{background:#fff!important;background-image:none!important}
  .wrap,.fx-layer,.combo,.toast{display:none!important}
  #printArea{display:block;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#111;padding:0 4mm}
  #printArea .p-head{border-bottom:2.5px solid #0E7C66;padding-bottom:8px;margin-bottom:14px}
  #printArea .p-head h1{font-size:15pt;font-weight:800;letter-spacing:-.5px}
  #printArea .p-head p{font-size:8.5pt;color:#555;margin-top:3px}
  #printArea .p-item{border:1px solid #CCC;border-radius:8px;padding:11px 13px;margin-bottom:9px;page-break-inside:avoid}
  #printArea .p-meta{font-size:7.5pt;color:#666;font-weight:700;margin-bottom:5px}

해석하고 입력·전처리 오류를 통제했는지 > 확인한다. - 요구된 기능을 실제 실행 가능한 HTML, Python, 서비스 또는 백엔드 > 흐름으로 구현했는지 확인한다. - 결과 파일, 화면, 로그, 보고서 등 검증 가능한 산출물을 제출했는지 > 확인한다. - 폐쇄망 실행, API 키 보호, 권한 관리, 개인정보 보호 등 문제의 제약 > 조건을 지켰는지 확인한다. - 사용자 매뉴얼과 재현 절차가 있어 평가자가 같은 결과를 확인할 수 > 있는지 확인한다. 이처럼 개념·적용·통제·위험을 한 세트로 묶어 기억하면 서술형 대비에도 유리합니다.","orig":"essay"},{"id":"L001","src":"lec","lec":1,"cat":"AI트렌드","diff":"하","type":"mcq","q":"1회차 강의에서 강조한 '더닝-크루거 효과'에 대한 설명으로 가장 적절한 것은?","opts":["많이 배울수록 자신감이 무한히 상승하는 현상","조금 배운 사람일수록 자신을 과대평가하는 심리 현상","전문가일수록 새 기술을 거부하는 현상","AI가 스스로 능력을 과대평가하는 환각 현상"],"a":1,"expl":"더닝-크루거 효과는 조금 배운 사람일수록 자신을 과대평가하는 심리 현상입니다. 강의에서는 '우매함의 봉우리'를 지나 '절망의 계곡'에 이르는데, 이 계곡을 '겸손'으로 바꿔 읽으라고 강조했습니다. 진짜 전문가는 만족 없이 계속 배우는 태도(attitude)를 유지하며, 이것이 knowledge보다 attitude가 먼저라는 강의 핵심 메시지와 연결됩니다."},{"id":"L002","src":"lec","lec":1,"cat":"AI트렌드","diff":"중","type":"mcq","q":"강의에서 말한 '미시적 혁신'의 의미로 가장 적절한 것은?","opts":["수십억 원 규모의 대형 AX 전환사업을 우선 기획하는 것","최신 기술을 모두 도입한 뒤 문제를 찾는 것","내 책상 위 2~5분짜리 작은 문제부터 AI로 푸는 것","혁신을 미시경제학 이론으로 분석하는 것"],"a":2,"expl":"미시적 혁신은 거대한 AX 사업이 아니라 압축파일 일괄 해제, 파일명 200개 일괄 변경 같은 책상 위 작은 문제부터 AI로 푸는 접근입니다. 강의는 '몇십억 들여야 AI가 도입된다'는 생각(진격의 거인 콤플렉스)을 경계하라고 했으며, 기존 레거시 워크플로우 + LLM의 결합이 진짜 실력이라고 강조했습니다."},{"id":"L003","src":"lec","lec":1,"cat":"AI트렌드","diff":"중","type":"mcq","q":"LLM의 '파라미터'에 대한 설명으로 가장 적절한 것은?","opts":["모델이 학습한 문서의 총 개수","모델이 곱셈·덧셈에 사용하는 가중치(weight)의 총 개수","모델이 하루에 처리할 수 있는 질문 수","모델이 지원하는 언어의 개수"],"a":1,"expl":"파라미터는 신경망이 입력에 곱하고 더하는 가중치(weight)의 총 개수입니다. Y=WX+b에서 W(기울기)와 b(절편)에 해당하는 값이며, 이런 1차식 수천억 개를 엮은 것이 모델입니다. 파라미터가 많을수록 복잡한 패턴을 더 잘 이해하므로 '모델이 크다'고 표현합니다. 학습이란 답이 틀렸을 때 이 가중치를 조금씩 고쳐가는 과정입니다."},{"id":"L004","src":"lec","lec":1,"cat":"AI트렌드","diff":"상","type":"mcq","q":"트랜스포머의 어텐션 메커니즘에서 Query·Key·Value(Q·K·V)의 역할로 가장 적절한 것은?","opts":["문장을 세 개의 언어로 번역하는 병렬 처리 단위","한 단어가 문장 내 어떤 단어와 가장 관련 있는지 계산하는 변환 벡터","모델의 입력·출력·저장을 담당하는 하드웨어 모듈","질문·정답·오답을 구분하는 학습 라벨"],"a":1,"expl":"어텐션은 단어를 임베딩 벡터로 바꾼 뒤 Query·Key·Value 세 벡터로 변환해 '이 단어가 어떤 단어와 가장 관련 있나'를 계산하는 메커니즘입니다. GPT-2 small 기준 768차원 임베딩이 Q·K·V로 3배(2304) 변환되고, 이 어텐션 블록이 12층 쌓여 반복됩니다. 트랜스포머(2017, Attention Is All You Need)의 핵심 구조입니다."},{"id":"L005","src":"lec","lec":1,"cat":"AI트렌드","diff":"중","type":"mcq","q":"'소버린 AI(Sovereign AI)'에서 강사가 가장 핵심으로 꼽은 요소는?","opts":["GPU 등 하드웨어 자원의 최대 확보","자국 도메인 데이터로 튜닝한 모델의 다양성 확보","해외 빅테크 모델의 전면 도입","모든 모델의 오픈소스 공개 의무화"],"a":1,"expl":"소버린 AI는 자국이 통제하는 AI 역량을 뜻합니다. GPU 같은 하드웨어도 중요하지만, 강사는 조선·제조·철강·농업 등 우리 도메인 데이터로 튜닝한 다양한 모델의 확보가 진짜 핵심이라고 강조했습니다. 특정 해외 모델에 종속되면 가격 인상이나 사용 차단 같은 리스크에 그대로 노출되기 때문입니다."},{"id":"L006","src":"lec","lec":1,"cat":"AI트렌드","diff":"중","type":"mcq","q":"SLM(Small Language Model)과 온디바이스 AI에 대한 설명으로 가장 적절한 것은?","opts":["반드시 데이터센터의 대형 GPU 클러스터에서만 실행된다","클라우드 없이 내 PC·폰·엣지 기기에서 도는 1B~4B급 작은 언어모델이다","파라미터가 1조 개 이상인 모델을 말한다","텍스트를 처리할 수 없는 이미지 전용 모델이다"],"a":1,"expl":"SLM은 1B·4B처럼 작은 크기의 언어모델로, 클라우드 없이 내 폰·라즈베리파이·일반 PC에서 돌 수 있습니다(온디바이스/엣지 AI). 폐쇄망 환경에서 '민원 분류만 잘하는 1~2B 모델' 같은 특화 모델로 업무를 지원할 수 있어 공공에 특히 유용합니다. 구글 Gemma 3n E4B가 대표 사례로, MatFormer 구조로 원본 8B가 effective 4B로 동작합니다."},{"id":"L007","src":"lec","lec":1,"cat":"AI트렌드","diff":"하","type":"mcq","q":"로컬 PC에서 오픈소스 LLM을 가장 간단히 실행하는 도구로 강의에서 소개한 것은?","opts":["Ollama","Photoshop","Tableau","VMware"],"a":0,"expl":"Ollama는 'ollama run gemma3:1b'처럼 명령 한 줄로 오픈소스 모델을 받아 로컬에서 실행하는 도구입니다. 인터넷 없이 돌아가므로 폐쇄망 환경에서도 활용할 수 있습니다. 모델 파일은 Hugging Face에서 받을 수 있고 보통 GGUF 포맷(양자화 포맷)을 사용합니다. LM Studio, MSTY, llama.cpp도 같은 계열의 로컬 실행기입니다."},{"id":"L008","src":"lec","lec":1,"cat":"AI트렌드","diff":"중","type":"mcq","q":"'컨텍스트 윈도우'와 KV 캐시에 대한 설명으로 가장 적절한 것은?","opts":["컨텍스트가 길수록 이미 계산한 Key·Value를 저장하는 메모리 사용량이 늘어난다","컨텍스트 윈도우는 모델의 학습 데이터 총량을 뜻한다","KV 캐시는 하드디스크 용량을 줄이는 압축 기술이다","컨텍스트 윈도우가 크면 응답이 항상 정확해진다"],"a":0,"expl":"컨텍스트 윈도우는 모델이 한 번에 다룰 수 있는 입력(대화) 길이입니다. 대화가 길어지면 이미 계산한 Key·Value를 저장해 재사용하는 KV 캐시가 커져 메모리를 많이 차지합니다. '컨텍스트가 길수록 메모리를 먹는다'는 말이 여기서 나오며, 이는 컨텍스트 엔지니어링(무엇을 넣고 뺄지 설계)의 필요성과 연결됩니다."},{"id":"L009","src":"lec","lec":1,"cat":"생성형AI활용","diff":"하","type":"mcq","q":"'바이브 코딩(Vibe Coding)'의 의미로 가장 적절한 것은?","opts":["음악을 들으며 코딩해 집중력을 높이는 기법","코드 문법을 몰라도 자연어로 AI에게 시켜 프로그램을 만드는 방식","코드의 분위기(vibe)를 분석하는 정적 분석 도구","진동 센서로 입력하는 하드웨어 코딩"],"a":1,"expl":"바이브 코딩은 안드레이 카파시가 만든 말로, 코드 문법을 몰라도 자연어로 AI에게 지시해 프로그램을 만드는 방식입니다. '가장 핫한 개발 언어는 영어(자연어)'라는 그의 말처럼, 코딩 실력보다 생각의 명료함과 정밀한 지시가 중요해졌습니다. 이 과정 전체의 핵심 도구 개념입니다."},{"id":"L010","src":"lec","lec":1,"cat":"생성형AI활용","diff":"중","type":"mcq","q":"'메타 프롬프트'에 대한 설명으로 가장 적절한 것은?","opts":["프롬프트를 짧게 줄여주는 압축 알고리즘","AI에게 최적의 프롬프트(시스템 프롬프트)를 대신 짜게 시키는 기법","여러 AI의 답변을 평균 내는 앙상블 기법","프롬프트를 메타버스에서 입력하는 방식"],"a":1,"expl":"메타 프롬프트는 '프롬프트를 만드는 프롬프트'입니다. 좋은 프롬프트를 직접 짜기 어려우니 '이런 워크플로우/봇을 만들려는데 최적의 프롬프트를 네가 짜라'고 AI에게 시키는 기법입니다. 마케팅 3C 같은 프레임워크와 결합하면 더 강력하며, 멀티 에이전트의 플랜 작성 등 과정 전반에서 반복 활용됩니다."},{"id":"L011","src":"lec","lec":1,"cat":"AI트렌드","diff":"중","type":"mcq","q":"AI 모델 비교·순위 사이트에 대한 설명으로 옳은 것은?","opts":["LMArena는 사람이 두 모델의 답을 블라인드 비교·투표해 Elo 점수로 순위를 매긴다","Artificial Analysis는 회사들이 자랑한 논문 지표만 모아 놓은 곳이다","LifeArchitect Models Table은 AI가 자동으로 갱신하는 표다","모델 순위는 한번 정해지면 바뀌지 않는다"],"a":0,"expl":"LMArena(옛 Chatbot Arena)는 사람이 두 모델의 답변을 블라인드로 비교·투표해 Elo 점수 기반 순위를 매기므로 실사용 만족도에 가깝습니다. Artificial Analysis는 자체 독립 벤치마크를 직접 측정해 싣는 사이트이고(논문 모음이 아님), LifeArchitect Models Table은 Alan D. Thompson 박사가 수작업으로 갱신합니다. 순위는 계속 바뀌므로 직접 확인하는 습관이 중요합니다."},{"id":"L012","src":"lec","lec":1,"cat":"AI트렌드","diff":"하","type":"mcq","q":"'레고 블록 오케스트레이션' 비유가 의미하는 것은?","opts":["도구들을 난이도순으로 하나씩 정복해야 한다는 뜻","API·RSS·MCP·프롬프트 등 도구를 조합 가능한 부품으로 쌓아 문제를 푼다는 뜻","레고 회사의 AI 도입 사례를 배우라는 뜻","한 가지 도구만 깊이 파야 한다는 뜻"],"a":1,"expl":"레고 블록 8개로 수억 개 형상을 만들 수 있듯, 회차마다 배우는 도구(API, RSS, MCP, 플러그인, 스킬, 프롬프트, 코딩 에이전트 등)를 난이도순 정복 대상이 아니라 조합 가능한 부품으로 쌓으라는 비유입니다. 여러 도구를 겸손하게 모아 오케스트레이션하는 것이 이 시대 전문가의 태도라는 1회차 핵심 메시지입니다."},{"id":"L013","src":"lec","lec":1,"cat":"서비스구현","diff":"중","type":"mcq","q":"강의 교안 사이트(워크벤치)의 구성에서 각 요소의 역할이 잘못 짝지어진 것은?","opts":["HTML — 브라우저에서 도는 화면 언어(페이지의 뼈대)","GitHub Pages — 무료 정적 사이트 호스팅","Supabase — 백엔드 데이터베이스(BaaS)","Claude Sonnet — 서버의 네트워크 방화벽 관리"],"a":3,"expl":"교안 사이트는 HTML(화면) + Claude Sonnet(교안 내용을 생성·수정하는 LLM 두뇌) + GitHub Pages(무료 정적 호스팅) + Supabase(백엔드 DB) 조합입니다. Claude는 방화벽 관리가 아니라 콘텐츠 생성·수정을 담당합니다. 'HTML 한 장 + LLM + 무료 호스팅 + 가벼운 DB만으로 협업 공간을 만들 수 있다'는 감각이 핵심입니다."},{"id":"L014","src":"lec","lec":1,"cat":"AI트렌드","diff":"중","type":"mcq","q":"1~3회차에 코딩 에이전트를 쓰지 않고 '어시스트형 바이브 코딩'부터 배우는 이유로 강의가 제시한 것은?","opts":["코딩 에이전트가 유료라서 비용을 아끼기 위해","폐쇄망에서는 외부 LLM 도움으로 코드를 만들어 내부로 이식해 실행하는 워크플로우가 필요하기 때문","코딩 에이전트는 배우기 너무 쉬워서 나중에 해도 되기 때문","어시스트형이 항상 더 좋은 코드를 만들기 때문"],"a":1,"expl":"공공 폐쇄망/보안망에서는 코딩 에이전트 설치·실행이 막힐 수 있습니다. '외부에서 LLM 도움으로 코드를 만들어 → 내부로 이식해 실행'하는 워크플로우를 익혀두면 망 환경과 무관하게 일할 수 있습니다. '폐쇄망이니 외부 건 안 배워도 돼'가 강사가 가장 말린 태도입니다. 4회차부터 Claude Code·Cursor 등 코딩 에이전트로 전환합니다."},{"id":"L015","src":"lec","lec":1,"cat":"AI트렌드","diff":"하","type":"mcq","q":"DX와 AX의 관계에 대한 강의 설명으로 가장 적절한 것은?","opts":["DX와 AX는 완전히 단절된 별개 개념이다","AX가 끝나야 DX를 시작할 수 있다","DX(디지털 전환)와 AX(AI 전환)는 단절이 아니라 한 라인으로 이어진다","X는 eXtreme의 약자다"],"a":2,"expl":"DX(Digital Transformation)와 AX(AI Transformation)는 단절된 개념이 아니라 한 라인으로 이어집니다. 종이를 디지털로 바꾸는 DX가 선행돼야 그 데이터 위에 AI를 얹는 AX가 가능합니다. X는 미국식으로 Transformation을 줄인 표기입니다. 당연하게 쓰는 용어도 내 업무·현상에 맞춰 스스로 재정의해보는 응용력을 기르라는 것이 강사의 메시지입니다."},{"id":"L016","src":"lec","lec":1,"cat":"AI트렌드","diff":"중","type":"mcq","q":"'망치를 들고 있으면 모든 게 못으로 보인다'는 카파시 인용구를 통해 강의가 경계한 것은?","opts":["도구를 전혀 쓰지 않는 태도","하나의 도구에 매몰돼 모든 문제를 그 도구로만 풀려는 편식","망치 같은 물리적 도구의 위험성","AI 도구의 가격 상승"],"a":1,"expl":"이 인용구는 도구 편식에 대한 경고입니다. 압축파일에서 회의 일시를 찾는 워밍업 문제에서, 반디집으로 30초면 풀 일을 굳이 코딩 에이전트를 띄워 푸는 것이 바로 이 함정입니다. 반대로 50개 파일 중 어디 있는지 모를 때는 AI로 빠르게 찾는 것도 미시적 혁신입니다. 상황에 맞는 도구를 고르는 판단이 핵심입니다."},{"id":"L017","src":"lec","lec":1,"cat":"AI트렌드","diff":"상","type":"mcq","q":"토큰(token)과 파라미터의 구분으로 가장 적절한 것은?","opts":["토큰은 모델 크기, 파라미터는 학습 데이터 양을 뜻한다","파라미터는 모델의 방정식 계수 총개수(모델 크기), 토큰은 모델이 학습·처리하는 단어 조각의 양이다","둘은 완전히 같은 개념이다","토큰은 유료 결제 수단만을 의미한다"],"a":1,"expl":"파라미터는 모델의 '방정식 계수' 총개수로 모델 크기를 나타내고, 토큰은 단어가 음절/어절 단위로 쪼개진 조각으로 모델이 학습하거나 입출력하는 텍스트의 양을 셉니다. 많이 학습할수록(토큰이 많을수록) 유창해지고, 파라미터가 많을수록 복잡한 패턴을 이해합니다. API 과금도 입력·출력 토큰 수 기준으로 이뤄집니다."},{"id":"L018","src":"lec","lec":2,"cat":"서비스구현","diff":"중","type":"mcq","q":"강사가 만든 'Who am I' 검색 시스템이 보통의 RAG와 다른 점은?","opts":["더 큰 LLM을 사용했다","LLM 없이 Fuse.js(퍼지 검색)·BM25·레벤슈타인 등 룰 기반 부품으로 검색을 구현했다","검색 없이 생성만 한다","클라우드 GPU를 대량으로 사용했다"],"a":1,"expl":"보통의 RAG는 검색된 문서를 LLM에 넣어 답을 생성하지만, 강사의 시스템은 LLM 없이 RSS 수집 + Fuse.js 퍼지 검색 + BM25 + 레벤슈타인 거리 같은 룰 기반 부품만으로 검색을 구현했습니다. AI가 다 해결해주는 시대일수록 룰 기반이 오히려 예측 가능하고 유지보수가 쉬울 수 있다는 '거꾸로 보기'의 사례입니다."},{"id":"L019","src":"lec","lec":2,"cat":"AI트렌드","diff":"중","type":"mcq","q":"NLP·NLU·NLG의 관계에 대한 설명으로 옳은 것은?","opts":["NLP가 큰 우산이고 그 아래 NLU(이해)와 NLG(생성)가 있으며, 트랜스포머 인코더는 NLU, 디코더는 NLG에 대응한다","NLU가 최상위 개념이고 NLP는 그 하위 분야다","NLG는 자연어를 그래프로 바꾸는 기술이다","셋은 서로 무관한 별개 분야다"],"a":0,"expl":"NLP(자연어 처리)가 큰 우산이고, 그 아래 입력을 해석하는 NLU(자연어 이해)와 출력을 만드는 NLG(자연어 생성)가 있습니다. 트랜스포머의 인코더는 NLU 쪽(BERT 계열), 디코더는 NLG 쪽(GPT 계열)에 대응합니다. ChatGPT는 디코더 계열(생성 특화) 모델입니다."},{"id":"L020","src":"lec","lec":2,"cat":"AI트렌드","diff":"상","type":"mcq","q":"ChatGPT(GPT-3.5)에서 체감 성능이 폭발한 결정적 계기로 강의가 짚은 것은?","opts":["파라미터 수를 10배로 늘려서","RLHF(인간 피드백 기반 강화학습)를 얹어서","한국어 데이터를 추가 학습해서","GPU를 신형으로 교체해서"],"a":1,"expl":"GPT-3까지는 주어진 지문 안에서만 잘 푸는 인컨텍스트 러닝 수준이었으나, 여기에 RLHF(인간 피드백 기반 강화학습)를 얹은 GPT-3.5에서 체감 성능이 폭발했고 2022년 말 ChatGPT 공개로 이어졌습니다. 참고로 트랜스포머는 2017년 구글 논문 'Attention Is All You Need'에서 나왔지만, 디코더 부분을 픽업해 키운 것은 OpenAI였습니다."},{"id":"L021","src":"lec","lec":2,"cat":"생성형AI활용","diff":"상","type":"mcq","q":"OpenAI Privacy Filter에 대한 설명으로 가장 적절한 것은?","opts":["클라우드 LLM에 보내기 전 로컬에서 개인정보(PII)를 찾아 마스킹하는 토큰 분류 모델이다","이미지를 고해상도로 복원하는 업스케일링 모델이다","LLM의 답변 속도를 높이는 캐싱 서버다","웹 브라우저의 광고를 차단하는 확장 프로그램이다"],"a":0,"expl":"OpenAI Privacy Filter는 1.5B 파라미터(활성 50M)의 양방향 토큰 분류 모델로, 이름·주소·이메일·전화·URL·날짜·계좌·비밀번호 8개 범주의 개인정보를 찾아 가립니다. 사용자가 입력하자마자 클라우드 LLM에 보내기 전 단계에서 로컬(온프레미스)로 돌며 마스킹하는 것이 핵심 가치입니다. 참고로 강사가 Claude에 물었을 때 '없는 모델'이라 답한 일화는 LLM 환각의 교훈 사례입니다."},{"id":"L022","src":"lec","lec":2,"cat":"생성형AI활용","diff":"중","type":"mcq","q":"LLM이 자기가 모르는 대상을 단정적으로 '없다'고 답하는 현상에서 얻을 교훈은?","opts":["AI가 없다고 하면 실제로 없는 것이니 믿어도 된다","환각(hallucination)일 수 있으므로 직접 한 번 더 확인하는 습관이 필요하다","질문을 영어로 하면 환각이 사라진다","환각은 유료 모델에서는 발생하지 않는다"],"a":1,"expl":"LLM은 학습 시점 이후의 정보나 모르는 것을 종종 단정적으로 '없다'고 지어냅니다(환각). 실제로 존재하는 OpenAI Privacy Filter를 Claude가 '없는 모델'이라 답한 사례처럼, 'AI가 아니라고 했으니 없는 거겠지'라고 믿지 말고 직접 검색·확인하는 습관이 필요합니다. 환각은 모델 등급과 무관하게 발생할 수 있는 확률 모델의 본질적 특성입니다."},{"id":"L023","src":"lec","lec":2,"cat":"서비스구현","diff":"중","type":"mcq","q":"opencode 개발 환경 3종 세트의 역할 연결이 옳은 것은?","opts":["VS Code=모델 공급자, opencode=IDE, OpenRouter=터미널","VS Code=IDE(편집기), opencode=터미널 코딩 에이전트, OpenRouter=여러 LLM을 하나의 API 창구로 묶는 모델 공급자","VS Code=클라우드 서버, opencode=데이터베이스, OpenRouter=백신","셋 모두 같은 회사의 동일 제품이다"],"a":1,"expl":"VS Code는 코드 편집기(IDE), opencode는 터미널에서 도는 오픈소스 AI 코딩 에이전트(npm 패키지명은 opencode-ai), OpenRouter는 여러 AI 모델을 하나의 API 창구로 묶어주는 모델 공급자입니다. opencode 안에서 /connect로 OpenRouter 키를 연결하고 /models로 모델을 바꿉니다. Node.js 18+가 설치 선행 조건입니다."},{"id":"L024","src":"lec","lec":2,"cat":"서비스구현","diff":"중","type":"mcq","q":"파이썬 프로그램을 배포하는 방법에 대한 설명으로 옳지 않은 것은?","opts":["PyInstaller --onefile로 단일 EXE 파일을 만들 수 있다","Flask로 로컬 웹앱을 띄우면 기본 포트는 127.0.0.1:5000이다","GitHub Pages는 프론트(정적 HTML) 페이지를 무료로 호스팅한다","사용자 입력을 eval()로 실행하는 것은 실제 서비스에서 권장되는 안전한 방식이다"],"a":3,"expl":"사용자 입력을 그대로 eval()로 실행하면 임의 코드가 실행될 수 있어 실제 서비스에서는 절대 금지입니다(데모용으로만 잠깐 등장). PyInstaller는 --onefile --noconsole 옵션으로 단일 EXE를 만들고, Flask 기본 포트는 5000, GitHub Pages는 정적 페이지 무료 호스팅(username.github.io)입니다. 기획→코딩→테스트→배포 풀 사이클을 MVP로 겪어보는 것이 실습의 목적입니다."},{"id":"L025","src":"lec","lec":2,"cat":"생성형AI활용","diff":"중","type":"mcq","q":"AI로 PPT 장표를 만들 때 강사가 SVG 방식을 '비밀 무기'로 꼽은 이유는?","opts":["SVG가 이미지보다 파일 용량이 항상 크기 때문","SVG는 PPT에 넣고 그룹 해제하면 개체별 편집이 가능하기 때문","SVG는 자동으로 애니메이션이 되기 때문","SVG는 저작권이 없기 때문"],"a":1,"expl":"AI가 PPT를 이미지로 뽑으면 수정이 안 되지만, SVG(벡터)로 렌더링해 받으면 PPT에 넣고 우클릭→그룹 해제로 텍스트·도형을 개체별로 편집할 수 있습니다. 프롬프트에 원페이지 원메시지, 거버닝 센텐스, As-Is/To-Be, HEX 색상 코드 같은 컨설팅식 약속을 넣으면 품질이 올라갑니다. 강사 체감상 Claude가 SVG를 가장 안 깨지게 만든다고 평했습니다."},{"id":"L026","src":"lec","lec":2,"cat":"서비스구현","diff":"하","type":"mcq","q":"Mermaid에 대한 설명으로 가장 적절한 것은?","opts":["텍스트 문법으로 플로우차트 등 다이어그램을 그리는 도구다","인어공주를 그려주는 이미지 생성 모델이다","데이터베이스 백업 프로그램이다","음성을 텍스트로 바꾸는 STT 엔진이다"],"a":0,"expl":"Mermaid는 'flowchart TD / A --> B' 같은 텍스트 문법으로 플로우차트·다이어그램을 그리는 도구입니다. LLM에게 '머메이드 문법으로 N단계 플로우차트를 그려줘'라고 시키면 코드로 그려주고, Mermaid Live Editor(mermaid.live)에 붙여넣으면 즉시 렌더링됩니다. 폐쇄망에서는 mermaid.min.js + index.html만으로 오프라인 에디터를 만들어 쓸 수도 있습니다."},{"id":"L027","src":"lec","lec":2,"cat":"서비스구현","diff":"중","type":"mcq","q":"MCP(Model Context Protocol)에 대한 설명으로 가장 적절한 것은?","opts":["AI에게 외부 도구·데이터를 연결해주는 표준 규격이다","모델을 압축하는 양자화 포맷이다","GPU 메모리를 관리하는 드라이버다","이미지 생성 전용 프로토콜이다"],"a":0,"expl":"MCP는 AI(호스트)에게 Notion, Gmail, 법령정보 같은 외부 도구·데이터를 연결해주는 표준 규격입니다. ChatGPT 앱 커넥터의 바탕 규약이며, 하나씩 붙이면 멀티로 확장됩니다. 응답 중 '도구 호출(tool call)' 형식이 떠야 MCP가 실제 동작한 것이고, 그것 없이 결과만 나오면 웹 검색일 수 있다는 구분법도 함께 소개됐습니다."},{"id":"L028","src":"lec","lec":2,"cat":"서비스구현","diff":"상","type":"mcq","q":"'MCP를 쓰면 다 된다'는 주장에 대해 강의가 제시한 현실적 점검 항목이 아닌 것은?","opts":["그 DB가 MCP를 붙일 수 있는 구조인지","권한(role)으로 접근 가능한지와 외부 호출 가능 여부","스키마(schema)가 맞는지","MCP 로고의 디자인 품질"],"a":3,"expl":"MCP는 만능이 아니라 ① 대상 DB가 MCP를 붙일 수 있는지 ② 권한(role)으로 접근되는지 ③ 외부에서 호출 가능한지 ④ 스키마가 맞는지를 하나하나 따져야 합니다. 기술만으로 밀면 헤매고, 도메인 전문가와 함께 업무를 정확히 알면 구조가 간결해진다는 것이 핵심 교훈입니다. 로고 디자인은 무관합니다."},{"id":"L029","src":"lec","lec":2,"cat":"생성형AI활용","diff":"중","type":"mcq","q":"GPTs의 Actions 기능에 대한 설명으로 가장 적절한 것은?","opts":["GPT의 답변 말투를 바꾸는 기능이다","OpenAPI 스키마를 넣어 외부 API를 GPTs가 호출하게 하는 기능이다","GPT를 오프라인에서 실행하는 기능이다","화면을 녹화하는 기능이다"],"a":1,"expl":"Actions는 OpenAPI 스키마를 등록해 외부 API를 GPTs가 직접 호출하게 하는 기능입니다. 강의에서는 인증 없이 쓰는 무료 날씨 API인 Open-Meteo로 시연했고(Authentication: None), 스키마 작성 자체도 GPT에게 시키면 됩니다. 같은 방식으로 공공데이터포털(data.go.kr) API를 붙이면 공공정보를 챗봇 안에서 바로 다룰 수 있습니다."},{"id":"L030","src":"lec","lec":2,"cat":"생성형AI활용","diff":"중","type":"mcq","q":"GPT 프로젝트/GPTs 운용 시 강사가 찾아낸 '메모리 분리' 설정의 효과는?","opts":["응답 속도가 2배 빨라진다","다른 대화 맥락이 섞여 들어와 봇이 이상해지는 것을 막는다","토큰 비용이 무료가 된다","이미지 생성 화질이 좋아진다"],"a":1,"expl":"프로젝트 설정의 메모리(memory) 옵션이 기본값이면 다른 대화의 맥락이 섞여 들어와 전용 봇의 동작이 오염될 수 있습니다. 메모리를 해당 프로젝트 안에서만 독립적으로 작동하게 분리하면 봇이 깔끔하게 동작합니다. 이 설정이 깊이 숨어 있어 모르고 지나치기 쉽다는 점을 강사가 강조했습니다."},{"id":"L031","src":"lec","lec":2,"cat":"AI트렌드","diff":"하","type":"mcq","q":"구글 Gemini 생태계에 대한 설명으로 옳지 않은 것은?","opts":["Gemini는 태생부터 멀티모달로 설계되었다","구글은 TPU 등 자체 칩을 설계해 하드웨어에 최적화한다","Gems는 GPTs와 같은 개념의 '나만의 봇' 기능이다","NotebookLM은 게임 스트리밍 전용 플랫폼이다"],"a":3,"expl":"NotebookLM은 자료(소스)를 넣으면 요약·질의응답을 해주는 도구로, 오디오(팟캐스트) 자동 생성 기능이 유명하며 슬라이드·마인드맵 생성도 지원합니다. Gemini는 태생이 멀티모달이고, 구글은 TPU 자체 칩으로 최적화하며, Gems는 나만의 Gemini 봇 기능입니다. 초기 이름은 바드(Bard)였습니다."},{"id":"L032","src":"lec","lec":2,"cat":"서비스구현","diff":"중","type":"mcq","q":"구글의 '기획→개발→배포' 워크플로우에서 Stitch와 AI Studio의 관계로 옳은 것은?","opts":["Stitch로 UI 시안을 만들고 AI Studio(Build)로 핸드오프해 동작 앱으로 발전시킨다","AI Studio가 디자인을, Stitch가 백엔드를 담당한다","둘은 경쟁 관계라 함께 쓸 수 없다","Stitch는 동영상 편집 전용 도구다"],"a":0,"expl":"Stitch는 구글의 AI UI 디자인 도구로 프롬프트로 화면 시안을 만들고 HTML+Tailwind CSS 코드로 내보낼 수 있습니다. 'AI Studio로 내보내기'를 하면 AI Studio의 Build가 시안을 받아 백엔드·API까지 붙여 동작 앱으로 만듭니다. 이렇게 기획(디자인)에서 개발로 바통을 넘기는 이음매를 핸드오프(handoff)라고 합니다."},{"id":"L033","src":"lec","lec":2,"cat":"서비스구현","diff":"중","type":"mcq","q":"Lovable 같은 클라우드 바이브 코딩 플랫폼을 공공 업무에 쓸 때 반드시 확인해야 할 사항으로 강의가 짚은 것은?","opts":["플랫폼 UI의 색상 테마","데이터가 외부 클라우드(Supabase 등)에 저장되므로 데이터 주권·보안 요건 충족 여부","개발사 대표의 국적","월 결제일이 며칠인지"],"a":1,"expl":"Lovable은 프론트+백엔드(기본 Supabase 연동)까지 프롬프트로 만들어 배포하는 플랫폼이지만, 데이터가 외부 클라우드에 저장됩니다. 데이터 주권·보안이 중요한 공공/민감 업무라면 데이터가 어디에 쌓이는지 반드시 확인해야 합니다. 편의성과 보안 요건을 함께 따지는 것이 공공 AI 활용의 기본 원칙입니다."},{"id":"L034","src":"lec","lec":2,"cat":"생성형AI활용","diff":"하","type":"mcq","q":"'딥리서치(Deep Research)' 기능에 대한 설명으로 가장 적절한 것은?","opts":["한 주제를 멀티스텝으로 깊게 조사해 보고서 형태로 만들어주는 기능","바다 심해 데이터를 분석하는 전용 모델","코드를 자동으로 배포하는 CI/CD 도구","화면 해상도를 높이는 기능"],"a":0,"expl":"딥리서치는 한 주제를 여러 단계(멀티스텝)로 깊게 파고들어 조사한 뒤 보고서로 만들어주는 기능으로, 거의 모든 주요 AI 서비스에 탑재됐습니다. '활용 방안 5개' 같은 식으로 구체적으로 시키면 좋습니다. 모델 티어(소형/표준/리즈닝)와 함께 서비스를 깊게 쓰는 방법의 하나로 소개됐습니다."},{"id":"L035","src":"lec","lec":3,"cat":"생성형AI활용","diff":"중","type":"mcq","q":"'프리모텀(Pre-mortem)' 질문법의 목적으로 가장 적절한 것은?","opts":["프로젝트 성공을 미리 축하하는 의식","AI의 아첨을 깨고 '이 계획이 실패했다면 왜였을까'를 미리 따져 리스크를 드러내는 것","사후에 실패 원인을 보고서로 쓰는 절차","AI 모델의 사망 시점을 예측하는 기법"],"a":1,"expl":"프리모텀은 '이 계획이 이미 실패했다고 가정하고, 왜 실패했는지 말해보라'고 묻는 기법입니다. AI는 사용자 계획에 동조(아첨)하는 경향이 있어, 이 질문으로 숨은 리스크와 약점을 미리 드러낼 수 있습니다. 스텝 바이 스텝으로 AI를 리드하고, Q&A 프롬프트로 AI가 먼저 물어보게 하는 것과 함께 3회차 프롬프트 기법의 핵심입니다."},{"id":"L036","src":"lec","lec":3,"cat":"데이터분석","diff":"중","type":"mcq","q":"여러 개의 연도별 CSV를 분석하기 전에 VBA로 '메타데이터'를 모으는 목적은?","opts":["파일을 암호화하기 위해","각 파일의 헤더와 샘플 행을 한눈에 비교해 데이터 구조를 먼저 파악하기 위해","CSV를 이미지로 변환하기 위해","파일 용량을 줄이기 위해"],"a":1,"expl":"연도별로 쪼개진 CSV들의 헤더 + 데이터 5행만 모아 한 엑셀로 만들면 '내 데이터가 어떻게 생겼나'를 분석 전에 파악할 수 있습니다(메타인지). 이 과정에서 단위 불일치(천원/만원), 컬럼명 불일치(연도 vs 조사연도), 코드 불일치 같은 공공 데이터의 함정이 드러납니다. 엑셀은 모든 PC에 있으므로 파이썬을 못 깔아도 VBA로 자동화할 수 있다는 점도 포인트입니다."},{"id":"L037","src":"lec","lec":3,"cat":"데이터분석","diff":"중","type":"mcq","q":"공공 데이터 전처리에서 '원천(CSV)에서 고쳐라'라고 강조한 이유는?","opts":["SQL 임포트에는 단위 변환 같은 옵션이 없고, 매번 프롬프트로 제어하는 것보다 원본 통일이 깔끔하기 때문","CSV 파일이 SQL보다 용량이 작기 때문","원본을 고치면 백업이 자동으로 되기 때문","데이터베이스는 수정이 불가능하기 때문"],"a":0,"expl":"SQL 임포트에는 '이 컬럼에 1000을 곱해라' 같은 변환 옵션이 없습니다. 단위(천원/만원)와 컬럼명(연도 vs 조사연도)을 원본에서 통일하는 것이 매번 프롬프트로 제어하는 것보다 깔끔합니다. 사람은 '연도=조사연도'임을 알지만 기계는 철자·띄어쓰기까지 정확히 맞아야 같은 컬럼으로 인식합니다."},{"id":"L038","src":"lec","lec":3,"cat":"데이터분석","diff":"하","type":"mcq","q":"SQLite의 특징으로 가장 적절한 것은?","opts":["대규모 클러스터 서버가 반드시 필요하다","파일 하나로 끝나는 초경량 DB로, 원격 접속 자체가 없어 보안 부담이 적다","월 사용료를 내야 하는 상용 클라우드 DB다","이미지 데이터만 저장할 수 있다"],"a":1,"expl":"SQLite는 파일 하나(.db)로 끝나는 초경량 DB로, 원격 접속 개념 자체가 없어 보안 부담이 적고 설치도 압축 해제가 전부입니다. 다른 PC로 .db 파일만 복사하면 그대로 쓸 수 있습니다. 여기서 익힌 SQL 개념은 PostgreSQL·SQL Server·Oracle에 그대로 통하므로 '연습용'이 아니라 '입문용'입니다."},{"id":"L039","src":"lec","lec":3,"cat":"데이터분석","diff":"중","type":"mcq","q":"Text-to-SQL을 정확히 쓰기 위해 GPT에게 반드시 함께 줘야 하는 두 가지는?","opts":["테이블 정의서(DDL)와 어떤 DB 엔진(SQLite 등)에서 실행되는지","개발자의 이름과 소속","서버의 IP 주소와 비밀번호","모니터 해상도와 OS 버전"],"a":0,"expl":"GPT가 올바른 SQL을 만들려면 ① 테이블 구조를 담은 DDL(CREATE TABLE 구문, DB Browser에서 '생성 구문 복사하기') ② 실행될 DB 엔진 명시('SQLite에서 수행될')가 필요합니다. 엔진마다 함수·문법이 달라서 엔진을 못 박지 않으면 틀린 SQL이 나옵니다. 이 'DDL+질문' 조합을 GPTs로 만들어두면 전용 SQL 도우미가 됩니다."},{"id":"L040","src":"lec","lec":3,"cat":"데이터분석","diff":"상","type":"mcq","q":"SQL 윈도우 함수와 그 기능의 연결이 옳지 않은 것은?","opts":["RANK — 순위 매기기","LAG — 이전 행 값 가져오기(전년 대비 계산)","NTILE(n) — 전체를 n개 그룹으로 분할","DROP — 이동평균 구간 지정"],"a":3,"expl":"DROP은 윈도우 함수가 아니라 테이블을 삭제하는 DDL 명령입니다. 이동 구간(이동평균) 지정은 ROWS BETWEEN 구문이 담당합니다. 윈도우 함수는 RANK/DENSE_RANK(순위), PERCENT_RANK/CUME_DIST(백분위), NTILE(그룹 분할), LAG/LEAD(이전/다음 행)로, 주식의 60일 이동평균선 같은 계산을 SQL 한 줄로 해내는 분석의 진짜 무기입니다."},{"id":"L041","src":"lec","lec":3,"cat":"데이터분석","diff":"중","type":"mcq","q":"'pip install sqlite3'가 오류 나는 이유는?","opts":["sqlite3는 파이썬에 기본 내장된 표준 라이브러리라 PyPI에 설치 패키지가 없기 때문","인터넷 연결이 항상 필요하기 때문","sqlite3는 자바 라이브러리이기 때문","pip가 유료 서비스이기 때문"],"a":0,"expl":"sqlite3는 파이썬 표준 라이브러리(내장 모듈)라서 별도 설치 없이 import만 하면 됩니다. PyPI에 설치용 패키지가 없어 pip install sqlite3는 오류가 납니다. 파이썬 설치 시 표준 라이브러리 약 200개가 함께 깔리고, 그 외 60만 개 이상의 외부 패키지는 pip install 후 import해서 씁니다. 빨간 오류 메시지는 캡처해 AI에게 물어보는 것이 표준 디버깅 루프입니다."},{"id":"L042","src":"lec","lec":3,"cat":"데이터분석","diff":"중","type":"mcq","q":"'WHERE 없는 SELECT *'가 위험한 이유로 강의가 설명한 것은?","opts":["문법 오류로 실행이 안 되기 때문","대용량 테이블을 통째로 메모리에 올리면 캐시를 밀어내고 전체 성능이 느려지기 때문","결과가 항상 0건이기 때문","데이터가 자동 삭제되기 때문"],"a":1,"expl":"하드웨어 속도는 CPU > 메모리 > 디스크 > 네트워크 순입니다. 1억 건 테이블을 조건 없이 통째로 부르면 메모리 한계를 넘겨 기존 캐시 데이터를 디스크로 밀어내고 시스템 전체가 느려집니다. 큰 테이블은 반드시 WHERE로 좁혀 필요한 부분만 가져와야 합니다. 같은 쿼리를 다시 실행할 때 빨라지는 것은 메모리 캐시 히트 덕분입니다."},{"id":"L043","src":"lec","lec":3,"cat":"생성형AI활용","diff":"중","type":"mcq","q":"GEO(Generative Engine Optimization)와 SEO의 차이로 가장 적절한 것은?","opts":["GEO는 지리정보 최적화, SEO는 보안 최적화다","SEO는 검색 결과 상위 노출·클릭 유도, GEO는 생성형 AI가 답변에 내 콘텐츠를 인용·추천하게 만드는 것","둘은 완전히 같은 개념의 다른 표기다","GEO는 게임 엔진 최적화 기술이다"],"a":1,"expl":"SEO는 검색엔진 결과(SERP) 상위 노출과 클릭을 노리지만, GEO는 ChatGPT·Perplexity·Gemini 같은 생성형 AI가 답변을 만들 때 내 콘텐츠를 인용·추천하게 만드는 것입니다. 목표가 '클릭 유도'에서 'AI 답변에 포함되기'로 바뀝니다. GEO는 명확한 정보 위계(H1·H2·H3), 질문-답변형, 두괄식, 구조화 데이터(JSON-LD)를 선호합니다."},{"id":"L044","src":"lec","lec":3,"cat":"서비스구현","diff":"중","type":"mcq","q":"콜센터 녹취 분석 워크플로우의 처리 순서로 가장 자연스러운 것은?","opts":["감성 분석 → 녹음 → 저장 → 요약","음성(STT 텍스트 변환) → 요약 → 감성 분석 → 저장·대시보드","저장 → 삭제 → 복원 → 분석","시각화 → 녹음 → 텍스트 변환"],"a":1,"expl":"음성 파일을 STT로 텍스트로 변환한 뒤, LLM으로 요약하고, 감성 분석을 거쳐 DB에 저장하고 대시보드로 잇는 것이 표준 흐름입니다. 각 단계가 레고 블록처럼 독립 부품이라 필요에 따라 교체·확장할 수 있습니다. 워드파일 문제은행의 '음성 파일을 텍스트로 변환한 뒤 요약, 감성 분석, 저장으로 이어지는 처리 흐름'(STT 파이프라인)과 같은 개념입니다."},{"id":"L045","src":"lec","lec":3,"cat":"생성형AI활용","diff":"하","type":"mcq","q":"NotebookLM으로 카드뉴스를 기획할 때 카드 한 장마다 뽑게 한 네 가지 요소에 포함되지 않는 것은?","opts":["이미지 프롬프트(글자 없이)","나레이션 스크립트","다음 컷 전환 효과","서버 방화벽 설정값"],"a":3,"expl":"카드 한 장마다 ① 이미지 프롬프트(글자 없이) ② 이미지에 못 넣은 문구 ③ 나레이션 스크립트 ④ 다음 컷 전환 효과를 뽑게 합니다. 이후 '이미지 프롬프트만 모아줘'로 정리하고 슬라이드·AI 오디오까지 확장합니다. 소스 이름 앞에 !를 붙여 정렬 순서를 올리면 생성 품질이 좋아진다는 팁도 함께 소개됐습니다. 방화벽 설정은 무관합니다."},{"id":"L046","src":"lec","lec":3,"cat":"생성형AI활용","diff":"중","type":"mcq","q":"'Q&A 프롬프트' 기법에 대한 설명으로 가장 적절한 것은?","opts":["AI가 먼저 객관식으로 질문하게 해서 요구사항을 명확히 좁혀가는 기법","AI에게 퀴즈를 내서 성능을 시험하는 기법","질문과 답을 동시에 입력하는 압축 기법","답변을 Q&A 게시판에 자동 등록하는 기능"],"a":0,"expl":"Q&A 프롬프트는 '작업 전에 네가 먼저 나에게 객관식으로 질문하라'고 지시해, AI가 요구사항을 스스로 좁혀가게 하는 기법입니다. 사용자가 미처 명시하지 못한 제약·선호를 AI가 끌어내므로 결과 품질이 올라갑니다. AI에 끌려가지 말고 리드하라는 '스텝 바이 스텝' 원칙, 프리모텀과 함께 메타 프롬프트 활용의 3종 세트입니다."},{"id":"L047","src":"lec","lec":3,"cat":"데이터분석","diff":"상","type":"mcq","q":"200명 이상 기관에서 Anaconda 사용 시 주의할 점으로 강의가 짚은 것은?","opts":["Anaconda는 2020년 9월부터 직원 200명 이상 기업·정부기관에 상업 라이선스(유료)를 요구한다","Anaconda는 한글을 지원하지 않는다","Anaconda 설치 시 컴퓨터가 포맷된다","Anaconda는 파이썬과 호환되지 않는다"],"a":0,"expl":"2020년 9월부터 직원 200명 이상 기업·정부기관이 Anaconda를 쓰면 상업 라이선스를 구매해야 합니다. 기관에서는 주피터 노트북을 단독 설치하거나 Miniconda + conda-forge / Miniforge 조합으로 쓰는 것이 안전합니다. 오픈소스 도구라도 라이선스 조건(MIT/GPL, 상업용 조항)을 확인하는 것이 공공 도입의 기본 점검 사항입니다."},{"id":"L048","src":"lec","lec":3,"cat":"데이터분석","diff":"중","type":"mcq","q":"DB Browser에서 CSV 임포트 시 '필드명 포함' 옵션을 켜지 않으면 생기는 문제는?","opts":["파일이 열리지 않는다","첫 행(컬럼명)이 데이터 레코드로 잘못 들어간다","한글이 모두 영어로 번역된다","테이블이 자동 삭제된다"],"a":1,"expl":"'필드명 포함(첫 행을 컬럼명으로)' 옵션을 켜지 않으면 첫 행의 컬럼명이 일반 데이터 레코드로 들어가 버립니다. 임포트 전 미리보기로 옵션에 따라 어떻게 바뀌는지 확인해야 합니다. 또 '3,417'처럼 천단위 콤마가 든 숫자는 텍스트로 인식돼 계산이 안 되므로 임포트 전에 콤마를 제거하거나 자료형을 맞춰야 합니다."},{"id":"L049","src":"lec","lec":3,"cat":"생성형AI활용","diff":"중","type":"mcq","q":"행정안전부 'AI 시대 문서 작성 가이드라인'의 방향으로 가장 적절한 것은?","opts":["표와 데코레이션을 최대한 화려하게 꾸민다","주어·서술어를 생략한 개조식 문장을 권장한다","사람과 AI가 모두 읽기 쉬운 명확한 구조의 문서를 권장한다","모든 문서를 이미지 파일로 저장하게 한다"],"a":2,"expl":"이 가이드라인은 예쁘게 꾸민 표·데코레이션과 주어/서술어를 생략한 복잡한 개조식 문장을 지양하고, 사람과 AI가 모두 읽기 쉬운 문서를 권장합니다. GEO가 선호하는 명확한 위계·두괄식 구조와 같은 맥락이며, HWPX 의무화와 한 묶음으로 공공 문서의 기계 가독성(machine-readability)을 높이는 흐름입니다."},{"id":"L050","src":"lec","lec":3,"cat":"데이터분석","diff":"중","type":"mcq","q":"주피터에서 SQLite 데이터를 분석하는 권장 패턴으로 가장 적절한 것은?","opts":["모든 테이블을 통째로 파이썬 리스트에 복사한다","DB에서 SQL로 필요한 결과만 추린 뒤 pd.read_sql로 데이터프레임에 가져온다","CSV를 매번 다시 다운로드한다","엑셀에 붙여넣은 뒤 수작업으로 옮긴다"],"a":1,"expl":"sqlite3.connect로 DB에 연결한 뒤, SQL로 필요한 결과만 추려 pd.read_sql로 데이터프레임에 가져오는 것이 메모리를 최소로 쓰는 핵심 패턴입니다. 무거운 집계·필터링은 DB가 하고 파이썬은 분석·시각화에 집중하는 역할 분담입니다. sqlite3는 내장 모듈이라 설치가 필요 없다는 점도 기억해야 합니다."},{"id":"L051","src":"lec","lec":3,"cat":"생성형AI활용","diff":"하","type":"mcq","q":"메타 프롬프트의 구조에서 '상황'에 포함되는 3요소는?","opts":["업무·제약·목표","이름·나이·직급","날씨·기분·시간","색상·폰트·크기"],"a":0,"expl":"메타 프롬프트에 상황을 줄 때는 업무(무슨 일인지)·제약(폐쇄망, 도구 제한 등)·목표(무엇을 달성할지) 세 가지를 담습니다. 상황이 구체적일수록 AI가 만들어주는 프롬프트의 품질이 올라갑니다. 프레임워크(3C, As-Is/To-Be 등)를 함께 심으면 컨설팅식 사고를 AI로 가속할 수 있습니다."},{"id":"L052","src":"lec","lec":4,"cat":"데이터분석","diff":"하","type":"mcq","q":"지도학습에서 회귀(regression)와 분류(classification)의 구분으로 옳은 것은?","opts":["회귀는 연속값(집값·점수) 예측, 분류는 범주(개/고양이, 고위험/저위험) 예측","회귀는 범주 예측, 분류는 연속값 예측","둘 다 정답 없이 군집을 묶는 방법이다","회귀는 이미지 전용, 분류는 텍스트 전용이다"],"a":0,"expl":"지도학습은 정답(타겟)이 있는 학습으로, 연속값을 예측하면 회귀(집값·시험점수·내일 주가), 범주를 예측하면 분류(개/고양이, 고위험/저위험)입니다. 실전 분류는 이진(binary)보다 멀티클래스가 많습니다. 정답 없이 군집을 묶는 것은 비지도학습(클러스터링), 보상으로 학습하는 것은 강화학습입니다."},{"id":"L053","src":"lec","lec":4,"cat":"데이터분석","diff":"중","type":"mcq","q":"오버피팅(과적합)에 대한 설명으로 가장 적절한 것은?","opts":["학습 데이터를 너무 적게 써서 아무것도 못 배우는 상태","모의고사만 외워 수능(새 데이터)을 못 푸는 것처럼 학습 데이터에만 과도하게 맞춰진 상태","모델의 파라미터가 부족한 상태","데이터에 결측치가 많은 상태"],"a":1,"expl":"오버피팅은 '모의고사만 외워 수능을 못 푸는' 상태로, 학습 데이터에 과도하게 맞춰져 새 데이터에 일반화가 안 되는 문제입니다. 반대로 너무 안 풀어본 상태가 언더피팅입니다. 완화 기법으로 드롭아웃 등이 있으며, 이상치에 덜 흔들리고 일반화가 잘 되는 모델을 로버스트(robust)하다고 합니다."},{"id":"L054","src":"lec","lec":4,"cat":"데이터분석","diff":"중","type":"mcq","q":"회귀 모델 평가에서 MSE를 쓰는 이유와 특성으로 가장 적절한 것은?","opts":["제곱 형태라 미분 가능해 경사하강법에 쓸 수 있지만 이상치에 민감하다","절댓값이라 이상치에 강건하다","분류 전용 지표라 회귀에는 못 쓴다","값이 클수록 좋은 모델이다"],"a":0,"expl":"MSE(평균제곱오차)는 오차를 제곱해 평균 내므로 미분 가능해 경사하강법 최적화에 적합하지만, 제곱 때문에 이상치에 민감합니다. 회귀 지표로는 MSE·RMSE·MAE·R²가 있고, 분류는 혼동행렬(confusion matrix)에서 accuracy·precision·recall·F1 score를 씁니다. F1은 실무 프로젝트에서 가장 많이 쓰는 분류 지표입니다."},{"id":"L055","src":"lec","lec":4,"cat":"데이터분석","diff":"중","type":"mcq","q":"Parquet 포맷에 대한 설명으로 가장 적절한 것은?","opts":["행 기반의 텍스트 포맷으로 메모장에서 편집하기 좋다","컬럼 기반의 빅데이터 형식으로 CSV보다 읽기 속도가 빠르며 클라우드 전처리에서 사실상 기본이다","이미지 압축 전용 포맷이다","한글 문서 전용 포맷이다"],"a":1,"expl":"Parquet은 컬럼(열) 기반 저장 형식으로, 필요한 컬럼만 읽을 수 있어 CSV보다 적재·조회가 빠르고(강사 환경 60만 줄 기준 약 2.6배) 클라우드 전처리에서 사실상 표준입니다. pandas에서 to_parquet/read_parquet로 변환·로드하며 pyarrow 설치가 필요합니다. 대용량 파이프라인의 CSV→Parquet→DB 흐름에서 중간 단계를 담당합니다."},{"id":"L056","src":"lec","lec":4,"cat":"데이터분석","diff":"상","type":"mcq","q":"메달리온 아키텍처(Medallion Architecture)의 3계층 구성으로 옳은 것은?","opts":["브론즈=원본 보존, 실버=정제된 데이터(스키마 표준화·결측 처리), 골드=분석용 집계·데이터 마트","브론즈=분석 결과, 실버=원본, 골드=백업","브론즈=이미지, 실버=텍스트, 골드=음성","계층 구분 없이 하나의 테이블에 모두 저장"],"a":0,"expl":"메달리온 아키텍처는 데이터를 3층으로 관리합니다. 브론즈는 원본 그대로 보존(CSV), 실버는 스키마 표준화·결측·중복을 처리한 정제 데이터(Parquet), 골드는 부서별 분석용 집계(데이터 마트)입니다. 원본을 건드리지 않고 단계를 나눠 장애와 재처리에 대비하는 것이 핵심이며, 랜딩 존/스테이징, ETL vs ELT, CDC(증분 적재) 개념과 함께 데이터 엔지니어링의 표준 설계입니다."},{"id":"L057","src":"lec","lec":4,"cat":"데이터분석","diff":"중","type":"mcq","q":"RAG 챗봇 구축에서 품질을 가장 크게 좌우한다고 강의가 강조한 요소는?","opts":["GPU의 브랜드","청킹(chunking) 전략 — 맥락을 살려 데이터를 자르는 방식","챗봇 UI의 색상","서버의 물리적 위치"],"a":1,"expl":"RAG 품질의 핵심은 모델보다 청킹 전략입니다. 기계적으로 '10줄마다' 자르면 검색이 엉뚱한 답을 가져오고, 법령이라면 조·절 단위처럼 맥락을 살려 잘라야 합니다. 구분자 옆에 '## 법인세법 부당행위계산 부인 관련' 같은 맥락 레이블을 달아주면 품질이 급상승합니다. 우리나라 법령은 맥락 단위가 섞여 있어 라벨링을 LLM에 맡기기 어렵고 결국 사람 검수가 필요합니다."},{"id":"L058","src":"lec","lec":4,"cat":"생성형AI활용","diff":"상","type":"mcq","q":"'AI 부채'의 유형과 설명의 연결이 옳지 않은 것은?","opts":["프롬프트 부채 — 잘 먹히던 프롬프트가 버전관리 없이 누적돼 어느 날 안 먹히는 문제","모델 의존성 — 특정 회사 API에 종속돼 모델 버전이 바뀌면 답이 달라지는 문제","검색 부채 — RAG가 오래된 정보를 사실처럼 제시하는 문제","전기 부채 — 데이터센터 전기요금이 밀리는 문제"],"a":3,"expl":"AI 부채는 확률 기반 시스템 특유의 미묘하고 비선형적인 오류에서 옵니다. 프롬프트 부채(버전관리 없는 프롬프트 누적), 모델 의존성(API 종속·버전 변경 리스크), 검색 부채(RAG 리트리버 불안정·낡은 정보), 평가 부채(LLM 품질 기준의 모호함)가 대표 유형입니다. '전기 부채'는 강의에 없는 개념입니다. 모니터링 도구로 Langfuse(토큰·비용·프롬프트 기록, LLM-as-judge)가 소개됐습니다."},{"id":"L059","src":"lec","lec":4,"cat":"데이터분석","diff":"중","type":"mcq","q":"시각화 라이브러리와 특징의 연결이 옳은 것은?","opts":["Folium — 위경도 기반 지도 시각화, 결과를 단일 HTML로 저장 가능","Matplotlib — 인터랙티브 클릭·줌 전용","Plotly — 파이썬 기본 내장이라 설치 불필요","Seaborn — 지도 전용 라이브러리"],"a":0,"expl":"Folium은 위경도만 있으면 지도에 마커를 찍고 결과를 단일 HTML로 저장할 수 있는 지도 시각화 라이브러리입니다(OpenStreetMap과 궁합이 좋음). Matplotlib은 파이썬 기본 시각화(문법이 까다롭지만 다 그려짐), Seaborn은 통계 시각화(갤러리 코드 제공), Plotly는 인터랙티브(클릭·줌, Dash로 대시보드)입니다. 어떤 차트가 좋을지는 AI에게 묻는 것이 빠릅니다."},{"id":"L060","src":"lec","lec":4,"cat":"데이터분석","diff":"중","type":"mcq","q":"'LLM을 우리가 학습시킨다'는 말이 틀린 이유로 강의가 설명한 것은?","opts":["LLM은 이미 완벽해서 학습이 필요 없기 때문","우리가 하는 것은 RAG(데이터 참조)이지 학습이 아니며, 진짜 학습(백프로파게이션)은 개인 컴퓨터로 불가능한 규모이기 때문","LLM은 법적으로 학습이 금지돼 있기 때문","학습은 GPU 없이 CPU로만 해야 하기 때문"],"a":1,"expl":"일반 사용자가 문서를 넣어 쓰는 것은 RAG(참조)이지 학습이 아닙니다. 진짜 '학습'은 수십~수백조 파라미터에 백프로파게이션을 돌리는 것으로 개인 컴퓨터로는 초기화조차 안 됩니다. 또 모델이 값을 내는 인퍼런스(예측)와 LLM의 리즈닝(CoT 추론)은 다른 개념이며, 최신 LLM은 분야별 서브셋이 모인 MoE(Mixture of Experts) 구조로 만들어집니다."},{"id":"L061","src":"lec","lec":4,"cat":"데이터분석","diff":"중","type":"mcq","q":"앙상블 기법 중 'soft voting'에 대한 설명으로 가장 적절한 것은?","opts":["여러 모델의 예측 확률을 평균 내어 최종 판단하는 방식","가장 목소리 큰 모델 하나만 쓰는 방식","모델을 부드러운 재질의 서버에서 돌리는 방식","데이터를 절반만 사용하는 방식"],"a":0,"expl":"soft voting은 RandomForest·XGBoost·LightGBM 같은 여러 모델의 예측 확률을 (가중) 평균 내어 최종 판단하는 앙상블 기법입니다. sklearn의 VotingClassifier(voting='soft', weights=[1,1,1])로 구현하며, 단일 모델보다 안정적인 성능을 내는 경우가 많습니다. 학습된 모델은 joblib으로 pickle 저장해 다음엔 학습 없이 즉시 로드합니다."},{"id":"L062","src":"lec","lec":4,"cat":"데이터분석","diff":"하","type":"mcq","q":"피처 엔지니어링(feature engineering)에서 '피처'의 의미는?","opts":["소프트웨어의 신기능","모델 입력에 쓰는 변수(파생변수 포함)","GPU의 코어 수","화면의 특수효과"],"a":1,"expl":"머신러닝에서 피처는 개발의 '기능'이 아니라 모델 입력에 쓰는 변수를 뜻합니다. 피처 엔지니어링은 기존 변수의 곱·나눗셈으로 파생변수를 만들거나, 이미지에 '반지 꼈음' 같은 자연어 묘사를 추가하는 등 모델이 더 잘 학습하도록 입력을 가공하는 작업입니다. 어떤 변수가 예측에 가장 영향을 줬는지는 피처 임포턴스로 확인합니다."},{"id":"L063","src":"lec","lec":4,"cat":"데이터분석","diff":"중","type":"mcq","q":"620만 건 데이터가 부담될 때 레이블 비율을 유지하며 표본을 뽑는 방법은?","opts":["무조건 앞에서 100건만 자르기","층화 추출(stratified sampling)","가장 큰 값만 골라내기","알파벳순 정렬 후 상위 10%"],"a":1,"expl":"층화 추출은 레이블(클래스)별 비율을 유지하면서 표본을 뽑는 방법으로, 대용량 데이터를 줄이면서도 분포 왜곡을 막습니다. 분포가 치우쳐 있으면(왜도, skewness) 로그 변환 등을 검토합니다. 클래스 불균형 상태에서 무작정 자르면 소수 클래스가 사라져 모델이 왜곡되므로, 샘플링 전략은 데이터 품질 관리의 기본입니다."},{"id":"L064","src":"lec","lec":4,"cat":"생성형AI활용","diff":"중","type":"mcq","q":"PRD(요구사항 정의서) 작성의 핵심 두 가지로 강의가 강조한 것은?","opts":["KPI를 반드시 숫자로 정량화하고, 아웃 오브 스코프(하지 않을 것)를 명시한다","분량을 최대한 길게 쓰고 전문용어를 많이 넣는다","디자인 시안을 먼저 완성하고 요구사항은 나중에 쓴다","작성자를 익명으로 하고 날짜를 뺀다"],"a":0,"expl":"PRD의 핵심은 ① KPI를 반드시 숫자로(quantify) ② 아웃 오브 스코프('이건 안 한다')의 명시입니다. 범위를 못 박지 않으면 요구가 계속 늘어나 끝이 없어집니다. PRD는 SOW(작업 범위서)에 가깝게 디테일해야 하며, 분석은 딜리버러블(끝점)을 먼저 상상하고 시작해야 시간 낭비를 막습니다."},{"id":"L065","src":"lec","lec":4,"cat":"생성형AI활용","diff":"중","type":"mcq","q":"폐쇄망 때문에 실데이터를 못 꺼낼 때 강의가 제시한 우회 전략은?","opts":["보안 규정을 무시하고 USB로 복사한다","컬럼 구조만 주고 비슷한 합성(가상) 데이터를 AI로 생성해 바깥에서 테스트한 뒤 코드를 안으로 들여온다","분석을 포기한다","종이에 출력해 손으로 옮긴다"],"a":1,"expl":"실데이터 반출이 불가하면 엑셀 헤더(컬럼 구조)만 주거나 기억하는 필드값으로 '비슷하게 500줄만 가상 생성해줘'라고 하면 됩니다. 폐쇄망 밖에서 합성 데이터로 테스트·조립한 뒤 검증된 코드를 안으로 들여오는 전략입니다. 강의의 민원 620만 건 케이스 데이터 자체도 시나리오를 먼저 짜고 AI로 역설계 생성한 합성 데이터입니다."},{"id":"L066","src":"lec","lec":4,"cat":"데이터분석","diff":"하","type":"mcq","q":"Colab에서 Matplotlib 그래프의 한글이 □□□로 깨질 때의 해결책은?","opts":["나눔 폰트를 설치하고 plt.rcParams의 font.family를 NanumGothic으로 지정한다","그래프를 영어로만 그린다","해상도를 낮춘다","Colab을 재구매한다"],"a":0,"expl":"Colab에는 한글 폰트가 기본 설치돼 있지 않아 fonts-nanum을 설치(!apt-get install -y fonts-nanum)하고, fontManager에 폰트를 추가한 뒤 plt.rcParams['font.family']='NanumGothic'으로 지정합니다. axes.unicode_minus=False로 마이너스 부호 깨짐도 함께 방지합니다. 자주 겪는 함정이므로 코드 스니펫을 떠 두면 편합니다."},{"id":"L067","src":"lec","lec":4,"cat":"데이터분석","diff":"중","type":"mcq","q":"데이터 파이프라인에서 CDC(Change Data Capture)의 의미는?","opts":["전체 데이터를 매번 통째로 덮어쓰는 방식","변경분(증분)만 잡아 처리하는 적재 방식","데이터를 CD에 굽는 백업 방식","질병 통제 데이터 표준"],"a":1,"expl":"CDC는 변경된 데이터(증분)만 잡아 처리하는 적재 방식입니다. 매번 전체를 덮어쓰면(오버라이트) DB에 무리가 가므로, 운영 환경에서는 증분 적재가 표준입니다. 운영 DB에 직접 붙지 않고 연계 서버를 두어 파일을 떨궈 가져가는 구조, 파이프라인 장애 재처리·모니터링을 담당하는 Apache Airflow와 함께 데이터 엔지니어링 실무 개념입니다."},{"id":"L068","src":"lec","lec":4,"cat":"AI트렌드","diff":"중","type":"mcq","q":"카파시의 'LLM은 새로운 운영체제(OS)'라는 말의 의미로 가장 적절한 것은?","opts":["LLM이 윈도우를 대체해 부팅을 담당한다는 뜻","LLM이 텍스트로 검색·계산·코드실행 등 모든 도구를 조율하는 중심 두뇌가 된다는 뜻","LLM을 설치하면 OS 라이선스가 무료라는 뜻","LLM이 하드웨어 드라이버를 직접 만든다는 뜻"],"a":1,"expl":"지금의 AI 채팅창은 1960년대 메인프레임 터미널 수준이고, LLM 자체가 텍스트로 검색·계산·코드실행 등 모든 도구를 조율하는 새로운 OS(중심 두뇌)라는 비유입니다. 개인용 컴퓨터·마우스·아이폰에 해당하는 것은 아직 발명도 안 됐다는 것이 카파시의 관점입니다. '코드는 이제 공짜고 일회용'이라는 어록과 함께, 오케스트레이션 역량의 중요성을 강조하는 맥락입니다."},{"id":"L069","src":"lec","lec":5,"cat":"서비스구현","diff":"하","type":"mcq","q":"Ollama의 기본 포트 번호는?","opts":["8080","5000","11434","3306"],"a":2,"expl":"Ollama는 로컬에서 http://localhost:11434 로 API 서버를 엽니다. VBA·파이썬 등에서 이 주소의 /api/generate 엔드포인트로 POST 요청을 보내 로컬 LLM을 호출할 수 있습니다. 참고로 5000은 Flask 기본 포트, 3306은 MySQL, 8080은 웹 서버 대체 포트로 자주 쓰입니다."},{"id":"L070","src":"lec","lec":5,"cat":"서비스구현","diff":"중","type":"mcq","q":"Ollama 핵심 명령어와 기능의 연결이 옳지 않은 것은?","opts":["ollama run — 모델을 받아 바로 대화 시작","ollama pull — 모델을 받아만 두기","ollama list — 설치된 모델 목록 확인","ollama fly — 모델을 클라우드로 전송"],"a":3,"expl":"Ollama의 핵심 명령은 run(실행·대화), pull(다운로드만), list(설치 목록), ps(실행 중 확인), rm(삭제) 5개면 충분합니다. 'ollama fly'라는 명령은 없습니다. Ollama는 인터넷 없이 로컬에서 돌아 폐쇄망 활용의 표준 출발점이며, 모델 태그는 ollama.com/library에서 확인합니다."},{"id":"L071","src":"lec","lec":5,"cat":"서비스구현","diff":"중","type":"mcq","q":"Ollama를 엑셀과 결합해 =AI_Summarize() 같은 함수를 만드는 방법으로 강의가 소개한 것은?","opts":["엑셀 추가 기능 스토어에서 유료 구매","VBA 사용자 정의 함수에서 MSXML2.XMLHTTP로 localhost:11434 API를 호출","엑셀을 파이썬으로 재작성","셀에 URL을 직접 입력"],"a":1,"expl":"VBA 사용자 정의 함수 안에서 MSXML2.XMLHTTP 객체로 Ollama API(localhost:11434/api/generate)에 POST 요청을 보내면 셀에서 =AI_Summarize(A1)처럼 로컬 LLM을 쓸 수 있습니다. .xlsm으로 저장해 내가 쓰고, 배포하려면 .xlam(엑셀 추가 기능)으로 저장해 동료가 옵션→추가 기능에서 등록합니다. URL과 인증 헤더만 바꾸면 외부 모델(GPT 등)도 같은 구조로 연동됩니다."},{"id":"L072","src":"lec","lec":5,"cat":"서비스구현","diff":"중","type":"mcq","q":"구글 설문(Forms)을 코드로 자동 생성할 때 사용하는 구글의 자동화 언어는?","opts":["Apps Script","VBScript","COBOL","Assembly"],"a":0,"expl":"Apps Script는 구글이 제공하는 자동화 언어(VBA의 구글판)로 script.google.com에서 실행합니다. FormApp.create()로 설문을 만들고 addMultipleChoiceItem 등으로 문항을 추가하며, getPublishedUrl()로 배포 주소를 얻습니다. LLM으로 문항을 기획하고 'Apps Script로 작성해줘'라고 시키면 15문항이든 100문항이든 한 번에 생성됩니다. 응답은 구글 시트에 쌓여 Gemini나 파이썬으로 바로 분석할 수 있습니다."},{"id":"L073","src":"lec","lec":5,"cat":"서비스구현","diff":"하","type":"mcq","q":"브라우저 개발자 도구(F12) 콘솔에 코드 붙여넣기가 막혔을 때의 해결 방법은?","opts":["브라우저를 재설치한다","콘솔에 allow pasting을 입력하고 엔터 친 뒤 붙여넣는다","다른 컴퓨터를 사용한다","관리자에게 공문을 보낸다"],"a":1,"expl":"크롬·엣지는 보안상 콘솔 첫 붙여넣기를 막는 경우가 있는데, 콘솔에 allow pasting을 타이핑하고 엔터를 친 뒤 붙여넣으면 됩니다. 콘솔 자동화의 기본 워크플로우는 F12 → 요소 선택으로 대상 캡처(Name/Role 팝업) → ChatGPT에 이미지+URL 전달 → 생성된 JS를 콘솔에 붙여 실행입니다. 콘솔 코드는 매번 휘발되므로 자주 쓰면 확장 프로그램으로 영속화합니다."},{"id":"L074","src":"lec","lec":5,"cat":"서비스구현","diff":"상","type":"mcq","q":"파이썬 크롤러 대신 브라우저 콘솔(JS) 자동화가 유리한 경우로 강의가 짚은 것은?","opts":["서버가 IP를 차단하는 크롤링 방어가 있는 사이트 — 콘솔 코드는 내 브라우저(클라이언트) 안에서 실행되므로 우회가 쉽다","데이터가 1억 건 이상인 경우","GPU 연산이 필요한 경우","서버 관리자 권한이 있는 경우"],"a":0,"expl":"콘솔 코드는 지금 내가 보고 있는 브라우저(클라이언트) 안에서 실행되므로, 네이버처럼 서버에서 IP를 차단하는 크롤링 방어를 우회하기 쉽습니다. 파이썬 크롤러보다 기능은 제한적이지만 막히는 사이트에는 이 방식이 통하며, RAG용 자료 대량 수집에 유용합니다. 첨부파일 일괄 다운로드, 2단계 클릭 자동화 등이 실전 사례입니다."},{"id":"L075","src":"lec","lec":5,"cat":"서비스구현","diff":"중","type":"mcq","q":"종이 양식 → OCR → 웹 폼 자동 입력 사례(농촌진흥청 흙 시료)가 보여주는 핵심 메시지는?","opts":["OCR은 오류가 많아 쓰면 안 된다","AX보다 DX가 먼저 — 종이를 디지털로 바꾸는 것이 선결 과제","손글씨는 반드시 타이피스트가 입력해야 한다","웹 폼은 자동화가 불가능하다"],"a":1,"expl":"농민이 손글씨로 쓴 시료 정보를 접수자가 두 번 옮겨 적던 업무를, 웹 폼 구조를 F12로 캡처하고 이미지 인식 API를 붙인 콘솔 코드로 자동 입력하게 만든 사례입니다. 핵심 메시지는 'AX보다 DX가 먼저' — 종이 문서를 디지털로 바꾸는 것이 선결이라는 점입니다. 사용자는 자동 입력된 값을 눈으로 확인 후 제출하므로 human-in-the-loop도 유지됩니다."},{"id":"L076","src":"lec","lec":5,"cat":"서비스구현","diff":"중","type":"mcq","q":"브라우저 확장 프로그램(manifest v3)을 만들어 등록하는 절차로 옳은 것은?","opts":["manifest.json과 popup.html 폴더를 만들고, 확장 프로그램 페이지에서 개발자 모드 ON 후 '압축 해제된 확장 프로그램 로드'로 폴더 선택","앱스토어에 애플 개발자 계정으로 업로드","윈도우 제어판에서 프로그램 추가","레지스트리를 직접 수정"],"a":0,"expl":"자주 쓰는 콘솔 코드는 manifest.json(manifest_version 3, action.default_popup 등)과 팝업 html로 폴더를 구성한 뒤, 브라우저 확장 프로그램 페이지에서 개발자 모드를 켜고 '압축 해제된 확장 프로그램 로드'로 폴더를 선택하면 등록됩니다. 남에게 배포하려면 크롬 웹스토어 심사가 필요합니다. 콘솔 코드의 휘발성을 해결하는 영속화 방법입니다."},{"id":"L077","src":"lec","lec":5,"cat":"생성형AI활용","diff":"중","type":"mcq","q":"temperature 파라미터에 대한 설명으로 가장 적절한 것은?","opts":["0에 가까울수록 가장 확률 높은 토큰만 골라 결정적이 되므로 코딩처럼 정확성이 중요한 작업에 적합하다","높을수록 항상 정확한 답이 나온다","GPU 온도를 조절하는 하드웨어 설정이다","응답 길이를 조절하는 파라미터다"],"a":0,"expl":"temperature는 토큰 선택의 무작위성을 조절합니다. 0에 가까우면 가장 확률 높은 토큰만 골라 결정적(deterministic)이 되어 코딩·정확성 작업에 적합하고 환각·버그가 줄어듭니다. 창의적 작업에는 1 근처를 씁니다. 코딩 에이전트는 보통 0에 가깝게 설정돼 있으며, 버그가 잦으면 temperature를 낮춰 다시 시도하는 것이 요령입니다."},{"id":"L078","src":"lec","lec":5,"cat":"데이터분석","diff":"중","type":"mcq","q":"Power Query의 '폴더에서 가져오기'가 해결하는 문제는?","opts":["엑셀이 여러 파일을 한 번에 못 여는 한계 — 폴더 단위로 월별 파일들을 연결해 하나로 통합","이미지 파일의 해상도 저하","프린터 용지 걸림","이메일 스팸 필터링"],"a":0,"expl":"엑셀은 파일을 하나씩만 열 수 있어 월별 CSV 12개를 합치려면 노가다였습니다. Power Query의 데이터 가져오기→파일에서→폴더에서를 쓰면 폴더 단위로 연결(connect)해 파일들을 병합·전처리할 수 있습니다. 여기서 '가져오기'는 열기(open)가 아니라 연결 개념이며, 폴더에 새 파일을 넣고 '모두 새로 고침'만 누르면 통합본이 자동 갱신됩니다. 가져올 파일이 열려 있으면 안 된다는 함정도 주의해야 합니다."},{"id":"L079","src":"lec","lec":5,"cat":"데이터분석","diff":"하","type":"mcq","q":"한 셀에 '서비스;정보'처럼 여러 값이 섞인 데이터를 Power Query에서 함수 없이 나누는 기능은?","opts":["열 분할(구분 기호 기준)","셀 병합","피벗 해제","조건부 서식"],"a":0,"expl":"Power Query의 열 분할 기능은 세미콜론·파이프(|) 같은 구분 기호를 기준으로 클릭만으로 열을 나눕니다. 엑셀 함수(FIND/LEFT)를 쓸 필요가 없습니다. 이는 '원-셀-원-데이터' 원칙 위반을 바로잡는 전처리이며, 작업 후 '닫기 및 로드'를 눌러야 결과가 실제 시트로 내려온다는 점을 기억해야 합니다."},{"id":"L080","src":"lec","lec":5,"cat":"서비스구현","diff":"중","type":"mcq","q":"엑셀을 열지 않고 '모두 새로 고침'을 무인 실행하기 위해 강의가 사용한 방법은?","opts":["PowerShell 스크립트에서 COM(Excel.Application)으로 RefreshAll()을 호출","마우스 매크로 녹화 프로그램","매일 아침 직원이 수동 클릭","엑셀을 24시간 켜 둠"],"a":0,"expl":"PowerShell에서 New-Object -ComObject Excel.Application으로 엑셀을 화면에 띄우지 않고($excel.Visible=$false) 열어 $wb.RefreshAll()을 호출하면 '모두 새로 고침'이 무인 실행됩니다. 이 .ps1 스크립트를 작업 스케줄러(taskschd.msc 또는 schtasks /create)에 등록하면 매월 지정일에 자동으로 통합·전처리·갱신이 돌아갑니다. 남는 수작업은 폴더에 새 파일을 넣는 것뿐입니다."},{"id":"L081","src":"lec","lec":5,"cat":"서비스구현","diff":"중","type":"mcq","q":"'토큰 0 자동화'(Power Query + PowerShell + 작업 스케줄러)를 권한 강의의 의도로 가장 적절한 것은?","opts":["AI 도구가 항상 열등하기 때문","개인 PC의 반복 업무는 윈도우 내장 기능으로 충분한 경우가 많으므로 MCP·에이전트로 오버엔지니어링하지 말라는 것","파이썬이 유료화됐기 때문","클라우드가 법으로 금지됐기 때문"],"a":1,"expl":"개인 PC에서 도는 반복 업무라면 파이썬(인메모리 부담)이나 MCP·에이전트로 오버엔지니어링하지 말고 윈도우 내장 기능(Power Query+PowerShell+스케줄러)으로 충분할 때가 많습니다. 토큰 비용 0, 파이썬 설치도 불필요합니다. '이걸 해보면 오히려 AI가 들어가면 좋을 지점이 보인다'는 것이 강사의 의도이며, old is best의 실용주의입니다."},{"id":"L082","src":"lec","lec":5,"cat":"서비스구현","diff":"중","type":"mcq","q":"PowerShell 자동화에서 가장 흔한 오류 원인과 예방책으로 강의가 짚은 것은?","opts":["경로(path) 오류 — 손으로 치지 말고 폴더 화면을 캡처해 AI에 주고, 한글 깨짐은 UTF-8 인코딩(chcp 65001)으로 예방","CPU 과열 — 냉각팬 교체","마우스 배터리 방전","모니터 케이블 불량"],"a":0,"expl":"파이썬이든 PowerShell이든 가장 흔한 오류는 경로 오류(그리고 'No module named ○○')입니다. 경로를 손으로 치지 말고 폴더 화면을 캡처해 'AI야 내 경로 이거야'라고 주면 한 글자 실수가 줄어듭니다. PowerShell 한글 깨짐은 chcp 65001 또는 [Console]::OutputEncoding 설정으로 잡고, 붙여넣기 시 따옴표·틸드가 깨지는 것도 주의합니다."},{"id":"L083","src":"lec","lec":5,"cat":"서비스구현","diff":"상","type":"mcq","q":"콘솔로 웹페이지의 숫자·텍스트를 바꿔치기할 수 있다는 사실이 주는 교훈은?","opts":["URL이 그대로여도 화면 표시값은 조작 가능하므로, '통장 인증' 캡처 등은 새로고침 검증 없이 믿으면 안 된다","콘솔을 쓰면 실제 서버 데이터도 바뀐다","웹페이지의 모든 정보는 항상 정확하다","F12는 해킹 도구라 사용이 금지된다"],"a":0,"expl":"콘솔(JS)로는 화면에 표시된 값(DOM)을 그 자리에서 바꿀 수 있습니다. 서버 데이터가 아닌 클라이언트 표시만 바뀌므로 새로고침하면 원래대로 돌아옵니다. 따라서 '통장 잔고 인증' 같은 캡처를 곧이곧대로 믿으면 안 되고, '리프레시 해봐'가 검증법입니다. 클라이언트/서버 구분을 이해하는 좋은 사례입니다."},{"id":"L084","src":"lec","lec":5,"cat":"서비스구현","diff":"중","type":"mcq","q":"5회차 강의에서 소개한 Gemma 4 E4B 같은 로컬 모델을 고를 때의 관점으로 가장 적절한 것은?","opts":["무조건 가장 큰 모델을 받는다","내 PC 사양(RAM 등)에서 돌아가는 크기이면서 업무(요약·분류 등)에 충분한 멀티모달·성능인지 확인한다","이름이 예쁜 모델을 고른다","해외 모델은 모두 금지다"],"a":1,"expl":"로컬 LLM은 내 PC 사양에서 돌아가는 크기(강사 경험상 RAM 32GB는 돼야 쾌적, 16GB는 빠듯)와 업무 요구(요약·분류·멀티모달)를 함께 따져 고릅니다. Gemma 4 E4B는 멀티모달 지원의 효율적 소형 모델로 소개됐습니다. '민원 분류만 잘하는 작은 모델'처럼 스페시픽한 SLM이 폐쇄망 업무의 숨통을 틔울 수 있으며, 설치 전 보안 점검은 필수입니다."},{"id":"L085","src":"lec","lec":6,"cat":"AI트렌드","diff":"중","type":"mcq","q":"AI 에이전트의 구성 3요소로 강의가 제시한 것은?","opts":["두뇌(LLM)·도구·기억","CPU·RAM·SSD","입력·출력·저장","기획·개발·운영"],"a":0,"expl":"AI 에이전트는 두뇌(LLM, 어떤 도구를 쓸지 판단하는 주체), 도구(검색·계산·외부 API 등 두뇌가 못하는 일을 맡김), 기억(컨텍스트·메모리, 대화와 결과를 담아둠)으로 구성됩니다. Anthropic의 'Building Effective Agents'는 증강된 LLM = LLM+검색+도구+기억으로 정의하는데, 검색을 도구에 포함시키면 강사의 3요소와 일치합니다."},{"id":"L086","src":"lec","lec":6,"cat":"AI트렌드","diff":"상","type":"mcq","q":"에이전트에서 '기억 설계'가 1순위인 진짜 이유로 강의가 강조한 것은?","opts":["기억이 없으면 매번 초기화돼 같은 작업을 반복하고, 그때마다 LLM 호출 토큰 비용이 나가기 때문","기억은 법적 의무사항이기 때문","기억이 있어야 UI가 예뻐지기 때문","기억이 GPU 온도를 낮추기 때문"],"a":0,"expl":"기억이 없는 에이전트는 매번 초기화되는 '붕어 같은 존재'가 되어, 바로 전 단계 결과를 가져오면 될 일을 반복합니다. 그때마다 두뇌(LLM) 호출 = 토큰 = 돈이 나갑니다. 일관성·일회성 문제도 있지만 가장 근본 이유는 비용 효율입니다. '에이전트를 만들 때 1순위로 생각할 것 = 기억 설계'라고 강사가 못 박았습니다."},{"id":"L087","src":"lec","lec":6,"cat":"AI트렌드","diff":"중","type":"mcq","q":"RPA와 AI 에이전트의 결정적 차이는?","opts":["RPA는 룰(규칙) 기반이라 예상 밖 값에 무너지지만, AI 에이전트는 두뇌(LLM)의 자율 판단이 있다","RPA가 항상 더 지능적이다","AI 에이전트는 규칙을 절대 따르지 않는다","둘은 완전히 같은 기술이다"],"a":0,"expl":"RPA(Robotic Process Automation)는 룰 베이스라 예상 밖(튀는) 값이 들어오면 무너집니다. AI 에이전트는 두뇌(LLM)가 상황을 판단해 필요한 도구를 알아서 골라 쓰는 것이 핵심 차이입니다. 두뇌(자율 판단)가 빠지면 그냥 RPA입니다. 알고리즘도 규칙 기반이므로 그 자체는 AI 에이전트가 아닙니다."},{"id":"L088","src":"lec","lec":6,"cat":"AI트렌드","diff":"중","type":"mcq","q":"멀티 에이전트 구조 중 '네트워크' 구조의 약점으로 강의가 짚은 것은?","opts":["리더(결정권자)가 없어 헤매고, 이상치 하나가 전체로 번져 오염되며 코드가 수백 줄로 복잡해진다","항상 가장 저렴하다","단 하나의 에이전트만 쓸 수 있다","도구를 전혀 연결할 수 없다"],"a":0,"expl":"네트워크 구조는 모든 에이전트가 그물망처럼 서로 직접 대화해 병렬·유연하지만, 리더가 없어 서로 헤매고 이상치 하나가 옆으로 번져 전체가 오염됩니다. 같은 일을 싱글은 100줄, 네트워크는 수백 줄이 필요할 만큼 복잡해집니다. 이 '리더 없음'을 푸는 것이 슈퍼바이저(팀장)를 두는 오케스트레이션입니다."},{"id":"L089","src":"lec","lec":6,"cat":"AI트렌드","diff":"중","type":"mcq","q":"슈퍼바이저 구조의 대표적 약점은?","opts":["요청이 몰리면 팀장(슈퍼바이저)이 병목이 되고, 팀장에 붙인 모델의 API 비용이 급증한다","서브 에이전트를 둘 수 없다","반드시 무료 모델만 써야 한다","코드를 1줄 이상 쓸 수 없다"],"a":0,"expl":"슈퍼바이저 구조는 팀장이 요청을 나눠주고 조율해 병렬·유지보수에 유리하지만, 요청이 몰리면 팀장이 병목에 빠지고 팀장에 붙인 모델의 API 비용이 기하급수적으로 듭니다. 서브를 '도구'로만 취급하는 '슈퍼바이저 as 툴'은 통제가 강한 대신 사실상 싱글과 유사해지는 '폭군' 구조입니다. 계층형은 전문성 있게 돌지만 비용·시간이 큽니다."},{"id":"L090","src":"lec","lec":6,"cat":"AI트렌드","diff":"상","type":"mcq","q":"'핸드오프'와 '델리게이트'의 구분으로 옳은 것은?","opts":["결과를 넘기고 손을 털면 핸드오프, 반려돼 되돌아와 다시 하면 델리게이트(위임)","핸드오프는 하드웨어 교체, 델리게이트는 소프트웨어 업데이트","둘 다 데이터 암호화 기법이다","핸드오프는 사람만, 델리게이트는 AI만 할 수 있다"],"a":0,"expl":"팀장에게 보고서를 올리고 손을 털면 핸드오프, 팀장이 '다시 해'라고 해서 되돌아와 다시 하면 델리게이트(위임)입니다. 일반 멀티 에이전트는 되돌아올 수 있으므로 100% 핸드오프가 아닙니다. 순차(탑다운) 에이전트만 무조건 아래로 흐르는 100% 핸드오프인데, 앞 단계가 잘못 넘기면 뒤가 전부 무너진다는 것이 최대 약점입니다."},{"id":"L091","src":"lec","lec":6,"cat":"서비스구현","diff":"중","type":"mcq","q":"민원 초안 생성 멀티 에이전트 실습에서 '챗봇'과 '에이전트'를 가르는 기준으로 강의가 제시한 것은?","opts":["페르소나만 주면 챗봇이고, 도구까지 줘서 결과를 만들어내야 에이전트다","응답 속도가 1초 미만이면 에이전트다","한국어를 쓰면 챗봇, 영어를 쓰면 에이전트다","GPU를 쓰면 에이전트다"],"a":0,"expl":"'너는 분류 담당이야'라고 페르소나만 주면 전용 챗봇에 그치고, 도구를 붙여 실제로 행동해 결과를 만들어내야 에이전트입니다. 실습(민원 접수→분류→검색→작성→검수)에서는 각 에이전트에 페르소나+사용 가능한 도구를 함께 부여했으며, 법령 API 같은 무거운 도구는 '예시 도구'로 대체해도 됩니다."},{"id":"L092","src":"lec","lec":6,"cat":"서비스구현","diff":"중","type":"mcq","q":"OpenRouter에 대한 설명으로 가장 적절한 것은?","opts":["키 하나로 수백 개 모델(여러 공급자)을 OpenAI 호환 방식으로 부르는 통합 게이트웨이","GPU를 물리적으로 라우팅하는 네트워크 장비","오픈소스 공유기 펌웨어","모델을 학습시키는 클라우드 GPU 팜"],"a":0,"expl":"OpenRouter는 API 키 하나로 60여 개 공급자의 수백 개 모델(OpenAI·Anthropic·Google·Meta 등)을 OpenAI 호환 방식으로 호출하는 통합 게이트웨이입니다. 공급자별 인증·결제·SDK를 따로 만들 필요가 없고 장애 시 폴백도 가능하며, 대시보드에서 사용 모델·비용을 확인할 수 있습니다. base_url을 openrouter.ai/api/v1로 바꾸고 모델 문자열만 지정하면 됩니다."},{"id":"L093","src":"lec","lec":6,"cat":"서비스구현","diff":"중","type":"mcq","q":"API 키 관리의 표준 방법으로 강의가 강조한 것은?","opts":["코드에 직접 하드코딩한다","HTML 프론트에 넣어 공유한다",".env 파일에 넣고 .gitignore로 깃 추적에서 제외하며, 키를 쓰는 호출은 서버·로컬 스크립트에서 한다","포스트잇에 적어 모니터에 붙인다"],"a":2,"expl":"API 키는 코드에 박지 말고 .env(환경변수 파일)에 두고, .gitignore에 .env를 추가해 깃에 올라가지 않게 합니다. HTML 프론트에서 직접 키를 부르면 브라우저에 그대로 노출되므로, 키를 쓰는 호출은 서버(백엔드)나 로컬 스크립트에서 해야 합니다. python-dotenv의 load_dotenv()로 읽어 os.environ으로 사용하는 것이 표준 패턴입니다."},{"id":"L094","src":"lec","lec":6,"cat":"생성형AI활용","diff":"중","type":"mcq","q":"'적정 에이전트 수'에 대한 강의 지침으로 가장 적절한 것은?","opts":["에이전트는 많을수록 무조건 좋다","역할이 명확하지 않으면 에이전트끼리 계속 왔다 갔다 하므로, 의심스러우면 수를 줄이고 비용·정확도를 측정해 최적을 찾는다","에이전트는 반드시 정확히 7개여야 한다","에이전트 수는 한 번 정하면 바꿀 수 없다"],"a":1,"expl":"'백지장도 맞들면 낫다'지만 너무 잘게 쪼개면 '사공이 많으면 배가 산으로' 갑니다. 에이전트가 7~8개로 계속 오가는 것은 각자 일이 명확하지 않다는 신호이며, 의심스러우면 줄이는 게 최선입니다. 최적값은 에이전트별 비용을 기록하고 민원 100건 등으로 구조별 비용·정확도를 비교하는 경험(측정)으로 찾습니다. 의사결정나무의 depth처럼 너무 적어도 많아도 안 됩니다."},{"id":"L095","src":"lec","lec":6,"cat":"생성형AI활용","diff":"중","type":"mcq","q":"'무조건 플랜 먼저' 원칙에서 플랜에 담을 4가지 요소는?","opts":["목표·범위·단계·완료 기준","이름·주소·연락처·이메일","색상·폰트·여백·아이콘","서론·본론·결론·참고문헌"],"a":0,"expl":"'뭐 만들어줘'라고 바로 시키지 말고 ① 목표 ② 범위 ③ 단계 ④ 완료 기준을 먼저 세우게 해야 합니다. 처음 보는 개념도 메타 프롬프트('내 상황이 이러니 플랜 프롬프트를 네가 만들어줘')로 시작할 수 있고, 만든 플랜은 다른 AI에게 '가장 크리티컬한 부분이 뭐야? 냉정하게 검토해'로 교차 검토시킵니다. 3살 아이 심부름 비유처럼 지시는 생각보다 명확하지 않기 때문입니다."},{"id":"L096","src":"lec","lec":6,"cat":"생성형AI활용","diff":"중","type":"mcq","q":"plan.md와 Git으로 개발 이력을 남기는 이유로 강의가 강조한 것은?","opts":["계획은 변해도 되지만 '바뀐 이유'가 사라지면 안 되기 때문","파일 용량을 줄이기 위해","상급자 결재를 생략하기 위해","코드를 암호화하기 위해"],"a":0,"expl":"계획은 바뀔 수 있지만 언제·왜·어디를 바꿨는지의 기록이 사라지면 유지보수가 불가능해집니다. plan.md에 목표·범위·단계·완료 기준·변경 이력을 남기고, Git 커밋으로 '언제 뭘 했다'를 영구 기록합니다(git add → commit). 픽셀 에이전트 원저자의 커밋 145개가 모두 그 이력이며, 개발자가 GitHub를 쓰는 가장 큰 이유가 이 관리 편의성입니다."},{"id":"L097","src":"lec","lec":6,"cat":"AI트렌드","diff":"상","type":"mcq","q":"멀티 에이전트 비용이 '토큰 스노우볼'처럼 불어나는 구조적 이유는?","opts":["핸드오프마다 이전 작업 내용 전체가 다음 에이전트의 입력 토큰이 되고, 추론(Thinking) 토큰과 출력 토큰이 단계마다 누적되기 때문","전기요금이 누진제이기 때문","에이전트가 많으면 세금이 붙기 때문","GPU 가격이 매일 오르기 때문"],"a":0,"expl":"A가 작업 파일을 넘기면 B는 그것 전체를 입력 토큰으로 받고, 다시 추론(Thinking) 토큰과 출력 토큰을 씁니다. 이것이 다음 에이전트로 계속 누적되며 비용이 일차함수가 아니라 눈덩이처럼 붑니다. 요즘 모델은 Thinking이 기본이라 추론 과정도 전부 과금되며(effort 레벨이 추론량 조절 장치), 에이전트를 과도하게 늘리면 과금 폭탄이 되는 이유입니다."},{"id":"L098","src":"lec","lec":6,"cat":"AI트렌드","diff":"상","type":"mcq","q":"LatentMAS 논문의 핵심 아이디어는?","opts":["에이전트 간 통신을 사람 말(텍스트 디코딩)로 하지 않고 잠재(latent) 표현을 그대로 넘겨 토큰을 크게 절감한다","에이전트를 잠수함에서 실행한다","모든 에이전트를 하나로 합쳐 싱글로 만든다","토큰 가격을 정부가 규제한다"],"a":0,"expl":"LatentMAS는 모델 사이 통신에서 굳이 텍스트로 디코딩하지 않고 마지막 층의 잠재(latent) 표현을 공유 잠재 메모리로 그대로 넘기는 접근입니다. 논문은 토큰 70.8~83.7% 절감, 속도 4배 이상을 보고했습니다. 다만 모델마다 토크나이저·임베딩이 달라 이종(heterogeneous) 모델 간 전달에서는 열화가 연구 쟁점이며, 어휘 통일이 이론상 해법이지만 회사 간 표준 통일은 현실적으로 어렵다는 열린 문제도 함께 소개됐습니다."},{"id":"L099","src":"lec","lec":6,"cat":"AI트렌드","diff":"중","type":"mcq","q":"퍼셉트론·임베딩·RNN·트랜스포머의 발전 흐름에 대한 설명으로 옳지 않은 것은?","opts":["퍼셉트론은 가중치를 고쳐가며 학습하는 딥러닝의 최소 단위다","임베딩은 단어·이미지를 숫자 벡터(좌표)로 바꾸는 것이다","RNN/LSTM은 긴 문맥 처리에 한계가 있었다","트랜스포머는 2017년 OpenAI가 발표한 구조다"],"a":3,"expl":"트랜스포머는 2017년 구글의 'Attention Is All You Need' 논문에서 나왔습니다. 정작 구글은 공개 정책 탓에 선점하지 못했고 OpenAI가 디코더 부분을 픽업해 GPT로 키웠습니다. 퍼셉트론(최소 단위)→임베딩(벡터화)→N-gram→RNN/LSTM(시간·기억 추가, 긴 문맥 한계)→트랜스포머(어텐션)의 흐름으로 모델이 '말'을 배웠습니다."},{"id":"L100","src":"lec","lec":6,"cat":"서비스구현","diff":"중","type":"mcq","q":"남이 만든 오픈소스(픽셀 에이전트)를 내 PC로 가져와 수정하는 표준 절차의 시작은?","opts":["git clone으로 레포를 복제한 뒤 의존성 설치(npm install 등) 후 실행해 보고, 순서와 요령을 지켜 뜯어고친다","소스코드를 화면 캡처해 다시 타이핑한다","개발자에게 우편으로 CD를 요청한다","웹사이트를 통째로 인쇄한다"],"a":0,"expl":"git clone으로 레포를 내 PC에 복제하고, Node.js 프로젝트라면 npm install로 의존성을 설치한 뒤 실행해 봅니다. 그다음 구조를 파악하며 순서대로 뜯어고칩니다(리버스 엔지니어링 — '모방은 창조의 어머니'). 잘 만든 오픈 멀티 에이전트를 하나 뜯어보며 구성을 따라가는 것도 훌륭한 학습법이며, 과제도 결과물을 GitHub에 올려 주소를 제출하는 방식이었습니다."}];
const WORKS = [{"n":1,"orig":9,"title":"업무량 통계 대시보드 HTML 프로그램 제작","scenario":"관리자는 부서별 업무 접수량, 처리 건수, 지연 건수를 매주 확인해야 한다. 엑셀 피벗 없이 CSV를 업로드하면 부서별 업무량과 지연 현황을 자동 시각화하는 오프라인 HTML 대시보드를 만드시오.","files":["workload.csv"],"cols":[["task_id","업무 ID"],["department","담당부서"],["staff_name","담당자"],["received_date","접수일"],["due_date","처리기한"],["completed_date","완료일"],["task_type","업무유형"],["status","상태"]],"todo":["CSV 업로드 후 부서별 접수·완료·지연 건수를 계산한다.","담당자별 처리량을 표와 그래프로 표시한다.","처리기한 초과 건을 자동 분류한다.","업무유형별 비중을 시각화한다.","필터링 결과를 내려받을 수 있게 한다."],"deliv":["HTML/CSS/JS 대시보드","샘플 CSV","계산 기준 설명","화면 캡처 또는 사용 가이드"],"tip":"핵심은 CSV 파싱과 '지연' 판정 로직입니다. 프롬프트에 컬럼 정의(특히 due_date와 completed_date의 비교 규칙, 미완료 건 처리)를 그대로 넣고 'CDN 없이 단일 HTML, FileReader로 CSV 업로드, 차트는 순수 JS/SVG로'를 명시하세요. 지연 판정 기준(완료일>기한 또는 미완료+기한 경과)을 설명 문서에 반드시 적어야 검증 가능성 점수를 받습니다."},{"n":2,"orig":7,"title":"교육 커리큘럼 자동 편성 HTML 도구 제작","scenario":"교육 운영자는 강의 주제, 강사 가능 시간, 교육장 사용 가능 시간을 조합해 매번 시간표를 만든다. AI 없이 규칙 기반으로 충돌을 줄이고 시간표 초안을 자동 생성하는 HTML/CSS/JS 도구를 만드시오.","files":[],"cols":[["topic_id","강의 주제 ID"],["topic_name","강의명"],["duration_minutes","교육시간"],["instructor_id","강사 ID"],["available_slot","가능 시간"],["room_id","교육장 ID"],["capacity","수용 인원"]],"todo":["주제, 강사, 교육장 CSV를 업로드한다.","강사 가능 시간과 교육장 가능 시간을 기준으로 시간표를 배치한다.","시간 충돌과 정원 초과를 표시한다.","수동 수정 기능을 제공한다.","최종 시간표를 CSV 또는 인쇄용 화면으로 출력한다."],"deliv":["폐쇄망 실행 가능한 HTML 도구","샘플 입력자료 3종","자동 편성 결과","충돌 처리 규칙 설명"],"tip":"규칙 기반 배치 문제라 프롬프트에 충돌 규칙을 수식처럼 정의하는 것이 승부처입니다. '같은 강사·같은 교육장·같은 시간대 중복 금지, 정원 초과 표시'를 우선순위와 함께 명시하고, 배치 실패 건은 '미배치 목록'으로 따로 보여달라고 요구하세요. 3개 CSV의 조인 키(instructor_id, room_id)를 프롬프트에 명확히 적으면 오류가 크게 줄어듭니다."},{"n":3,"orig":13,"title":"생활불편 신고 접수·처리현황 공개 서비스 구축","scenario":"시민은 도로 파손, 불법 투기, 가로등 고장 등 생활불편 사항을 신고하고 처리 현황을 확인하고 싶어 한다. 위치, 사진, 신고 유형을 입력받고 담당부서가 처리 상태를 갱신하는 대국민 서비스를 구축하시오.","files":[],"cols":[["report_id","신고 ID"],["reporter_id","신고자 ID"],["report_type","신고 유형"],["address","위치 주소"],["latitude","위도"],["longitude","경도"],["description","신고 내용"],["photo_url","사진 URL"],["status", /* ─────────── 저장소 어댑터: claude artifact(window.storage) → localStorage → 메모리 ─────────── */
const store = (() => {
  const mem = {};
  const hasWS = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
  let hasLS = false;
  try { const k='__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); hasLS = true; } catch(e){}
  return {
    async get(key){
      if (hasWS){ try{ const r = await window.storage.get('aiq_'+key); return r ? JSON.parse(r.value) : null; }catch(e){ return null; } }
      if (hasLS){ try{ const v = localStorage.getItem('aiq_'+key); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
      return mem[key] ?? null;
    },
    async set(key, val){
      const s = JSON.stringify(val);
      if (hasWS){ try{ await window.storage.set('aiq_'+key, s); return; }catch(e){} }
      if (hasLS){ try{ localStorage.setItem('aiq_'+key, s); return; }catch(e){} }
      mem[key] = val;
    }
  };
})();

  timer: null,

const $ = sel => document.querySelector(sel);
const view = () => $('#view');
const TYPE_LABEL = { mcq:'객관식', short:'단답형', essay:'서술형' };
const LEC_LABEL = ['모의평가','1회차·에이전트 시대','2회차·프론티어 탐색','3회차·워크플로우','4회차·바이브코딩1','5회차·바이브코딩2','6회차·에이전트 개발'];
const TIME_LIMITS = { practice:15, exam:30, retry:15 };
function timeLimit(){ return TIME_LIMITS[S.session?.mode] || 30; }

function byId(id){ return QUESTIONS.find(q => q.id === id); }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function loadState(){
  const w = await store.get('wrongIds'); if (Array.isArray(w)) S.wrongIds = w.filter(id=>byId(id));
  const h = await store.get('history'); if (h) S.history = Object.assign(S.history, h);
}
function saveState(){ store.set('wrongIds', S.wrongIds); store.set('history', S.history); }
function addWrong(id){ if(!S.wrongIds.includes(id)){ S.wrongIds.push(id); saveState(); } }
function removeWrong(id){ const i=S.wrongIds.indexOf(id); if(i>-1){ S.wrongIds.splice(i,1); saveState(); } }

function stopTimer(){ if(S.timer){ clearInterval(S.timer); S.timer=null; } }
function goHome(){ stopTimer(); S.session=null; renderHome(); }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1900); }

/* ─────────── 연습 모드 설정 ─────────── */
const FILTER = { src:'all', lec:'all' };
function renderPracticeSetup(){
  stopTimer();
  $('#homeBtn').style.display='';
  const count = filteredPool().length;
  view().innerHTML = `
  <div class="sheet">
    <h3>🌱 연습 모드 설정</h3>
    <p class="sub">범위를 고르고 시작하세요. 전 문항 객관식이며 순서는 매번 섞입니다.</p>
    <div class="fgroup"><label>출처</label><div class="opts-row">
      ${fopt('src','all','전체')}${fopt('src','word','모의평가 시험지')}${fopt('src','lec','강의노트 6종')}
    </div></div>
    <div class="fgroup" style="${FILTER.src==='lec'?'':'display:none'}"><label>강의 회차</label><div class="opts-row">
      ${fopt('lec','all','전체')}${[1,2,3,4,5,6].map(n=>fopt('lec',String(n),n+'회차')).join('')}
    </div></div>
    <button class="start-btn" ${count?'':'disabled'} onclick="startPractice()">연습 시작 · ${count}문항</button>
  </div>`;
}
function fopt(group, val, label){
  const on = FILTER[group]===val ? 'on':'';
  return `<button class="fopt ${on}" onclick="setFilter('${group}','${val}')">${label}</button>`;
}
function setFilter(g,v){ FILTER[g]=v; if(g==='src'&&v!=='lec') FILTER.lec='all'; renderPracticeSetup(); }
function filteredPool(){
  return QUESTIONS.filter(q=>{
    if (FILTER.src==='word' && q.src!=='word') return false;
    if (FILTER.src==='lec' && q.src!=='lec') return false;
    if (FILTER.lec!=='all' && String(q.lec)!==FILTER.lec) return false;
    return true;
  });
}

/* ─────────── 세션 시작 ─────────── */
function startPractice(){
  const pool = shuffle(filteredPool());
  if(!pool.length) return;
  S.session = { mode:'practice', queue:pool, idx:0, correct:0, streak:0, answers:[] };
  renderQuestion();
}
function startExam(){
  const mcqs = QUESTIONS.filter(q=>q.type==='mcq');
  const picked = shuffle(mcqs).slice(0,60);
  S.session = { mode:'exam', queue:picked, idx:0, correct:0, streak:0, answers:[] };
  renderQuestion();
}
function startRetry(){
  const pool = shuffle(S.wrongIds.map(byId).filter(Boolean));
  if(!pool.length){ renderRetryEmpty(); return; }
  S.session = { mode:'retry', queue:pool, idx:0, correct:0, streak:0, answers:[] };
  renderQuestion();
}
