<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI 챔피언 1차 역량평가 대비 문제은행</title>
<style>
:root{
  --bg:#EDF1F5; --card:#FFFFFF; --ink:#17263B; --sub:#5B6B80; --line:#D7E0EA;
  --pine:#0E7C66; --pine-deep:#0A5B4B; --pine-soft:#E2F3EE;
  --amber:#F5A623; --amber-soft:#FEF3DD;
  --red:#DE4B54; --red-soft:#FCE9EA;
  --blue:#2F5FD0; --blue-soft:#E8EEFB;
  --shadow:0 2px 6px rgba(23,38,59,.06), 0 10px 24px rgba(23,38,59,.07);
  --mono:ui-monospace,'Cascadia Code','JetBrains Mono','D2Coding',Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.6; min-height:100vh;
  background-image:radial-gradient(circle at 12% -8%, #DDEBE6 0, transparent 42%),radial-gradient(circle at 105% 8%, #E4EAF7 0, transparent 40%);
  background-attachment:fixed;
}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 80px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ── 헤더 ── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--pine) 0%,var(--pine-deep) 100%);display:grid;place-items:center;color:#fff;font-weight:800;font-size:.95rem;letter-spacing:-.5px;box-shadow:var(--shadow)}
.brand h1{font-size:1.02rem;font-weight:800;letter-spacing:-.3px;line-height:1.25}
.brand small{display:block;font-size:.72rem;color:var(--sub);font-weight:600}
.home-btn{font-size:.8rem;font-weight:700;color:var(--sub);padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card)}
.home-btn:hover{color:var(--pine);border-color:var(--pine)}

/* ── 홈 ── */
.hero{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:26px 24px;box-shadow:var(--shadow);margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"7.9 ~ 7.10 시험";position:absolute;top:20px;right:-38px;transform:rotate(35deg);background:var(--amber);color:#5C3E00;font-size:.66rem;font-weight:800;padding:4px 44px;letter-spacing:1px}
.hero .eyebrow{font-size:.72rem;font-weight:800;color:var(--pine);letter-spacing:1.5px;margin-bottom:6px}
.hero h2{font-size:1.5rem;font-weight:800;letter-spacing:-.8px;line-height:1.35;margin-bottom:8px;word-break:keep-all}
.hero p{font-size:.86rem;color:var(--sub)}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font-size:.72rem;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--pine-soft);color:var(--pine-deep)}
.chip.warn{background:var(--amber-soft);color:#8A5B00}
.chip.info{background:var(--blue-soft);color:var(--blue)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 12px;text-align:center}
.stat b{display:block;font-size:1.35rem;font-weight:800;font-family:var(--mono);letter-spacing:-1px}
.stat span{font-size:.7rem;color:var(--sub);font-weight:700}
.stat.g b{color:var(--pine)} .stat.a b{color:#C77E00} .stat.r b{color:var(--red)} .stat.b b{color:var(--blue)}

.modes{display:grid;gap:12px;margin-bottom:16px}
.mode{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:20px;display:flex;gap:16px;align-items:center;text-align:left;box-shadow:var(--shadow);transition:transform .12s,border-color .12s;width:100%}
.mode:hover{transform:translateY(-2px);border-color:var(--pine)}
.mode:active{transform:scale(.99)}
.mode .icon{flex:0 0 54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:1.5rem}
.mode.practice .icon{background:var(--pine-soft)} .mode.exam .icon{background:var(--amber-soft)} .mode.retry .icon{background:var(--red-soft)} .mode.lecture .icon{background:var(--blue-soft)}
.mode h3{font-size:1.05rem;font-weight:800;letter-spacing:-.4px}
.mode p{font-size:.8rem;color:var(--sub);margin-top:2px;word-break:keep-all}
.mode .badge{margin-left:auto;flex:0 0 auto;font-size:.72rem;font-weight:800;color:var(--sub);background:var(--bg);padding:6px 11px;border-radius:999px;font-family:var(--mono)}
.mode.retry .badge.hot{background:var(--red-soft);color:var(--red)}

/* ── 필터 시트 ── */
.sheet{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.sheet h3{font-size:1.05rem;font-weight:800;margin-bottom:4px}
.sheet .sub{font-size:.8rem;color:var(--sub);margin-bottom:16px}
.fgroup{margin-bottom:16px}
.fgroup label{display:block;font-size:.74rem;font-weight:800;color:var(--sub);letter-spacing:.5px;margin-bottom:8px}
.opts-row{display:flex;flex-wrap:wrap;gap:8px}
.fopt{font-size:.8rem;font-weight:700;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--sub);transition:.12s}
.fopt.on{background:var(--pine);border-color:var(--pine);color:#fff}
.start-btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--pine);color:#fff;font-size:.95rem;font-weight:800;letter-spacing:-.3px;margin-top:6px;transition:.12s;text-align:center}
.start-btn:hover{background:var(--pine-deep)}
.start-btn:disabled{background:var(--line);color:var(--sub);cursor:not-allowed}

/* ── 퀴즈 화면 ── */
.quiz-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qprog{flex:1}
.qprog .txt{display:flex;justify-content:space-between;font-size:.72rem;font-weight:800;color:var(--sub);margin-bottom:5px;font-family:var(--mono)}
.bar{height:8px;background:#DBE4ED;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pine),#18A184);border-radius:99px;transition:width .3s}
.quit{font-size:.74rem;font-weight:700;color:var(--sub);padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);flex:0 0 auto}

/* 타이머 링 — 시그니처 */
.timer-zone{display:flex;justify-content:center;margin:4px 0 14px}
.ring-wrap{position:relative;width:92px;height:92px}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:#DBE4ED;stroke-width:7}
.ring-fg{fill:none;stroke:var(--pine);stroke-width:7;stroke-linecap:round;transition:stroke .3s}
.ring-num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:1.7rem;font-weight:800;letter-spacing:-1px}
.ring-wrap.warn .ring-fg{stroke:var(--amber)} .ring-wrap.warn .ring-num{color:#C77E00}
.ring-wrap.danger .ring-fg{stroke:var(--red)} .ring-wrap.danger .ring-num{color:var(--red)}
.ring-wrap.danger{animation:pulse .55s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.ring-wrap.done .ring-fg{stroke:var(--line)} .ring-wrap.done .ring-num{font-size:.85rem;color:var(--sub)}

.combo{position:fixed;top:14px;right:14px;z-index:50;background:linear-gradient(135deg,#FF9A3D,#F5622E);color:#fff;font-weight:800;font-size:.85rem;font-family:var(--mono);padding:8px 15px;border-radius:999px;box-shadow:0 6px 18px rgba(245,98,46,.4);display:none;animation:comboPop .3s}
@keyframes comboPop{0%{transform:scale(.5)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

.qcard{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.qtags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.qtag{font-size:.68rem;font-weight:800;padding:4px 10px;border-radius:7px;letter-spacing:.3px}
.qtag.src-word{background:var(--blue-soft);color:var(--blue)}
.qtag.src-lec{background:var(--pine-soft);color:var(--pine-deep)}
.qtag.src-custom{background:var(--amber-soft);color:#8A5B00}
.qtag.cat{background:#F0F3F7;color:var(--sub)}
.qtag.d-하{background:#EAF6EC;color:#2E7D46} .qtag.d-중{background:var(--amber-soft);color:#8A5B00} .qtag.d-상{background:var(--red-soft);color:var(--red)}
.qtag.type{background:#EFEAFB;color:#6741C6}
.qtext{font-size:1.01rem;font-weight:700;letter-spacing:-.3px;line-height:1.65;margin-bottom:18px;word-break:keep-all}

.choices{display:grid;gap:9px}
.choice{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;padding:13px 15px;border-radius:13px;border:1.5px solid var(--line);background:#FBFCFE;font-size:.9rem;line-height:1.55;transition:.12s;word-break:keep-all}
.choice .key{flex:0 0 26px;height:26px;border-radius:8px;background:#E8EDF3;color:var(--sub);display:grid;place-items:center;font-weight:800;font-size:.78rem;font-family:var(--mono);margin-top:1px}
.choice:not(:disabled):hover{border-color:var(--pine);background:#F5FBF9}
.choice.picked{border-color:var(--blue);background:var(--blue-soft)}
.choice.correct{border-color:var(--pine);background:var(--pine-soft)}
.choice.correct .key{background:var(--pine);color:#fff}
.choice.wrong{border-color:var(--red);background:var(--red-soft)}
.choice.wrong .key{background:var(--red);color:#fff}
.choice:disabled{cursor:default;opacity:1}
.choice.dim{opacity:.5}

.think-box{border:1.5px dashed var(--line);border-radius:13px;padding:16px;background:#FBFCFE;font-size:.85rem;color:var(--sub);text-align:center;margin-bottom:4px;word-break:keep-all}
.think-box b{color:var(--ink)}

.reveal{margin-top:16px;border-radius:14px;padding:16px;animation:fadeUp .3s}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.reveal.ok{background:var(--pine-soft);border:1.5px solid #BCE3D8}
.reveal.no{background:var(--red-soft);border:1.5px solid #F3C4C7}
.reveal.neutral{background:var(--blue-soft);border:1.5px solid #C9D8F5}
.reveal .verdict{font-size:.95rem;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.reveal.ok .verdict{color:var(--pine-deep)} .reveal.no .verdict{color:var(--red)} .reveal.neutral .verdict{color:var(--blue)}
.reveal .ans-line{font-size:.84rem;font-weight:700;margin-bottom:8px;word-break:keep-all}
.reveal .expl{font-size:.84rem;line-height:1.7;color:#2B3B52;word-break:keep-all}
.reveal .expl-label{font-size:.68rem;font-weight:800;letter-spacing:1px;color:var(--sub);margin:10px 0 4px}

.self-grade{display:flex;gap:9px;margin-top:14px}
.self-grade button{flex:1;padding:12px;border-radius:12px;font-size:.86rem;font-weight:800;border:1.5px solid}
.sg-ok{background:var(--pine-soft);border-color:#BCE3D8;color:var(--pine-deep)}
.sg-ok:hover{background:#CFEDE4}
.sg-no{background:var(--red-soft);border-color:#F3C4C7;color:var(--red)}
.sg-no:hover{background:#F8D9DB}

.next-btn{width:100%;margin-top:14px;padding:14px;border-radius:13px;background:var(--ink);color:#fff;font-size:.92rem;font-weight:800;transition:.12s}
.next-btn:hover{background:#22344E}
.kbd-hint{text-align:center;font-size:.68rem;color:#93A2B5;margin-top:10px;font-family:var(--mono)}

/* ── 결과 화면 ── */
.result-hero{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:28px 22px;text-align:center;box-shadow:var(--shadow);margin-bottom:14px}
.result-hero .grade{font-size:3rem;line-height:1}
.result-hero h2{font-size:1.35rem;font-weight:800;letter-spacing:-.5px;margin:10px 0 4px}
.result-hero p{font-size:.84rem;color:var(--sub)}
.score-row{display:flex;justify-content:center;gap:22px;margin-top:18px}
.score-item b{display:block;font-size:1.5rem;font-weight:800;font-family:var(--mono);letter-spacing:-1px}
.score-item span{font-size:.7rem;color:var(--sub);font-weight:700}
.pass-tag{display:inline-block;margin-top:14px;font-size:.78rem;font-weight:800;padding:7px 16px;border-radius:999px}
.pass-tag.pass{background:var(--pine-soft);color:var(--pine-deep)}
.pass-tag.fail{background:var(--red-soft);color:var(--red)}
.wrong-list h3{font-size:.95rem;font-weight:800;margin:18px 4px 10px}
.wrong-item{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px}
.wrong-item .wq{font-size:.86rem;font-weight:700;margin:6px 0 10px;word-break:keep-all}
.wrong-item .wa{font-size:.8rem;margin-bottom:4px;word-break:keep-all}
.wrong-item .wa.user{color:var(--red)} .wrong-item .wa.real{color:var(--pine-deep);font-weight:700}
.wrong-item .wex{font-size:.79rem;color:#40506A;line-height:1.65;background:#F6F8FB;border-radius:10px;padding:11px 13px;margin-top:8px;word-break:keep-all}
.res-actions{display:grid;gap:9px;margin-top:16px}
.res-actions .primary{padding:14px;border-radius:13px;background:var(--pine);color:#fff;font-weight:800;font-size:.9rem}
.res-actions .ghost{padding:14px;border-radius:13px;background:var(--card);border:1.5px solid var(--line);font-weight:800;font-size:.9rem;color:var(--sub)}

/* 정답 이펙트 */
.fx-layer{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.confetti{position:absolute;width:9px;height:9px;border-radius:2px;animation:confFall linear forwards}
@keyframes confFall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}
.stamp{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%) scale(.4);font-size:4.2rem;z-index:98;pointer-events:none;animation:stampIn .55s forwards;filter:drop-shadow(0 6px 14px rgba(0,0,0,.18))}
@keyframes stampIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-14deg)}45%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(4deg)}70%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}

.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:20px;padding:44px 20px;text-align:center}
.empty .big{font-size:2.6rem;margin-bottom:10px}
.empty p{font-size:.88rem;color:var(--sub);word-break:keep-all}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:.8rem;font-weight:700;padding:11px 20px;border-radius:999px;z-index:100;animation:fadeUp .25s;box-shadow:0 8px 22px rgba(0,0,0,.25)}


/* ── 작업형 대비 ── */
.mode.work .icon{background:var(--blue-soft)}
.wt-list{display:grid;gap:10px}
.wt-item{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;gap:13px;align-items:center;text-align:left;width:100%;transition:.12s;box-shadow:var(--shadow)}
.wt-item:hover{border-color:var(--blue);transform:translateY(-1px)}
.wt-item .no{flex:0 0 38px;height:38px;border-radius:11px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:800;font-family:var(--mono);font-size:.85rem}
.wt-item h4{font-size:.92rem;font-weight:800;letter-spacing:-.3px;word-break:keep-all}
.wt-item p{font-size:.74rem;color:var(--sub);margin-top:2px}
.wt-item .arrow{margin-left:auto;color:var(--sub);font-weight:800}
.wt-note{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:15px 18px;margin-bottom:12px}
.wt-note b{font-size:.82rem}
.wt-note ul{margin:7px 0 0 2px;list-style:none}
.wt-note li{font-size:.76rem;color:var(--sub);line-height:1.7;padding-left:16px;position:relative;word-break:keep-all}
.wt-note li::before{content:"·";position:absolute;left:4px;color:var(--blue);font-weight:800}
.wd-sec{margin-top:18px}
.wd-sec .sec-label{font-size:.7rem;font-weight:800;letter-spacing:1.2px;color:var(--sub);margin-bottom:7px;display:flex;align-items:center;gap:6px}
.wd-sec .scenario{font-size:.9rem;line-height:1.75;word-break:keep-all;background:#F6F8FB;border-radius:12px;padding:14px 16px}
.wd-cols{width:100%;border-collapse:collapse;font-size:.8rem}
.wd-cols th,.wd-cols td{border:1px solid var(--line);padding:7px 11px;text-align:left}
.wd-cols th{background:#F0F4F8;font-weight:800;font-size:.72rem;color:var(--sub)}
.wd-cols td:first-child{font-family:var(--mono);font-size:.76rem;color:var(--blue);white-space:nowrap}
.wd-file{display:inline-block;font-family:var(--mono);font-size:.74rem;font-weight:700;background:var(--blue-soft);color:var(--blue);padding:4px 10px;border-radius:7px;margin-bottom:8px}
.wd-steps{list-style:none;display:grid;gap:7px}
.wd-steps li{display:flex;gap:10px;font-size:.86rem;line-height:1.6;word-break:keep-all}
.wd-steps .n{flex:0 0 22px;height:22px;border-radius:7px;background:var(--pine-soft);color:var(--pine-deep);display:grid;place-items:center;font-family:var(--mono);font-weight:800;font-size:.7rem;margin-top:2px}
.wd-steps.deliv .n{background:var(--amber-soft);color:#8A5B00}
.wd-tip{background:linear-gradient(135deg,#FFF9EC,#FFF3D9);border:1.5px solid #F3DFAE;border-radius:14px;padding:15px 17px;font-size:.85rem;line-height:1.75;word-break:keep-all}
.wd-tip .tip-head{font-weight:800;color:#8A5B00;font-size:.8rem;margin-bottom:5px}
.wd-rubric{background:#F6F8FB;border:1.5px solid var(--line);border-radius:14px;padding:15px 17px}
.wd-rubric li{font-size:.8rem;color:#2B3B52;line-height:1.75;list-style:none;padding-left:22px;position:relative;word-break:keep-all}
.wd-rubric li::before{content:"✓";position:absolute;left:2px;color:var(--pine);font-weight:800}
.wd-nav{display:flex;gap:9px;margin-top:16px}
.wd-nav button{flex:1;padding:13px;border-radius:12px;font-weight:800;font-size:.85rem;border:1.5px solid var(--line);background:var(--card);color:var(--sub)}
.wd-nav button:hover{border-color:var(--blue);color:var(--blue)}


/* ── 오답노트 관리 ── */
.wn-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.wn-head h3{font-size:1.05rem;font-weight:800}
.wn-head .cnt{font-family:var(--mono);color:var(--red);font-weight:800}
.wn-tools{display:flex;gap:8px;flex-wrap:wrap}
.wn-btn{font-size:.78rem;font-weight:800;padding:9px 14px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);color:var(--sub);transition:.12s}
.wn-btn:hover{border-color:var(--blue);color:var(--blue)}
.wn-btn.go{background:var(--red);border-color:var(--red);color:#fff}
.wn-btn.go:hover{background:#C43A43}
.wn-btn.pdf{border-color:#C9D8F5;background:var(--blue-soft);color:var(--blue)}
.wn-btn.danger:hover{border-color:var(--red);color:var(--red)}
.wn-item{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 44px 16px 16px;margin-bottom:10px}
.wn-del{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:9px;background:var(--bg);color:var(--sub);font-weight:800;font-size:.85rem;display:grid;place-items:center;transition:.12s}
.wn-del:hover{background:var(--red-soft);color:var(--red)}
.wn-q{font-size:.86rem;font-weight:700;margin:6px 0 8px;word-break:keep-all}
.wn-ans{font-size:.8rem;color:var(--pine-deep);font-weight:700;margin-bottom:6px;word-break:keep-all}
.wn-ex{font-size:.79rem;color:#40506A;line-height:1.65;background:#F6F8FB;border-radius:10px;padding:11px 13px;word-break:keep-all}
.wn-toggle{font-size:.74rem;font-weight:800;color:var(--blue);margin-top:6px}

/* ── 인쇄(PDF) ── */
#printArea{display:none}
@media print{
  body{background:#fff!important;background-image:none!important}
  .wrap,.fx-layer,.combo,.toast{display:none!important}
  #printArea{display:block;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#111;padding:0 4mm}
  #printArea .p-head{border-bottom:2.5px solid #0E7C66;padding-bottom:8px;margin-bottom:14px}
  #printArea .p-head h1{font-size:15pt;font-weight:800;letter-spacing:-.5px}
  #printArea .p-head p{font-size:8.5pt;color:#555;margin-top:3px}
  #printArea .p-item{border:1px solid #CCC;border-radius:8px;padding:11px 13px;margin-bottom:9px;page-break-inside:avoid}

!important;display:inline-block!important}\r\n  .codewrap{border-color:#ccc}\r\n}\r\n</style>\r\n</head>\r\n<body>\r\n<div class=\"topbar\">\r\n  <button class=\"menubtn\" id=\"menubtn\" aria-label=\"목차 열기\">☰ 목차</button>\r\n  <span class=\"tt\">강의노트 · 보강판</span>\r\n</div>\r\n<div class=\"scrim\" id=\"scrim\"></div>\r\n<div class=\"shell\">\r\n  <aside class=\"side\" id=\"side\">\r\n    <div class=\"brand\">강의노트 · 01회차</div>\r\n    <p class=\"brand-t\">1회차 — AI 에이전트 시대: 전문가의 태도와 트렌드 지도</p>\r\n    <p class=\"brand-s\">현장 강의 · 기술 보강판</p>\r\n    <nav id=\"nav\">\r\n<a class=\"nav-h1\" href=\"#ai\">오리엔테이션 — 이 시대의 AI 전문가는 누구인가</a>\r\n<a class=\"nav-h2\" href=\"#_1\">교과서가 없는 &quot;초학문의 시대&quot;</a>\r\n<a class=\"nav-h2\" href=\"#knowledge-attitude-\">knowledge보다 attitude — 더닝-크루거와 겸손</a>\r\n<a class=\"nav-h2\" href=\"#_2\">전문가의 좁은 스펙트럼, 그리고 &quot;틈 메우기&quot;</a>\r\n<a class=\"nav-h1\" href=\"#_3\">미시적 혁신 — 책상 위 문제부터 푼다</a>\r\n<a class=\"nav-h2\" href=\"#1\">워밍업 문제 ① — 교안 사이트에 접속하라</a>\r\n<a class=\"nav-h2\" href=\"#2\">워밍업 문제 ② — 압축파일에서 회의 일시 찾기</a>\r\n<a class=\"nav-h2\" href=\"#_4\">레고 블록 오케스트레이션</a>\r\n<a class=\"nav-h1\" href=\"#dx-ax\">DX와 AX — 내 언어로 다시 정의하기</a>\r\n<a class=\"nav-h1\" href=\"#8\">8주 학습 지도 — 무엇을 언제 배우나</a>\r\n<a class=\"nav-h1\" href=\"#ai-1\">AI 트렌드 지도 ① — 어디서 보고, 어떻게 따라잡나</a>\r\n<a class=\"nav-h2\" href=\"#_5\">모델 비교·순위 사이트</a>\r\n<a class=\"nav-h2\" href=\"#_6\">회사 공식 문서를 정독하라</a>\r\n<a class=\"nav-h2\" href=\"#_7\">지금 잘나가는 모델(빠르게 바뀜)</a>\r\n<a class=\"nav-h1\" href=\"#ai-2-llm\">AI 트렌드 지도 ② — LLM은 도대체 어떻게 작동하나</a>\r\n<a class=\"nav-h2\" href=\"#860\">비유: 뉴런 860억 개</a>\r\n<a class=\"nav-h2\" href=\"#_8\">파라미터 = 곱셈에 쓰는 &quot;가중치&quot;의 개수</a>\r\n<a class=\"nav-h2\" href=\"#querykeyvalue\">트랜스포머와 Query·Key·Value</a>\r\n<a class=\"nav-h2\" href=\"#_9\">파라미터 수와 토큰 수</a>\r\n<a class=\"nav-h1\" href=\"#aislm\">작은 모델의 시대 — 소버린 AI·온디바이스·SLM</a>\r\n<a class=\"nav-h2\" href=\"#ai_1\">소버린 AI의 핵심은 &quot;모델의 다양성&quot;</a>\r\n<a class=\"nav-h2\" href=\"#ai-slm\">온디바이스·엣지 AI와 SLM</a>\r\n<a class=\"nav-h2\" href=\"#hugging-face-ollama\">직접 해보기 — Hugging Face + Ollama</a>\r\n<a class=\"nav-h1\" href=\"#_10\">멀티모달과 워크플로우 — 결과만 보여준 것 채우기</a>\r\n<a class=\"nav-h1\" href=\"#_11\">프롬프트에서 컨텍스트·하네스로 — 용어 정리</a>\r\n<a class=\"nav-h2\" href=\"#ai_2\">메타 프롬프트 — &quot;AI에게 질문을 시켜라&quot;</a>\r\n<a class=\"nav-h2\" href=\"#_12\">컨텍스트 윈도우 / 컨텍스트 엔지니어링</a>\r\n<a class=\"nav-h2\" href=\"#_13\">스킬·하네스·규칙 파일</a>\r\n<a class=\"nav-h1\" href=\"#ai_3\">AI가 내 컴퓨터로 들어온다 — 통합 전략과 에이전트</a>\r\n<a class=\"nav-h2\" href=\"#_14\">회사별 통합(생태계) 전략</a>\r\n<a class=\"nav-h1\" href=\"#_15\">부록 — 용어 사전·환경설정·출처</a>\r\n<a class=\"nav-h2\" href=\"#_16\">용어 빠른 사전</a>\r\n<a class=\"nav-h2\" href=\"#_17\">환경설정 체크리스트(과제 예고)</a>\r\n<a class=\"nav-h2\" href=\"#_18\">검색으로 보강·정정한 출처</a>\r\n    </nav>\r\n  </aside>\r\n  <main class=\"main\" id=\"main\">\r\n<nav class=\"print-toc\">\r\n<div class=\"ptoc-title\">목차</div>\r\n<a class=\"nav-h1\" href=\"#ai\">오리엔테이션 — 이 시대의 AI 전문가는 누구인가</a>\r\n<a class=\"nav-h2\" href=\"#_1\">교과서가 없는 &quot;초학문의 시대&quot;</a>\r\n<a class=\"nav-h2\" href=\"#knowledge-attitude-\">knowledge보다 attitude — 더닝-크루거와 겸손</a>\r\n<a class=\"nav-h2\" href=\"#_2\">전문가의 좁은 스펙트럼, 그리고 &quot;틈 메우기&quot;</a>\r\n<a class=\"nav-h1\" href=\"#_3\">미시적 혁신 — 책상 위 문제부터 푼다</a>\r\n<a class=\"nav-h2\" href=\"#1\">워밍업 문제 ① — 교안 사이트에 접속하라</a>\r\n<a class=\"nav-h2\" href=\"#2\">워밍업 문제 ② — 압축파일에서 회의 일시 찾기</a>\r\n<a class=\"nav-h2\" href=\"#_4\">레고 블록 오케스트레이션</a>\r\n<a class=\"nav-h1\" href=\"#dx-ax\">DX와 AX — 내 언어로 다시 정의하기</a>\r\n<a class=\"nav-h1\" href=\"#8\">8주 학습 지도 — 무엇을 언제 배우나</a>\r\n<a class=\"nav-h1\" href=\"#ai-1\">AI 트렌드 지도 ① — 어디서 보고, 어떻게 따라잡나</a>\r\n<a class=\"nav-h2\" href=\"#_5\">모델 비교·순위 사이트</a>\r\n<a class=\"nav-h2\" href=\"#_6\">회사 공식 문서를 정독하라</a>\r\n<a class=\"nav-h2\" href=\"#_7\">지금 잘나가는 모델(빠르게 바뀜)</a>\r\n<a class=\"nav-h1\" href=\"#ai-2-llm\">AI 트렌드 지도 ② — LLM은 도대체 어떻게 작동하나</a>\r\n<a class=\"nav-h2\" href=\"#860\">비유: 뉴런 860억 개</a>\r\n<a class=\"nav-h2\" href=\"#_8\">파라미터 = 곱셈에 쓰는 &quot;가중치&quot;의 개수</a>\r\n<a class=\"nav-h2\" href=\"#querykeyvalue\">트랜스포머와 Query·Key·Value</a>\r\n<a class=\"nav-h2\" href=\"#_9\">파라미터 수와 토큰 수</a>\r\n<a class=\"nav-h1\" href=\"#aislm\">작은 모델의 시대 — 소버린 AI·온디바이스·SLM</a>\r\n<a class=\"nav-h2\" href=\"#ai_1\">소버린 AI의 핵심은 &quot;모델의 다양성&quot;</a>\r\n<a class=\"nav-h2\" href=\"#ai-slm\">온디바이스·엣지 AI와 SLM</a>\r\n<a class=\"nav-h2\" href=\"#hugging-face-ollama\">직접 해보기 — Hugging Face + Ollama</a>\r\n<a class=\"nav-h1\" href=\"#_10\">멀티모달과 워크플로우 — 결과만 보여준 것 채우기</a>\r\n<a class=\"nav-h1\" href=\"#_11\">프롬프트에서 컨텍스트·하네스로 — 용어 정리</a>\r\n<a class=\"nav-h2\" href=\"#ai_2\">메타 프롬프트 — &quot;AI에게 질문을 시켜라&quot;</a>\r\n<a class=\"nav-h2\" href=\"#_12\">컨텍스트 윈도우 / 컨텍스트 엔지니어링</a>\r\n<a class=\"nav-h2\" href=\"#_13\">스킬·하네스·규칙 파일</a>\r\n<a class=\"nav-h1\" href=\"#ai_3\">AI가 내 컴퓨터로 들어온다 — 통합 전략과 에이전트</a>\r\n<a class=\"nav-h2\" href=\"#_14\">회사별 통합(생태계) 전략</a>\r\n<a class=\"nav-h1\" href=\"#_15\">부록 — 용어 사전·환경설정·출처</a>\r\n<a class=\"nav-h2\" href=\"#_16\">용어 빠른 사전</a>\r\n<a class=\"nav-h2\" href=\"#_17\">환경설정 체크리스트(과제 예고)</a>\r\n<a class=\"nav-h2\" href=\"#_18\">검색으로 보강·정정한 출처</a>\r\n</nav>\r\n    <div class=\"hero\">\r\n      <div class=\"eyebrow\">Lecture Note · 기술 보강판</div>\r\n      <h1>1회차 — AI 에이전트 시대: 전문가의 태도와 트렌드 지도</h1>\r\n      <p>현장 강의를 기술적으로 보강한 학습 레퍼런스 — 강사의 의도는 살리고, 빠지거나 틀린 기술은 정확히 채웠습니다.</p>\r\n    </div>\r\n\r\n<p>이 강의 하나로 무엇을 할 수 있게 하려는가 →\r\n<strong>\"거대한 AX(수십억짜리 사업)가 아니라 내 책상 위 작은 문제부터 AI로 푸는 마인드셋을 잡고, 그걸 위해 머릿속에 'AI 트렌드 전체 지도'를 심는 것.\"</strong></p>\r\n<blockquote class=\"callout callout-key\"><span class=\"callout-badge\">핵심</span>\r\n<p>★ 1회차는 실습 회차가 아니라 <strong>오리엔테이션 + AI 트렌드 오버뷰 + 환경설정 예고</strong>다. 그래서 이 노트도 위계를 억지로 세우지 않고, 강의에 실제로 있던 <em>나란한 주제들</em>을 그대로 두되 하나의 태도로 꿰었다. 관통하는 태도는 딱 한 줄: <strong>\"지식·기술(how)보다 태도(attitude)가 먼저다. 다양한 도구를 겸손하게 모아서 오케스트레이션하라.\"</strong></p>\r\n<p><strong>보강 안내</strong> — 강사가 이름을 안 밝히고 넘어간 사이트·도구, 그리고 낡았거나 부정확한 수치는 웹 검색으로 확인해 본문에 녹이고 <code>(검색 보강)</code>으로 표시했다. 출처는 맨 끝 부록에 모았다.</p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"오리엔테이션 — 이 시대의 AI 전문가는 누구인가\" id=\"ai\">오리엔테이션 — 이 시대의 AI 전문가는 누구인가</h1>\r\n<h2 id=\"_1\">교과서가 없는 \"초학문의 시대\"</h2>\r\n<p>강사(신성진, 한국데이터사이언티스트협회)가 처음 던진 화두는 <em>\"과연 이 시대의 AI 전문가는 누구인가\"</em>다. 핵심은 이거야.</p>\r\n<ul>\r\n<li><strong>교과서가 없다.</strong> ChatGPT 책을 사면 그 안에는 이미 한물간 모델이 기다리고 있다. GPT-4o로 배웠는데 현장은 5.5다. 기술이 책보다 빨리 바뀐다.</li>\r\n<li>그래서 <strong>FOMO</strong>(Fear Of Missing Out, 뒤처질까 봐 느끼는 불안)에 시달리거나, 반대로 \"여기까지만 알면 돼\" 하고 멈춰 선다. 둘 다 위험하다.</li>\r\n<li>공공(공직자)이 민간보다 AI 활용 역량이 <strong>오히려 높다</strong>는 게 강사의 현장 관찰이다. 외부망·OpenRouter·엔터프라이즈 API를 도입해 직원이 쓰게 하는 지자체가 많다.</li>\r\n</ul>\r\n<blockquote class=\"callout callout-key\"><span class=\"callout-badge\">핵심</span>\r\n<p>★ <strong>AI 전문가의 정의를 스스로 잡아라.</strong> 강사 본인도 \"나는 AI 전문가인가? 사실 아니다\"라고 말한다. 정답이 없으니 각자 정의를 내리고, 그 정의를 동료에게 전파할 수 있어야 한다는 게 이 과정의 출발점이다.</p>\r\n</blockquote>\r\n<h2 id=\"knowledge-attitude-\">knowledge보다 attitude — 더닝-크루거와 겸손</h2>\r\n<p>강사가 가장 길게 강조한 부분. 초보자가 꼭 기억할 그림이 하나 있다.</p>\r\n<p><strong>더닝-크루거 효과(Dunning–Kruger effect)</strong> — 조금 배운 사람일수록 자신을 과대평가한다는 심리 현상.</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">code</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre class=\"mermaid\">flowchart LR\r\n  A[\"조금 배움\"] --&gt; B[\"우매함의 봉우리&lt;br/&gt;다 안다는 착각\"]\r\n  B --&gt; C[\"절망의 계곡&lt;br/&gt;모를수록 불안\"]\r\n  C --&gt; D[\"지속 가능한 전문가&lt;br/&gt;겸손 = 계속 배움\"]\r\n</pre></div>\r\n<blockquote class=\"callout callout-key\"><span class=\"callout-badge\">핵심</span>\r\n<p>★ 강사의 한 줄: <strong>\"절망의 계곡을 '겸손'으로 바꿔 읽어라.\"</strong> 진짜 전문가는 만족이 없고 늘 불안하다. 나보다 더 아는 사람, 내가 알던 게 부정당할 순간을 늘 대비하기 때문이다. 그래서 <code>knowledge</code>보다 <code>attitude</code>(세상·현상·문제를 다르게 보는 자세)가 먼저다.</p>\r\n</blockquote>\r\n<h2 id=\"_2\">전문가의 좁은 스펙트럼, 그리고 \"틈 메우기\"</h2>\r\n<p>한 사람이 소화하는 AI 영역은 좁다. 안드레이 카파시(Andrej Karpathy, \"바이브 코딩\"이라는 말을 만든 사람) 같은 대가도 전부는 못 다룬다. 그래서 좁은 전문가들이 모이면 반드시 <strong>틈</strong>이 생긴다. 틈을 메우는 방법은 두 가지다.</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">code</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre class=\"mermaid\">flowchart LR\r\n  G[\"내 지식의 틈\"] --&gt; M1[\"① 내 원의 지름을 키운다&lt;br/&gt;= 스스로 더 배움\"]\r\n  G --&gt; M2[\"② 동료가 옆에서 메워준다&lt;br/&gt;= 다양성의 협업\"]\r\n</pre></div>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p><strong>보강 — 용어 한 줄 정리.</strong> 강의에 등장한 카파시의 명언 <em>\"망치를 들고 있으면 모든 게 못으로 보인다\"</em> 는 도구 편식 경고다(2장에서 워밍업 문제로 다시 나온다). 그리고 <em>바이브 코딩(Vibe Coding)</em> 은 \"코드 문법을 몰라도 자연어로 AI에게 시켜서 프로그램을 만드는 방식\"을 뜻한다. 이 과정의 핵심 도구가 된다.</p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"미시적 혁신 — 책상 위 문제부터 푼다\" id=\"_3\">미시적 혁신 — 책상 위 문제부터 푼다</h1>\r\n<p>강의 전체를 관통하는 실천 메시지. <strong>거대한 AX(AI Transformation, 수십·수백억짜리 전환사업)에 짓눌리지 말고, 2~5분짜리 작은 문제부터 AI로 풀라</strong>는 것.</p>\r\n<blockquote class=\"callout callout-warn\"><span class=\"callout-badge\">주의</span>\r\n<p>⚠ <strong>주의 — \"진격의 거인 콤플렉스\"를 경계하라.</strong> 강사 표현으로, \"몇십억 들여야 AI가 도입된다\"는 생각에 빠지면 정작 책상 위 작은 문제를 풀 에너지를 잃는다. AX로만 풀리는 문제는 없다. <strong>기존 레거시(legacy, 이미 쓰던 낡은) 워크플로우 + LLM</strong>을 어떻게 결합하느냐가 진짜 실력이다.</p>\r\n</blockquote>\r\n<h2 id=\"1\">워밍업 문제 ① — 교안 사이트에 접속하라</h2>\r\n<p>강사는 단톡방에 링크를 안 뿌리고, \"수단·방법 가리지 말고 알아서 접속하라\"는 문제를 냈다. 그 사이트(\"AI 챔피언 고급 과정 교안 편집기 = 워크벤치\")의 정체를 보강하면:</p>\r\n<div class=\"tablescroll\"><table>\r\n<thead>\r\n<tr>\r\n<th>구성 요소</th>\r\n<th>정체</th>\r\n<th>한 줄 설명</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td><strong>HTML</strong></td>\r\n<td>브라우저에서 도는 화면 언어</td>\r\n<td>페이지의 뼈대. C드라이브의 .html 파일은 브라우저만 있으면 바로 열린다</td>\r\n</tr>\r\n<tr>\r\n<td><strong>Claude Sonnet</strong></td>\r\n<td>Anthropic의 LLM</td>\r\n<td>교안 내용을 생성·수정하는 두뇌</td>\r\n</tr>\r\n<tr>\r\n<td><strong>GitHub Pages</strong></td>\r\n<td>무료 정적 사이트 호스팅</td>\r\n<td>깃허브에 올린 HTML을 인터넷 주소로 띄워줌 (검색 보강)</td>\r\n</tr>\r\n<tr>\r\n<td><strong>Supabase</strong></td>\r\n<td>백엔드 데이터베이스(BaaS)</td>\r\n<td>'DB' 버튼을 누르면 교안이 여기 저장됐다 다시 불려옴 (검색 보강)</td>\r\n</tr>\r\n</tbody>\r\n</table></div>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p><strong>보강</strong> — 비밀번호는 <code>2026</code>. 강사가 보여주려던 건 <em>\"사이트를 만든다\"</em> 가 아니라 <em>\"HTML 한 장 + LLM + 무료 호스팅 + 가벼운 DB만으로도 우리만의 협업 공간을 만들 수 있다\"</em> 는 감각이다. 이게 뒤에 나오는 \"HTML 하나로 파생되는 서비스\" 이야기와 이어진다.</p>\r\n</blockquote>\r\n<h2 id=\"2\">워밍업 문제 ② — 압축파일에서 회의 일시 찾기</h2>\r\n<p>노션에 올린 압축 파일(50개 문서) 안에서 \"인천광역시 규제혁신담당관이 회의한 일시\"를 찾는 문제. 누군가는 반디집으로 그냥 풀었고, 누군가는 Codex/ChatGPT에 통째로 맡겼다. <strong>정답은 하나가 아니다.</strong></p>\r\n<blockquote class=\"callout callout-warn\"><span class=\"callout-badge\">주의</span>\r\n<p>★ 이 문제의 진짜 메시지: <strong>도구에 매몰되지 마라.</strong> 반디집으로 30초면 풀 일을 굳이 Codex 띄워서 풀면 그게 \"망치 들면 다 못으로 보이는\" 함정이다. 동시에, 50개 중 어디 있는지 모를 때 <strong>AI로 빠르게 찾는 것</strong>도 미시적 혁신이다. 상황에 맞는 도구를 고르는 판단이 핵심.</p>\r\n</blockquote>\r\n<h2 id=\"_4\">레고 블록 오케스트레이션</h2>\r\n<p>도구(API, RSS, MCP, 플러그인, 스킬, 프롬프트, 첨부파일, Antigravity, Codex, Claude Code…)를 <strong>레고 블록</strong>처럼 모아서 조합하라는 비유. 블록 8개로 수억 개 형상을 만들 수 있듯, 회차마다 배우는 도구를 <em>난이도순 정복</em>이 아니라 <em>조합 가능한 부품</em>으로 쌓으라는 것.</p>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p><strong>보강 — 낯선 도구 이름 빠른 사전</strong> (지금 다 이해할 필요 없음, \"이런 게 있구나\"면 충분)\r\n- <strong>API</strong>: 프로그램끼리 정보를 주고받는 약속. AI 모델도 API 키 하나로 불러 쓴다.\r\n- <strong>RSS</strong>: 사이트의 새 글을 자동으로 받아오는 표준 형식(뉴스/공고 수집에 유용).\r\n- <strong>MCP</strong> (Model Context Protocol): AI에게 외부 도구·데이터를 연결해주는 표준 규격.\r\n- <strong>Antigravity / Codex / Claude Code / opencode / Goose</strong>: 내 컴퓨터에서 일하는 코딩 에이전트들(10장에서 설명).</p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"DX와 AX — 내 언어로 다시 정의하기\" id=\"dx-ax\">DX와 AX — 내 언어로 다시 정의하기</h1>\r\n<p>강사가 \"여러분은 거점 리더니까 동료에게 개념을 전파할 수 있어야 한다\"며 직접 정의한 부분. 외울 게 아니라 <strong>응급실 통증</strong> 비유로 이해하면 된다.</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">code</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre class=\"mermaid\">flowchart LR\r\n  A[\"현상&lt;br/&gt;아파 죽겠다(암묵지)\"] --&gt; B[\"DX 디지털화&lt;br/&gt;10점 중 7점으로 정량화\"]\r\n  B --&gt; C[\"AX 전환&lt;br/&gt;더 세밀한 패턴 분석\"]\r\n  C --&gt; D[\"생성형 AI&lt;br/&gt;바늘로 찌르는 듯한 통증이&lt;br/&gt;5분 지속(비정형 표현까지)\"]\r\n</pre></div>\r\n<ul>\r\n<li><strong>DX (Digital Transformation)</strong>: 인간이 감각으로 아는 현상·암묵지를 <strong>컴퓨터가 알아먹게 정량화</strong>하는 모든 노력. 응급실의 \"통증 1~10점\"이 딱 그거다. 센서 발달 → 데이터 저장 → 패턴 인식(머신러닝·통계)으로 이어졌다.</li>\r\n<li><strong>AX (AI Transformation)</strong>: 그 정량 데이터를 <strong>더 디테일하게</strong> 분석하려는 흐름. 생성형 AI가 들어오면서 \"7점\" 같은 척도를 넘어 <em>\"바늘로 찌르는 듯한 통증\"</em> 같은 비정형 표현까지 다룰 수 있게 됐다.</li>\r\n</ul>\r\n<blockquote class=\"callout callout-key\"><span class=\"callout-badge\">핵심</span>\r\n<p>★ DX와 AX는 단절된 게 아니라 <strong>한 라인</strong>이다. X는 미국식 약자로 Transformation. 강사 메시지: 당연하게 쓰던 용어도 <em>내 업무·내 현상에 맞춰 스스로 정의</em>해보는 응용력을 키워라.</p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"8주 학습 지도 — 무엇을 언제 배우나\" id=\"8\">8주 학습 지도 — 무엇을 언제 배우나</h1>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">code</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre class=\"mermaid\">flowchart TD\r\n  W1[\"1회차&lt;br/&gt;오리엔테이션·AI 트렌드·환경설정\"] --&gt; W2[\"2회차&lt;br/&gt;유명 AI 서비스 50개+ 둘러보기\"]\r\n  W2 --&gt; W3[\"3회차&lt;br/&gt;LLM 어시스트 워크플로우&lt;br/&gt;엑셀VBA·파이썬·RSS→HTML\"]\r\n  W3 --&gt; W45[\"4~5회차&lt;br/&gt;업무 자동화·로컬 SLM(Ollama)&lt;br/&gt;코딩 에이전트 설치·활용\"]\r\n  W45 --&gt; W6[\"MCP·로컬 RAG·백엔드 웹서비스 구현\"]\r\n  W6 --&gt; W7[\"클라우드 바이브코딩&lt;br/&gt;Lovable·Bolt·v0\"]\r\n  W7 --&gt; W8[\"개인 프로젝트 · 팀 프로젝트(4주)\"]\r\n</pre></div>\r\n<p>핵심 설계 의도 두 가지:</p>\r\n<ol>\r\n<li><strong>처음엔 코딩 에이전트를 쓰지 않는다.</strong> 3회차까지는 외부 LLM의 <em>어시스트</em>만 받아서(폐쇄망 상황 가정) 내 로컬에서 분석·자동화·바이브코딩을 한다. 이걸 강사는 <strong>\"어시스트형 바이브 코딩\"</strong> 이라 부른다.</li>\r\n<li><strong>4회차부터 코딩 에이전트로 전환.</strong> Claude Code·Cursor·Windsurf·opencode·Goose·Antigravity 등을 PC가 허락하는 만큼 설치하고, API·MCP·백엔드를 붙여 서비스까지 만든다.</li>\r\n</ol>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">code</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre class=\"mermaid\">flowchart LR\r\n  subgraph 초반[\"1~3회차\"]\r\n    A1[\"외부 LLM에게 코드 받아&lt;br/&gt;내 컴퓨터에서 실행\"]\r\n  end\r\n  subgraph 후반[\"4회차~\"]\r\n    A2[\"코딩 에이전트가&lt;br/&gt;내 파일 직접 읽고 처리\"]\r\n  end\r\n  초반 --&gt; 후반\r\n</pre></div>\r\n<blockquote class=\"callout callout-warn\"><span class=\"callout-badge\">주의</span>\r\n<p><strong>보강 — 왜 굳이 어려운 순서로 가나?</strong> 폐쇄망/보안망에서는 코딩 에이전트가 막힐 수 있다. <em>\"외부에서 LLM 도움으로 코드를 만들어 → 내부로 이식해 실행\"</em> 하는 워크플로우를 익혀두면, 망 환경에 상관없이 일할 수 있다. \"폐쇄망이니 외부 건 안 배워도 돼\"는 강사가 가장 말린 태도.</p>\r\n<p>⚠ <strong>주의 — 마인드셋을 내려놓아라.</strong> 100억짜리 조달 용역을 기획해도 되지만, 먼저 <strong>혼자 또는 동료 3~4명</strong>으로 풀 수 있는 작은 것부터 꿈꿔라. 예: 압축파일 50개 일괄 해제·요약, 파일명 200개 1초 변경, HWP 표 200개를 1개로 30초 통합, 동료가 쓸 좋은 프롬프트 1개. 프로그래밍을 안 해도 된다.</p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"AI 트렌드 지도 ① — 어디서 보고, 어떻게 따라잡나\" id=\"ai-1\">AI 트렌드 지도 ① — 어디서 보고, 어떻게 따라잡나</h1>\r\n<p>교과서가 없으니 <strong>직접 출처를 보러 다니는 습관</strong>이 곧 실력이다. 강사가 강조한 사이트들.</p>\r\n<h2 id=\"_5\">모델 비교·순위 사이트</h2>\r\n<div class=\"tablescroll\"><table>\r\n<thead>\r\n<tr>\r\n<th>사이트</th>\r\n<th>무엇을 보여주나</th>\r\n<th>특징</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td><strong>Artificial Analysis</strong> (artificialanalysis.ai)</td>\r\n<td>모델별 지능·속도·가격 비교</td>\r\n<td><strong>자체 독립 벤치마크</strong>를 돌려 비교 (검색 보강)</td>\r\n</tr>\r\n<tr>\r\n<td><strong>LMArena</strong> (lmarena.ai, 옛 Chatbot Arena)</td>\r\n<td>사람이 두 모델 답을 블라인드로 비교·투표</td>\r\n<td><strong>Elo 점수</strong> 기반 경험적 순위. 실사용 만족도에 가까움 (검색 보강)</td>\r\n</tr>\r\n<tr>\r\n<td><strong>LifeArchitect Models Table</strong> (lifearchitect.ai/models-table)</td>\r\n<td>800개+ 모델의 파라미터·토큰 등 데이터 표</td>\r\n<td><strong>Alan D. Thompson 박사</strong>가 손으로 매일 갱신. <em>기울임 글씨 = 추정치</em>, 보통 글씨 = 공개된 사실 (검색 보강)</td>\r\n</tr>\r\n</tbody>\r\n</table></div>\r\n<blockquote class=\"callout callout-warn\"><span class=\"callout-badge\">주의</span>\r\n<p>⚠ <strong>주의 · [정정]</strong> — 강사는 Artificial Analysis를 \"논문 지표를 모아놓은 곳\"이라 표현했는데, 정확히는 <strong>자기들이 직접 측정한 독립 벤치마크</strong>를 싣는 사이트다. \"회사들이 자기 자랑한 논문 모음\"과는 다르다. (검색 보강)</p>\r\n<p><strong>보강 — Models Table 읽는 법.</strong> 표에서 <strong>두 번째 칸이 회사명, 첫 번째 칸이 모델명</strong>이다. 세 번째 줄의 <strong>파라미터</strong>가 핵심(다음 장에서 설명). 구글 시트로 제공돼 'Open in new tab'으로 내 사본을 떠서 쓸 수 있다.</p>\r\n</blockquote>\r\n<h2 id=\"_6\">회사 공식 문서를 정독하라</h2>\r\n<p>ChatGPT만 쓰지 말고 <strong>만든 회사의 개발자 사이트</strong>에 들어가라는 것. 모델 종류·리서치·API 사용법이 다 거기 있다.</p>\r\n<div class=\"tablescroll\"><table>\r\n<thead>\r\n<tr>\r\n<th>회사</th>\r\n<th>개발자/문서 사이트</th>\r\n<th>메모</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>OpenAI</td>\r\n<td>platform.openai.com / developer.openai.com</td>\r\n<td>Agent Builder, 어시스턴트, 특화 모델(GPT Image 등)</td>\r\n</tr>\r\n<tr>\r\n<td>Google</td>\r\n<td>ai.google.dev (Google AI for Developers)</td>\r\n<td>Gemma·Gemini API, 임베딩 (검색 보강)</td>\r\n</tr>\r\n<tr>\r\n<td>Anthropic</td>\r\n<td><strong>platform.claude.com</strong> / docs</td>\r\n<td>Claude API. 최근 \"Managed Agents\" 등 신기능 (검색 보강: URL 정확)</td>\r\n</tr>\r\n</tbody>\r\n</table></div>\r\n<blockquote class=\"callout callout-warn\"><span class=\"callout-badge\">주의</span>\r\n<p>★ <strong>API 키 하나면</strong> 그 회사의 이미지·임베딩·웹검색 모델을 내가 만든 사이트에 심을 수 있다. \"임베딩을 꼭 로컬에서 어렵게 할 필요 없이 GPT/Claude/Gemini가 제공하는 임베딩 서비스를 써보는\" 식의 감각을 키우라는 게 강사 의도. (단, 내 데이터를 학습에 안 쓴다는 보장 하에.)</p>\r\n</blockquote>\r\n<h2 id=\"_7\">지금 잘나가는 모델(빠르게 바뀜)</h2>\r\n<p>강사가 짚은 분야별 강자 — <strong>순위는 계속 바뀌니 위 사이트로 직접 확인</strong>할 것.</p>\r\n<ul>\r\n<li><strong>텍스트 대화 / 웹서치 / 코딩</strong>: Claude가 상위권(LMArena 기준 1~3위). (검색 보강: 모델 세대마다 변동)</li>\r\n<li><strong>이미지 생성</strong>: GPT Image 2가 나노바나나 2(구글 제미나이 계열 이미지 모델)를 제쳤다는 평. 일관성 유지·세밀 수정이 강점.</li>\r\n<li><strong>비디오 생성</strong>: ByteDance의 <strong>Seedance</strong>가 열풍. 짧은 프롬프트(제로샷)로도 영상을 만든다.</li>\r\n</ul>\r\n<blockquote class=\"callout callout-warn\"><span class=\"callout-badge\">주의</span>\r\n<p>⚠ <strong>주의</strong> — 이미지·영상 모델 이름(Nano Banana, Seedance, Seedream, Kling, Veo, Sora 2, Higgsfield 등)은 분기마다 바뀐다. 이름 외우기보다 <em>\"멀티모달 모델을 한곳에 모아 써볼 수 있는 사이트가 있다\"</em> 는 사실만 기억하면 된다(8장 참고).</p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"AI 트렌드 지도 ② — LLM은 도대체 어떻게 작동하나\" id=\"ai-2-llm\">AI 트렌드 지도 ② — LLM은 도대체 어떻게 작동하나</h1>\r\n<p>여기는 강사가 \"파라미터가 뭐냐\"를 설명하려고 엑셀·사이트를 띄운 부분. <strong>수학 없이</strong> 개념만 잡으면 된다. 초보자에게 가장 중요한 장이라 차근히 보강한다.</p>\r\n<h2 id=\"860\">비유: 뉴런 860억 개</h2>\r\n<ul>\r\n<li>인간 뇌엔 뉴런이 약 <strong>860억 개</strong>, 전체가 약 <strong>20와트</strong>로 돈다. (강사 수치 정확 — 확인됨)</li>\r\n<li>뉴런 하나하나는 화학물질(나트륨·칼륨)이 오가며 작은 전기를 만들 뿐인데, 860억 개가 모이니 감정·철학·코딩하는 인간이 됐다.</li>\r\n<li>인공신경망도 같은 발상: <strong>아주 단순한 곱셈·덧셈 단위</strong>를 수천억 개 연결했더니 복잡한 패턴을 이해하더라.</li>\r\n</ul>\r\n<h2 id=\"_8\">파라미터 = 곱셈에 쓰는 \"가중치\"의 개수</h2>\r\n<p>강사가 CNN(Convolutional Neural Network, 이미지 인식 신경망)으로 손글씨 숫자(0/1)를 맞히는 엑셀 예제를 보여준 게 이거다.</p>\r\n<ul>\r\n<li>이미지를 픽셀 숫자로 바꾸고 → 거기에 <strong>가중치(weight)</strong> 를 곱하고 더한다(엑셀의 <code>SUMPRODUCT</code>, 즉 내적). → 결과를 0~1 사이로 눌러서 \"1에 가깝나, 0에 가깝나\" 판단.</li>\r\n<li>답이 틀리면 거꾸로 돌아가 가중치를 0.01씩 조금씩 고친다(이게 <em>학습</em>). 이 <strong>가중치 숫자들의 개수 = 파라미터 수</strong>.</li>\r\n</ul>\r\n<blockquote class=\"callout callout-warn\"><span class=\"callout-badge\">주의</span>\r\n<p>★ <strong>파라미터를 1차 방정식으로 이해하기.</strong> <code>Y = WX + b</code>에서 <code>W</code>(기울기·계수)와 <code>b</code>(절편·상수)가 파라미터다. 이런 1차식 수천억 개를 엮은 게 모델. 그래서 <strong>파라미터가 많을수록 복잡한 패턴을 더 잘 이해</strong>한다(= 모델이 \"크다\").</p>\r\n<p>⚠ <strong>주의 · [정정]</strong> — 강사가 \"3000 빌리언이면 나누기 2 해서 최소 1500 빌리언짜리 1차 방정식\"이라 했는데, 이건 어디까지나 <em>직관 비유</em>다. 실제로 편향(<code>b</code>)은 가중치(<code>W</code>)보다 훨씬 적어서 정확히 절반은 아니다. 개념 잡는 용도로만 받아들이자.</p>\r\n</blockquote>\r\n<h2 id=\"querykeyvalue\">트랜스포머와 Query·Key·Value</h2>\r\n<p>강사가 띄운 \"유튜브 사이트\"의 정체 → <strong>bbycroft.net/llm</strong> (Brendan Bycroft 제작). GPT 스타일 트랜스포머를 3D로 그려 <em>덧셈·곱셈 하나하나</em>까지 보여준다. 화면에 나온 <em>\"Data visualization empowers users to…\"</em> 문장이 그 데모(GPT-2)다. (검색 보강)</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">code</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre class=\"mermaid\">flowchart LR\r\n  T[\"입력 문장\"] --&gt; TK[\"토큰으로 쪼갬\"]\r\n  TK --&gt; EM[\"임베딩&lt;br/&gt;단어를 좌표(벡터)로\"]\r\n  EM --&gt; TR[\"트랜스포머 블록 ×N&lt;br/&gt;어텐션 Q·K·V\"]\r\n  TR --&gt; OUT[\"다음 토큰 확률 예측\"]\r\n  OUT --&gt;|예측 단어를 붙여 반복| TK\r\n</pre></div>\r\n<p>강사가 말한 숫자들(768차원, 2304, 12개, 11번)은 <strong>GPT-2 small(약 1.24억 파라미터)</strong> 의 구조다. 풀어보면:</p>\r\n<ul>\r\n<li>단어를 <strong>768차원</strong> 좌표(벡터)로 임베딩한다. \"비슷한 단어는 좌표가 가깝다\"가 핵심.</li>\r\n<li>그 벡터를 <strong>Query·Key·Value(Q·K·V)</strong> 세 개로 변환한다 → 768 × 3 = <strong>2304</strong>. <em>\"data라는 단어가 어떤 단어와 가장 관련 있나\"</em> 를 계산하는 게 어텐션(attention).</li>\r\n<li>이 어텐션 블록이 여러 층(GPT-2 small은 12층) 쌓여서 반복된다.</li>\r\n</ul>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p><strong>보강 — Key-Value 캐시가 뭐길래.</strong> 대화가 길어질 때 이미 계산한 K·V를 저장해 재사용하는 최적화가 KV 캐시다. \"컨텍스트가 길수록 메모리를 먹는다\"는 말이 여기서 나온다(9장 컨텍스트 윈도우와 연결).\r\n더 그림으로 보고 싶으면 <strong>3Blue1Brown</strong>의 신경망·트랜스포머 영상 시리즈도 강력 추천(수식 없이 시각화). (검색 보강)</p>\r\n</blockquote>\r\n<h2 id=\"_9\">파라미터 수와 토큰 수</h2>\r\n<ul>\r\n<li><strong>파라미터</strong>: 모델의 \"방정식 계수\" 총개수 = 모델 크기.</li>\r\n<li><strong>토큰</strong>: 모델이 학습한 단어 조각의 양. 많이 학습할수록 유창하다. (토큰 = 단어가 음절/어절 단위로 쪼개진 조각)</li>\r\n</ul>\r\n<blockquote class=\"callout callout-warn\"><span class=\"callout-badge\">주의</span>\r\n<p>⚠ <strong>주의 · [정정]</strong> — 강사는 \"GPT-5.5는 파라미터 약 3000 빌리언(3조)\"이라 했는데, <strong>OpenAI는 GPT-4 이후 모델의 파라미터 수를 공식 발표하지 않는다.</strong> \"3T\"는 외부 추정/체감치이지 공식 수치가 아니다. 체감 기준점으로만 쓰고, 사실로 인용하지 말 것. (검색 보강)</p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"작은 모델의 시대 — 소버린 AI·온디바이스·SLM\" id=\"aislm\">작은 모델의 시대 — 소버린 AI·온디바이스·SLM</h1>\r\n<p>큰 모델 이야기 뒤, 강사가 공직자에게 진짜 권한 건 <strong>작은 모델</strong>이다.</p>\r\n<h2 id=\"ai_1\">소버린 AI의 핵심은 \"모델의 다양성\"</h2>\r\n<ul>\r\n<li><strong>소버린 AI(Sovereign AI)</strong>: 자국이 통제하는 AI 역량. GPU 같은 하드웨어 자원도 중요하지만, 강사는 <strong>모델의 다양성</strong>(조선·제조·철강·농업 등 우리 도메인 데이터로 튜닝한 다양한 모델 확보)이 진짜 핵심이라고 본다.</li>\r\n</ul>\r\n<blockquote class=\"callout callout-warn\"><span class=\"callout-badge\">주의</span>\r\n<p><strong>보강 · [정정] — 트럼프 vs Anthropic 사건의 실제 내용.</strong> 강사는 \"트럼프가 베네수엘라 지도자 검거 때 Claude가 거부하자 내쫓았다\"고 기억했는데, 사실관계는 조금 다르다. 실제로는 <strong>미 국방부(DoD)가 Claude를 \"모든 합법적 목적(자율무기·국내 대량감시 포함)\"에 쓰게 해달라고 요구 → Anthropic이 거부 → 트럼프 행정부가 전 정부기관에 Anthropic 사용 중단 지시 + \"공급망 위험(supply chain risk)\" 지정 → Anthropic이 연방정부를 상대로 소송(2026년 3월), 1심에서 예비적 금지명령 일부 승소</strong>의 흐름이다. 강사 메시지(\"특정 모델에 종속되면 위험, 그래서 모델 다양성이 필요\")는 그대로 유효하다. (검색 보강)</p>\r\n</blockquote>\r\n<h2 id=\"ai-slm\">온디바이스·엣지 AI와 SLM</h2>\r\n<ul>\r\n<li><strong>SLM(Small Language Model)</strong>: 작은 언어모델. 1B·4B 같은 크기.</li>\r\n<li><strong>온디바이스/엣지 AI</strong>: 클라우드 없이 내 폰·라즈베리파이·작은 센서에서 도는 AI. 구글 딥마인드·알리바바 같은 빅테크가 주도하는 트렌드.</li>\r\n</ul>\r\n<p>강사가 콕 집은 모델: 구글 <strong>Gemma 3n E4B</strong>.</p>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p><strong>보강</strong> — Gemma 3n E4B는 <strong>원본 8B인데 'effective 4B'</strong> 로 도는 게 특징이다. <strong>MatFormer(Matryoshka Transformer)</strong> 구조로, 큰 모델 안에 작은 모델이 들어있어 메모리·배터리를 아끼면서 추론한다. 10B 미만 최초로 LMArena 1300점을 넘겼다. <em>\"이펙티브 4 빌리언\"</em> 이 바로 이 뜻. (검색 보강)\r\n그 외: IBM <strong>Granite 8B</strong>, LG <strong>EXAONE</strong>, 업스테이지 <strong>Solar</strong> 등도 표에 보인다.</p>\r\n</blockquote>\r\n<h2 id=\"hugging-face-ollama\">직접 해보기 — Hugging Face + Ollama</h2>\r\n<p>강사가 \"Ollama 1B로 엑셀 함수도 설명시킨다\"고 말만 하고 넘어간 부분을 명령어로 채운다.</p>\r\n<ul>\r\n<li><strong>Hugging Face</strong>(huggingface.co): 오픈소스 모델 장터. 검색창에 <code>1B</code>처럼 치면 작은 모델이 수만 개. 파일은 보통 <strong>GGUF</strong>(llama.cpp/Ollama가 읽는 양자화 포맷) 확장자.</li>\r\n<li><strong>로컬 실행기</strong>: Ollama, LM Studio, MSTY, llama.cpp, AnythingLLM 등. 가장 간단한 게 Ollama.</li>\r\n</ul>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">Shell</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre><code class=\"language-bash\"># 1) ollama.com 에서 설치한 뒤, 터미널(PowerShell)에서 바로 실행\r\nollama run gemma3:1b           # 1B 초경량 — 처음이면 자동 다운로드 후 대화 시작\r\nollama run gemma3n:e4b         # 온디바이스용, 추론 가능 (effective 4B)\r\nollama pull qwen3:1.7b         # 받아만 두기(실행은 나중에)\r\nollama list                    # 설치된 모델 목록\r\n</code></pre></div>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">text</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre><code class=\"language-text\"># 실제로 1B에게 시켜볼 프롬프트 예시 (강의에서 보여준 것)\r\n엑셀 VLOOKUP 함수를 설명하고, 예제 데이터로 풀이 방법까지 보여줘.\r\n</code></pre></div>\r\n<blockquote class=\"callout callout-warn\"><span class=\"callout-badge\">주의</span>\r\n<p><strong>보강 — 폐쇄망 활용 포인트.</strong> 모델 태그(<code>gemma3:1b</code> 등)는 바뀔 수 있으니 <code>ollama.com/library</code>에서 확인. Ollama는 <strong>인터넷 없이 로컬에서</strong> 도니까, 외부망이 막힌 환경에서도 \"민원 분류만 잘하는 1~2B 모델\" 같은 <em>스페시픽(specific) 작은 모델</em>로 동료 업무의 숨통을 틔울 수 있다. 단, 설치 전 보안 점검은 필수.</p>\r\n<p>★ 강사의 결론: 큰 모델만 AI가 아니다. <strong>GPU 없는 평범한 PC의 작은 모델 하나로 미시적 문제를 푸는 POC(개념 증명)</strong> 가 지금 시점에 굉장히 중요하다.</p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"멀티모달과 워크플로우 — 결과만 보여준 것 채우기\" id=\"_10\">멀티모달과 워크플로우 — 결과만 보여준 것 채우기</h1>\r\n<p><strong>멀티모달(multimodal)</strong>: 텍스트뿐 아니라 이미지·음성·영상까지 함께 다루는 능력.</p>\r\n<p>강사 시연: 종이 보고서를 <strong>사진 찍어</strong> \"여기에 똑같이 그려줘\"라고 하면 GPT Image 2가 문서를 통째로 전사·복제하고, 동시에 <em>\"이 문서와 똑같은, HTML 편집 가능 + PDF 저장 사이트를 만들어줘\"</em> 로 바이브코딩까지 한다. 이게 <strong>워크플로우</strong> — 프롬프트 한 줄이 아니라 여러 도구를 엮어 문제를 푸는 방식.</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">code</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre class=\"mermaid\">flowchart LR\r\n  P[\"종이 문서&lt;br/&gt;사진 촬영\"] --&gt; M[\"멀티모달 모델&lt;br/&gt;GPT Image 2 등\"]\r\n  M --&gt; A[\"문서 전사·복제\"]\r\n  M --&gt; B[\"HTML로 동일 양식 생성&lt;br/&gt;편집·PDF저장 가능\"]\r\n  B --&gt; C[\"로컬 .html&lt;br/&gt;브라우저로 바로 열어 수정\"]\r\n</pre></div>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p><strong>보강 — 왜 HTML을 자꾸 강조하나.</strong> C드라이브의 <code>.html</code>은 브라우저만 있으면 열린다. 자주 쓰는 양식(주간/월간 보고서)을 HTML로 만들어 두고 <strong>작은 4B 모델 하나만 붙여도</strong> 문서를 자동 생성하는 서비스가 된다. 외부 API가 허용되면 더 다양한 AI 서비스로 확장. 1장의 \"워크벤치\"가 바로 그 예(HTML로만 만든 서비스).</p>\r\n<p><strong>보강 — 멀티모달 모델 모아 쓰는 곳.</strong> Higgsfield 같은 사이트에 들어가면 GPT Image 2·Nano Banana 2·Seedream·Seedance·Kling·Veo·Sora 2 등을 한곳에서 써볼 수 있다. (이름은 자주 바뀐다 — 8주 과정 중 영상·홍보 제작 때 직접 다룸.)</p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"프롬프트에서 컨텍스트·하네스로 — 용어 정리\" id=\"_11\">프롬프트에서 컨텍스트·하네스로 — 용어 정리</h1>\r\n<p>강사가 \"용어 전쟁\"이라 부른 부분. <strong>흐름 하나만</strong> 잡으면 된다: 모델이 똑똑해질수록, <em>프롬프트를 잘 쓰는 기술</em>에서 → <em>맥락(컨텍스트)을 잘 떠먹이는 기술</em>로 무게가 옮겨갔다.</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">code</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre class=\"mermaid\">flowchart LR\r\n  P[\"프롬프트&lt;br/&gt;문법 잘 써야 답이 좋음\"] --&gt; C[\"컨텍스트 엔지니어링&lt;br/&gt;맥락을 충분히 넣음\"]\r\n  C --&gt; S[\"스킬 SKILL.md&lt;br/&gt;작업 지침을 파일로 저장\"]\r\n  S --&gt; H[\"하네스(harness)&lt;br/&gt;지침+도구+권한+코드베이스\"]\r\n</pre></div>\r\n<h2 id=\"ai_2\">메타 프롬프트 — \"AI에게 질문을 시켜라\"</h2>\r\n<p>내가 잘 모르는 주제라 프롬프트 쓰기가 막막할 때, <strong>AI가 먼저 객관식으로 물어보게</strong> 만드는 기법. 강사가 Claude Code의 \"플래닝 질문\" 방식을 차용한 것.</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">text</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre><code class=\"language-text\">[역할] 너는 보고서 기획 도우미야.\r\n[작업] \"행정안전부 AI 미시적 혁신 운영방안 보고서\"를 쓸 건데, 뭘 넣을지 잘 몰라.\r\n[방식] 보고서에 들어갈 요소를 객관식 10지선다(A~J)로 5문항 만들어 나에게 먼저 질문해줘.\r\n       내가 각 문항에서 하나씩 고르면, 그 선택을 종합해 '완성된 보고서 작성 프롬프트'를 만들어줘.\r\n지금부터 질문 시작.\r\n</code></pre></div>\r\n<blockquote class=\"callout callout-key\"><span class=\"callout-badge\">핵심</span>\r\n<p>★ 5문항 × 10지선다면 경우의 수가 <code>10⁵</code>. 내가 원하는 딱 그 주제의 프롬프트로 <strong>분기</strong>시킬 수 있다. 이미지가 막막할 땐 똑같이 <em>\"포토그래퍼 전문 기법 10가지로 객관식 질문해줘\"</em> 로 응용. (광각·삼분할·웜즈아이뷰·블루아워·얕은 심도 같은 걸 몰라도 AI가 골라준다.)</p>\r\n<p><strong>보강 — 병렬로 일 시키기.</strong> ChatGPT에서 한 채팅창만 붙들지 말고, 메시지를 <strong>편집·분기</strong>(서브 에이전트처럼)해 여러 인격을 동시에 굴리는 습관도 권한다. 또 만든 프롬프트는 <em>새 창</em>에 옮겨 실행하라 — 만들던 창은 이미 \"프롬프트 만드는 맥락\"으로 오염돼 엉뚱한 답을 낼 수 있다.</p>\r\n</blockquote>\r\n<h2 id=\"_12\">컨텍스트 윈도우 / 컨텍스트 엔지니어링</h2>\r\n<ul>\r\n<li><strong>컨텍스트 윈도우(context window)</strong>: 한 대화에서 모델이 한 번에 기억하는 토큰의 총량(질문+답변 누적).</li>\r\n<li><strong>컨텍스트 엔지니어링</strong>: 정형화된 프롬프트 문법보다, <em>내가 가진 맥락·자료를 최대한 구체적으로 떠먹이는</em> 행위.</li>\r\n</ul>\r\n<blockquote class=\"callout callout-warn\"><span class=\"callout-badge\">주의</span>\r\n<p>⚠ <strong>주의 · [정정]</strong> — 강사는 \"컨텍스트 윈도우가 12만 8천 토큰까지, 책 한 권\"이라 했는데 이 수치는 <strong>이미 낡았다(GPT-4 Turbo 시절 128K)</strong>. 2026년 기준 <strong>Claude(Opus 4.8/Sonnet 4.6)는 200K가 기본, 100만(1M) 토큰도 일반 제공</strong>, <strong>Gemini는 1M(2M 예정)</strong>. \"책 한 권\"이 아니라 \"책 여러 권\" 수준으로 더 커졌다. (검색 보강)</p>\r\n</blockquote>\r\n<h2 id=\"_13\">스킬·하네스·규칙 파일</h2>\r\n<div class=\"tablescroll\"><table>\r\n<thead>\r\n<tr>\r\n<th>용어</th>\r\n<th>정체</th>\r\n<th>비유</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td><strong>스킬 (SKILL.md)</strong></td>\r\n<td>\"이 작업은 이렇게 해라\"는 <strong>작업 지침 파일</strong></td>\r\n<td>AI에게 미리 쥐여주는 매뉴얼</td>\r\n</tr>\r\n<tr>\r\n<td><strong>하네스 (harness)</strong></td>\r\n<td>지침 + <strong>도구 호출(tool calling)·파일 권한·코드베이스</strong>까지 묶은 실행 환경</td>\r\n<td>매뉴얼 + 연장통 + 작업장</td>\r\n</tr>\r\n<tr>\r\n<td><strong>규칙 파일</strong></td>\r\n<td>CLAUDE.md / AGENTS.md / Cursor·Windsurf Rules</td>\r\n<td>프로젝트마다 AI가 먼저 읽는 규칙서</td>\r\n</tr>\r\n</tbody>\r\n</table></div>\r\n<p>예: \"행안부 문서 가이드 기반으로 HWPX를 만들어주는 스킬\"을 두면, 내가 \"보고서 써줘\" 한 줄만 던져도 AI가 그 <code>SKILL.md</code>를 읽고 <em>\"파이썬 hwpx 라이브러리를 호출하고, 서식은 이렇게\"</em> 까지 알아서 처리한다. 이게 다 <strong>컨텍스트</strong>다.</p>\r\n<blockquote class=\"callout callout-warn\"><span class=\"callout-badge\">주의</span>\r\n<p>⚠ <strong>주의 — 오버 엔지니어링 경계.</strong> \"하네스 안에 또 하네스\"를 만들며 용어에 매몰되는 사람들이 있다. 용어 전쟁에 휘둘리지 말고 <strong>흐름</strong>만 기억하라: 컨텍스트가 좋아져서, 제로샷(맨몸 한 줄)만 던져도 AI가 관련 지침을 읽어가며 실행할 수준이 됐다.</p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"AI가 내 컴퓨터로 들어온다 — 통합 전략과 에이전트\" id=\"ai_3\">AI가 내 컴퓨터로 들어온다 — 통합 전략과 에이전트</h1>\r\n<p>마지막 트렌드. AI는 외부 사이트 → 브라우저 → 내 컴퓨터 순으로 점점 안쪽까지 들어온다.</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">code</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre class=\"mermaid\">flowchart LR\r\n  EX[\"외부 LLM&lt;br/&gt;ChatGPT·Gemini·Claude\"] --&gt; BR[\"브라우저&lt;br/&gt;Edge의 Copilot·Chrome의 Gemini 사이드바\"]\r\n  BR --&gt; DT[\"데스크탑 앱&lt;br/&gt;Claude·Codex·Antigravity\"]\r\n  DT --&gt; AG[\"코딩 에이전트&lt;br/&gt;내 컴퓨터 파일을 직접 읽고 처리\"]\r\n</pre></div>\r\n<h2 id=\"_14\">회사별 통합(생태계) 전략</h2>\r\n<ul>\r\n<li><strong>OpenAI(ChatGPT)</strong>: 자체 플랫폼이 없어 <strong>MCP로 서드파티</strong>(공공데이터포털·법령정보 등)를 붙여 생태계 확장.</li>\r\n<li><strong>Google(Gemini)</strong>: 시트·코랩·슬라이드·지메일·캘린더 등 <strong>자기 생태계</strong> 안에 통합.</li>\r\n<li><strong>Anthropic(Claude)</strong>: 엑셀·파워포인트에 들어가고, 스킬·플러그인·Managed Agents 등 <strong>독립 생태계</strong>를 강화. 최근 금융·회계용 엑셀 에이전트로 월가에서 화제.</li>\r\n</ul>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p><strong>보강 — 에이전틱 AI는 아직 신중하게.</strong> <em>에이전트</em>가 \"내가 시킨 자동화를 수행\"하는 단계라면, <em>에이전틱(agentic) AI</em>는 \"무엇을 할지 <strong>판단·의사결정</strong>까지 맡기는\" 단계다. 강사 경험상 아직 불안하다(실제로 에이전트가 파일을 다 지운 적도). 그래서 <strong>사람 승인(approval) 단계</strong>를 끼우는 게 현실적이다.</p>\r\n<p>★ <strong>공공의 과제 = 거버넌스.</strong> 이 에이전트가 Gemini가 아니라 AI 공통기반(FabriX·네이버 클로바)과 연결된다면 어떻게 운영·통제할지 고민하라. 에이전트를 굴리는 브릿지 파일들은 오픈소스로 많이 나와 있어, <strong>오픈소스 + Gemma 4B로 공공 자체 하네스 시스템</strong>을 만드는 게 좋은 팀 프로젝트가 될 수 있다(= \"애자일 AI\").</p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"부록 — 용어 사전·환경설정·출처\" id=\"_15\">부록 — 용어 사전·환경설정·출처</h1>\r\n<h2 id=\"_16\">용어 빠른 사전</h2>\r\n<div class=\"tablescroll\"><table>\r\n<thead>\r\n<tr>\r\n<th>용어</th>\r\n<th>한 줄 정의</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>바이브 코딩</td>\r\n<td>문법 몰라도 자연어로 AI에게 시켜 프로그램을 만드는 방식</td>\r\n</tr>\r\n<tr>\r\n<td>DX / AX</td>\r\n<td>디지털 전환(정량화) / AI 전환(더 세밀한 패턴·비정형까지)</td>\r\n</tr>\r\n<tr>\r\n<td>파라미터</td>\r\n<td>모델의 곱셈 가중치 개수 = 모델 크기</td>\r\n</tr>\r\n<tr>\r\n<td>토큰</td>\r\n<td>단어가 쪼개진 조각. 컨텍스트 윈도우의 단위</td>\r\n</tr>\r\n<tr>\r\n<td>임베딩</td>\r\n<td>단어를 좌표(벡터)로 바꿔 의미 거리를 재는 것</td>\r\n</tr>\r\n<tr>\r\n<td>트랜스포머 / Q·K·V</td>\r\n<td>LLM의 핵심 구조 / 어텐션에서 관련도를 계산하는 세 벡터</td>\r\n</tr>\r\n<tr>\r\n<td>컨텍스트 윈도우</td>\r\n<td>한 번에 기억하는 토큰 총량</td>\r\n</tr>\r\n<tr>\r\n<td>컨텍스트 엔지니어링</td>\r\n<td>맥락·자료를 잘 떠먹여 답을 끌어내는 기술</td>\r\n</tr>\r\n<tr>\r\n<td>SLM / 온디바이스·엣지 AI</td>\r\n<td>작은 언어모델 / 클라우드 없이 내 기기·센서에서 도는 AI</td>\r\n</tr>\r\n<tr>\r\n<td>GGUF</td>\r\n<td>로컬 실행기(Ollama 등)가 읽는 모델 양자화 포맷</td>\r\n</tr>\r\n<tr>\r\n<td>MCP</td>\r\n<td>AI에 외부 도구·데이터를 연결하는 표준 규격</td>\r\n</tr>\r\n<tr>\r\n<td>스킬(SKILL.md) / 하네스</td>\r\n<td>작업 지침 파일 / 지침+도구+권한까지 묶은 실행 환경</td>\r\n</tr>\r\n<tr>\r\n<td>RAG</td>\r\n<td>외부 정보를 검색해 LLM 답변에 섞어 신뢰도를 높이는 방식</td>\r\n</tr>\r\n<tr>\r\n<td>소버린 AI</td>\r\n<td>자국이 통제하는 AI 역량(특히 모델 다양성)</td>\r\n</tr>\r\n</tbody>\r\n</table></div>\r\n<h2 id=\"_17\">환경설정 체크리스트(과제 예고)</h2>\r\n<p>1회차 과제는 <strong>환경설정 완비</strong>다. 강사가 따로 리스트·가이드를 보낼 예정이지만, 미리 준비하면 좋은 것:</p>\r\n<ul>\r\n<li>[ ] <strong>Python</strong> 설치 (대부분 이미 됨)</li>\r\n<li>[ ] <strong>구글 계정</strong> (가능하면 부계정 — 단, 생년월일을 오늘 날짜로 넣지 말 것: 미성년 처리되어 잠긴다)</li>\r\n<li>[ ] <strong>코딩 에이전트</strong> 중 PC가 허락하는 것: Claude Code · Codex · Cursor · Windsurf · Gemini용 Antigravity · opencode · Goose</li>\r\n<li>[ ] <strong>Ollama</strong> (로컬 SLM 실험용) + 작은 모델 1개 받아두기</li>\r\n<li>[ ] 주요 서비스 계정/구독 상태 점검: ChatGPT · Gemini · Claude (2회차에 50개+ 서비스 투어)</li>\r\n</ul>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p><strong>보강 — 폐쇄망 대안 한 줄.</strong> 외부망이 막히면 코딩 에이전트 대신 <strong>외부 LLM 어시스트 → 코드 이식 → 로컬 실행</strong> 워크플로우로 간다(4장). 로컬 추론은 <strong>Ollama</strong>, 로컬 STT가 필요하면 <strong>faster-whisper</strong> 같은 오프라인 도구로 같은 일을 할 수 있다.</p>\r\n</blockquote>\r\n<h2 id=\"_18\">검색으로 보강·정정한 출처</h2>\r\n<ul>\r\n<li>Gemma 3n E4B(MatFormer, effective 4B): <a href=\"https://ai.google.dev/gemma/docs/gemma-3n\">Google AI for Developers</a>, <a href=\"https://artificialanalysis.ai/models/gemma-3n-e4b\">Artificial Analysis</a></li>\r\n<li>LifeArchitect Models Table (Alan D. Thompson): <a href=\"https://lifearchitect.ai/models-table/\">models-table</a></li>\r\n<li>LLM 시각화(GPT-2, 768/2304 구조): <a href=\"https://bbycroft.net/llm\">bbycroft.net/llm</a>, <a href=\"https://github.com/bbycroft/llm-viz\">GitHub bbycroft/llm-viz</a></li>\r\n<li>컨텍스트 윈도우 현황(Claude 200K~1M, Gemini 1M~2M): <a href=\"https://platform.claude.com/docs/en/build-with-claude/context-windows\">Claude Platform Docs</a></li>\r\n<li>트럼프 행정부 vs Anthropic(국방부 분쟁·소송): <a href=\"https://en.wikipedia.org/wiki/Anthropic%E2%80%93United_States_Department_of_Defense_dispute\">Wikipedia</a>, <a href=\"https://www.npr.org/2026/03/09/nx-s1-5742548/anthropic-pentagon-lawsuit-amodai-hegseth\">NPR</a></li>\r\n</ul>\r\n  </main>\r\n</div>\r\n\r\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js\"><\/script>\r\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/powershell.min.js\"><\/script>\r\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/vbscript.min.js\"><\/script>\r\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js\"><\/script>\r\n<script>\r\n// 주제 헤더 raw 텍스트를 data-full로 옮겨 ::after 표시\r\ndocument.querySelectorAll('h1.modhead').forEach(function(h){\r\n  h.setAttribute('data-full', h.textContent);\r\n});\r\n\r\n// highlight.js\r\nif(window.hljs){\r\n  document.querySelectorAll('.codewrap pre code').forEach(function(b){\r\n    try{hljs.highlightElement(b);}catch(e){}\r\n  });\r\n}\r\n\r\n// mermaid\r\nif(window.mermaid){\r\n  mermaid.initialize({\r\n    startOnLoad:true, theme:'base',\r\n    htmlLabels:false,\r\n    themeVariables:{\r\n      fontFamily:'-apple-system,Pretendard,\"Malgun Gothic\",sans-serif',\r\n      fontSize:'13px',\r\n      primaryColor:'#e6f4f1', primaryBorderColor:'#127c71', primaryTextColor:'#0c5249',\r\n      lineColor:'#9aa0a8', secondaryColor:'#f4f1ea', tertiaryColor:'#fbf1e4',\r\n      clusterBkg:'#f6f6f0', clusterBorder:'#cfd3cb'\r\n    },\r\n    flowchart:{curve:'basis', useMaxWidth:true, htmlLabels:false},\r\n    sequence:{useMaxWidth:true}\r\n  });\r\n}\r\n\r\n// 복사 버튼\r\ndocument.querySelectorAll('.copybtn').forEach(function(btn){\r\n  btn.addEventListener('click', function(){\r\n    var code = btn.closest('.codewrap').querySelector('pre code');\r\n    var txt = code ? code.innerText : '';\r\n    navigator.clipboard.writeText(txt).then(function(){\r\n      btn.textContent='복사됨'; btn.classList.add('ok');\r\n      setTimeout(function(){btn.textContent='복사'; btn.classList.remove('ok');},1400);\r\n    });\r\n  });\r\n});\r\n\r\n// 스크롤 스파이\r\nvar links = Array.from(document.querySelectorAll('#nav a'));\r\nvar map = {};\r\nlinks.forEach(function(a){ map[a.getAttribute('href').slice(1)] = a; });\r\nvar heads = Array.from(document.querySelectorAll('.main h1[id], .main h2[id]'));\r\nvar spy = new IntersectionObserver(function(entries){\r\n  entries.forEach(function(en){\r\n    if(en.isIntersecting){\r\n      links.forEach(function(l){l.classList.remove('active');});\r\n      var act = map[en.target.id];\r\n      if(act){act.classList.add('active');\r\n        act.scrollIntoView({block:'nearest'});}\r\n    }\r\n  });\r\n}, {rootMargin:'-10% 0px -75% 0px', threshold:0});\r\nheads.forEach(function(h){spy.observe(h);});\r\n\r\n// 모바일 사이드바\r\nvar side=document.getElementById('side'), scrim=document.getElementById('scrim'),\r\n    mb=document.getElementById('menubtn');\r\nfunction toggle(open){side.classList.toggle('open',open);scrim.classList.toggle('show',open);}\r\nif(mb){mb.addEventListener('click',function(){toggle(!side.classList.contains('open'));});}\r\nif(scrim){scrim.addEventListener('click',function(){toggle(false);});}\r\nlinks.forEach(function(a){a.addEventListener('click',function(){if(window.innerWidth<=880)toggle(false);});});\r\n<\/script>\r\n</body>\r\n</html>\r\n","2":"<!DOCTYPE html>\r\n<html lang=\"ko\">\r\n<head>\r\n<meta charset=\"utf-8\">\r\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\r\n<title>2회차 — AI 프론티어 탐색: 최전선 도구를 직접 써보고, 직접 만든다</title>\r\n<link rel=\"preconnect\" href=\"https://cdnjs.cloudflare.com\">\r\n<link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css\">\r\n<style>\r\n:root{\r\n  --bg:#fafaf6; --panel:#ffffff; --ink:#1b1e24; --ink-soft:#5a6069; --ink-faint:#8b919b;\r\n  --line:#e7e6df; --line-soft:#f0efe9;\r\n  --teal:#127c71; --teal-d:#0c5249; --teal-bg:#e6f4f1;\r\n  --amber:#b9722a; --amber-bg:#fbf1e4;\r\n  --red:#c0392b; --red-bg:#fbe9e7;\r\n  --code-bg:#f6f6f0;\r\n  --mono:ui-monospace,\"SF Mono\",\"Cascadia Code\",\"JetBrains Mono\",Consolas,monospace;\r\n  --sans:-apple-system,BlinkMacSystemFont,\"Pretendard\",\"Apple SD Gothic Neo\",\"Segoe UI\",\"Malgun Gothic\",sans-serif;\r\n  --rad:12px;\r\n}\r\n*{box-sizing:border-box}\r\nhtml{scroll-behavior:smooth}\r\n@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}\r\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);\r\n  font-size:16px;line-height:1.72;-webkit-font-smoothing:antialiased}\r\n\r\n/* layout */\r\n.shell{display:grid;grid-template-columns:300px minmax(0,1fr);max-width:1240px;margin:0 auto}\r\n.print-toc{display:none}\r\n.side{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;\r\n  padding:30px 22px 60px;border-right:1px solid var(--line)}\r\n.main{min-width:0;padding:46px 60px 120px;max-width:880px}\r\n\r\n/* sidebar */\r\n.brand{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;\r\n  color:var(--teal);margin-bottom:6px}\r\n.brand-t{font-weight:700;font-size:17px;line-height:1.35
