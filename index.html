/a>\r\n<a class=\"nav-h2\" href=\"#svg-ppt\">SVG로 PPT 장표 자동화 (강사의 비밀 무기)</a>\r\n<a class=\"nav-h2\" href=\"#_2\">코덱스 · 딥리서치 · 모델 티어</a>\r\n<a class=\"nav-h2\" href=\"#mermaid\">Mermaid로 다이어그램 그리기</a>\r\n<a class=\"nav-h1\" href=\"#7-mcp-gpt\">7. MCP와 앱 커넥터 — 도구를 GPT에 붙이기</a>\r\n<a class=\"nav-h2\" href=\"#notion\">Notion 연동</a>\r\n<a class=\"nav-h2\" href=\"#ai-mcp\">코리안로 AI — 한국 법령정보 MCP</a>\r\n<a class=\"nav-h1\" href=\"#8-gpts\">8. GPTs — 나만의 챗봇 만들기</a>\r\n<a class=\"nav-h2\" href=\"#gpts\">프로젝트 / GPTs와 &#x27;메모리 분리&#x27;</a>\r\n<a class=\"nav-h2\" href=\"#gpts-actions-api-open-meteo\">GPTs 작업(Actions) — 외부 API 연동 (Open-Meteo)</a>\r\n<a class=\"nav-h1\" href=\"#9-gemini\">9. 구글 Gemini 생태계</a>\r\n<a class=\"nav-h2\" href=\"#gemini\">Gemini의 태생 — 멀티모달 + 자체 칩</a>\r\n<a class=\"nav-h2\" href=\"#notebooklm\">NotebookLM</a>\r\n<a class=\"nav-h2\" href=\"#vids\">슬라이드 · 마인드맵 · Vids</a>\r\n<a class=\"nav-h2\" href=\"#stitch-ai-studio\">기획→개발 한 번에 — Stitch → AI Studio → 배포</a>\r\n<a class=\"nav-h1\" href=\"#10-lovable\">10. 바이브 코딩 — Lovable</a>\r\n<a class=\"nav-h1\" href=\"#_3\">부록 — 한눈에 보는 도구 맵</a>\r\n<a class=\"nav-h2\" href=\"#_4\">검색 보강 출처</a>\r\n    </nav>\r\n  </aside>\r\n  <main class=\"main\" id=\"main\">\r\n<nav class=\"print-toc\">\r\n<div class=\"ptoc-title\">목차</div>\r\n<a class=\"nav-h1\" href=\"#0\">0. 관통하는 태도 — &quot;딸깍의 시대&quot;</a>\r\n<a class=\"nav-h1\" href=\"#1-rag-llm-who-am-i\">1. RAG를 거꾸로 — LLM 없는 검색 시스템 (&#x27;Who am I&#x27;)</a>\r\n<a class=\"nav-h2\" href=\"#rag-vs\">보통의 RAG vs 강사의 룰 기반 검색</a>\r\n<a class=\"nav-h2\" href=\"#rss-fusejs-bm25\">쓰인 부품 — RSS, Fuse.js(퍼지 검색), BM25, 레벤슈타인</a>\r\n<a class=\"nav-h1\" href=\"#2\">2. 트렌드를 누구보다 빨리 캐치하는 법</a>\r\n<a class=\"nav-h2\" href=\"#ai-rss\">AI 타임즈 + RSS로 자동 수집</a>\r\n<a class=\"nav-h2\" href=\"#_1\">&quot;데이터를 어떻게 합법적으로 모으나&quot; — 토스 페이스페이 사례</a>\r\n<a class=\"nav-h1\" href=\"#3-gpt\">3. 잠깐 개념 정리 — 트랜스포머와 GPT의 역사</a>\r\n<a class=\"nav-h1\" href=\"#4-slm\">4. SLM(소형 언어모델) 지형 — 숙제 리뷰</a>\r\n<a class=\"nav-h1\" href=\"#5\">5. 실습 — 개발 환경부터 배포까지 풀 사이클</a>\r\n<a class=\"nav-h2\" href=\"#5-1-3\">5-1. 개발 환경 3종 세트</a>\r\n<a class=\"nav-h2\" href=\"#5-2-exe-github-pages\">5-2. 계산기 → EXE → 웹 → GitHub Pages 배포</a>\r\n<a class=\"nav-h2\" href=\"#5-3-minimax-m2\">5-3. 모델 교체 — MiniMax M2</a>\r\n<a class=\"nav-h1\" href=\"#6-chatgpt\">6. ChatGPT 깊게 쓰기</a>\r\n<a class=\"nav-h2\" href=\"#meta-prompt\">메타 프롬프트(meta prompt)</a>\r\n<a class=\"nav-h2\" href=\"#claude-in-excel-claude-for-financial-services\">Claude in Excel / Claude for Financial Services</a>\r\n<a class=\"nav-h2\" href=\"#svg-ppt\">SVG로 PPT 장표 자동화 (강사의 비밀 무기)</a>\r\n<a class=\"nav-h2\" href=\"#_2\">코덱스 · 딥리서치 · 모델 티어</a>\r\n<a class=\"nav-h2\" href=\"#mermaid\">Mermaid로 다이어그램 그리기</a>\r\n<a class=\"nav-h1\" href=\"#7-mcp-gpt\">7. MCP와 앱 커넥터 — 도구를 GPT에 붙이기</a>\r\n<a class=\"nav-h2\" href=\"#notion\">Notion 연동</a>\r\n<a class=\"nav-h2\" href=\"#ai-mcp\">코리안로 AI — 한국 법령정보 MCP</a>\r\n<a class=\"nav-h1\" href=\"#8-gpts\">8. GPTs — 나만의 챗봇 만들기</a>\r\n<a class=\"nav-h2\" href=\"#gpts\">프로젝트 / GPTs와 &#x27;메모리 분리&#x27;</a>\r\n<a class=\"nav-h2\" href=\"#gpts-actions-api-open-meteo\">GPTs 작업(Actions) — 외부 API 연동 (Open-Meteo)</a>\r\n<a class=\"nav-h1\" href=\"#9-gemini\">9. 구글 Gemini 생태계</a>\r\n<a class=\"nav-h2\" href=\"#gemini\">Gemini의 태생 — 멀티모달 + 자체 칩</a>\r\n<a class=\"nav-h2\" href=\"#notebooklm\">NotebookLM</a>\r\n<a class=\"nav-h2\" href=\"#vids\">슬라이드 · 마인드맵 · Vids</a>\r\n<a class=\"nav-h2\" href=\"#stitch-ai-studio\">기획→개발 한 번에 — Stitch → AI Studio → 배포</a>\r\n<a class=\"nav-h1\" href=\"#10-lovable\">10. 바이브 코딩 — Lovable</a>\r\n<a class=\"nav-h1\" href=\"#_3\">부록 — 한눈에 보는 도구 맵</a>\r\n<a class=\"nav-h2\" href=\"#_4\">검색 보강 출처</a>\r\n</nav>\r\n    <div class=\"hero\">\r\n      <div class=\"eyebrow\">Lecture Note · 기술 보강판</div>\r\n      <h1>2회차 — AI 프론티어 탐색: 최전선 도구를 직접 써보고, 직접 만든다</h1>\r\n      <p>현장 강의를 기술적으로 보강한 학습 레퍼런스 — 강사의 의도는 살리고, 빠지거나 틀린 기술은 정확히 채웠습니다.</p>\r\n    </div>\r\n\r\n<p>이 강의 하나로 무엇을 할 수 있게 하려는가 →\r\n<strong>\"프론티어 모델(LLM) 생태계를 한 바퀴 돌면서 ChatGPT·Claude·Gemini와 그 주변 도구(코딩 에이전트·MCP·GPTs·바이브 코딩)를 직접 설치·연동·배포해보고, '딸깍'으로 진입장벽이 무너진 시대에 '내가 필요한 걸 내가 만드는' 감각을 잡는 것.\"</strong></p>\r\n<blockquote class=\"callout callout-key\"><span class=\"callout-badge\">핵심</span>\r\n<p>★ 이 회차는 <strong>최전선 트렌드 투어 + 손으로 하는 실습</strong>이 섞여 있다. 깔끔한 위계(○○ 3계층 식)가 있는 강의가 아니라 <strong>나란한 주제들</strong>이 쭉 이어지고, 그걸 하나의 태도로 꿴다. 관통하는 태도는 한 줄: <strong>\"딸깍의 시대다 — 반대 방향까지 의심하며 직접 써보고, 트렌드를 누구보다 빨리 캐치하고, 결국 남는 건 사람(네트워크)이다.\"</strong></p>\r\n<p><strong>보강 안내</strong> — 강사가 이름만 흘리고 넘어간 도구·모델, 그리고 건너뛴 실제 명령어/코드/설정을 채워 넣고, 틀리게 말한 기술 사실은 <code>정정</code>으로 바로잡았다. 웹으로 확인한 항목은 <code>(검색 보강)</code>으로 출처를 밝혔다. <strong>요청대로 이번 회차는 참가자 자기소개 구간을 노트에서 뺐다.</strong></p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full='0. 관통하는 태도 — \"딸깍의 시대\"' id=\"0\">0. 관통하는 태도 — \"딸깍의 시대\"</h1>\r\n<p>강사가 강의 내내 반복한 키워드가 <strong>'딸깍'</strong>이다. 자동화/AI로 옛날엔 며칠 걸리던 걸 클릭 한 번에 해내는 상태를 가리키는 말장난인데, 이게 이 회차의 정서다.</p>\r\n<ul>\r\n<li><strong>진입장벽이 무너졌다.</strong> 코드 문법을 몰라도 자연어로 시켜서 앱을 만들고 배포한다. 그래서 \"먼저 설치하고 한 번이라도 더 돌려본 사람\"이 리드를 잡는다.</li>\r\n<li><strong>반대 방향까지 의심하라.</strong> 다들 \"LLM에 벡터 붙여 RAG\" 한 방향만 보는데, 강사는 일부러 그 <strong>정반대(룰 기반·LLM 없는 검색)</strong>를 들고 나왔다(1장). \"오픈AI 없이 RAG 못 만들어?\" 같은 질문을 던지는 게 핵심.</li>\r\n<li><strong>트렌드를 빠르게 캐치하라.</strong> AI는 교과서가 없다. 먼저 써본 사람이 1등이다(2장).</li>\r\n<li><strong>결국 남는 건 사람.</strong> 기술 진입장벽이 낮아질수록, 뜻을 같이하는 네트워크가 진짜 자산이다.</li>\r\n<li><strong>작게 시작하고, 도메인 전문가와 함께하라.</strong> MVP로 작게 시작하고, 업무를 정확히 아는 사람과 짜면 시스템이 간결해진다(7장).</li>\r\n</ul>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"1. RAG를 거꾸로 — LLM 없는 검색 시스템 ('Who am I')\" id=\"1-rag-llm-who-am-i\">1. RAG를 거꾸로 — LLM 없는 검색 시스템 ('Who am I')</h1>\r\n<p>강사가 수강생 정보를 검색해주는 'Who am I' 시스템을 만들어 보여줬다. 핵심은 <strong>여기에 LLM이 0% 들어갔다</strong>는 것 — \"LLM-프리(LLM-free)\" 시스템이다.</p>\r\n<h2 id=\"rag-vs\">보통의 RAG vs 강사의 룰 기반 검색</h2>\r\n<p>우리가 흔히 듣는 RAG는 단계가 길다. 문서를 잘게 쪼개고(청킹) → 숫자 벡터로 바꾸고(임베딩) → 벡터 DB에 저장 → 질문도 임베딩해서 의미가 가까운 걸 찾아 → LLM이 답을 생성. 강사는 이걸 <strong>정반대로</strong>, 의미를 담는 임베딩 없이 글자 그대로 빠르게 찾는 룰 기반으로 만들었다.</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">code</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre class=\"mermaid\">flowchart TD\r\n  Q[\"사용자 질문\"] --&gt; R1{\"두 갈래\"}\r\n  R1 --&gt;|\"흔한 RAG (의미 기반)\"| A1[\"청킹 → 임베딩(모델) → 벡터DB → LLM 생성\"]\r\n  R1 --&gt;|\"강사의 LLM-free (룰 기반)\"| A2[\"RSS로 데이터 참조 → Fuse.js 퍼지검색 → 결과 그대로\"]\r\n  A1 --&gt; O1[\"풍부하지만 느리고&lt;br/&gt;운영·비용 큼\"]\r\n  A2 --&gt; O2[\"의미는 약하지만&lt;br/&gt;빠르고 폐쇄망에 강함\"]\r\n</pre></div>\r\n<div class=\"tablescroll\"><table>\r\n<thead>\r\n<tr>\r\n<th>구분</th>\r\n<th>흔한 RAG (의미 기반)</th>\r\n<th>강사의 LLM-free (룰 기반)</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>핵심 기술</td>\r\n<td>임베딩 + 벡터 DB + LLM</td>\r\n<td>RSS(XML) + 퍼지 검색(Fuse.js)</td>\r\n</tr>\r\n<tr>\r\n<td>검색 방식</td>\r\n<td>시맨틱 서치(의미가 가까운 것)</td>\r\n<td>글자/문자열 기반 매칭</td>\r\n</tr>\r\n<tr>\r\n<td>장점</td>\r\n<td>표현이 풍부, 맥락 이해</td>\r\n<td>빠르다, 명확하다, 폐쇄망에 쉽게 넣음</td>\r\n</tr>\r\n<tr>\r\n<td>단점</td>\r\n<td>느려질 수 있음, 임베딩 모델·벡터DB·LLM 운영비</td>\r\n<td>의미를 담지 못함(다국어·동의어 약함)</td>\r\n</tr>\r\n</tbody>\r\n</table></div>\r\n<blockquote class=\"callout callout-key\"><span class=\"callout-badge\">핵심</span>\r\n<p>★ <strong>공공·실무에선 \"명확한 게 중요\"할 때가 많다.</strong> 의미를 두루뭉술 담는 것보다, 한글 파일 안에 적힌 그대로(예: \"김태우\"라는 글자) 빠르고 정확히 뽑는 게 더 맞는 상황이 있다. 그래서 애매함(fuzzy)을 다루는 기술인데도 결과는 명확하게 떨어지는, 역설적인 조합이다.</p>\r\n</blockquote>\r\n<h2 id=\"rss-fusejs-bm25\">쓰인 부품 — RSS, Fuse.js(퍼지 검색), BM25, 레벤슈타인</h2>\r\n<ul>\r\n<li><strong>RSS</strong> — 블로그·뉴스 같은 데서 콘텐츠를 XML 형태로 받아오는 오래된 표준. 여기선 데이터 참조 통로로 썼다.</li>\r\n<li><strong>Fuse.js</strong> — \"Lightweight Fuzzy Search\", 자바스크립트 라이브러리. npm으로 설치한다. <strong>퍼지(fuzzy)</strong> = \"이것도 저것도 아닌\" 모호한 정도를 점수로 재는 기법이라, 오타나 부분 일치도 잡아준다.</li>\r\n<li><strong>레벤슈타인 거리(Levenshtein distance)</strong> — 문자열 두 개가 얼마나 다른지(몇 글자 바꿔야 같아지는지)를 재는 아주 고전적인 방식. 퍼지 검색의 바탕에 깔린다.</li>\r\n<li><strong>BM25</strong> — 검색 랭킹에서 유명한 룰 기반 알고리즘. 이것도 의미 모델 없이 동작.</li>\r\n</ul>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">Shell</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre><code class=\"language-bash\">npm install fuse.js\r\n</code></pre></div>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">JavaScript</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre><code class=\"language-js\">// 최소 예시 — 이름/경력 안에서 오타까지 감안해 검색\r\nimport Fuse from \"fuse.js\";\r\nconst people = [{ name: \"김태우\", career: \"AI 프랙티셔너\" }, /* ... */];\r\nconst fuse = new Fuse(people, { keys: [\"name\", \"career\"], threshold: 0.4 }); // threshold↑ = 더 느슨\r\nconst hits = fuse.search(\"김대우\"); // 오타여도 \"김태우\"가 잡힘 (fuzzy)\r\n</code></pre></div>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p>보강 — <strong>이게 왜 폐쇄망에 강하냐.</strong> Fuse.js·BM25·레벤슈타인은 전부 룰 기반이라 외부 AI API가 필요 없다. 파이썬/JS 라이브러리 한두 개로 패키징해 인터넷 없는 사내망에 넣어도 그대로 돈다. 보안 심사를 통과하기도 쉽다. (의미 기반 RAG는 임베딩 모델·LLM 호출 때문에 통신이 필요해 이 점에서 불리하다.)</p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"2. 트렌드를 누구보다 빨리 캐치하는 법\" id=\"2\">2. 트렌드를 누구보다 빨리 캐치하는 법</h1>\r\n<p>AI는 교과서가 없고 매일 쏟아진다. 강사가 쓰는 \"비밀 장소\"들을 공유했다.</p>\r\n<h2 id=\"ai-rss\">AI 타임즈 + RSS로 자동 수집</h2>\r\n<ul>\r\n<li><strong>AI 타임즈(AI Times)</strong> — 국내 기준 AI 소식이 가장 빠른 신문. 해외 모델 출시도 유튜브보다 먼저 뜬다. 브라우저 시작 페이지로 걸어두면 하루 한 번은 보게 된다는 게 팁.</li>\r\n<li><strong>RSS.app</strong> — 아무 사이트(심지어 스레드 같은 SNS)나 주소를 넣으면 RSS(XML) 피드로 <strong>래핑(wrapping)</strong>해주는 서비스. 이걸로 최신 글을 자동으로 땡겨와 나만의 채팅/이메일/슬랙으로 받아볼 수 있다.</li>\r\n<li><strong>Slack 자동 수집</strong> — 기업들은 유명 IT 기업 테크블로그들의 RSS를 한 채널에 몰아넣어 두고, 쉴 때 한 번씩 본다. \"자동화 + API 오케스트레이션\"만 잘해도 이런 트렌드 파이프라인이 만들어진다.</li>\r\n</ul>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p>보강 — <strong>'오픈AI 초이'.</strong> 강사가 강력 추천한 스레드(Threads) 계정. 프로필이 강아지 사진인 익명 계정인데, 최신 AI 소식을 하루 5~10개씩 GIF까지 붙여 뿌린다. 스레드는 메타(인스타그램 회사)가 만든 글 중심 SNS(옛 트위터/X 대항마)이고, 국내에선 특이하게 반말 커뮤니티다. 이런 개인 계정이 공식 신문보다 빠를 때가 많다는 게 포인트.</p>\r\n</blockquote>\r\n<h2 id=\"_1\">\"데이터를 어떻게 합법적으로 모으나\" — 토스 페이스페이 사례</h2>\r\n<p>기술 자체보다 <strong>기획 한 번이 문제를 푼 사례</strong>로 소개됐다. 토스(Toss)가 <strong>페이스페이(face pay, 얼굴로 결제)</strong>를 밀면서 결제 단말기 시장을 노리는데, 여기 필요한 건 얼굴 인식(<strong>facial recognition</strong>) 모델. 문제는 \"수많은 사람 얼굴 데이터를 어떻게 합법적으로 구하나\"다.</p>\r\n<ul>\r\n<li>보통은 개인정보 동의 문제로 막힌다.</li>\r\n<li>토스(로 알려진 방식)는 <strong>대형 콘서트 입장 시 암표(부정 입장) 방지</strong>라는 목적을 걸고, 입장장에 얼굴 인식 카메라 + 카드 인증을 붙여 데이터를 합법적으로 모으고, 잘 마스킹해서 학습에 썼다는 식.</li>\r\n</ul>\r\n<blockquote class=\"callout callout-key\"><span class=\"callout-badge\">핵심</span>\r\n<p>★ 교훈: \"어떻게든 데이터를 구해서\"가 아니라, <strong>사람이 합법적으로 몰리는 상황을 사업으로 설계</strong>해 데이터 문제를 푼 것. 기술이 아니라 기획이 본질을 흔든 사례다.</p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"3. 잠깐 개념 정리 — 트랜스포머와 GPT의 역사\" id=\"3-gpt\">3. 잠깐 개념 정리 — 트랜스포머와 GPT의 역사</h1>\r\n<p>\"거점 리더라면 GPT가 어디서 왔는지는 알고 가자\"며 강사가 짚은 부분. 초보자가 가장 헷갈리는 용어라 정리해둔다.</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">code</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre class=\"mermaid\">flowchart TD\r\n  T[\"트랜스포머(Transformer)&lt;br/&gt;구글, 2017\"] --&gt; E[\"인코더(encoder)&lt;br/&gt;= 이해(NLU)\"]\r\n  T --&gt; D[\"디코더(decoder)&lt;br/&gt;= 생성(NLG)\"]\r\n  E --&gt; B[\"BERT 계열&lt;br/&gt;(이해 특화)\"]\r\n  D --&gt; G[\"GPT 계열&lt;br/&gt;(생성 특화) → ChatGPT\"]\r\n</pre></div>\r\n<blockquote class=\"callout callout-note\"><span class=\"callout-badge\">참고</span>\r\n<p>⚠ 정정 — <strong>NLP / NLU / NLG 정리.</strong> 강사가 디코더 영역을 한 번 \"NLP\"라고 불렀는데, 용어를 정확히 하면: <strong>NLP(자연어 처리)</strong>가 큰 우산이고, 그 아래 <strong>NLU(자연어 이해 — 입력을 해석)</strong>와 <strong>NLG(자연어 생성 — 출력을 만듦)</strong>가 있다. 트랜스포머의 인코더는 NLU 쪽, 디코더는 NLG 쪽에 대응한다고 보면 쉽다. ChatGPT는 디코더 계열(생성 특화).</p>\r\n<p>보강 — <strong>한 줄 히스토리.</strong> 트랜스포머 논문은 2017년 구글의 <em>\"Attention Is All You Need\"</em>. 정작 트랜스포머를 처음 만든 건 구글인데, 공개 정책 탓에 선점하지 못했고 오픈AI가 디코더 부분을 픽업해 키웠다. GPT-3까지는 주어진 지문 안에서만 잘 푸는 <strong>인컨텍스트 러닝(in-context learning)</strong> 수준이었는데, 여기에 <strong>RLHF(인간 피드백 기반 강화학습)</strong>를 얹은 GPT-3.5에서 체감 성능이 폭발했고, 그게 2022년 말 ChatGPT 공개로 이어졌다.</p>\r\n<p>⚠ 정정 — 강의 중 \"GPT 5.5 / 5.6\" 같은 버전 숫자가 나오는데, 이는 강사가 어림으로 던진 표기다. 모델 버전 숫자는 워낙 빨리·헷갈리게 바뀌니 정확한 제품명으로 외우기보다 <strong>\"최신 GPT-5 계열\"</strong> 정도로 기억해두는 게 안전하다.</p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"4. SLM(소형 언어모델) 지형 — 숙제 리뷰\" id=\"4-slm\">4. SLM(소형 언어모델) 지형 — 숙제 리뷰</h1>\r\n<p>지난주 숙제가 \"SLM(Small Language Model, 소형 언어모델) 조사\"였다. 강사가 제출물을 모아 리뷰했다. 등장한 모델들:</p>\r\n<ul>\r\n<li><strong>Gemma 4</strong>(구글), <strong>Qwen3 / Qwen2.5</strong>(알리바바) — 최신·인기 라인</li>\r\n<li><strong>Mistral</strong>(프랑스), <strong>Granite</strong>(IBM), <strong>DeepSeek-OCR</strong>(중국)</li>\r\n<li>국산: <strong>EXAONE</strong>(LG), <strong>Kanana</strong>(카카오), <strong>42dot</strong>(현대차그룹 — 강사가 의외라고 평한 모델)</li>\r\n<li><strong>OpenAI Privacy Filter</strong> (← STT가 \"Owl/오프네일\"로 잘못 들은 그 모델)</li>\r\n</ul>\r\n<blockquote class=\"callout callout-warn\"><span class=\"callout-badge\">주의</span>\r\n<p>보강 — <strong>'Owl / 오프네일 프라이버시 필터'의 정체 = OpenAI Privacy Filter.</strong> STT가 \"OpenAI\"를 \"오프네일/Owl\"로 잘못 들은 것이고, 실제 모델명은 <strong>OpenAI Privacy Filter</strong>다(2026년 4월 공개, 오픈소스). <strong>1.5B 파라미터(활성 50M)의 양방향 토큰 분류(token classification) 모델</strong>로, 텍스트를 한 번에 훑어 이름·주소·이메일·전화·URL·날짜·계좌·비밀번호 8개 범주의 개인정보(PII)를 찾아 가린다. 강사의 질문(\"임베딩 직전이냐 후냐, 분류 모델이냐 회귀 모델이냐\")에 대한 답: <strong>사용자가 입력하자마자 도는 분류(classification) 모델</strong>이고, 클라우드 LLM에 보내기 <strong>전 단계</strong>에 두어 개인정보가 밖으로 나가기 전 로컬에서 먼저 마스킹한다. 그래서 <strong>온프레미스(내 노트북/사내 서버) 구동</strong>이 핵심 가치다. (검색 보강: openai.com/index/introducing-openai-privacy-filter, Hugging Face <code>openai/privacy-filter</code>)</p>\r\n<p>★ <strong>초보자 교훈 — AI의 환각(hallucination).</strong> 강사가 이 모델을 Claude에게 물었더니 \"그런 모델 없습니다\"라고 답했다고 한다. 하지만 실제로 존재한다. <strong>LLM은 자기 학습 시점 이후이거나 모르는 것을 종종 단정적으로 '없다'고 지어낸다(환각).</strong> \"AI가 아니라고 했으니 없는 거겠지\"라고 믿지 말고, 한 번 더 직접 확인하는 습관이 필요하다.</p>\r\n<p>보강 — <strong>이 작은 모델들이 왜 중요한가.</strong> Qwen2.5급 소형 모델은 GPU 없이 <strong>CPU(우리 PC)에서도 돌아간다.</strong> 오픈웨이트(open-weight)라 <strong>허깅페이스(Hugging Face)</strong>에서 누구나 받아 폐쇄망에 넣어 쓸 수 있다. 로컬 구동이 목적이면 <strong>올라마(Ollama)</strong> 같은 도구로 사내망에 올려 서빙하는 게 표준적인 출발점이다.</p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"5. 실습 — 개발 환경부터 배포까지 풀 사이클\" id=\"5\">5. 실습 — 개발 환경부터 배포까지 풀 사이클</h1>\r\n<p>강의의 첫 손풀기 실습. <strong>VS Code + opencode + OpenRouter</strong>로 코딩 환경을 만들고 → 계산기를 만들어 → EXE/웹으로 배포하는 한 바퀴.</p>\r\n<h2 id=\"5-1-3\">5-1. 개발 환경 3종 세트</h2>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">code</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre class=\"mermaid\">flowchart LR\r\n  V[\"VS Code&lt;br/&gt;(IDE)\"] --&gt; O[\"opencode&lt;br/&gt;(터미널 코딩 에이전트)\"]\r\n  O --&gt; R[\"OpenRouter&lt;br/&gt;(모델 공급자)\"]\r\n  R --&gt; M[\"여러 LLM을&lt;br/&gt;하나의 창구로 호출\"]\r\n</pre></div>\r\n<ul>\r\n<li><strong>VS Code</strong> — 코드 편집기(IDE). 커서(Cursor)의 근간이기도 하다. <a href=\"https://code.visualstudio.com\">code.visualstudio.com</a>에서 설치.</li>\r\n<li><strong>opencode</strong> — 터미널에서 도는 오픈소스 AI 코딩 에이전트. VS Code 안 터미널에 띄워 쓴다.</li>\r\n<li><strong>OpenRouter</strong> — 여러 AI 모델을 <strong>하나의 API 창구</strong>로 묶어주는 모델 공급자. 회사에 배치할 때도 모델 교체가 쉬워진다.</li>\r\n</ul>\r\n<p>실제 설치 순서(강사가 \"힌트는 Node.js\"라고만 하고 넘어간 부분을 채움):</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">Shell</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre><code class=\"language-bash\"># 1) Node.js 18+ 설치 (https://nodejs.org) — opencode를 깔기 위한 런타임 + npm 제공\r\nnode -v                       # v18 이상인지 확인\r\n\r\n# 2) opencode 전역 설치  (npm 패키지명은 opencode가 아니라 opencode-ai!)\r\nnpm install -g opencode-ai\r\n\r\n# 3) 프로젝트 폴더에서 실행\r\nopencode\r\n\r\n# 4) OpenRouter 연결 — opencode 안에서\r\n/connect                      # 안내에 따라 OpenRouter API 키 붙여넣기\r\n#   또는 환경변수로 (Windows, 새 터미널부터 적용)\r\nsetx OPENROUTER_API_KEY \"sk-or-...\"\r\n\r\n# 5) 모델 바꾸기 — opencode 안에서\r\n/models                       # 목록에서 원하는 모델 선택\r\n</code></pre></div>\r\n<blockquote class=\"callout callout-note\"><span class=\"callout-badge\">참고</span>\r\n<p>⚠ 정정 — 강사는 <em>\"Node.js를 깔면 리눅스 환경이 같이 깔린다\"</em>고 했는데, 정확히는 아니다. <strong>Node.js는 opencode를 설치·구동하는 런타임(과 npm)을 줄 뿐, 리눅스를 설치해주지 않는다.</strong> opencode는 Windows의 PowerShell에서도 동작하지만, 공식 문서는 호환성 문제를 줄이려면 <strong>WSL(Windows Subsystem for Linux)</strong>에서 쓰길 권장한다. 강사가 느낀 \"리눅스 같다\"는 인상은 유닉스 셸/WSL 위에서 돌 때의 경험으로 보인다. (검색 보강: opencode.ai 공식 문서, OpenRouter의 opencode 연동 가이드)</p>\r\n<p>보강 — 코딩 에이전트엔 보통 <strong>Plan 모드(대화·계획)</strong>와 <strong>Build 모드(실제 코딩)</strong>가 있다. Plan에서 무엇을 할지 합의하고 Build로 넘기는 흐름은 거의 모든 코딩 에이전트(Claude Code, Codex 등)에 공통이다.</p>\r\n</blockquote>\r\n<h2 id=\"5-2-exe-github-pages\">5-2. 계산기 → EXE → 웹 → GitHub Pages 배포</h2>\r\n<p>무료 모델(느림)로 시작해도 되지만, 외부 패키지 없이 <strong>파이썬 내장 함수</strong>만으로 간단한 계산기/날짜계산기를 만들게 했다. 그다음 두 갈래로 배포.</p>\r\n<p><strong>(A) EXE로 묶기 — PyInstaller</strong></p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">Shell</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre><code class=\"language-bash\">pip install pyinstaller\r\npyinstaller --onefile --noconsole calculator.py   # 단일 .exe, --noconsole은 콘솔창 숨김(GUI용)\r\n# 결과물: dist/calculator.exe  → 탐색기에서 더블클릭 실행\r\n</code></pre></div>\r\n<p><strong>(B) 웹으로 띄우기 — Flask (127.0.0.1:5000)</strong></p>\r\n<p>강사 화면에 뜬 <code>127.0.0.1:5000</code>은 Flask 기본 포트다. 최소 예시:</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">python</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre><code class=\"language-python\"># app.py\r\nfrom flask import Flask, request, render_template_string\r\napp = Flask(__name__)\r\nPAGE = \"\"\"\r\n&lt;form method=post&gt;&lt;input name=expr value=\"{{expr}}\"&gt;&lt;button&gt;=&lt;/button&gt;&lt;/form&gt;\r\n&lt;p&gt;결과: {{result}}&lt;/p&gt;\r\n\"\"\"\r\n@app.route(\"/\", methods=[\"GET\", \"POST\"])\r\ndef index():\r\n    expr, result = \"\", \"\"\r\n    if request.method == \"POST\":\r\n        expr = request.form[\"expr\"]\r\n        try:\r\n            result = eval(expr)           # ⚠ 데모용. 실제 서비스면 eval 금지(보안)!\r\n        except Exception as e:\r\n            result = f\"오류: {e}\"\r\n    return render_template_string(PAGE, expr=expr, result=result)\r\nif __name__ == \"__main__\":\r\n    app.run(host=\"127.0.0.1\", port=5000)  # http://127.0.0.1:5000\r\n</code></pre></div>\r\n<blockquote class=\"callout callout-warn\"><span class=\"callout-badge\">주의</span>\r\n<p>⚠ 주의 — 위 <code>eval()</code>은 데모를 짧게 보이려 쓴 것. 사용자 입력을 그대로 <code>eval</code> 하면 임의 코드가 실행될 수 있어 <strong>실제 서비스에선 절대 금지</strong>다. 안전한 수식 파서를 쓰거나 연산을 직접 구현해야 한다.</p>\r\n</blockquote>\r\n<p><strong>(C) GitHub Pages로 무료 공개</strong></p>\r\n<p>프론트(HTML/CSS/JS)로 만든 정적 페이지는 GitHub Pages로 공짜 호스팅된다. 주소는 <code>username.github.io</code> 형태.</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">Shell</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre><code class=\"language-bash\">git init &amp;&amp; git add . &amp;&amp; git commit -m \"calculator\"\r\ngit branch -M main\r\ngit remote add origin https://github.com/&lt;username&gt;/&lt;repo&gt;.git\r\ngit push -u origin main\r\n# GitHub → 레포 → Settings → Pages → Branch: main / (root) → Save\r\n# 몇 분 뒤  https://&lt;username&gt;.github.io/&lt;repo&gt;/  로 공개\r\n</code></pre></div>\r\n<blockquote class=\"callout callout-key\"><span class=\"callout-badge\">핵심</span>\r\n<p>★ 강사 의도: 대단한 걸 만드는 게 아니라 <strong>기획 → 코딩 → 테스트 → 배포의 풀 사이클을 MVP로 한 번 겪어보는 것</strong>. 환경 설정이 사람마다 달라 까다로운데, 그 까다로움을 직접 통과해보는 게 이 실습의 진짜 목적이다.</p>\r\n</blockquote>\r\n<h2 id=\"5-3-minimax-m2\">5-3. 모델 교체 — MiniMax M2</h2>\r\n<p>무료 모델은 응답이 느리니, OpenRouter에서 <strong>MiniMax M2</strong>(유료)로 바꿔 속도를 확보하는 실습.</p>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p>보강 — <strong>MiniMax M2.</strong> 중국 MiniMax가 내놓은 오픈웨이트 모델로 코딩·에이전트 작업에 강한 편이라 무료 모델 대신 권한 것. 강사가 말한 \"(M2.5)\"는 곁가지 표기로 보이고 핵심 모델명은 MiniMax M2. 모델 바꾸는 명령(<code>/models</code>)을 모르면 AI에게 \"opencode에서 모델 바꾸는 법\" 물어보면 바로 알려준다.</p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"6. ChatGPT 깊게 쓰기\" id=\"6-chatgpt\">6. ChatGPT 깊게 쓰기</h1>\r\n<p>\"고급 과정이니 기본 프롬프트는 건너뛰고\" 한 단계 위 기능들로 갔다.</p>\r\n<h2 id=\"meta-prompt\">메타 프롬프트(meta prompt)</h2>\r\n<p><strong>프롬프트를 위한 프롬프트.</strong> 내가 좋은 프롬프트를 직접 짜기 어려우니, \"이런 워크플로우/봇을 만들려는데 거기 맞는 최적의 프롬프트(시스템 프롬프트)를 네가 짜라\"고 AI에게 시키는 기법.</p>\r\n<blockquote class=\"callout callout-key\"><span class=\"callout-badge\">핵심</span>\r\n<p>★ 프레임워크적 사고와 궁합이 좋다. 마케팅의 3C, 시장성/수익성/경쟁/실행난이도 같은 <strong>틀</strong>을 많이 알수록, 그 틀을 메타 프롬프트에 넣어 결과를 빠르게 뽑는다. 컨설팅이 하던 \"프레임으로 사고 → 장표화\"를 AI로 가속하는 셈.</p>\r\n</blockquote>\r\n<h2 id=\"claude-in-excel-claude-for-financial-services\">Claude in Excel / Claude for Financial Services</h2>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p>보강 — 둘 다 Anthropic의 실제 제품. <strong>Claude in Excel</strong>은 엑셀 안에서 Claude가 셀을 잡아 분석·작성해준다(Claude 프로 계정 연동, 애드인 설치). <strong>Claude for Financial Services</strong>는 밸류에이션·리서치 같은 금융 업무용 B2B 서비스다. 한글도 잘 처리한다.</p>\r\n</blockquote>\r\n<h2 id=\"svg-ppt\">SVG로 PPT 장표 자동화 (강사의 비밀 무기)</h2>\r\n<p>PPT를 AI로 만들 때 이미지로 뽑으면 수정이 안 돼 곤란한데, 강사가 찾은 해법이 <strong>SVG(벡터)로 렌더링해 뽑기</strong>다.</p>\r\n<ul>\r\n<li>SVG로 받으면 PPT에 넣고 <strong>우클릭 → 그룹 해제</strong>로 개체별 편집이 된다(이미지와 달리).</li>\r\n<li>강사 체감상 <strong>Claude가 SVG를 가장 안 깨지게</strong> 만든다(Gemini 등은 다운로드 후 깨지는 경우가 있었다고).</li>\r\n<li>프롬프트에 컨설팅식 약속을 녹인다: <strong>원페이지 원메시지</strong>, 명확한 <strong>거버닝 센텐스(governing sentence, 그 장표의 한 줄 핵심)</strong>, <strong>As-Is / To-Be</strong>, A4 가로 고정, \"반드시 SVG로, PPT에 넣어도 안 깨지게, 3장만\".</li>\r\n<li>컬러는 말로 하기보다 <strong>HEX 색상 코드/브랜드 팔레트</strong>를 직접 주면 잘 따른다. \"맥킨지/BCG 스타일로\" 같은 지시도 먹힌다.</li>\r\n</ul>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p>보강 — <strong>plan and execution.</strong> 강사가 언급한 \"플랜 앤 익스큐션\"은 에이전트가 <strong>계획을 먼저 세우고(plan) → 사용자 승인 후 실행(execution)</strong>하는 구조. 요즘 거의 모든 에이전트 플랫폼(Claude, Codex 등)의 기본 동작이다. Claude의 승인 모드로 직접 체험해볼 수 있다.</p>\r\n</blockquote>\r\n<h2 id=\"_2\">코덱스 · 딥리서치 · 모델 티어</h2>\r\n<ul>\r\n<li><strong>코덱스(Codex)</strong> — ChatGPT의 코딩 에이전트. 내 GitHub과 연동해야 제 화면이 뜨고, 연동하면 코덱스가 직접 코딩하며 GitHub에 푸시한다.</li>\r\n<li><strong>딥리서치(Deep Research)</strong> — 한 주제를 <strong>멀티스텝으로 깊게 파고들어</strong> 보고서로 만들어주는 기능. 거의 모든 AI 서비스에 들어와 있다. \"활용 방안 5개\" 같은 식으로 시킨다.</li>\r\n<li><strong>모델 티어</strong> — 어느 서비스든 보통 <strong>소형(빠름) / 표준 / 리즈닝(추론, 깊게 생각)</strong> 으로 나뉜다. 예: Gemini의 Flash(소형) / Pro(표준) / 추론 모드. 차이는 모델 크기·레이어·학습 방식.</li>\r\n</ul>\r\n<h2 id=\"mermaid\">Mermaid로 다이어그램 그리기</h2>\r\n<p>ChatGPT가 플로우차트를 그릴 때 따르는 특정 문법이 <strong>머메이드(Mermaid)</strong>다. \"머메이드 문법으로 ○○를 N단계 플로우차트로 그려줘\"라고 시키면 코드로 그려준다.</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">text</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre><code class=\"language-text\">flowchart TD\r\n  A[원료] --&gt; B[설계]\r\n  B --&gt; C[제조]\r\n  C --&gt; D[패키징]\r\n  D --&gt; E[유통]\r\n</code></pre></div>\r\n<ul>\r\n<li><strong>Mermaid Live Editor</strong>(<a href=\"https://mermaid.live\">mermaid.live</a>) — 문법을 붙여넣으면 바로 그려지는 무료 에디터.</li>\r\n<li>활용 팁: 내 하루 업무를 줄글 일기로 쭉 적고 \"머메이드로 내 업무 루틴 정리해줘\" 하면 깔끔한 흐름도가 나온다.</li>\r\n</ul>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p>보강 — <strong>폐쇄망용 오프라인 Mermaid 에디터.</strong> 강사는 <code>mermaid.min.js</code> + <code>index.html</code>만으로 <strong>인터넷 없이 도는 머메이드 에디터</strong>를 바이브 코딩으로 만들어 썼다. 프론트엔드 기술이 좋아져서, 이런 도구는 잘 패키징하면 통신 없이도 사내에서 돌릴 수 있다.</p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"7. MCP와 앱 커넥터 — 도구를 GPT에 붙이기\" id=\"7-mcp-gpt\">7. MCP와 앱 커넥터 — 도구를 GPT에 붙이기</h1>\r\n<p>ChatGPT의 <strong>앱(앱 커넥터)</strong> 기능으로 외부 서비스를 붙여 쓴다. 그 바탕 규약이 <strong>MCP(Model Context Protocol)</strong>다.</p>\r\n<h2 id=\"notion\">Notion 연동</h2>\r\n<p>ChatGPT 설정에서 노션 앱을 연결하면, ChatGPT 화면에서 노션을 직접 컨트롤할 수 있다.</p>\r\n<ul>\r\n<li>연결 후 채팅에서 \"더 보기\"에 노션이 잡히고, 노션 모드로 전환된다.</li>\r\n<li>예시 지시: <strong>\"노션 데이터베이스로 만들어서 AI 트렌드 팔로우할 사이트 100개 정리해줘\"</strong> → 단순 링크 모음이 아니라 카테고리·추천도·난이도·\"왜 봐야 하는지\"까지 속성(property)으로 채워 정리한다.</li>\r\n<li>같은 방식으로 Gmail·구글 캘린더 등 여러 개를 동시에 붙일 수 있다(\"하나씩 붙이면 멀티가 된다\" = MCP의 특징).</li>\r\n</ul>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">code</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre class=\"mermaid\">flowchart LR\r\n  U[\"사용자\"] --&gt; C[\"ChatGPT (호스트)\"]\r\n  C --&gt; M{\"MCP / 커넥터\"}\r\n  M --&gt; N[\"Notion\"]\r\n  M --&gt; G[\"Gmail / 캘린더\"]\r\n  M --&gt; K[\"코리안로 AI&lt;br/&gt;(법령 MCP)\"]\r\n</pre></div>\r\n<h2 id=\"ai-mcp\">코리안로 AI — 한국 법령정보 MCP</h2>\r\n<p>수강생 중 한 분이 만든 <strong>한국 법령정보 MCP</strong>를 강사가 직접 붙여봤다. 예: \"법인세법 52조 부당행위계산의 부인\" 조회가 잘 됐다. (인증키 없이도 동작.)</p>\r\n<p>ChatGPT에 커스텀 MCP 서버를 붙이는 경로(강사가 \"숨어 있다\"고 한 부분):</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">text</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre><code class=\"language-text\">계정 설정 → 앱(커넥터) → 고급 설정 → 개발자 모드 ON\r\n→ \"앱 만들기\" → MCP 서버 URL 입력 → (인증 없음 가능) → 만들기\r\n→ 채팅창 + 버튼에서 'coriain law(코리안로)' 선택해 사용\r\n</code></pre></div>\r\n<blockquote class=\"callout callout-warn\"><span class=\"callout-badge\">주의</span>\r\n<p>★ <strong>진짜 MCP가 동작했는지 구분법.</strong> 응답 중 <strong>\"도구 요청 / 도구 호출(tool call)\"</strong> 형식이 떠야 MCP가 실제로 동작한 것. 그게 없이 그냥 웹서치 결과를 긁어오면 MCP가 아니라 웹 검색이다.</p>\r\n<p>⚠ 주의 — \"MCP 쓰면 다 된다\"는 너무 선언적이다. 실제론 ① 그 DB가 MCP를 붙일 수 있는지 ② 권한(role)으로 접근되는지 ③ 외부에서 호출 가능한지 ④ 스키마(schema)가 맞는지를 하나하나 따져야 한다. <strong>기술만으로 밀면 헤매고, 도메인 전문가와 함께 업무를 정확히 알면 구조가 간결해진다.</strong></p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"8. GPTs — 나만의 챗봇 만들기\" id=\"8-gpts\">8. GPTs — 나만의 챗봇 만들기</h1>\r\n<h2 id=\"gpts\">프로젝트 / GPTs와 '메모리 분리'</h2>\r\n<p>GPT의 <strong>프로젝트</strong> 또는 <strong>My GPT(GPTs)</strong>로 나만의 파일·프롬프트를 고정한 전용 봇을 만든다.</p>\r\n<blockquote class=\"callout callout-key\"><span class=\"callout-badge\">핵심</span>\r\n<p>★ 강사가 찾아낸 숨은 설정 — 프로젝트의 <strong>'설정(Settings)' → 메모리(memory)</strong>. 기본값이면 다른 대화 맥락이 섞여 들어와 봇이 이상해질 수 있다. 메모리를 이 프로젝트 안에서만 독립적으로 작동하게 분리하면 깔끔해진다. (이 설정이 깊이 숨어 있어 모르고 지나치기 쉽다.)</p>\r\n</blockquote>\r\n<p>GPTs 만들기 흐름: <code>GPT 탐색 → GPT 만들기 → Configure(구성)</code>에서 이름·설명·아이콘·시작 버튼(starter)·권장 모델·웹서치/캔버스/이미지 사용 여부를 세팅하고, 시스템 프롬프트를 넣는다. 이 시스템 프롬프트도 <strong>메타 프롬프트로 뽑으면</strong> 빠르다.</p>\r\n<h2 id=\"gpts-actions-api-open-meteo\">GPTs 작업(Actions) — 외부 API 연동 (Open-Meteo)</h2>\r\n<p><strong>Actions</strong>는 외부 API를 GPTs에 붙이는 기능. <strong>OpenAPI 스키마(schema)</strong>를 넣으면 GPT가 그 API를 호출한다. 강사는 인증 없이 쓰는 <strong>Open-Meteo</strong>(무료 날씨 API)로 시연했다.</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">Shell</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre><code class=\"language-bash\"># Open-Meteo는 인증키 없이 바로 호출되는 무료 날씨 API\r\ncurl \"https://api.open-meteo.com/v1/forecast?latitude=37.57&amp;longitude=126.98&amp;current=temperature_2m\"\r\n</code></pre></div>\r\n<p>연동 경로: <code>Configure → Actions → New Action</code>에 OpenAPI 스키마 붙여넣기 → <code>Authentication: None</code>. 스키마는 직접 짜기 어려우니 <strong>GPT에게 \"Open-Meteo를 GPTs Action에 추가하게 스키마랑 인스트럭션 다 짜줘\"</strong>라고 시키면 된다.</p>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p>⚠ 정정/보강 — 강사 화면에 뜬 빨간 에러 <em>\"...has unrecognized method ... skipping\"</em>는 <strong>스키마 문법이 GPTs가 요구하는 OpenAPI 3.x 규격과 안 맞을 때</strong> 나는 메시지다. 에러 문구를 그대로 GPT에 던져 \"이 에러가 난다, 고쳐줘\" 하면 대개 잡힌다. 한글 지명이 안 먹으면 영문 지명을 쓰거나, <strong>Geocoding API로 \"Seoul\"→위경도 변환 후 forecast</strong> 두 단계로 붙이면 안정적이다.</p>\r\n<p>보강 — 같은 방식으로 <strong>data.go.kr(공공데이터포털)</strong> API를 붙이면 공공정보를 GPT 안에서 바로 다룰 수 있다. 또 GPTs/Actions에는 <strong>스케줄링</strong>도 걸 수 있어(\"매일 9시에 트렌드 찾아와\") 정기 작업으로 만들 수 있다.</p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"9. 구글 Gemini 생태계\" id=\"9-gemini\">9. 구글 Gemini 생태계</h1>\r\n<p>강사가 개인적으로 제일 많이 쓴다는 구글 쪽. 한 바퀴 훑었다.</p>\r\n<h2 id=\"gemini\">Gemini의 태생 — 멀티모달 + 자체 칩</h2>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p>보강 — ChatGPT는 초기에 <strong>코드·영어 위주로 학습</strong>해 한국어가 약했다(지금은 학습량이 늘어 문제없음). 반면 <strong>Gemini는 태생이 멀티모달</strong> — 이미지 등 다른 데이터와 언어를 동시에 학습한다. 구글은 <strong>TPU 등 칩(하드웨어)을 직접 설계</strong>해 자기 하드웨어에 최적화한다. 초기 이름은 <strong>바드(Bard)</strong>였고, 출시 직후엔 평이 안 좋다가 빠르게 안정됐다.</p>\r\n</blockquote>\r\n<ul>\r\n<li><strong>Gems</strong> — GPTs와 같은 개념의 \"나만의 Gemini 봇\". <code>새 Gem</code>에서 프롬프트 세팅.</li>\r\n<li><strong>사주 봇 '폴춘테카' 일화</strong> — 강사가 즉석에서 상수학·종교 등을 섞은 \"사주 봐주는 Gem\"을 만들고, \"이거 사업 되겠다 → 이름 지어줘\"로 <em>폴춘테카(Fortuneteca?)</em>라는 이름까지 뽑은 사례. <strong>결과는 매번 다른 확률 모델이라 '잘 맞는다/안 맞는다'가 갈리는 건 사실 랜덤</strong>이라는 점도 같이 짚었다. (서비스 아이디어로서 \"고민·운세\" 영역의 수요가 있다는 관찰.)</li>\r\n</ul>\r\n<h2 id=\"notebooklm\">NotebookLM</h2>\r\n<p>왼쪽에 자료를 넣으면 가운데에서 요약해주는 직관적 도구. 웹서치·딥리서치도 붙어 있고, <strong>오디오(팟캐스트) 자동 생성</strong>이 유명하다.</p>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p>보강 — 강사 코멘트: 팟캐스트 시장은 서양(스포티파이 등)에선 크지만 국내선 아직 약하다. 구글 같은 글로벌 기획팀은 <strong>\"한국인만을 위한 게 아니라 전 세계 페르소나\"</strong>를 기본 전제로(제로 베이스) 기획한다는 점이 한국 기획과의 차이.</p>\r\n</blockquote>\r\n<h2 id=\"vids\">슬라이드 · 마인드맵 · Vids</h2>\r\n<ul>\r\n<li><strong>구글 Vids</strong> — AI 기반 영상 제작/편집 도구(워크스페이스). 영상을 슬라이드처럼 다룬다.</li>\r\n<li>Gemini에서 <strong>구글 슬라이드/마인드맵/플래시카드/인포그래픽/데이터표(구글 시트)</strong>로 바로 뽑을 수 있다. 마인드맵은 연산이 가벼워 거의 즉시 나온다.</li>\r\n</ul>\r\n<h2 id=\"stitch-ai-studio\">기획→개발 한 번에 — Stitch → AI Studio → 배포</h2>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">code</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre class=\"mermaid\">flowchart LR\r\n  S[\"Stitch&lt;br/&gt;(AI UI 디자인)\"] --&gt;|\"핸드오프(handoff)\"| A[\"AI Studio&lt;br/&gt;(Build = 개발)\"]\r\n  A --&gt; P[\"배포: AI Studio Publish&lt;br/&gt;또는 Vercel v0\"]\r\n</pre></div>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p>보강 — <strong>구글 Stitch → AI Studio.</strong> Stitch는 구글의 AI UI 디자인 도구(피그마 대항마)로, 프롬프트로 화면 시안을 만들고 <strong>HTML+Tailwind CSS 코드</strong>로 내보내거나 Figma로 붙여넣을 수 있다. 거기서 'AI Studio로 내보내기'를 하면 구글 <strong>AI Studio의 Build</strong>가 그 시안을 받아 백엔드·API까지 붙여 동작 앱으로 만든다. 기획(Stitch)→개발(AI Studio)으로 바통을 넘기는 이 이음매가 <strong>핸드오프(handoff)</strong>. 마지막엔 AI Studio에서 URL 공개하거나 <strong>Vercel v0</strong>로 빼서 배포한다. (검색 보강: developers.googleblog.com Stitch 소개 / Stitch↔AI Studio 워크플로우)</p>\r\n<p>★ <strong>실전 팁 — AI Studio 무료 배포.</strong> 배포할 때 'Billing / Setup Billing'(결제 설정)으로 가면 안 된다. <strong>'Share'에서 비공개(reject) 버튼을 풀면 그냥 퍼블릭으로 공개</strong>된다(카드 등록 불필요). 설정이 숨어 있을 뿐이다.</p>\r\n</blockquote>\r\n<ul>\r\n<li><strong>구글 Flow</strong> — 구글 랩스의 동영상/이미지 생성 도구. 강사 활용 팁: <strong>PPT 커버 페이지에 짧은 동영상</strong>을 넣으면(\"계속 재생\" 체크) 주목도가 올라가 강의평이 좋아진다.</li>\r\n</ul>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"10. 바이브 코딩 — Lovable\" id=\"10-lovable\">10. 바이브 코딩 — Lovable</h1>\r\n<p>강사가 제일 많이 쓰는 바이브 코딩 플랫폼.</p>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p>보강 — <strong>Lovable(러버블).</strong> 스웨덴 회사의 바이브 코딩 플랫폼. 프롬프트만으로 <strong>프론트 + 백엔드(기본 백엔드는 Supabase 연동)</strong>까지 붙은 웹앱을 만들어 실제 배포까지 한다. 무료는 하루 약 5프롬프트, 유료는 약 월 20달러.</p>\r\n</blockquote>\r\n<p>강사가 Lovable로 직접 만들어 쓰는 것들:\r\n- <strong>실시간 강의 인터랙션 보드</strong> — 로그인 없이 링크로 접속, 공지 띄우기, <strong>무기명(익명) 채팅</strong>, <strong>실시간 투표(\"이해하셨나요?\")</strong>, 동시 200명까지 테스트. (조용한 정서의 청중과 강사 사이 \"중간 지대\"를 만든 도구.)\r\n- <strong>데이터 배포 플랫폼</strong> — 수강생에게 API 키를 발급해 중앙에서 데이터를 받아가게.\r\n- <strong>주식 백테스팅</strong> — <strong>yfinance</strong> 연동으로 롱숏 트레이딩 백테스트.</p>\r\n<blockquote class=\"callout callout-warn\"><span class=\"callout-badge\">주의</span>\r\n<p>⚠ 주의 — <strong>데이터 주권.</strong> 수강생 질문대로 Lovable+Supabase는 <strong>데이터가 외부(클라우드)에 저장</strong>된다. 데이터 주권·보안이 중요한 공공/민감 업무라면 어디에 데이터가 쌓이는지 반드시 확인하고 써야 한다.</p>\r\n<p>보강 — <strong>증권 자동매매 API.</strong> 한국투자증권·하나투자증권은 오픈 API가 잘 돼 있어, <strong>API 키만 발급받으면(이 발급 과정이 제일 번거롭다) 조회는 물론 매수·매도까지 코드로 가능</strong>. 강사는 100만 원 넣고 자동매매를 돌려 약 3만 원 수익을 봤다는 일화. 취미·학습용으로 권함.</p>\r\n<p>★ 강사의 마무리 한 줄: <strong>\"요즘은 내가 필요한 걸 내가 만들어 쓰는 게 최고다.\"</strong> 일상/업무에서 겪는 작은 문제를 직접 짜서 풀어보는 것 — 그게 이 회차 전체의 결론이다.</p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"부록 — 한눈에 보는 도구 맵\" id=\"_3\">부록 — 한눈에 보는 도구 맵</h1>\r\n<div class=\"tablescroll\"><table>\r\n<thead>\r\n<tr>\r\n<th>분류</th>\r\n<th>도구</th>\r\n<th>한 줄</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>코딩 환경</td>\r\n<td>VS Code, opencode, OpenRouter</td>\r\n<td>IDE + 터미널 에이전트 + 모델 창구</td>\r\n</tr>\r\n<tr>\r\n<td>배포</td>\r\n<td>PyInstaller, Flask, GitHub Pages</td>\r\n<td>EXE 묶기 / 로컬 웹 / 무료 정적 호스팅</td>\r\n</tr>\r\n<tr>\r\n<td>트렌드</td>\r\n<td>AI 타임즈, RSS.app, 스레드(오픈AI 초이), Slack</td>\r\n<td>최신 소식 자동 수집 파이프라인</td>\r\n</tr>\r\n<tr>\r\n<td>검색</td>\r\n<td>Fuse.js, BM25, 레벤슈타인</td>\r\n<td>LLM 없는 룰 기반 퍼지 검색</td>\r\n</tr>\r\n<tr>\r\n<td>문서</td>\r\n<td>Claude in Excel, SVG 장표, Mermaid</td>\r\n<td>분석·PPT·다이어그램 자동화</td>\r\n</tr>\r\n<tr>\r\n<td>연동</td>\r\n<td>MCP / 커넥터, GPTs Actions, Open-Meteo, data.go.kr</td>\r\n<td>외부 도구·API를 챗봇에 붙이기</td>\r\n</tr>\r\n<tr>\r\n<td>구글</td>\r\n<td>Gemini, Gems, NotebookLM, Vids, Stitch→AI Studio, Flow, v0</td>\r\n<td>기획→개발→배포 생태계</td>\r\n</tr>\r\n<tr>\r\n<td>바이브 코딩</td>\r\n<td>Lovable(+Supabase), yfinance, 증권 API</td>\r\n<td>프롬프트로 실제 서비스 만들기</td>\r\n</tr>\r\n<tr>\r\n<td>SLM/보안</td>\r\n<td>Qwen·Gemma·EXAONE·Kanana·42dot, OpenAI Privacy Filter, Ollama</td>\r\n<td>로컬·폐쇄망 구동, 개인정보 마스킹</td>\r\n</tr>\r\n</tbody>\r\n</table></div>\r\n<h2 id=\"_4\">검색 보강 출처</h2>\r\n<ul>\r\n<li>opencode 설치·OpenRouter 연동: opencode.ai 공식 문서, OpenRouter \"opencode integration\" 가이드</li>\r\n<li>OpenAI Privacy Filter(='Owl/오프네일'): openai.com/index/introducing-openai-privacy-filter, Hugging Face <code>openai/privacy-filter</code></li>\r\n<li>구글 Stitch → AI Studio 워크플로우: developers.googleblog.com \"Introducing Stitch\", Stitch↔AI Studio 디자인-투-코드 가이드</li>\r\n</ul>\r\n  </main>\r\n</div>\r\n\r\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js\"><\/script>\r\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/powershell.min.js\"><\/script>\r\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/vbscript.min.js\"><\/script>\r\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js\"><\/script>\r\n<script>\r\n// 주제 헤더 raw 텍스트를 data-full로 옮겨 ::after 표시\r\ndocument.querySelectorAll('h1.modhead').forEach(function(h){\r\n  h.setAttribute('data-full', h.textContent);\r\n});\r\n\r\n// highlight.js\r\nif(window.hljs){\r\n  document.querySelectorAll('.codewrap pre code').forEach(function(b){\r\n    try{hljs.highlightElement(b);}catch(e){}\r\n  });\r\n}\r\n\r\n// mermaid\r\nif(window.mermaid){\r\n  mermaid.initialize({\r\n    startOnLoad:true, theme:'base',\r\n    htmlLabels:false,\r\n    themeVariables:{\r\n      fontFamily:'-apple-system,Pretendard,\"Malgun Gothic\",sans-serif',\r\n      fontSize:'13px',\r\n      primaryColor:'#e6f4f1', primaryBorderColor:'#127c71', primaryTextColor:'#0c5249',\r\n      lineColor:'#9aa0a8', secondaryColor:'#f4f1ea', tertiaryColor:'#fbf1e4',\r\n      clusterBkg:'#f6f6f0', clusterBorder:'#cfd3cb'\r\n    },\r\n    flowchart:{curve:'basis', useMaxWidth:true, htmlLabels:false},\r\n    sequence:{useMaxWidth:true}\r\n  });\r\n}\r\n\r\n// 복사 버튼\r\ndocument.querySelectorAll('.copybtn').forEach(function(btn){\r\n  btn.addEventListener('click', function(){\r\n    var code = btn.closest('.codewrap').querySelector('pre code');\r\n    var txt = code ? code.innerText : '';\r\n    navigator.clipboard.writeText(txt).then(function(){\r\n      btn.textContent='복사됨'; btn.classList.add('ok');\r\n      setTimeout(function(){btn.textContent='복사'; btn.classList.remove('ok');},1400);\r\n    });\r\n  });\r\n});\r\n\r\n// 스크롤 스파이\r\nvar links = Array.from(document.querySelectorAll('#nav a'));\r\nvar map = {};\r\nlinks.forEach(function(a){ map[a.getAttribute('href').slice(1)] = a; });\r\nvar heads = Array.from(document.querySelectorAll('.main h1[id], .main h2[id]'));\r\nvar spy = new IntersectionObserver(function(entries){\r\n  entries.forEach(function(en){\r\n    if(en.isIntersecting){\r\n      links.forEach(function(l){l.classList.remove('active');});\r\n      var act = map[en.target.id];\r\n      if(act){act.classList.add('active');\r\n        act.scrollIntoView({block:'nearest'});}\r\n    }\r\n  });\r\n}, {rootMargin:'-10% 0px -75% 0px', threshold:0});\r\nheads.forEach(function(h){spy.observe(h);});\r\n\r\n// 모바일 사이드바\r\nvar side=document.getElementById('side'), scrim=document.getElementById('scrim'),\r\n    mb=document.getElementById('menubtn');\r\nfunction toggle(open){side.classList.toggle('open',open);scrim.classList.toggle('show',open);}\r\nif(mb){mb.addEventListener('click',function(){toggle(!side.classList.contains('open'));});}\r\nif(scrim){scrim.addEventListener('click',function(){toggle(false);});}\r\nlinks.forEach(function(a){a.addEventListener('click',function(){if(window.innerWidth<=880)toggle(false);});});\r\n<\/script>\r\n</body>\r\n</html>\r\n","3":"<!DOCTYPE html>\r\n<html lang=\"ko\">\r\n<head>\r\n<meta charset=\"utf-8\">\r\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\r\n<title>3회차 — AI 서비스 워크플로우: 도구를 레고처럼 조합하기</title>\r\n<link rel=\"preconnect\" href=\"https://cdnjs.cloudflare.com\">\r\n<link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css\">\r\n<style>\r\n:root{\r\n  --bg:#fafaf6; --panel:#ffffff; --ink:#1b1e24; --ink-soft:#5a6069; --ink-faint:#8b919b;\r\n  --line:#e7e6df; --line-soft:#f0efe9;\r\n  --teal:#127c71; --teal-d:#0c5249; --teal-bg:#e6f4f1;\r\n  --amber:#b9722a; --amber-bg:#fbf1e4;\r\n  --red:#c0392b; --red-bg:#fbe9e7;\r\n  --code-bg:#f6f6f0;\r\n  --mono:ui-monospace,\"SF Mono\",\"Cascadia Code\",\"JetBrains Mono\",Consolas,monospace;\r\n  --sans:-apple-system,BlinkMacSystemFont,\"Pretendard\",\"Apple SD Gothic Neo\",\"Segoe UI\",\"Malgun Gothic\",sans-serif;\r\n  --rad:12px;\r\n}\r\n*{box-sizing:border-box}\r\nhtml{scroll-behavior:smooth}\r\n@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}\r\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);\r\n  font-size:16px;line-height:1.72;-webkit-font-smoothing:antialiased}\r\n\r\n/* layout */\r\n.shell{display:grid;grid-template-columns:300px minmax(0,1fr);max-width:1240px;margin:0 auto}\r\n.print-toc{display:none}\r\n.side{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;\r\n  padding:30px 22px 60px;border-right:1px solid var(--line)}\r\n.main{min-width:0;padding:46px 60px 120px;max-width:880px}\r\n\r\n/* sidebar */\r\n.brand{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;\r\n  color:var(--teal);margin-bottom:6px}\r\n.brand-t{font-weight:700;font-size:17px;line-height:1.35;margin:0 0 4px}\r\n.brand-s{font-size:12.5px;color:var(--ink-faint);margin:0 0 24px;line-height:1.5}\r\nnav a{display:block;text-decoration:none;color:var(--ink-soft);border-left:2px solid transparent;\r\n  padding:3px 0 3px 12px;font-size:13.5px;transition:color .15s,border-color .15s}\r\nnav a:hover{color:var(--ink)}\r\nnav a.nav-h1{margin-top:16px;font-weight:700;color:var(--ink);font-size:13px;\r\n  font-family:var(--mono);letter-spacing:.02em}\r\nnav a.nav-h2{font-size:13px}\r\nnav a.active{color:var(--teal-d);border-left-color:var(--teal);font-weight:600}\r\n\r\n/* headings */\r\nh1.modhead{font-size:13px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;\r\n  color:var(--teal);margin:72px 0 0;padding-top:28px;border-top:2px solid var(--ink);\r\n  font-weight:700}\r\nh1.modhead::after{content:attr(data-full);display:block;font-family:var(--sans);\r\n  font-size:30px;letter-spacing:-.01em;text-transform:none;color:var(--ink);\r\n  margin-top:8px;font-weight:750;line-height:1.2}\r\nh1.modhead{font-size:0} -add .callout-badge{background:var(--teal-d);color:#fff}\r\n\r\n/* topbar (mobile) */\r\n.topbar{display:none}\r\n\r\n@media (max-width:880px){\r\n  .shell{grid-template-columns:1fr}\r\n  .side{position:fixed;z-index:40;top:0;left:0;width:84%;max-width:320px;height:100vh;\r\n    background:var(--panel);transform:translateX(-105%);transition:transform .25s;\r\n    box-shadow:0 0 40px rgba(0,0,0,.18)}\r\n  .side.open{transform:translateX(0)}\r\n  .main{padding:70px 22px 90px}\r\n  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;\r\n    background:rgba(250,250,246,.92);backdrop-filter:blur(8px);\r\n    padding:12px 18px;border-bottom:1px solid var(--line)}\r\n  .menubtn{font-family:var(--mono);font-size:13px;border:1px solid var(--line);\r\n    background:#fff;padding:6px 12px;border-radius:8px;cursor:pointer}\r\n  .topbar .tt{font-family:var(--mono);font-size:12px;color:var(--teal);letter-spacing:.05em}\r\n  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}\r\n  .scrim.show{display:block}\r\n  h1.modhead::after{font-size:25px}\r\n  .hero h1{font-size:25px}\r\n  .main{max-width:100%}\r\n}\r\n\r\n/* ── 인쇄 / PDF 저장 (출력 시 목차 먼저 → 본문) ── */\r\n@media print{\r\n  @page{margin:14mm 12mm}\r\n  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}\r\n  .topbar,.scrim,.menubtn,.copybtn{display:none!important}\r\n  .shell{display:block;max-width:none}\r\n  /* 화면용 사이드바는 인쇄에서 완전히 숨김 (변환 불안정 → 빈 페이지 방지) */\r\n  .side{display:none!important}\r\n  /* 인쇄 전용 목차: 본문 맨 앞 일반 블록으로 깔끔히 출력 후 페이지 넘김 */\r\n  .print-toc{display:block!important;break-after:page;page-break-after:always}\r\n  .print-toc .ptoc-title{font-size:19pt;font-weight:800;color:#0c5249;letter-spacing:-.01em;\r\n    margin:0 0 16px;padding-bottom:10px;border-bottom:2px solid #127c71}\r\n  .print-toc a{display:block;color:#1b1e24;text-decoration:none;padding:3px 0;font-size:11.5pt;border:none}\r\n  .print-toc a.nav-h1{margin-top:13px;font-weight:700;color:#0c5249;font-size:12.5pt}\r\n  .print-toc a.nav-h2{padding-left:16px;color:#3a3f47}\r\n  /* 본문 */\r\n  .main{padding:0;max-width:none}\r\n  body{font-size:10.5pt;line-height:1.5;background:#fff}\r\n  a{text-decoration:none;color:inherit}\r\n  .hero{break-inside:avoid;background:#fff!important;color:#1b1e24!important;\r\n    border:none;border-bottom:2px solid #127c71;border-radius:0;\r\n    padding:0 0 14px!important;margin:0 0 18px}\r\n  .hero .eyebrow{color:#127c71!important}\r\n  .hero h1{color:#0c5249!important}\r\n  .hero p{color:#444!important}\r\n  /* 주제 헤더가 페이지 맨 아래 외롭게 걸리지 않게만 (새 페이지 강제는 빼서 빈 페이지 방지) */\r\n  h1.modhead{break-after:avoid;page-break-after:avoid}\r\n  h2,h3{break-after:avoid;page-break-after:avoid}\r\n  /* 코드·콜아웃·표·다이어그램은 페이지 중간에서 잘리지 않게 */\r\n  .codewrap,.callout,pre.mermaid,.tablescroll,table{break-inside:avoid;page-break-inside:avoid}\r\n  pre code,pre.hljs{white-space:pre-wrap;word-break:break-word}\r\n  pre.mermaid{text-align:center;border:1px solid #ddd;padding:12px 8px;margin:14px auto}\r\n  pre.mermaid svg{max-width:100%!important;height:auto!important;\r\n    max-height:200mm!important;display:inline-block!important}\r\n  .codewrap{border-color:#ccc}\r\n}\r\n</style>\r\n</head>\r\n<body>\r\n<div class=\"topbar\">\r\n  <button class=\"menubtn\" id=\"menubtn\" aria-label=\"목차 열기\">☰ 목차</button>\r\n  <span class=\"tt\">강의노트 · 보강판</span>\r\n</div>\r\n<div class=\"scrim\" id=\"scrim\"></div>\r\n<div class=\"shell\">\r\n  <aside class=\"side\" id=\"side\">\r\n    <div class=\"brand\">강의노트 · 03회차</div>\r\n    <p class=\"brand-t\">3회차 — AI 서비스 워크플로우: 도구를 레고처럼 조합하기</p>\r\n    <p class=\"brand-s\">현장 강의 · 기술 보강판</p>\r\n    <nav id=\"nav\">\r\n<a class=\"nav-h1\" href=\"#_1\">들어가며 — 레고 블록 오케스트레이션</a>\r\n<a class=\"nav-h1\" href=\"#1\">1부 · 메타 프롬프트 — 프롬프트를 만드는 프롬프트</a>\r\n<a class=\"nav-h2\" href=\"#_2\">메타 프롬프트의 구조: 상황(업무·제약·목표)</a>\r\n<a class=\"nav-h2\" href=\"#pre-mortem-ai\">프리모텀(Pre-mortem) — AI의 &#x27;아첨&#x27;을 깨는 질문법</a>\r\n<a class=\"nav-h2\" href=\"#ai\">스텝 바이 스텝 — AI에 끌려가지 말고 리드하기</a>\r\n<a class=\"nav-h2\" href=\"#qa-ai\">Q&amp;amp;A 프롬프트 — AI가 먼저 객관식으로 물어보게</a>\r\n<a class=\"nav-h1\" href=\"#2-text-to-sql\">2부 · 데이터베이스와 Text-to-SQL (핵심 실습)</a>\r\n<a class=\"nav-h2\" href=\"#_3\">왜 데이터베이스인가 — 파이썬만으로 안 되는 이유</a>\r\n<a class=\"nav-h2\" href=\"#_4\">전체 워크플로우 한눈에</a>\r\n<a class=\"nav-h2\" href=\"#1-vba-csv\">1단계 · VBA로 CSV 메타데이터 모으기</a>\r\n<a class=\"nav-h2\" href=\"#2\">2단계 · 데이터 전처리 — 데이터가 거짓말할 때</a>\r\n<a class=\"nav-h2\" href=\"#3-sqlite-db-browser\">3단계 · SQLite + DB Browser 설치</a>\r\n<a class=\"nav-h2\" href=\"#4-db-csv\">4단계 · DB 만들고 CSV 임포트</a>\r\n<a class=\"nav-h2\" href=\"#5-ddl-text-to-sql\">5단계 · 테이블 정의서(DDL) → Text-to-SQL</a>\r\n<a class=\"nav-h2\" href=\"#6-sql\">6단계 · 윈도우 함수 — SQL 분석의 진짜 무기</a>\r\n<a class=\"nav-h2\" href=\"#7-sqlite\">7단계 · 주피터 노트북에서 SQLite 연결</a>\r\n<a class=\"nav-h2\" href=\"#_5\">보강 · 데이터베이스가 빠른 이유 — 메모리 계층과 캐싱</a>\r\n<a class=\"nav-h1\" href=\"#3-notebooklm\">3부 · 콘텐츠 제작 워크플로우 — NotebookLM 레고</a>\r\n<a class=\"nav-h2\" href=\"#notebooklm\">NotebookLM으로 카드뉴스·영상 기획</a>\r\n<a class=\"nav-h2\" href=\"#codia-ai-notebooklm-ppt\">Codia AI — NotebookLM 슬라이드를 &#x27;편집 가능한 PPT&#x27;로</a>\r\n<a class=\"nav-h1\" href=\"#4-geoseo-ai\">4부 · GEO/SEO — AI 시대의 검색 최적화</a>\r\n<a class=\"nav-h2\" href=\"#geo\">GEO란 — 검색 패러다임의 전환</a>\r\n<a class=\"nav-h2\" href=\"#lovable\">실습 · 기관 사이트 진단 → Lovable로 개선</a>\r\n<a class=\"nav-h1\" href=\"#5\">5부 · 콜센터 녹취 분석 — 음성 워크플로우</a>\r\n<a class=\"nav-h2\" href=\"#_6\">워크플로우 설계 (레고 블록)</a>\r\n<a class=\"nav-h2\" href=\"#_7\">실제 코드 골격</a>\r\n<a class=\"nav-h1\" href=\"#_8\">마무리 &amp;amp; 과제</a>\r\n<a class=\"nav-h1\" href=\"#_9\">부록 — 용어 사전 · 출처</a>\r\n<a class=\"nav-h2\" href=\"#_10\">용어 빠른 사전</a>\r\n<a class=\"nav-h2\" href=\"#_11\">검색으로 확인·보강한 출처</a>\r\n    </nav>\r\n  </aside>\r\n  <main class=\"main\" id=\"main\">\r\n<nav class=\"print-toc\">\r\n<div class=\"ptoc-title\">목차</div>\r\n<a class=\"nav-h1\" href=\"#_1\">들어가며 — 레고 블록 오케스트레이션</a>\r\n<a class=\"nav-h1\" href=\"#1\">1부 · 메타 프롬프트 — 프롬프트를 만드는 프롬프트</a>\r\n<a class=\"nav-h2\" href=\"#_2\">메타 프롬프트의 구조: 상황(업무·제약·목표)</a>\r\n<a class=\"nav-h2\" href=\"#pre-mortem-ai\">프리모텀(Pre-mortem) — AI의 &#x27;아첨&#x27;을 깨는 질문법</a>\r\n<a class=\"nav-h2\" href=\"#ai\">스텝 바이 스텝 — AI에 끌려가지 말고 리드하기</a>\r\n<a class=\"nav-h2\" href=\"#qa-ai\">Q&amp;amp;A 프롬프트 — AI가 먼저 객관식으로 물어보게</a>\r\n<a class=\"nav-h1\" href=\"#2-text-to-sql\">2부 · 데이터베이스와 Text-to-SQL (핵심 실습)</a>\r\n<a class=\"nav-h2\" href=\"#_3\">왜 데이터베이스인가 — 파이썬만으로 안 되는 이유</a>\r\n<a class=\"nav-h2\" href=\"#_4\">전체 워크플로우 한눈에</a>\r\n<a class=\"nav-h2\" href=\"#1-vba-csv\">1단계 · VBA로 CSV 메타데이터 모으기</a>\r\n<a class=\"nav-h2\" href=\"#2\">2단계 · 데이터 전처리 — 데이터가 거짓말할 때</a>\r\n<a class=\"nav-h2\" href=\"#3-sqlite-db-browser\">3단계 · SQLite + DB Browser 설치</a>\r\n<a class=\"nav-h2\" href=\"#4-db-csv\">4단계 · DB 만들고 CSV 임포트</a>\r\n<a class=\"nav-h2\" href=\"#5-ddl-text-to-sql\">5단계 · 테이블 정의서(DDL) → Text-to-SQL</a>\r\n<a class=\"nav-h2\" href=\"#6-sql\">6단계 · 윈도우 함수 — SQL 분석의 진짜 무기</a>\r\n<a class=\"nav-h2\" href=\"#7-sqlite\">7단계 · 주피터 노트북에서 SQLite 연결</a>\r\n<a class=\"nav-h2\" href=\"#_5\">보강 · 데이터베이스가 빠른 이유 — 메모리 계층과 캐싱</a>\r\n<a class=\"nav-h1\" href=\"#3-notebooklm\">3부 · 콘텐츠 제작 워크플로우 — NotebookLM 레고</a>\r\n<a class=\"nav-h2\" href=\"#notebooklm\">NotebookLM으로 카드뉴스·영상 기획</a>\r\n<a class=\"nav-h2\" href=\"#codia-ai-notebooklm-ppt\">Codia AI — NotebookLM 슬라이드를 &#x27;편집 가능한 PPT&#x27;로</a>\r\n<a class=\"nav-h1\" href=\"#4-geoseo-ai\">4부 · GEO/SEO — AI 시대의 검색 최적화</a>\r\n<a class=\"nav-h2\" href=\"#geo\">GEO란 — 검색 패러다임의 전환</a>\r\n<a class=\"nav-h2\" href=\"#lovable\">실습 · 기관 사이트 진단 → Lovable로 개선</a>\r\n<a class=\"nav-h1\" href=\"#5\">5부 · 콜센터 녹취 분석 — 음성 워크플로우</a>\r\n<a class=\"nav-h2\" href=\"#_6\">워크플로우 설계 (레고 블록)</a>\r\n<a class=\"nav-h2\" href=\"#_7\">실제 코드 골격</a>\r\n<a class=\"nav-h1\" href=\"#_8\">마무리 &amp;amp; 과제</a>\r\n<a class=\"nav-h1\" href=\"#_9\">부록 — 용어 사전 · 출처</a>\r\n<a class=\"nav-h2\" href=\"#_10\">용어 빠른 사전</a>\r\n<a class=\"nav-h2\" href=\"#_11\">검색으로 확인·보강한 출처</a>\r\n</nav>\r\n    <div class=\"hero\">\r\n      <div class=\"eyebrow\">Lecture Note · 기술 보강판</div>\r\n      <h1>3회차 — AI 서비스 워크플로우: 도구를 레고처럼 조합하기</h1>\r\n      <p>현장 강의를 기술적으로 보강한 학습 레퍼런스 — 강사의 의도는 살리고, 빠지거나 틀린 기술은 정확히 채웠습니다.</p>\r\n    </div>\r\n\r\n<p>이 강의 하나로 무엇을 할 수 있게 하려는가 →\r\n<strong>\"메타 프롬프트부터 데이터베이스·콘텐츠·검색·음성까지, 흩어진 AI 도구들을 '레고 블록'처럼 조합(오케스트레이션)해 실제 업무 워크플로우를 직접 짜는 것. 문법(how)은 AI가 해주니, 나는 '무엇을 왜(why·what)' 풀지에 집중한다.\"</strong></p>\r\n<blockquote class=\"callout callout-key\"><span class=\"callout-badge\">핵심</span>\r\n<p>★ 이번 회차는 신성진 강사의 7시간 실습 집약 세션이다(원래 제목 \"메타 프롬프트 설계와 AI 서비스 워크플로우, 오케스트레이션\"). 다섯 덩어리 — ① 메타 프롬프트 ② 데이터베이스·Text-to-SQL(가장 큰 실습) ③ NotebookLM 콘텐츠 제작 ④ GEO/SEO 진단 ⑤ 콜센터 녹취 분석 — 가 \"레고 블록 조합\"이라는 한 줄 태도로 꿰인다.</p>\r\n<p><strong>보강 안내</strong> — 강사가 화면으로 빠르게 지나간 설치·코드·SQL을 초보자가 따라 할 수 있게 <strong>실제 동작하는 명령어/코드로 채웠다.</strong> 불확실한 사실(프리모텀 근거·LLM 에스컬레이션 연구·GEO·아나콘다 라이선스)은 검색으로 확인해 <code>(검색 보강)</code>으로 표시하고 출처는 부록에. 운영성 멘트(점심·식당·버스·숙박·기차표·을지훈련 일정 등)는 노트에서 뺐고, 학습에 도움 되는 비유·일화·청중 질문은 살렸다.</p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"들어가며 — 레고 블록 오케스트레이션\" id=\"_1\">들어가며 — 레고 블록 오케스트레이션</h1>\r\n<p>강의 전체를 관통하는 한 가지 그림. 세상에 AI 도구가 2만 8천 개가 넘는데, 이걸 <strong>난이도순으로 하나씩 정복</strong>하려 들지 말고 <strong>조합 가능한 부품</strong>으로 모으라는 것.</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">code</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre class=\"mermaid\">flowchart LR\r\n  W[\"내가 풀 문제&lt;br/&gt;(why·what)\"] --&gt; O[\"도구 조합 설계&lt;br/&gt;(오케스트레이션)\"]\r\n  O --&gt; A[\"메타 프롬프트\"]\r\n  O --&gt; B[\"DB · SQL\"]\r\n  O --&gt; C[\"NotebookLM · Codia\"]\r\n  O --&gt; D[\"GEO/SEO · Lovable\"]\r\n  O --&gt; E[\"Whisper · Ollama\"]\r\n</pre></div>\r\n<blockquote class=\"callout callout-key\"><span class=\"callout-badge\">핵심</span>\r\n<p>★ 강사가 반복한 핵심: <strong>how(SQL 문법, 파이썬 코드)는 이제 AI가 다 해준다.</strong> 우리에게 남는 건 \"무엇을, 왜 분석·해결할 것인가\"라는 판단과, 도구를 엮어 워크플로우를 만드는 감각이다. 1회차의 <em>\"지식보다 태도\"</em>, <em>\"레고 블록\"</em> 메시지를 실습으로 옮긴 회차다.</p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"1부 · 메타 프롬프트 — 프롬프트를 만드는 프롬프트\" id=\"1\">1부 · 메타 프롬프트 — 프롬프트를 만드는 프롬프트</h1>\r\n<p><strong>메타 프롬프트(meta prompt)</strong> = 프롬프트를 위한 프롬프트. 내가 직접 좋은 프롬프트를 쓰는 게 아니라, <em>\"내 업무는 이렇고 목표·제약은 이러니, 이걸 잘 처리하는 프롬프트를 만들어줘\"</em> 라고 시켜서 <strong>프롬프트 자체를 산출물로 받는</strong> 기법.</p>\r\n<h2 id=\"_2\">메타 프롬프트의 구조: 상황(업무·제약·목표)</h2>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">code</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre class=\"mermaid\">flowchart LR\r\n  S[\"상황 기술&lt;br/&gt;업무 · 목표 · 제약\"] --&gt; R[\"'이걸 처리하는&lt;br/&gt;프롬프트를 만들어줘'\"]\r\n  R --&gt; P[\"완성된 프롬프트&lt;br/&gt;(few-shot·CoT 형태)\"]\r\n  P --&gt; T[\"튜닝 후 공유 뱅크&lt;br/&gt;(MD 파일 업로드)\"]\r\n</pre></div>\r\n<p>실습(워밍업)은 이랬다 — 내 업무로 메타 프롬프트를 만들고, <strong>모델 두 개(예: ChatGPT ↔ Claude/Gemini/Copilot)에 같은 요청을 넣어 교차 비교</strong>한 뒤, 더 나은 쪽을 골라 공유 폴더에 올려 <em>프롬프트 뱅크</em>를 쌓는 것.</p>\r\n<p>강사 예시:</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">text</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre><code class=\"language-text\">나는 ○○구 교통정책과 주무관이고, 버스 노선 민원에 답변한다.\r\n[목표] 공문 형식의 민원 답변 1건\r\n[제약] 법령을 반드시 인용 / 추측·가정 금지 / 500자 이내\r\n이 업무를 처리하는 '시스템 프롬프트'를 만들어줘. (민원 내용을 넣으면 답변이 나오도록)\r\n</code></pre></div>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p><strong>보강 — 같이 나온 용어 한 줄씩.</strong> <em>퓨샷(few-shot)</em> = 예시 몇 개를 같이 줘서 형식을 따라 하게 하는 것. <em>체인 오브 소트(Chain of Thought, CoT)</em> = \"단계적으로 생각해줘\"처럼 추론 과정을 펼치게 하는 것. 메타 프롬프트가 만들어주는 결과가 보통 이 형태로 나온다.</p>\r\n</blockquote>\r\n<h2 id=\"pre-mortem-ai\">프리모텀(Pre-mortem) — AI의 '아첨'을 깨는 질문법</h2>\r\n<p>강사가 가장 공들여 소개한 기법. ChatGPT·Gemini 같은 모델은 <strong>아첨(sycophancy)</strong> 경향이 있어 미래 계획을 물으면 장밋빛 답만 준다. 사람 뇌도 계획할 땐 전두엽이 희망 위주로 돌아 나쁜 시나리오를 잘 안 떠올린다.</p>\r\n<blockquote class=\"callout callout-warn\"><span class=\"callout-badge\">주의</span>\r\n<p>★ <strong>핵심 — 실패를 '이미 일어난 일'로 가정하라.</strong> \"이 축제 6개월 뒤 어떻게 될까?\"(미래형) 대신 <strong>\"이 축제를 열었는데 6개월 뒤 아무도 안 왔어. 그 이유는?\"</strong>(과거형)으로 물으면, AI가 약점(홍보 차별화 실패, 클라우드 비용 과다, 로그인 이탈 등)을 날카롭게 짚어낸다.</p>\r\n<p><strong>보강 (검색 보강) — 근거가 있는 기법이다.</strong> 프리모텀은 게리 클라인(Gary Klein)이 <em>Harvard Business Review</em> 2007년 9월호 \"Performing a Project Premortem\"에서 제시했다. 바탕 원리는 <strong>사전 부검적 통찰(prospective hindsight)</strong> — Mitchell·Russo·Pennington의 1989년 연구에서 \"이미 일어났다\"고 가정하면 원인을 정확히 짚는 능력이 <strong>약 30% 향상</strong>된다고 나왔다. 과신·집단사고를 깨는 효과도 있다.</p>\r\n<p>⚠ <strong>주의 — LLM의 호전성·아첨은 실제 위험이다.</strong> 강사가 든 \"10개 모델 중 9개가 '핵 버튼 눌러라'고 답했다\"는 일화는 과장이 아니다. 2024년 코넬 등 연구 <em>\"Escalation Risks from Language Models…\"</em> 에서 5개 LLM이 모의 워게임에서 갈등을 키웠고 GPT-4-Base는 평균 <strong>33%</strong> 확률로 핵공격을 실행했다(검색 보강). AI의 답을 그대로 믿지 말고 프리모텀처럼 <strong>반대로 캐묻는</strong> 습관이 필요하다.</p>\r\n</blockquote>\r\n<h2 id=\"ai\">스텝 바이 스텝 — AI에 끌려가지 말고 리드하기</h2>\r\n<p>모델을 고급(띵킹) 모드로 올리면 한 번에 봇물 터지듯 쏟아내서 리뷰를 못 하게 된다. 그래서 프롬프트에 <em>\"한 번에 다 쏟지 말고 단계별로 작성하고, 내가 OK 하면 다음으로\"</em> 를 넣는다.</p>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p><strong>보강 — 주피터 노트북에서 특히 유용.</strong> 셀 단위로 코드를 받아 한 셀 실행 → 확인 → 다음 셀. 뒤(2부)에서 SQLite 연결 코드를 이렇게 셀 단위로 받는다. \"GPT한테 끌려가지 말고 내가 리드한다\"가 이 회차의 작업 습관.</p>\r\n</blockquote>\r\n<h2 id=\"qa-ai\">Q&amp;A 프롬프트 — AI가 먼저 객관식으로 물어보게</h2>\r\n<p>이미지 생성처럼 <em>무엇을 넣어야 잘 나오는지 내가 모를 때</em> 쓰는 기법. \"원샷\"으로 던지지 말고 AI와 주고받는다.</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">text</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre><code class=\"language-text\">강의용 커버 이미지를 만들 건데 어떤 요소가 필요한지 잘 몰라.\r\n이미지를 잘 만드는 데 필요한 핵심 요소 5개를 '객관식'으로 나에게 하나씩 물어봐.\r\n내가 고르면 그 선택을 종합해 '이미지 생성 프롬프트'를 만들어줘.\r\n</code></pre></div>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p><strong>보강 — 1회차 '메타 프롬프트'와 같은 뿌리.</strong> 1회차에서 본 \"AI가 객관식으로 먼저 질문하게 하기\"의 실전 버전이다. 이미지/영상 프롬프트는 모델이 영어로 뱉는 경우가 많은데(이미지 모델이 영어로 더 학습됨), 그대로 쓰면 더 잘 나온다.</p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"2부 · 데이터베이스와 Text-to-SQL (핵심 실습)\" id=\"2-text-to-sql\">2부 · 데이터베이스와 Text-to-SQL (핵심 실습)</h1>\r\n<p>이번 회차의 절반. \"AI 시대에 DB가 왜 필요해?\"에서 출발해, <strong>CSV → 정제 → SQLite → AI로 SQL 생성 → 파이썬 분석</strong>까지 한 줄로 꿴다.</p>\r\n<h2 id=\"_3\">왜 데이터베이스인가 — 파이썬만으로 안 되는 이유</h2>\r\n<p>신입들이 자주 묻는다. \"그냥 파이썬으로 다 불러오면 되지 왜 DB를 써요?\" 강사의 답:</p>\r\n<div class=\"tablescroll\"><table>\r\n<thead>\r\n<tr>\r\n<th>관점</th>\r\n<th>파이썬(판다스)만</th>\r\n<th>데이터베이스(SQLite 등)</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>메모리</td>\r\n<td><code>read_csv</code>로 전부 메모리에 적재 → 큰 데이터면 <strong>Out of Memory</strong></td>\r\n<td>엔진이 메모리를 제어, 디스크로 스왑해서라도 결과를 냄</td>\r\n</tr>\r\n<tr>\r\n<td>신뢰성</td>\r\n<td>휘발성(메모리 기반)</td>\r\n<td>트랜잭션·무결성 보장 (은행 잔고가 OOM나면 안 되니까)</td>\r\n</tr>\r\n<tr>\r\n<td>용량</td>\r\n<td>PC 성능에 종속</td>\r\n<td>디스크 크기만큼, 사실상 무제한</td>\r\n</tr>\r\n<tr>\r\n<td>전처리</td>\r\n<td>레코드 커지면 느려짐</td>\r\n<td>옵티마이저로 필터·조인을 최적화</td>\r\n</tr>\r\n<tr>\r\n<td>재현성</td>\r\n<td>코드/환경 따라 달라질 수 있음</td>\r\n<td>같은 SQL → 같은 결과</td>\r\n</tr>\r\n</tbody>\r\n</table></div>\r\n<blockquote class=\"callout callout-key\"><span class=\"callout-badge\">핵심</span>\r\n<p>★ <strong>핵심 기준 — 107만 행.</strong> 엑셀이 보여줄 수 있는 최대 행은 1,048,576행(약 107만). 그 이상을 다룰 거라면 <strong>무조건 DB에 넣으라</strong>는 게 강사의 단언. 100만 건을 일일이 눈으로 볼 일은 없고, 결국 <em>필터링·통계·집계</em>만 쓰는데 그건 DB가 압도적으로 빠르고 가볍다.</p>\r\n<p><strong>보강 — DB 기술은 결국 두 가지: 잘 저장 + 잘 조회.</strong>\r\n- <em>옷장 비유</em>: 옷은 잘 넣었는데(저장) \"어느 서랍에 뒀더라\"가 안 떠오르면(조회 실패) 소용없다. 인감도장을 \"잘 뒀는데 어디 뒀지…\" 하며 한참 찾는 게 딱 그 경우.\r\n- <em>도서관 비유</em>: 제목을 알면 가나다순(=인덱스)으로 금방 찾지만, 제목을 모르면 처음부터 끝까지 다 봐야 한다(=풀 스캔). <strong>인덱스(Index)</strong> 는 원하는 값을 빨리 찾기 위한 저장 기술이다.</p>\r\n</blockquote>\r\n<h2 id=\"_4\">전체 워크플로우 한눈에</h2>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">code</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre class=\"mermaid\">flowchart LR\r\n  CSV[\"공공 CSV 여러 개\"] --&gt; VBA[\"① VBA로&lt;br/&gt;메타데이터 점검\"]\r\n  VBA --&gt; FIX[\"② 전처리&lt;br/&gt;(단위·컬럼명 통일)\"]\r\n  FIX --&gt; IMP[\"③ SQLite 임포트\"]\r\n  IMP --&gt; DDL[\"④ 테이블 정의서(DDL)\"]\r\n  DDL --&gt; T2S[\"⑤ GPT Text-to-SQL\"]\r\n  T2S --&gt; RUN[\"⑥ DB Browser 실행\"]\r\n  RUN --&gt; PY[\"⑦ 주피터 read_sql → df\"]\r\n</pre></div>\r\n<h2 id=\"1-vba-csv\">1단계 · VBA로 CSV 메타데이터 모으기</h2>\r\n<p>연도별로 쪼개진 CSV가 6개(혹은 300개)일 때, <strong>각 파일의 헤더 + 데이터 5행만 모아 한 엑셀로</strong> 만들어 한눈에 비교한다(= 분석 전 \"내 데이터가 어떻게 생겼나\"를 아는 메타인지).</p>\r\n<p>강사가 GPT에 넣은 프롬프트:</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">text</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre><code class=\"language-text\">특정 폴더의 모든 CSV를 읽어서, 첫 행은 컬럼 이름으로 하고,\r\n각 CSV의 1~6행 데이터를 새 metadata.xlsx 파일의 '파일별 시트'로 저장하는 VBA를 작성해줘.\r\n</code></pre></div>\r\n<p>실행 방법(엑셀): <strong>Alt+F11</strong>(VBA 편집기) → 왼쪽에서 마우스 오른쪽 → <strong>삽입 → 모듈</strong> → 코드 붙여넣기 → <strong>F5(실행)</strong>.\r\n- 맥: <strong>Fn + Option + F11</strong>, 또는 메뉴 <em>도구 → 매크로 → Visual Basic Editor</em>.</p>\r\n<p>GPT가 만들어 줄 VBA는 대략 이런 모양이다(동작 확인용, 단순 CSV 기준):</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">VBA</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre><code class=\"language-vbscript\">Sub CSV메타데이터_모으기()\r\n    Dim folder As String, f As String\r\n    Dim wbOut As Workbook, ws As Worksheet\r\n    Dim fso As Object, ts As Object\r\n    Dim i As Long, j As Long, cols() As String\r\n\r\n    With Application.FileDialog(msoFileDialogFolderPicker)\r\n        If .Show &lt;&gt; -1 Then Exit Sub\r\n        folder = .SelectedItems(1)\r\n    End With\r\n\r\n    Set wbOut = Workbooks.Add\r\n    Set fso = CreateObject(\"Scripting.FileSystemObject\")\r\n\r\n    f = Dir(folder &amp; \"\\*.csv\")\r\n    Do While f &lt;&gt; \"\"\r\n        Set ws = wbOut.Sheets.Add\r\n        ws.Name = Left(fso.GetBaseName(f), 31)          ' 시트명 31자 제한\r\n        Set ts = fso.OpenTextFile(folder &amp; \"\\\" &amp; f, 1, False, -2)  ' -2: 시스템 기본 인코딩\r\n        i = 1\r\n        Do While Not ts.AtEndOfStream And i &lt;= 6        ' 헤더 + 5행\r\n            cols = Split(ts.ReadLine, \",\")\r\n            For j = 0 To UBound(cols)\r\n                ws.Cells(i, j + 1).Value = cols(j)\r\n            Next j\r\n            i = i + 1\r\n        Loop\r\n        ts.Close\r\n        f = Dir\r\n    Loop\r\n    MsgBox \"완료: \" &amp; (wbOut.Sheets.Count - 1) &amp; \"개 CSV 처리\"\r\nEnd Sub\r\n</code></pre></div>\r\n<blockquote class=\"callout callout-warn\"><span class=\"callout-badge\">주의</span>\r\n<p>⚠ <strong>주의 · 함정 세 가지.</strong> ① 오류가 나면 <strong>팝업을 캡처해 GPT에 그대로 물어보면</strong> 거의 해결된다(이게 표준 디버깅 루프). ② 실행 전 특정 시트를 선택해야 충돌이 안 나는 경우가 있다. ③ <strong>인코딩</strong> — 한글 CSV가 UTF-8이면 위 코드에서 깨질 수 있다(이 경우 메모장에서 ANSI로 저장하거나 <code>ADODB.Stream</code>으로 읽게 프롬프트). 따옴표 안에 콤마가 있는 CSV도 단순 <code>Split</code>은 깨진다.</p>\r\n<p><strong>보강 — 왜 VBA인가(광안대교 일화).</strong> 2000년대엔 수천억대 공사 내역서를 엑셀 매크로로 다루는 사람이 그룹사에 몇 명뿐인 '도사'였다. 지금은 그 VBA를 <strong>AI가 써준다.</strong> 엑셀은 모든 PC에 깔려 있어, 직원 PC에 파이썬을 못 깔아도 <strong>VBA만으로 업무 자동화</strong>가 된다 — 엑셀뿐 아니라 PPT·워드도 같은 방식(COM)으로 제어 가능. (2회차 '범피스'의 COM 자동화와 같은 원리.)</p>\r\n</blockquote>\r\n<h2 id=\"2\">2단계 · 데이터 전처리 — 데이터가 거짓말할 때</h2>\r\n<p>메타데이터를 보면 공공 데이터의 함정이 드러난다. 강사가 심은 오류:\r\n- <strong>단위 불일치</strong>: 어떤 해는 천원, 어떤 해는 만원 단위 → 그래프에 갑자기 '절벽'(10배 차이).\r\n- <strong>컬럼명 불일치</strong>: <code>연도</code> vs <code>조사연도</code>(심지어 <code>조사 연도</code> 띄어쓰기) → 파이썬에서 서로 다른 컬럼으로 인식 → 널(빈)값 발생.\r\n- <strong>시군명/코드 불일치</strong> → 시군 코드로 매핑 필요.</p>\r\n<blockquote class=\"callout callout-warn\"><span class=\"callout-badge\">주의</span>\r\n<p>⚠ <strong>주의 — 원천(CSV)에서 고쳐라.</strong> SQL 임포트에는 \"이 컬럼에 1000을 곱해라\" 같은 옵션이 없다. 매번 프롬프트로 제어하느니 <strong>원본 데이터에서 컬럼명을 통일하고 단위를 맞추는 게</strong> 깔끔하다. 사람은 \"연도=조사연도\"인 걸 알지만 기계는 모른다 — <strong>철자·띄어쓰기까지 정확히</strong> 맞춰야 한다.</p>\r\n<p><strong>보강 — 히라(HIRA, 건강보험심사평가원) 데이터 일화.</strong> 학생 과제에 단골인 심평원 데이터는 2019년경 갑자기 컬럼 구성이 바뀌어(담당자 교체·항목 추가) 그래프가 뚝 끊긴다. \"왜 절벽이 생기지?\"의 원인이 대개 이런 <strong>컬럼 변동</strong>이다. 분석 전에 반드시 데이터부터 열어봐야 하는 이유.</p>\r\n</blockquote>\r\n<h2 id=\"3-sqlite-db-browser\">3단계 · SQLite + DB Browser 설치</h2>\r\n<p><strong>SQLite</strong> = 파일 하나로 끝나는 초경량 DB(원격 접속 자체가 없어 보안 부담이 적다). 설치랄 게 없다:</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">text</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre><code class=\"language-text\">1) sqlite.org → Download → \"SQLite Tools Win x64\" zip 받기\r\n2) 압축 풀어 나온 파일들을 C:\\SQLite 폴더에 복사 (인스톨러 없음, 이게 끝)\r\n</code></pre></div>\r\n<p>까만 커맨드 창이 불편하면 그래픽 도구를 깐다:</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">text</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre><code class=\"language-text\">DB Browser for SQLite → 다운로드 → (윈도우 64bit standard installer) → 다음 다음 설치\r\n</code></pre></div>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p><strong>보강 — SQLite는 '연습용'이 아니라 '입문용'.</strong> 여기서 익힌 개념은 PostgreSQL·SQL Server·Oracle에 그대로 통한다. 과제·실서비스로 가면 PostgreSQL 등을 쓰면 된다(구조가 유사). SQLite는 지금 메모리/파일 기반이라 가장 단순할 뿐.</p>\r\n</blockquote>\r\n<h2 id=\"4-db-csv\">4단계 · DB 만들고 CSV 임포트</h2>\r\n<p>DB Browser에서: <strong>새 데이터베이스</strong>(예: <code>GRP.db</code>) 생성 → 첫 테이블 만들기 창은 <em>취소</em> → <strong>파일 → 가져오기 → CSV 파일에서 테이블 가져오기</strong> → CSV 하나씩 임포트(6개 = 6개 테이블). DB는 <code>GRP.db</code> 파일 하나로 떨어져, 다른 PC로 <strong>그 파일만 복사</strong>하면 그대로 쓸 수 있다.</p>\r\n<blockquote class=\"callout callout-warn\"><span class=\"callout-badge\">주의</span>\r\n<p>⚠ <strong>주의 — \"필드명 포함\" 체크.</strong> 임포트 창에서 이 옵션을 안 켜면 <strong>첫 행(시군 등 컬럼명)이 데이터(레코드)로 들어가</strong> 버린다. 켜고/끄고 미리보기가 어떻게 바뀌는지 보고 임포트할 것. (DB = 방, 그 안의 대표 오브젝트 = 테이블.)</p>\r\n</blockquote>\r\n<h2 id=\"5-ddl-text-to-sql\">5단계 · 테이블 정의서(DDL) → Text-to-SQL</h2>\r\n<p>GPT가 SQL을 만들려면 <strong>테이블 구조</strong>를 알아야 한다. DB Browser에서 테이블 우클릭 → <strong>생성 구문 복사하기</strong>(= DDL, <code>CREATE TABLE …</code>) → 메모장에 모아 GPT에 준다.</p>\r\n<blockquote class=\"callout callout-key\"><span class=\"callout-badge\">핵심</span>\r\n<p>★ <strong>핵심 — \"SQLite에서 수행될\"을 명시하라.</strong> 엔진(SQLite/PostgreSQL/MSSQL/Oracle)마다 함수·문법이 달라서, 프롬프트에 어떤 엔진인지 못 박아야 맞는 SQL이 나온다. 이 'DDL + 질문'을 GPTs로 만들어 두면, 이후엔 질문만 하면 되는 전용 도우미가 된다.</p>\r\n</blockquote>\r\n<p>이제 SQL을 모르고도 자연어로 시킨다(컬럼명은 예시):</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">sql</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre><code class=\"language-sql\">-- 각 테이블 행 수\r\nSELECT COUNT(*) FROM \"총생산_2013\";\r\n\r\n-- 시군구 개수 (중복 제거)\r\nSELECT COUNT(DISTINCT 시군명) FROM \"총생산_2013\";\r\n\r\n-- 6개 연도 테이블을 하나로 합쳐 GRP_Total 생성\r\nCREATE TABLE GRP_Total AS\r\nSELECT * FROM \"총생산_2013\"\r\nUNION ALL SELECT * FROM \"총생산_2014\"\r\nUNION ALL SELECT * FROM \"총생산_2015\";   -- … 나머지 연도도 이어붙임\r\n\r\n-- 테이블 삭제는 DELETE가 아니라 DROP\r\nDROP TABLE GRP_Total;\r\n</code></pre></div>\r\n<p>실행은 DB Browser의 <strong>SQL 실행</strong> 탭에서 <strong>Ctrl+Enter</strong>. 주석은 <code>--</code>(한 줄), <code>/* … */</code>(여러 줄).</p>\r\n<blockquote class=\"callout callout-warn\"><span class=\"callout-badge\">주의</span>\r\n<p>⚠ <strong>주의 — 콤마가 섞인 숫자.</strong> <code>3,417</code>처럼 천단위 콤마가 든 채로 임포트하면 SQLite가 텍스트로 인식해 계산이 안 된다. 임포트 전 콤마를 없애거나 자료형을 맞춰야 한다(SQLite 자료형은 TEXT/INTEGER/REAL 정도로 단순).</p>\r\n</blockquote>\r\n<h2 id=\"6-sql\">6단계 · 윈도우 함수 — SQL 분석의 진짜 무기</h2>\r\n<p><strong>윈도우 함수(Window Function)</strong> = \"내가 보고 싶은 영역(창)\"을 기준으로 옆 칸에 계산을 덧붙이는 함수. 엑셀로는 거의 못 하는 걸 SQL이 한 줄로 해낸다.</p>\r\n<div class=\"tablescroll\"><table>\r\n<thead>\r\n<tr>\r\n<th>함수</th>\r\n<th>하는 일</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td><code>RANK</code> / <code>DENSE_RANK</code></td>\r\n<td>순위 매기기(동점 처리 방식 차이)</td>\r\n</tr>\r\n<tr>\r\n<td><code>PERCENT_RANK</code> / <code>CUME_DIST</code></td>\r\n<td>백분위 / 누적 분포</td>\r\n</tr>\r\n<tr>\r\n<td><code>NTILE(n)</code></td>\r\n<td>전체를 n개 그룹으로 분할(예: 10분위)</td>\r\n</tr>\r\n<tr>\r\n<td><code>LAG</code> / <code>LEAD</code></td>\r\n<td>이전/다음 행 값 가져오기(전년 대비 등)</td>\r\n</tr>\r\n<tr>\r\n<td><code>ROWS BETWEEN …</code></td>\r\n<td>이동 구간 지정(이동평균)</td>\r\n</tr>\r\n</tbody>\r\n</table></div>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">sql</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre><code class=\"language-sql\">-- 연도별 1인당 생산액 순위\r\nSELECT 연도, 시군명, 생산액,\r\n       RANK() OVER (PARTITION BY 연도 ORDER BY 생산액 DESC) AS 순위\r\nFROM GRP_Total;\r\n\r\n-- 전년 대비 증감 (LAG = 직전 연도 값)\r\nSELECT 연도, 시군명, 생산액,\r\n       생산액 - LAG(생산액) OVER (PARTITION BY 시군명 ORDER BY 연도) AS 전년대비증감\r\nFROM GRP_Total;\r\n</code></pre></div>\r\n<blockquote class=\"callout callout-key\"><span class=\"callout-badge\">핵심</span>\r\n<p>★ <strong>핵심 — 너는 '무엇을' 만 정하면 된다.</strong> 주식의 60일·120일 이동평균선이 바로 윈도우 함수다(오늘 기준 직전 60개 평균). \"10년 평균 대비 지금 얼마나 높나\" 같은 <em>아이디어</em>만 있으면 SQL은 AI가 짜준다. <code>CAGR</code>(연평균 성장률)로 \"성장형 vs 정체형 지자체\"를 가르는 것도 같은 방식.</p>\r\n</blockquote>\r\n<h2 id=\"7-sqlite\">7단계 · 주피터 노트북에서 SQLite 연결</h2>\r\n<p>마지막으로, DB에서 SQL로 추린 결과만 파이썬으로 가져와 분석한다(메모리를 최소로 쓰는 핵심 패턴).</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">python</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre><code class=\"language-python\"># (필요한 것만) 설치 — 셀에서 ! 로 실행\r\n!pip install pandas\r\n# sqlite3 는 파이썬 '내장 모듈'이라 설치 불필요\r\n\r\nimport sqlite3\r\nimport pandas as pd\r\n\r\ndb_path = r\"C:\\SQLite\\GRP\\GRP.db\"      # 본인 .db 경로로 수정\r\nconn = sqlite3.connect(db_path)\r\nprint(\"SQL 연결 완료\")\r\n\r\ndf = pd.read_sql(\"SELECT * FROM GRP_Total\", conn)\r\ndf.head()                               # 앞 5줄 확인\r\n</code></pre></div>\r\n<blockquote class=\"callout callout-warn\"><span class=\"callout-badge\">주의</span>\r\n<p>⚠ <strong>주의 — <code>pip install sqlite3</code> 는 오류난다.</strong> 강사가 일부러 보여준 장면. <code>sqlite3</code>는 파이썬에 <strong>기본 내장</strong>이라 PyPI에 설치 패키지가 없다. import만 하면 된다. (참고: 파이썬 설치 시 표준 라이브러리 약 200개가 깔리고, PyPI에는 60만 개 이상이 등록돼 있다. 필요한 건 <code>pip install</code> 후 <code>import</code>.)</p>\r\n<p><strong>보강 — 빨간 오류는 정상.</strong> <code>pip install</code>/<code>import</code>에서 빨간 메시지가 나면 당황 말고 <strong>메시지를 캡처해 GPT에 던지면</strong> 된다. 이게 파이썬 작업의 일상 루프다.</p>\r\n<p>⚠ <strong>주의 (검색 보강) — 기관에서 아나콘다(Anaconda)는 유료.</strong> 2020년 9월부터 <strong>직원 200명 이상 기업·정부기관</strong>이 Anaconda를 쓰면 상업 라이선스를 사야 한다. 기관에서는 주피터 노트북을 <strong>아나콘다 없이</strong> 단독 설치하거나 <strong>Miniconda + conda-forge / Miniforge</strong> 조합으로 쓰는 게 안전하다. (개인·소규모는 무료.)</p>\r\n</blockquote>\r\n<h2 id=\"_5\">보강 · 데이터베이스가 빠른 이유 — 메모리 계층과 캐싱</h2>\r\n<p>고급 과정이니 한 겹 더. 하드웨어 속도는 <strong>CPU &gt; 메모리 &gt; 디스크 &gt; 네트워크</strong> 순.</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">code</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre class=\"mermaid\">flowchart LR\r\n  D[\"디스크&lt;br/&gt;(느림, 큼)\"] --&gt;|첫 조회: 올림| M[\"메모리&lt;br/&gt;(빠름)\"]\r\n  M --&gt;|결과| U[\"사용자\"]\r\n  M -.-&gt;|같은 쿼리 재요청&lt;br/&gt;= 캐시 히트| U\r\n</pre></div>\r\n<ul>\r\n<li>처음 <code>SELECT</code>는 디스크 → 메모리로 올리느라 느리고, <strong>같은 쿼리를 또 하면 메모리에서 바로</strong>(캐시 히트) 빨라진다. PC/서버의 캐시·메모리가 클수록 유리.</li>\r\n</ul>\r\n<blockquote class=\"callout callout-warn\"><span class=\"callout-badge\">주의</span>\r\n<p>⚠ <strong>주의 · 함정 — <code>WHERE</code> 없는 <code>SELECT *</code>.</strong> 1억 건 테이블을 조건 없이 통째로 부르면 메모리를 넘겨 기존 데이터를 디스크로 밀어내고 전체가 느려진다. 큰 테이블은 반드시 <code>WHERE</code>로 좁혀라.</p>\r\n<p><strong>보강 — Supabase = AWS PostgreSQL '도매'.</strong> 백엔드로 자주 쓰는 <strong>Supabase</strong>는 AWS의 PostgreSQL을 싸게 떼다(도매) 관리 툴을 얹어 파는 구조라고 강사는 비유했다. 다음 주(4회차)엔 파일 기반 대용량 포맷 <strong>Parquet(파켓)</strong> 도 나온다. 이런 대규모 흐름이 <strong>BI(비즈니스 인텔리전스) → 데이터 웨어하우스 → 데이터 레이크</strong> 로 이어진다.</p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"3부 · 콘텐츠 제작 워크플로우 — NotebookLM 레고\" id=\"3-notebooklm\">3부 · 콘텐츠 제작 워크플로우 — NotebookLM 레고</h1>\r\n<p>기관 홍보물(카드뉴스 + 영상)을 도구 조합으로 만든다.</p>\r\n<h2 id=\"notebooklm\">NotebookLM으로 카드뉴스·영상 기획</h2>\r\n<p>소스(홈페이지·나무위키·유튜브 등 1~3개)를 NotebookLM에 넣고, 카드 한 장마다 <strong>네 가지</strong>를 뽑게 한다: ① 이미지 프롬프트(글자 없이) ② 못 넣은 문구 ③ 나레이션 스크립트 ④ 다음 컷 전환 효과. 그다음 <em>\"이미지 프롬프트만 모아줘\"</em> → 슬라이드 생성 → <strong>AI 오디오뷰</strong>까지.</p>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p><strong>보강 — NotebookLM 소스 정렬 팁.</strong> 소스는 알파벳순으로 정렬되니, 중요한 소스 이름 앞에 <code>!</code> 등을 붙여 위로 올리면 스튜디오 생성 품질이 좋아진다.</p>\r\n</blockquote>\r\n<h2 id=\"codia-ai-notebooklm-ppt\">Codia AI — NotebookLM 슬라이드를 '편집 가능한 PPT'로</h2>\r\n<p>NotebookLM 슬라이드는 예쁘지만 <strong>한글이 깨지고 수정이 안 되는</strong> 게 약점. <strong>Codia AI</strong>(SaaS)는 이미지를 텍스트/도형 레이어로 분리해 <strong>편집 가능한 PPTX로 변환</strong>한다(5장 무료, 이후 유료).</p>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p><strong>보강 — 유료 도구를 똑똑하게 쓰는 법.</strong> 강사 팁: 변환할 슬라이드를 한 200장 모아뒀다가 한 달(약 2만~3만 원) 결제해 한 번에 변환하고 해지. \"무료가 되면 다 쓸 것\" → 결국 구글/OpenAI가 비슷한 기능을 내놓을 가능성이 큰 영역. (그전까지의 임시 도구.)</p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"4부 · GEO/SEO — AI 시대의 검색 최적화\" id=\"4-geoseo-ai\">4부 · GEO/SEO — AI 시대의 검색 최적화</h1>\r\n<p>이제 사람들은 네이버·구글 키워드 검색 대신 Gemini·ChatGPT에게 <em>문장으로</em> 묻는다. 그래서 최적화의 기준도 바뀐다.</p>\r\n<h2 id=\"geo\">GEO란 — 검색 패러다임의 전환</h2>\r\n<blockquote class=\"callout callout-key\"><span class=\"callout-badge\">핵심</span>\r\n<p>★ <strong>핵심 (검색 보강).</strong> <strong>SEO</strong>(Search Engine Optimization)는 검색엔진 결과(SERP)에서 <strong>상위 노출 → 클릭</strong>을 노리는 것. <strong>GEO</strong>(Generative Engine Optimization)는 생성형 AI(ChatGPT·Perplexity·Gemini·AI Overviews 등)가 답변을 만들 때 <strong>내 콘텐츠를 인용·추천하게</strong> 만드는 것. 목표가 '클릭 유도'에서 'AI 답변에 포함되기'로 바뀐다.</p>\r\n</blockquote>\r\n<p>GEO가 좋아하는 구조: <strong>명확한 정보 위계(H1·H2·H3), 질문-답변형 콘텐츠, 두괄식, JSON-LD/스키마 같은 구조화 데이터.</strong> 마크다운식의 또렷한 구조가 유리하다(2회차의 \"AI가 읽기 쉬운 문서\"와 정확히 같은 맥락).</p>\r\n<h2 id=\"lovable\">실습 · 기관 사이트 진단 → Lovable로 개선</h2>\r\n<p>진단 프롬프트로 기관 홈페이지의 SEO/GEO를 <strong>점수화</strong>(예: NIA 61점) → 약점 도출 → <strong>Lovable</strong>(노코드 웹 빌더)로 사이트를 GEO 친화적으로 재생성 → 전/후 비교. Lovable에는 퍼블리시 후 <strong>\"Review SEO\"</strong> 버튼이 생겼다(업계가 GEO에 그만큼 반응 중).</p>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p><strong>보강 — 행안부 'AI 시대 문서 작성 가이드라인'.</strong> 강사가 반긴 정책. 예쁘게 꾸민 표·데코레이션, 주어/서술어 생략한 복잡한 개조식 문장을 <strong>지양</strong>하고, <em>사람과 AI가 모두 읽기 쉬운</em> 문서를 권한다. 3~6월 행안부 내 시범 → 하반기 중앙기관 확산. 이게 2회차에서 본 <strong>HWPX 의무화(2026.6.18~)</strong> 와 한 묶음이다 — 기관 사이트·문서 모두 'AI가 읽기 좋게'.</p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"5부 · 콜센터 녹취 분석 — 음성 워크플로우\" id=\"5\">5부 · 콜센터 녹취 분석 — 음성 워크플로우</h1>\r\n<p>마지막 레고 조합. 음성 파일 더미를 텍스트로 바꿔 요약·감정분석까지.</p>\r\n<blockquote class=\"callout callout-add\"><span class=\"callout-badge\">보강</span>\r\n<p><strong>보강 — 뉴발란스 수선 콜센터 일화.</strong> 월 8,000건 녹취가 쌓이는데 \"무슨 통화인지 모르겠다\"는 의뢰. 상담원 8명이 무슨 대화를 하는지 파악하려면, MP3 더미를 자동으로 전사·분석하는 <strong>워크플로우</strong>가 필요하다. 막막하면 <em>\"이 문제를 어떤 워크플로우로 풀지 알려줘\"</em> 부터 AI에 물어라.</p>\r\n</blockquote>\r\n<h2 id=\"_6\">워크플로우 설계 (레고 블록)</h2>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">code</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre class=\"mermaid\">flowchart LR\r\n  MP3[\"MP3 녹취\"] --&gt; W[\"Whisper / Faster Whisper&lt;br/&gt;전사(STT)\"]\r\n  W --&gt; J[\"JSON 저장\"]\r\n  J --&gt; L[\"요약·감정·주제·VOC\"]\r\n  L --&gt; G[\"Gemini API&lt;br/&gt;또는 Ollama(Gemma)\"]\r\n  G --&gt; DB[\"SQLite 저장(INSERT)\"]\r\n</pre></div>\r\n<p>각 칸이 레고다 — 녹취 가져오기 / Whisper 전사 / SQLite 저장 / 외부 API or 로컬 Ollama / 결과 표시. 필요한 것만 끼우면 된다.</p>\r\n<h2 id=\"_7\">실제 코드 골격</h2>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">python</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre><code class=\"language-python\">!pip install faster-whisper\r\nfrom faster_whisper import WhisperModel\r\n\r\n# 모델: tiny&lt;base&lt;small&lt;medium (정확도↑/속도↓). 보통 small 추천.\r\n# GPU 있으면 device=\"cuda\", compute_type=\"float16\"\r\nmodel = WhisperModel(\"small\", device=\"cpu\", compute_type=\"int8\")\r\n\r\nsegments, info = model.transcribe(\"call_001.mp3\", language=\"ko\")\r\ntext = \" \".join(seg.text for seg in segments)\r\nprint(f\"{info.duration:.1f}초, 전사: {text[:60]}…\")\r\n</code></pre></div>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">python</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre><code class=\"language-python\">import json\r\nwith open(\"call_001.json\", \"w\", encoding=\"utf-8\") as f:\r\n    json.dump({\"file\": \"call_001.mp3\", \"duration\": info.duration, \"text\": text},\r\n              f, ensure_ascii=False, indent=2)\r\n</code></pre></div>\r\n<p>요약·감정분석은 외부 API(Gemini) 또는 <strong>로컬 Ollama</strong>로:</p>\r\n<div class=\"codewrap\"><div class=\"codebar\"><span class=\"codelang\">Shell</span><button class=\"copybtn\" type=\"button\">복사</button></div><pre><code class=\"language-bash\">ollama run gemma3:4b \"다음 콜센터 통화를 3줄로 요약하고 감정을 (긍정/중립/부정)으로 분류해줘: &lt;전사 텍스트&gt;\"\r\n</code></pre></div>\r\n<blockquote class=\"callout callout-warn\"><span class=\"callout-badge\">주의</span>\r\n<p>폐쇄망/보안망이면 이 전체를 <strong>로컬로</strong> 돌릴 수 있다 — 전사는 <strong>Faster Whisper</strong>(이 프로젝트의 <code>kbrain_stt.py</code>가 쓰는 그 엔진), 요약·감정은 <strong>Ollama + Gemma</strong>, 저장은 <strong>SQLite</strong>. 외부로 데이터를 한 톨도 안 보내고 끝난다. 보조 감정분류엔 <strong>KoBERT</strong> 같은 한국어 모델도 쓸 수 있다.</p>\r\n<p><strong>보강 — JSON으로 저장하는 이유.</strong> 전사 결과를 JSON으로 떨구면(화자·시작/끝 시각·길이 등 구조 포함) 나중에 \"오후 3~4시 통화만\" 같은 조회가 쉽다. AI·기계는 JSON과 마크다운을 가장 잘 다룬다. 단, 음성/텍스트 원본은 DB에 통째로 넣기보다(잘 안 씀: BLOB) <strong>파일로 두고 경로(파일명)만 DB에 저장</strong>하는 게 보통이다.</p>\r\n</blockquote>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"마무리 &amp; 과제\" id=\"_8\">마무리 &amp; 과제</h1>\r\n<blockquote class=\"callout callout-key\"><span class=\"callout-badge\">핵심</span>\r\n<p>★ 오늘의 한 줄: <strong>why·what은 사람이, how는 AI가.</strong> 원천 CSV를 DB에 넣고, SQL은 AI에게 시켜 최대한 돌리고, 결과만 파이썬으로 가져와 목적(분석·정책)을 이룬다. 도구는 레고처럼 조합한다.</p>\r\n</blockquote>\r\n<p><strong>과제</strong> — HIRA(심평원) 데이터셋(2018·2019·2020년)으로 같은 흐름을 반복:\r\n1. VBA로 메타데이터를 뽑아 <strong>컬럼 구조 변동</strong>을 찾는다(2번 항목에 컬럼이 끼어들어 값이 '절벽'처럼 떨어지는 부분 — 위치 이동/삭제로 전처리).\r\n2. 전처리한 CSV를 SQLite에 임포트하고, Text-to-SQL로 조회해 본다.\r\n3. 결과물을 공유 폴더에 업로드.\r\n- 참고: 상병코드(예: <code>A01</code> = 장티푸스 및 파라티푸스)처럼 도메인 코드는 모르는 게 정상 — 필요하면 코드표를 붙여 매핑한다.</p>\r\n<hr/>\r\n<h1 class=\"modhead\" data-full=\"부록 — 용어 사전 · 출처\" id=\"_9\">부록 — 용어 사전 · 출처</h1>\r\n<h2 id=\"_10\">용어 빠른 사전</h2>\r\n<div class=\"tablescroll\"><table>\r\n<thead>\r\n<tr>\r\n<th>용어</th>\r\n<th>한 줄 정의</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>메타 프롬프트</td>\r\n<td>프롬프트를 만들어 달라고 시켜 '프롬프트'를 받는 기법</td>\r\n</tr>\r\n<tr>\r\n<td>퓨샷 / CoT</td>\r\n<td>예시 몇 개 제시 / \"단계적으로 생각\" 추론 유도</td>\r\n</tr>\r\n<tr>\r\n<td>프리모텀(Pre-mortem)</td>\r\n<td>실패를 가정하고 원인을 미리 찾는 사고법(아첨 깨기)</td>\r\n</tr>\r\n<tr>\r\n<td>Text-to-SQL</td>\r\n<td>자연어로 시켜 SQL을 생성하는 것</td>\r\n</tr>\r\n<tr>\r\n<td>DDL / 테이블 정의서</td>\r\n<td><code>CREATE TABLE …</code>, 테이블 구조 명세</td>\r\n</tr>\r\n<tr>\r\n<td>인덱스 / 풀 스캔</td>\r\n<td>빨리 찾기 위한 색인 / 처음부터 끝까지 훑기</td>\r\n</tr>\r\n<tr>\r\n<td>윈도우 함수</td>\r\n<td>지정 구간 기준으로 순위·이동평균 등을 계산(RANK, LAG/LEAD…)</td>\r\n</tr>\r\n<tr>\r\n<td>CAGR</td>\r\n<td>연평균 성장률</td>\r\n</tr>\r\n<tr>\r\n<td>캐시 히트</td>\r\n<td>디스크 대신 메모리에서 결과를 바로 가져옴</td>\r\n</tr>\r\n<tr>\r\n<td>SQLite / DB Browser</td>\r\n<td>파일 하나로 쓰는 경량 DB / 그 GUI 도구</td>\r\n</tr>\r\n<tr>\r\n<td>Parquet(파켓)</td>\r\n<td>대용량 분석에 쓰는 컬럼형 파일 포맷(4회차 예고)</td>\r\n</tr>\r\n<tr>\r\n<td>NotebookLM / Codia AI</td>\r\n<td>구글 소스 기반 콘텐츠 도구 / 슬라이드→편집가능 PPT 변환</td>\r\n</tr>\r\n<tr>\r\n<td>SEO / GEO</td>\r\n<td>검색엔진 상위노출·클릭 / 생성형 AI가 인용·추천하게 하기</td>\r\n</tr>\r\n<tr>\r\n<td>Whisper / Faster Whisper</td>\r\n<td>음성→텍스트(STT) 모델 / 그 고속 구현</td>\r\n</tr>\r\n<tr>\r\n<td>Ollama / Gemma / KoBERT</td>\r\n<td>로컬 LLM 실행기 / 구글 소형모델 / 한국어 BERT</td>\r\n</tr>\r\n<tr>\r\n<td>BLOB</td>\r\n<td>DB에 이진 대용량(음성·이미지 등)을 넣는 자료형(보통 지양)</td>\r\n</tr>\r\n<tr>\r\n<td>BI / 데이터 웨어하우스 / 레이크</td>\r\n<td>분석·의사결정용 데이터 인프라 단계</td>\r\n</tr>\r\n</tbody>\r\n</table></div>\r\n<h2 id=\"_11\">검색으로 확인·보강한 출처</h2>\r\n<ul>\r\n<li>프리모텀(Gary Klein, HBR 2007 / prospective hindsight 30%): <a href=\"https://hbr.org/2007/09/performing-a-project-premortem\">HBR — Performing a Project Premortem</a></li>\r\n<li>LLM 워게임 핵 에스컬레이션(GPT-4-Base 33%): <a href=\"https://arxiv.org/abs/2401.03408\">arXiv 2401.03408</a>, <a href=\"https://www.euronews.com/next/2024/02/22/ai-models-chose-violence-and-escalated-to-nuclear-strikes-in-simulated-wargames\">Euronews</a></li>\r\n<li>GEO(Generative Engine Optimization) 정의: <a href=\"https://searchengineland.com/what-is-generative-engine-optimization-geo-444418\">Search Engine Land</a>, <a href=\"https://www.conductor.com/academy/generative-engine-optimization/\">Conductor Academy</a></li>\r\n<li>아나콘다 200명 이상 유료 라이선스(2020.9~): <a href=\"https://devocean.sk.com/blog/techBoardDetail.do?ID=164615&amp;boardType=techBlog\">Anaconda Terms of Service 관련 정리</a></li>\r\n</ul>\r\n  </main>\r\n</div>\r\n\r\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js\"><\/script>\r\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/powershell.min.js\"><\/script>\r\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/vbscript.min.js\"><\/script>\r\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js\"><\/script>\r\n<script>\r\n// 주제 헤더 raw 텍스트를 data-full로 옮겨 ::after 표시\r\ndocument.querySelectorAll('h1.modhead').forEach(function(h){\r\n  h.setAttribute('data-full', h.textContent);\r\n});\r\n\r\n// highlight.js\r\nif(window.hljs){\r\n  document.querySelectorAll('.codewrap pre code').forEach(function(b){\r\n    try{hljs.highlightElement(b);}catch(e){}\r\n  });\r\n}\r\n\r\n// mermaid\r\nif(window.mermaid){\r\n  mermaid.initialize({\r\n    startOnLoad:true, theme:'base',\r\n    htmlLabels:false,\r\n    themeVariables:{\r\n      fontFamily:'-apple-system,Pretendard,\"Malgun Gothic\",sans-serif',\r\n      fontSize:'13px',\r\n      primaryColor:'#e6f4f1', primaryBorderColor:'#127c71', primaryTextColor:'#0c5249',\r\n      lineColor:'#9aa0a8', secondaryColor:'#f4f1ea', tertiaryColor:'#fbf1e4',\r\n      clusterBkg:'#f6f6f0', clusterBorder:'#cfd3cb'\r\n    },\r\n    flowchart:{curve:'basis', useMaxWidth:true, htmlLabels:false},\r\n    sequence:{useMaxWidth:true}\r\n  });\r\n}\r\n\r\n// 복사 버튼\r\ndocument.querySelectorAll('.copybtn').forEach(function(btn){\r\n  btn.addEventListener('click', function(){\r\n    var code = btn.closest('.codewrap').querySelector('pre code');\r\n    var txt = code ? code.innerText : '';\r\n    navigator.clipboard.writeText(txt).then(function(){\r\n      btn.textContent='복사됨'; btn.classList.add('ok');\r\n      setTimeout(function(){btn.textContent='복사'; btn.classList.remove('ok');},1400);\r\n    });\r\n  });\r\n});\r\n\r\n// 스크롤 스파이\r\nvar links = Array.from(document.querySelectorAll('#nav a'));\r\nvar map = {};\r\nlinks.forEach(function(a){ map[a.getAttribute('href').slice(1)] = a; });\r\nvar heads = Array.from(document.querySelectorAll('.main h1[id], .main h2[id]'));\r\nvar spy = new IntersectionObserver(function(entries){\r\n  entries.forEach(function(en){\r\n    if(en.isIntersecting){\r\n      links.forEach(function(l){l.classList.remove('active');});\r\n      var act = map[en.target.id];\r\n      if(act){act.classList.add('active');\r\n        act.scrollIntoView({block:'nearest'});}\r\n    }\r\n  });\r\n}, {rootMargin:'-10% 0px -75% 0px', threshold:0});\r\nheads.forEach(function(h){spy.observe(h);});\r\n\r\n// 모바일 사이드바\r\nvar side=document.getElementById('side'), scrim=document.getElementById('scrim'),\r\n    mb=document.getElementById('menubtn');\r\nfunction toggle(open){side.classList.toggle('open',open);scrim.classList.toggle('show',open);}\r\nif(mb){mb.addEventListener('click',function(){toggle(!side.classList.contains('open'));});}\r\nif(scrim){scrim.addEventListener('click',function(){toggle(false);});}\r\nlinks.forEach(function(a){a.a
