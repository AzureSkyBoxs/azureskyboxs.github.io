tGPT, Perplexity, Gemini 등의 AI가 답변을 생성할 때 내 콘텐츠를 인용 및 추천 리스트에 포함시키도록 만드는 것", "웹사이트 소스코드 내부의 이미지 해상도와 CSS 렌더링 속도를 물리적으로 최적화하는 기술", "공공 데이터 포털 API에 실시간 보안 방화벽 알고리즘을 구축하여 해킹을 방어하는 것"], "a": 1, "expl": "전통적인 검색엔진 최적화(SEO)가 링크 상위 노출과 높은 클릭수(CTR) 유도를 목표로 삼았다면, AI 시대의 GEO는 생성형 AI의 지식 답변 프로세스 내부에 내 비즈니스나 콘텐츠가 신뢰할 만한 인용 출처로 발탁되어 추천되게 유도하는 기술입니다."}, {"id": "NL027", "src": "custom", "lec": 3, "cat": "생성형AI활용", "diff": "중", "type": "mcq", "q": "GEO(Generative Engine Optimization) 친화적인 구조를 만들기 위해 행정안전부의 'AI 시대 문서 작성 가이드라인'이 지향하고 권장하는 공공 문서의 작성 방향성은?", "opts": ["화려한 데코레이션 표와 다채로운 색상이 가미된 인포그래픽 중심의 문서", "주어와 서술어를 대폭 생략하고 복잡하게 얽힌 다단 형태의 개조식 문서", "사람과 AI가 모두 읽기 쉽도록 명확한 정보 위계(H1·H2·H3)와 두괄식 구조를 갖춘 문서", "기계가 수정할 수 없도록 문서 전체를 텍스트가 분리되지 않는 통이미지 파일로 저장하는 문서"], "a": 2, "expl": "행정안전부 가이드라인은 AI가 기계적으로 긁어 읽기 좋은 '기계 가독성(machine-readability)'을 강조합니다. 따라서 주어·서술어가 생략된 어지러운 개조식이나 화려한 표 장식을 피하고, H1·H2 마크다운 구조처럼 정보 위계가 뚜렷하며 두괄식으로 핵심이 잡힌 직관적 형식을 권장합니다."}, {"id": "NL028", "src": "custom", "lec": 3, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "콜센터 녹취 대량 분석 프로젝트(예: 뉴발란스 수선 콜센터 일화)에서, 음성 원본 데이터(MP3)를 처리할 때 데이터베이스 엔지니어링 측면에서 권장되는 올바른 저장 아키텍처는?", "opts": ["음성 파일 전체의 이진 데이터(Binary)를 DB 테이블의 BLOB 컬럼에 직접 밀어 넣는다", "음성 및 텍스트 원본은 파일 시스템 경로에 별도로 저장하고, DB 테이블에는 해당 파일의 경로(파일명) 문자열만 매핑해 저장한다", "데이터 보안을 위해 전사 결과를 저장하지 않고 처리 즉시 OOM 캐시에서 휘발시킨다", "620만 건의 통화 내역을 하나의 통합 엑셀 시트에 합친 뒤 닫기 및 로드를 수행한다"], "a": 1, "expl": "음성이나 고해상도 이미지 같은 대용량 데이터를 DB 내부의 BLOB(Binary Large Object) 타입으로 직접 넣으면 데이터베이스의 크기가 비대해져 전체 트랜잭션과 백업 속도가 붕괴됩니다. 따라서 실무에서는 데이터 레이크/파일 서버에 실제 파일을 두고, DB에는 추적용 경로(Path/URI) 정보만 기록하는 것이 표준 아키텍처입니다."}, {"id": "NL029", "src": "custom", "lec": 3, "cat": "생성형AI활용", "diff": "하", "type": "mcq", "q": "NotebookLM에 마케팅 전략이나 정책 분석을 위한 다수의 소스(Source) 문서를 대량 업로드하여 스튜디오 결과물을 만들 때, 최상단으로 먼저 인식시킬 중요 소스의 정렬 순서를 강제로 끌어올리기 위한 팁은?", "opts": ["중요 소스 파일 이름의 맨 앞에 느낌표(!) 등의 특수문자를 붙인다", "소스 파일의 확장자를 모두 Parquet(.parquet) 포맷으로 변환한다", "NotebookLM 화면 우측 하단의 'Review SEO' 검증 툴을 실행한다", "temperature 파라미터 설정을 1에서 0으로 강제 하향한다"], "a": 0, "expl": "NotebookLM 내부에 적재된 소스 데이터들은 시스템 내부에서 기본적으로 알파벳/가나다순으로 정렬되므로, 가장 가중치가 높고 핵심이 되는 메인 소스 문서의 이름 앞에 특수문자(!)를 달아 상단 배치하면 요약 스튜디오와 콘텐츠 생성 품질의 안정성을 대폭 향상시킬 수 있습니다."}, {"id": "NL030", "src": "custom", "lec": 3, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "데이터베이스 전처리 과정에서 '데이터의 휘발성을 방지하고, OOM(Out of Memory) 현상 없이 무제한에 가까운 디스크 스왑 처리가 가능하며, 동일한 쿼리에 항상 동일한 정답을 보장하는 특성'과 관련된 DB만의 핵심 가치는?", "opts": ["트랜잭션 및 무결성(신뢰성·재현성) 보장", "프롬프트 스터핑의 방지", "AutoML 기반 피처 임포턴스 가속", "하네스 엔지니어링의 시각화"], "a": 0, "expl": "파이썬 판다스(pandas)는 데이터를 인메모리에 얹어 연산하므로 PC 사양 종속과 휘발성 리스크가 크지만, 데이터베이스는 엔진 레벨에서 디스크 스왑과 트랜잭션을 엄격하게 제어하여 대용량 적재 시에도 높은 무결성과 재현성을 보장하는 강력한 차별점을 제공합니다."}, {"id": "NL031", "src": "custom", "lec": 4, "cat": "데이터분석", "diff": "상", "type": "mcq", "q": "머신러닝 및 딥러닝 인공신경망의 기반이 되며, 가중치(W)와 입력 벡터(X) 간의 다차원 행렬 연산(SUMPRODUCT 등)을 수학적으로 다루는 펀더멘털 학문은?", "opts": ["선형대수 (Linear Algebra)", "추론통계학 (Inferential Statistics)", "베이즈 정리 (Bayes' Theorem)", "자연어 처리 (NLP)"], "a": 0, "expl": "딥러닝 인공신경망의 입력값에 가중치(Weight)를 곱하고 절편을 더하는 수천억 개의 1차 방정식 엮기 과정과 내적(dot product) 연산의 모든 뼈대는 수학의 '선형대수(Linear Algebra)'에서 나옵니다."}, {"id": "NL032", "src": "custom", "lec": 4, "cat": "데이터분석", "diff": "하", "type": "mcq", "q": "빅데이터의 고유한 3대 속성을 일컫는 이른바 '3V' 구성 요소로 올바른 것은?", "opts": ["Volume (용량), Velocity (속도), Variety (다양성)", "Vibe (분위기), Vector (벡터), Variable (변수)", "Validation (검증), Value (가치), Version (버전)", "Vulnerability (취약성), Volume (용량), Vision (비전)"], "a": 0, "expl": "컴퓨터과학 진영에서 대두된 빅데이터의 정립 조건이자 정의 구조인 3V는 데이터의 방대한 용량(Volume), 실시간에 준하는 생성/처리 속도(Velocity), 텍스트나 영상 등을 아우르는 형태의 다양성(Variety)을 의미합니다."}, {"id": "NL033", "src": "custom", "lec": 4, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "실리콘밸리 데이터 사이언티스트들의 5단계 프레임워크 중, 어떠한 사전 가정이나 선입견 없이 결측치를 파악하고 데이터의 날것 형태 분포를 있는 그대로 확인하는 제로베이스·크리티컬 관점의 단계를 뜻하는 용어는?", "opts": ["EDA (탐색적 데이터 분석)", "PRD (요구사항 정의)", "AutoML 모델링", "스토리텔링"], "a": 0, "expl": "EDA(Exploratory Data Analysis)는 본격적인 머신러닝 모델링 이전에, 데이터 모델이 가진 결측값 상태나 왜도 분포, 이상치 특성을 편견 없이 있는 그대로 탐색하는 가장 핵심적인 프레임워크 단계입니다."}, {"id": "NL034", "src": "custom", "lec": 4, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "파이썬 데이터 분석 라이브러리인 판다스(pandas)의 어원이자 경제학 등에서 널리 쓰이는 용어 명칭은?", "opts": ["Panel Data (패널 데이터)", "Panda Bear (판다 곰)", "Partitioning Database (파티셔닝 DB)", "Parameter Domain (파라미터 도메인)"], "a": 0, "expl": "판다스(pandas)는 동물이 아니라, 여러 대상(Cross-sectional)을 시계열(Time-series)로 추적 결합해 둔 계량경제학 및 데이터 통계 용어인 'Panel Data(패널 데이터)'의 앞 단어 조합에서 유래한 라이브러리입니다."}, {"id": "NL035", "src": "custom", "lec": 4, "cat": "데이터분석", "diff": "상", "type": "mcq", "q": "2026년 5월 분리 개편된 구글의 개발 플랫폼 'Antigravity 2.0' 라인업의 두 가지 핵심 제품과 특징의 연결로 옳은 것은?", "opts": ["Antigravity IDE (VS Code 스타일의 비주얼 편집 환경) 및 Antigravity AI Agent (Gemini 3.5 기반 파일·폴더 없는 헤드리스 채팅 에이전트)", "Antigravity Stitch (디자인 최적화 빌더) 및 Antigravity Flow (동영상 인프라 시스템)", "Antigravity Server (온프레미스 오라클 연동 모듈) 및 Antigravity Cache (인메모리 OOM 제어 팩)", "Antigravity OpenRouter (통합 API 창구) 및 Antigravity Parquet (분산 처리용 분산 엔진)"], "a": 0, "expl": "2026년 5월 업그레이드 배포된 Antigravity 2.0은 전통적인 UI 코딩용 편집 공간인 'IDE 제품군'과, 복잡한 디렉토리 체계 필요 없이 채팅 대화만으로 AI 백엔드 코딩을 독자 수행하는 'AI Agent 제품군(Gemini 3.5 탑재)'의 투 트랙으로 완전하게 이원화 분리되었습니다."}, {"id": "NL036", "src": "custom", "lec": 4, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "머신러닝 최적화 과정에서 예측 함수 오차의 최솟값을 찾기 위해 기울기(경사)를 따라 조금씩 이동하며 파라미터를 고쳐나가는 과정 중, '국소적인 골짜기(Local Minima)에 갇혀 전체 공간의 진짜 최솟값(Global Minima)을 놓치는 문제'를 해결하기 위한 수학적 최적화 기법의 기본 명칭은?", "opts": ["경사 하강법 (Gradient Descent)", "층화 추출법 (Stratified Sampling)", "로그 변환 (Log Transformation)", "혼동 행렬 (Confusion Matrix)"], "a": 0, "expl": "오차(잔차) 함수의 기울기가 0이 되는 지점을 향해 내려가는 알고리즘을 경사 하강법(Gradient Descent)이라고 부르며, Local Minima를 탈출하여 Global Minima에 안전하게 안착시키는 것이 데이터 사이언스 모델링 최적화의 난제 중 하나입니다."}, {"id": "NL037", "src": "custom", "lec": 4, "cat": "생성형AI활용", "diff": "상", "type": "mcq", "q": "확률 기반 시스템 특유의 비선형적인 버그를 통제하기 위해, 자원·프롬프트·사용자·모델 버전·에이전트를 전체적으로 묶어 통합 통제 관리 및 배포 검증을 수행하는 프레임워크 기술 환경을 뜻하는 용어는?", "opts": ["하네스 엔지니어링 (Harness Engineering)", "프롬프트 스터핑 (Prompt Stuffing)", "데이터 마트 (Data Mart)", "CDC (Change Data Capture)"], "a": 0, "expl": "언제 버그가 튈지 모르는 확률형 LLM/AI 부채를 시스템 소프트웨어 공학적으로 안전하게 구동 및 QA 검증하기 위해, 연장통과 작업장 환경 지침 전체를 유기적으로 동결 관리하는 복합 관리 기술을 하네스 엔지니어링이라고 합니다."}, {"id": "NL038", "src": "custom", "lec": 4, "cat": "생성형AI활용", "diff": "중", "type": "mcq", "q": "강사 경험담을 기반으로 RAG(참조 검색 기반 생성) 솔루션을 은행법·증권법 등 현업 공공 비즈니스에 PoC 도입할 때, '기계적 줄 수 분할'의 한계를 깨고 도메인 전문가의 질문 만족도를 극대화할 수 있었던 최우선 RAG 설계 전략은?", "opts": ["가장 비싸고 파라미터가 큰 초거대 OpenAI API 모델 단독 지정", "법령의 '조·절' 맥락 단위로 세밀하게 자르고 상단에 ## 맥락 레이블을 명시하는 청킹(Chunking) 전략", "파이썬 read_csv 코드의 read 속도를 2.6배 올리는 것", "Langfuse 모니터링 툴을 연동하여 CPU 방화벽 포트 차단"], "a": 1, "expl": "RAG의 실무 품질은 파운데이션 모델 자체보다 데이터를 쪼개는 '청킹 전략'이 결정합니다. 기계적으로 나누면 문맥이 끊겨 검색 오류가 나므로, 법령의 고유한 조·절 경계를 파악하고 레이블링을 통해 맥락을 보강하는 human-in-the-loop 방식의 청킹 설계가 핵심입니다."}, {"id": "NL039", "src": "custom", "lec": 4, "cat": "데이터분석", "diff": "하", "type": "mcq", "q": "데이터 엔지니어링 파이프라인 흐름 중 하나로, 실시간 비즈니스 시스템(SAP 등 운영 DB)의 과부하와 OOM 다운 현상을 막기 위해 중간에 파일을 별도로 떨구어 두고 주기적으로 땡겨가도록 설계하는 중간 통로 서버의 명칭은?", "opts": ["연계 서버", "데이터 레이크", "주피터 노트북 커널", "AutoML 에이전트"], "a": 0, "expl": "운영 중인 메인 기업 생산성 DB에 직접 쿼리를 과도하게 날리면 코어 시스템이 깨지기 때문에, 주기적으로 증분 데이터(CDC) 파일만 임시 저장소에 격리 전달하도록 설계된 중간 브릿지 인프라를 '연계 서버'라고 부릅니다."}, {"id": "NL040", "src": "custom", "lec": 4, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "학습 데이터 환경이 심각하게 끊기거나 강제 OOM 셧다운이 발생하더라도, 처음(제로 베이스)부터 다시 연산하지 않고 에폭(Epoch) 단위로 직전 저장 시점부터 이어서 가속할 수 있게 돕는 저장 모듈 기법은?", "opts": ["체크포인트 (Checkpoint)", "드롭아웃 (Dropout)", "소프트 보팅 (Soft Voting)", "피처 임포턴스 (Feature Importance)"], "a": 0, "expl": "장시간 소요되는 데이터 사이언스 및 딥러닝 학습 파이프라인에서 주기적으로 현재 가중치 상태를 디스크에 백업 고정해 두어 실패 시점 복구를 지원하는 기술 명칭을 '체크포인트(Checkpoint)'라고 합니다."}, {"id": "NL041", "src": "custom", "lec": 5, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "Ollama를 활용하여 4B급 성능의 로컬 멀티모달(텍스트+이미지 처리) 모델인 Gemma 4 'gemma4:e4b'를 실행할 때, 모델명 접미사에 붙은 'E4B(Effective 4B)'의 핵심 기술적 메커니즘은?", "opts": ["4개의 상용 GPU를 클러스터 인터페이스로 강제 병렬 바인딩하는 기술", "선택적 파라미터 활성화(Selective Activation) 구조를 통해 적은 자원과 RAM 용량으로도 4B 성능을 구현하는 기술", "인터넷 연결이 활성화되었을 때만 백엔드 배터리를 4배로 가속하는 크롬 확장 프로그램", "개인정보(PII)의 8대 범주 문자열을 4음절 단위로 마스킹 암호화하는 압축 방식"], "a": 1, "expl": "gemma4:e4b 모델의 E4B는 '실효 4B(Effective 4 Billion)'를 뜻합니다. 선택적 파라미터 활성화(Gemma 3n 계열 아키텍처 공통) 메커니즘 덕분에 고사양 서버 자원 없이 일반 CPU 노트북 환경에서도 저전력·저용량으로 멀티모달 이미지 전사 추론을 쾌적하게 구현할 수 있습니다."}, {"id": "NL042", "src": "custom", "lec": 5, "cat": "서비스구현", "diff": "상", "type": "mcq", "q": "외부망 접속이 엄격히 차단된 사내 폐쇄망 환경에서, 타 부서 직원이나 동료의 PC가 내 PC에 구축된 로컬 Ollama AI 모델을 사설 네트워크로 원격 호출하여 공유 사용(서빙)할 수 있도록 활성화시켜야 하는 시스템 환경변수 명령어 세트는?", "opts": ["setx OLLAMA_HOST \"0.0.0.0:11434\"", "pip install sqlite3 --upgrade", "chcp 65001 /f", "winget install ollama.core -p 5000"], "a": 0, "expl": "Ollama는 기본적으로 로컬 루프백 주소(127.0.0.1)에만 바인딩되므로 외부 접속이 차단됩니다. 이를 사내 내부망(LAN 대역 IP) 전체에 개방하려면 호스트 바인딩을 모든 인터페이스 수신 모드인 '0.0.0.0' 및 기본 포트 11434 포트로 수동 설정변수 등록(`setx OLLAMA_HOST \"0.0.0.0:11434\"`)한 후 재시작해야 합니다."}, {"id": "NL043", "src": "custom", "lec": 5, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "Ollama 로컬 AI 모델을 엑셀 매크로 환경과 유기적으로 차단 없이 연동하기 위해, VBA 소스코드 편집기 내부에서 로컬 서버 엔드포인트(:11434/api/generate)로 데이터 비동기 송수신을 처리해 주는 MS 핵심 내장 객체 모델의 명칭은?", "opts": ["MSXML2.XMLHTTP", "PyInstaller.COM", "FormApp.create", "manifest.json"], "a": 0, "expl": "엑셀 내부망 환경에서 VBA 텍스트 데이터를 외부 또는 로컬 주소에 POST 방식으로 던지고 JSON 답변을 수신받아 셀 함수(=AI_Ask 등)로 파싱하기 위해 사용하는 윈도우 핵심 통신 라이브러리 객체는 `MSXML2.XMLHTTP`입니다."}, {"id": "NL044", "src": "custom", "lec": 5, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "구글 추가 기능 및 업무 설문지 대량 코드 생성을 위해 script.google.com 플랫폼에서 작성 및 연동되며, 구글 폼 생성 함수인 FormApp 객체 등을 제어하는 자동화 프로그래밍 언어의 명칭은?", "opts": ["Google Apps Script", "Excel VBA Macro", "PowerShell Script", "Node.js npm"], "a": 0, "expl": "구글 생태계의 매크로이자 자동화 제어 스크립트 도구는 'Google Apps Script'입니다. 이를 활용해 LLM이 설계해 준 설문 양식을 자바스크립트 문법 기반의 코드 실행 한 번으로 대량 양산 및 구글 시트 데이터 분석 파이프라인까지 연동할 수 있습니다."}, {"id": "NL045", "src": "custom", "lec": 5, "cat": "서비스구현", "diff": "하", "type": "mcq", "q": "브라우저 개발자 도구(F12) 콘솔 창에 ChatGPT가 작성해 준 자동화 자바스크립트 코드를 최초로 붙여넣어 실행하려고 할 때, 크롬/엣지 보안 정책상 붙여 <script>
/* ─────────── 저장소 어댑터: claude artifact(window.storage) → localStorage → 메모리 ─────────── */
const store = (() => {
  const mem = {};
  const hasWS = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
  let hasLS = false;
  try { const k='__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); hasLS = true; } catch(e){}
  return {
    async get(key){
      if (hasWS){ try{ const r = await window.storage.get('aiq_'+key); return r ? JSON.parse(r.value) : null; }catch(e){ return null; } }
      if (hasLS){ try{ const v = localStorage.getItem('aiq_'+key); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
      return mem[key] ?? null;
    },
    async set(key, val){
      const s = JSON.stringify(val);
      if (hasWS){ try{ await window.storage.set('aiq_'+key, s); return; }catch(e){} }
      if (hasLS){ try{ localStorage.setItem('aiq_'+key, s); return; }catch(e){} }
      mem[key] = val;
    }
  };
})();

function getSrcLabel(q) {
  if (q.src === 'word') {
    return `모의평가 ${parseInt(q.id.slice(1), 10)}번`;
  } else if (q.src === 'lec') {
    return LEC_LABEL[q.lec];
  }
  return '추가 문제';
}
function getSrcTagHtml(q) {
  const label = getSrcLabel(q);
  const className = q.src === 'word' ? 'src-word' : (q.src === 'lec' ? 'src-lec' : 'src-custom');
  return `<span class="qtag ${className}">${label}</span>`;
}
const TIME_LIMITS = { practice:15, exam:30, retry:15 };
function timeLimit(){
  if (S.session?.mode === 'practice' && S.session?.timeLimit !== undefined) {
    return S.session.timeLimit;
  }
  return TIME_LIMITS[S.session?.mode] || 30;
}


function shuffleQuestionOptions(queue){
  return queue.map(originalQ => {
    const q = JSON.parse(JSON.stringify(originalQ));
    if (!q.opts || q.opts.length === 0) return q;
    const originalOpts = [...q.opts];
    const correctAnswerText = originalOpts[q.a];
    q.opts = shuffle(q.opts);
    q.a = q.opts.indexOf(correctAnswerText);
    return q;
  });
}
function byId(id){ return QUESTIONS.find(q => q.id === id); }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function loadState(){

}
function saveState(){ store.set('wrongIds', S.wrongIds); store.set('history', S.history); }
function addWrong(id){ if(!S.wrongIds.includes(id)){ S.wrongIds.push(id); saveState(); } }
function removeWrong(id){ const i=S.wrongIds.indexOf(id); if(i>-1){ S.wrongIds.splice(i,1); saveState(); } }

/* ─────────── 연습 모드 설정 ─────────── */
const FILTER = { src:'all', lec:'all', timeLimit:15 };
function renderPracticeSetup(){
  stopTimer();
  $('#homeBtn').style.display='';
  const count = filteredPool().length;
  const customCount = QUESTIONS.filter(q => q.src === 'custom').length;
  console.log('[DEBUG] QUESTIONS total:', QUESTIONS.length, 'customCount:', customCount, 'FILTER:', FILTER, 'filteredPool:', filteredPool().length);
  const customButton = customCount > 0 ? fopt('src','custom','추가 문제') : '';
  view().innerHTML = `
  <div class="sheet">
    <h3>🌱 연습 모드 설정</h3>
    <p class="sub">범위를 고르고 시작하세요. 전 문항 객관식이며 순서는 매번 섞입니다.</p>
    <div class="fgroup"><label>출처</label><div class="opts-row">
      ${fopt('src','all','전체')}${fopt('src','word','모의평가 시험지')}${fopt('src','lec','강의노트 6종')}${customButton}
    </div></div>
    <div class="fgroup" style="${FILTER.src==='lec'?'':'display:none'}"><label>강의 회차</label><div class="opts-row">
      ${fopt('lec','all','전체')}${[1,2,3,4,5,6].map(n=>fopt('lec',String(n),n+'회차')).join('')}
    </div></div>
    <div class="fgroup"><label>풀이 제한 시간</label><div class="opts-row">
      ${foptTime(10, '10초')}${foptTime(15, '15초 (기본)')}${foptTime(30, '30초')}${foptTime(60, '60초')}${foptTime(999, '제한 없음')}
    </div></div>
    <button class="start-btn" ${count?'':'disabled'} onclick="startPractice()">연습 시작 · ${count}문항</button>
  </div>`;
}
function foptTime(val, label){
  const on = FILTER.timeLimit === val ? 'on' : '';
  return `<button class="fopt ${on}" onclick="setPracticeTime(${val})">${label}</button>`;
}
function setPracticeTime(val){
  FILTER.timeLimit = val;
  renderPracticeSetup();
}
function fopt(group, val, label){
  const on = FILTER[group]===val ? 'on':'';
  return `<button class="fopt ${on}" onclick="setFilter('${group}','${val}')">${label}</button>`;
}
function setFilter(g,v){ FILTER[g]=v; if(g==='src'&&v!=='lec') FILTER.lec='all'; renderPracticeSetup(); }
function filteredPool(){
  return QUESTIONS.filter(q=>{
    if (FILTER.src!=='all' && q.src!==FILTER.src) return false;
    if (FILTER.src==='lec' && FILTER.lec!=='all' && String(q.lec)!==FILTER.lec) return false;
    return true;
  });
}

/* ─────────── 세션 시작 ─────────── */
function startPractice(){
  const pool = shuffle(filteredPool());
  if(!pool.length) return;
  const shuffledPool = shuffleQuestionOptions(pool);
  S.session = { mode:'practice', queue:shuffledPool, idx:0, correct:0, streak:0, answers:[], timeLimit: FILTER.timeLimit || 15 };
  saveSessionState();
  renderQuestion();
}
function startExam(){
  const mcqs = QUESTIONS.filter(q=>q.type==='mcq');
  const picked = shuffle(mcqs).slice(0,60);
  const shuffledPicked = shuffleQuestionOptions(picked);
  S.session = { mode:'exam', queue:shuffledPicked, idx:0, correct:0, streak:0, answers:[] };
  saveSessionState();
  renderQuestion();
}
function startRetry(){
  const pool = shuffle(S.wrongIds.map(byId).filter(Boolean));
  if(!pool.length){ renderRetryEmpty(); return; }
  const shuffledPool = shuffleQuestionOptions(pool);
  S.session = { mode:'retry', queue:shuffledPool, idx:0, correct:0, streak:0, answers:[] };
  saveSessionState();
  renderQuestion();
}

function saveSessionState() {
  if (S.session) {
    store.set('session', {
      mode: S.session.mode,
      queue: S.session.queue,
      idx: S.session.idx,
      correct: S.session.correct,
      streak: S.session.streak,
      answers: S.session.answers,
      timeLimit: S.session.timeLimit,
      remainMs: S.session.remainMs,
      paused: S.session.paused
    });
  }
}

function clearSessionState() {
  store.set('session', null);
}

function togglePause() {
  const ss = S.session;
  if (!ss) return;
  if (ss.answers.length > ss.idx) return;
  
  if (ss.paused) {
    ss.paused = false;
    $('#pauseBtnTxt').textContent = '일시정지';
    const overlay = $('#pauseOverlay');
    if (overlay) overlay.remove();
    
    document.querySelectorAll('.choice').forEach(b => {
      if (ss.answers.length <= ss.idx) {
        b.disabled = false;
      }
    });
    
    startCountdown();
    saveSessionState();
  } else {
    ss.paused = true;
    $('#pauseBtnTxt').textContent = '재개';
    
    if (S.deadline) {
      ss.remainMs = S.deadline - Date.now();
    }
    
    stopTimer();
    
    const qcard = $('.qcard');
    if (qcard) {
      const overlay = document.createElement('div');
      overlay.id = 'pauseOverlay';
      overlay.className = 'think-box';
      overlay.style.marginTop = '14px';
      overlay.innerHTML = `<b>⏸️ 일시정지 중</b><br>풀이가 중단되었습니다. '재개' 버튼을 누르면 이어서 진행됩니다.`;
      const choices = $('#choices');
      choices.parentNode.insertBefore(overlay, choices.nextSibling);
    }
    
    document.querySelectorAll('.choice').forEach(b => b.disabled = true);
    saveSessionState();
  }
}

function resumeSession() {
  if (!S.session) return goHome();
  renderQuestion();
}

function discardSession() {
  if (confirm("진행 중인 풀이를 취소하고 처음부터 새로 시작하시겠습니까?")) {
    clearSessionState();
    S.session = null;
    renderHome();
  }
}

function startCountdown(){
  const fg = $('#ringFg'), num = $('#ringNum'), ring = $('#ring');
  const C = 251.3;
  const LIMIT = timeLimit();
  if (LIMIT >= 999) {
    markTimerDone('∞');
    return;
  }
  let startMs = LIMIT*1000;
  if (S.session && S.session.remainMs !== undefined && S.session.remainMs > 0) {
    startMs = S.session.remainMs;
    delete S.session.remainMs;
  }
  const warnAt = Math.ceil(LIMIT/2), dangerAt = Math.max(3, Math.round(LIMIT/5));
  S.deadline = Date.now() + startMs;
  S.timer = setInterval(()=>{
    const remainMs = S.deadline - Date.now();
    const left = Math.max(0, Math.ceil(remainMs/1000));
    if(!document.body.contains(ring)){ stopTimer(); return; }
    num.textContent = left;
    fg.style.strokeDashoffset = C * Math.min(1, Math.max(0, 1 - remainMs/(LIMIT*1000)));
    ring.classList.toggle('warn', left<=warnAt && left>dangerAt);
    ring.classList.toggle('danger', left<=dangerAt && left>0);
    if (remainMs<=0){ stopTimer(); onTimeout(); }
  }, 120);
}

function markTimerDone(label){
  const ring=$('#ring'); if(!ring) return;
  ring.classList.remove('warn','danger'); ring.classList.add('done');
  $('#ringNum').textContent=label;
  $('#ringFg').style.strokeDashoffset = 0;
}

/* ─────────── 응답 처리 ─────────── */
function recordAnswer(q, correct, pickedIdx){
  const ss = S.session;
  ss.answers.push({ id:q.id, correct, picked:pickedIdx });
  S.history.solved++; if(correct) S.history.correct++;
  if (correct){
    ss.correct++; ss.streak++;
    if (ss.mode==='retry') removeWrong(q.id);
  } else {
    ss.streak=0;
    addWrong(q.id);
  }
  saveState();
  saveSessionState();
}

function pickAnswer(i){
  const ss=S.session; if(!ss) return;
  const q=ss.queue[ss.idx];
  if(ss.answers.length>ss.idx) return;
  stopTimer();
  const correct = i===q.a;
  recordAnswer(q, correct, i);
  if (ss.mode==='exam'){
    document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
    const el=document.querySelector(`.choice[data-i="${i}"]`); if(el) el.classList.add('picked');
    markTimerDone('제출');
    setTimeout(nextQuestion, 320);
  } else {
    revealMcq(q, i, correct, false);
  }
}

function onTimeout(){
  const ss=S.session; if(!ss) return;
  const q=ss.queue[ss.idx];
  if (ss.answers.length>ss.idx) return;
  recordAnswer(q, false, null);
  if (ss.mode==='exam'){ markTimerDone('시간초과'); setTimeout(nextQuestion, 320); }
  else revealMcq(q, null, false, true);
}

function revealMcq(q, pickedIdx, correct, timeout){
  markTimerDone(correct?'정답':'오답');
  document.querySelectorAll('.choice').forEach(b=>{
    b.disabled=true;
    const i = +b.dataset.i;
    if (i===q.a) b.classList.add('correct');
    else if (i===pickedIdx) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  if (correct) fxCorrect(S.session.streak); else fxWrong(timeout);
  $('#revealSlot').innerHTML = `
    <div class="reveal ${correct?'ok':'no'}">
      <div class="verdict">${correct?'🎉 정답!':(timeout?'⏰ 시간 초과!':'❌ 오답')}</div>
      <div class="ans-line">정답 : <b>${'ABCD'[q.a]}. ${esc(q.opts[q.a])}</b></div>
      <div class="expl-label">해설</div>
      <div class="expl">${esc(q.expl)}</div>
    </div>
    <button class="next-btn" onclick="nextQuestion()">다음 문항 →</button>`;
  $('.next-btn').focus();
}


function nextQuestion(){
  const ss=S.session; if(!ss) return;
  stopTimer();
  if (ss.idx+1 >= ss.queue.length){ renderResult(); return; }
  ss.idx++;
  saveSessionState();
  renderQuestion();
}
function quitSession(){
  const ss=S.session; if(!ss) return goHome();
  clearSessionState();
  if (ss.answers.length && ss.mode!=='practice') { renderResult(true); }
  else goHome();
}

/* ─────────── 이펙트 ─────────── */
function fxCorrect(streak){
  const fx=$('#fx');
  const colors=['#0E7C66','#18A184','#F5A623','#2F5FD0','#FF9A3D'];
  for(let i=0;i<26;i++){
    const c=document.createElement('div'); c.className='confetti';
    c.style.left=(35+Math.random()*30)+'%';
    c.style.top='-12px';
    c.style.background=colors[i%colors.length];
    c.style.animationDuration=(0.9+Math.random()*0.9)+'s';
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    fx.appendChild(c); setTimeout(()=>c.remove(),1900);
  }
  stampFx('⭕');
  if (streak>=2){
    const cb=$('#combo'); cb.style.display='block'; cb.textContent=`🔥 ${streak} COMBO`;
    clearTimeout(cb._t); cb._t=setTimeout(()=>cb.style.display='none',1500);
  }
}
function fxWrong(timeout){ stampFx(timeout?'⏰':'❌'); }
function stampFx(ch){
  const s=document.createElement('div'); s.className='stamp'; s.textContent=ch;
  document.body.appendChild(s); setTimeout(()=>s.remove(),620);
}

    ${wrong.map(a=>{

    }).join('')}

  <div class="qcard" style="margin-bottom:14px">
    <div class="qtags">
      <span class="qtag src-word" style="background:var(--blue-soft);color:var(--blue)">레퍼런스</span>
      <span class="qtag cat">수업 요약본</span>
    </div>
    <div class="qtext" style="margin-bottom:6px">📖 1차 역량평가 대비 강의 레퍼런스</div>
    <p style="font-size:.84rem;color:var(--sub);line-height:1.6;word-break:keep-all">
      강사가 현장에서 배포한 강의 노트를 문제 풀이 카드와 동일하게 전체 화면으로 조회할 수 있습니다. 원하는 회차를 선택하면 해당 강의 레퍼런스가 카드 프레임 내에 전체 화면으로 열립니다.
    </p>
  </div>
  <div class="wt-list">
    ${list.map(l=>`<button class="wt-item" onclick="renderLectureDetail(${l.n})">
      <span class="no">${String(l.n).padStart(2,'0')}</span>
      <span><h4>${esc(l.title)}</h4><p>${l.n}회차 강의 노트 레퍼런스</p></span>
      <span class="arrow">→</span>
    </button>`).join('')}
  </div>`;
  window.scrollTo({top:0});
}

function renderLectureDetail(n){
  $('#homeBtn').style.display='';
  const htmlContent = LECTURES[n];
  const list = [
    { n:1, title:"AI 에이전트 시대" },
    { n:2, title:"AI 프론티어 탐색" },
    { n:3, title:"AI 서비스 워크플로우" },
    { n:4, title:"바이브코딩1" },
    { n:5, title:"바이브코딩2" },
    { n:6, title:"AI 에이전트 개발" }
  ];
  const prev = list.find(x=>x.n===n-1), next = list.find(x=>x.n===n+1);
  
  view().innerHTML = `
  <div class="qcard" style="padding:10px; height: 75vh; min-height:550px; display:flex; flex-direction:column; box-shadow:var(--shadow);">
    <iframe id="lectureIframe" sandbox="allow-scripts allow-same-origin" style="width:100%; height:100%; border:none; border-radius:12px; background:#fff;" srcdoc=""></iframe>
  </div>
  <div class="wd-nav" style="margin-top:14px">
    ${prev?`<button onclick="renderLectureDetail(${prev.n})">← ${esc(prev.title)}</button>`:''}
    <button onclick="renderLectureList()">목록</button>
    ${next?`<button onclick="renderLectureDetail(${next.n})">${esc(next.title)} →</button>`:''}
  </div>`;
  
  const iframe = document.getElementById('lectureIframe');
  iframe.srcdoc = htmlContent;
  window.scrollTo({top:0});
}


/* ─────────── 키보드 ─────────── */
document.addEventListener('keydown', e=>{
  const ss=S.session; if(!ss) return;
  if (['1','2','3','4'].includes(e.key)){
    const q=ss.queue[ss.idx];
    if (q && ss.answers.length<=ss.idx){
      const btn=document.querySelector(`.choice[data-i="${+e.key-1}"]`);
      if(btn && !btn.disabled) pickAnswer(+e.key-1);
    }
  }
  if (e.key==='Enter' || e.key==='ArrowRight'){
    const nb=document.querySelector('.next-btn');
    if(nb){ e.preventDefault(); nextQuestion(); }
  }
});

/* ─────────── 부팅 ─────────── */
(async ()=>{
  await loadState();
  const savedSession = await store.get('session');
  if (savedSession) {
    S.session = savedSession;
    renderHome(true);
  } else {
    renderHome();
  }
})();

</script>
