인 절차, 책임 체계를 정하는 관리 원칙'은 AI 가동 및 코드 생성 시 적용되는 사용 범위, 관리 기준, 승인/책임 절차라는 거버넌스 (Governance) 관리 체계의 핵심을 완전하게 짚고 있습니다. **오답인 이유**: '외부 위협으로부터 원격 서버를 보호하기 위한...'은 네트워크 보안 인프라 구축, '오픈소스 라이브러리의 실시간 코드 에러를 자동으로...'는 CI/CD 정적 코드 분석 툴, '데이터베이스 접근 권한을 IP 대역별로 암호화하여...'는 전통적인 데이터베이스 접근 제어 기술에 치우친 설명이므로 오답입니다."}, {"id": "W004", "src": "word", "lec": 0, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "데이터 분석 업무에서는 파일을 바로 읽을지, DB에 적재해 조회할지, 어떤 기준으로 검증할지에 따라 성능과 재현성이 달라진다. 다음 중 'Text-to-SQL'에 대한 설명으로 가장 적절한 것은?", "opts": ["텍스트로 구성된 비정형 데이터 파일의 형태소를 분석하여 정형 데이터셋으로 변환하는 방식", "데이터베이스 내의 SQL 실행 로그를 텍스트 보고서 형태로 자동 요약해주는 진단 방식", "자연어 문자열 데이터를 가시적인 대시보드 그래픽이나 차트로 즉시 렌더링하는 방식", "자연어 질문을 SQL 쿼리로 변환해 데이터베이스 내부의 데이터를 원활히 조회를 돕는 방식"], "a": 3, "expl": "**정답인 이유**: '자연어 질문을 SQL 쿼리로 변환해 데이터베이스 내부의 데이터를 원활히 조회를 돕는 방식'은 사용자의 일상 언어 (자연어) 질문을 분석하여 관계형 데이터베이스를 조회할 수 있는 고유한 SQL 구문으로 모델이 역추론·자동 변환해 주는 기술의 목적을 명확히 제시합니다. **오답인 이유**: '텍스트로 구성된 비정형 데이터 파일의 형태소를...'은 형태소 분석 및 전처리 파이프라인, '데이터베이스 내의 SQL 실행 로그를 텍스트 보고서...'는 DBMS 성능 분석 요약 도구, '자연어 문자열 데이터를 가시적인 대시보드 그래픽이나...'는 비정형 데이터 기반 자동 시각화 모듈에 가깝습니다."}, {"id": "W005", "src": "word", "lec": 0, "cat": "생성형AI활용", "diff": "중", "type": "mcq", "q": "생성형 AI를 업무에 적용할 때는 도구 이름을 아는 것보다 어떤 문제를 해결하고 어떤 한계를 통제할지 판단하는 역량이 중요하다. 다음 중 '브리콜라주 사고'에 대한 설명으로 가장 적절한 것은?", "opts": ["기존 시스템을 완전히 폐기하고 클라우드 네이티브 기반의 최신 AI 솔루션을 전면 도입하는 접근", "가용한 도구와 지식을 조합해 현실에서 마주한 당면 문제를 해결하는 실천적 문제해결 접근", "AI 모델의 완벽한 논리성과 수학적 엄밀성을 증명하기 위해 학술적 검증 프로세스에 의존하는 접근", "예산과 자원에 구애받지 않고 시장에 존재하는 가장 비싼 엔터프라이즈 AI 솔루션을 구매하는 접근"], "a": 1, "expl": "**정답인 이유**: '가용한 도구와 지식을 조합해 현실에서 마주한 당면 문제를 해결하는 실천적 문제해결 접근'은 고가의 거창한 도구를 새롭게 구매하거나 만드는 대신, 지금 즉시 손에 쥐고 쓸 수 있는 가용한 자원 (HTML, 엑셀, LLM 등)을 유기적으로 이어 붙여 눈앞의 문제를 빠르게 해결해 내는 손재주꾼형 실천 방식인 브리콜라주 (Bricolage)의 철학을 반영하고 있습니다. **오답인 이유**: '기존 시스템을 완전히 폐기하고 클라우드 네이티브...'는 빅뱅 방식의 인프라 전환 계획, 'AI 모델의 완벽한 논리성과 수학적 엄밀성을...'은 고도로 이론화된 학술 검증, '예산과 자원에 구애받지 않고 시장에 존재하는 가장 비싼...'은 벤더 종속적인 솔루션 구매 방식을 뜻하므로 오답입니다."}, {"id": "W006", "src": "word", "lec": 0, "cat": "서비스구현", "diff": "상", "type": "mcq", "q": "공공기관 AI 활용에서는 편의성뿐 아니라 망 분리, 실행 권한, 검증 절차, 변경 이력 관리가 함께 요구된다. 다음 중 '외부 생성·내부 실행 분리'에 대한 설명으로 가장 적절한 것은?", "opts": ["클라우드 웹 서버에서 데이터를 수집하고 연산 처리는 사용자의 개인 모바일 단말기에서 수행하는 전략", "오픈소스 코드를 상용 소프트웨어 라이선스와 법적으로 격리하여 소스코드 유출을 방지하는 컴플라이언스", "모든 개발 소스코드를 외부 공개 저장소에 보관하되 내부 시스템 연결은 VPN으로 차단하는 운영 전략", "외부망에서 코드를 생성하고 내부망에서는 검증절차를 통과한 안전한 산출물만 실행하는 폐쇄망 대응 전략"], "a": 3, "expl": "**정답인 이유**: '외부망에서 코드를 생성하고 내부망에서는 검증절차를 통과한 안전한 산출물만 실행하는 폐쇄망 대응 전략'은 인터넷망이 연결된 외부 환경에서 AI 등을 보조 수단 삼아 코드를 효율적으로 생성한 뒤, 무결성이 입증된 안전한 정적 결과물 (HTML 등)만 폐쇄적인 공공 내부망에 들여와 수행시킨다는 공공 가이드에 완벽히 부합합니다. **오답인 이유**: '클라우드 웹 서버에서 데이터를 수집하고 연산 처리는...'은 에지 컴퓨팅 기술, '오픈소스 코드를 상용 소프트웨어 라이선스와 법적으로...'는 라이선스 검수 정책, '모든 개발 소스코드를 외부 공개 저장소에 보관하되...'는 단순 VPN 제어 기반 분산 운영에 대한 설명이므로 오답입니다."}, {"id": "W007", "src": "word", "lec": 0, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "음성·비정형 데이터 분석은 원본 수집, 전사, 요약, 저장, 검증 단계가 이어지므로 각 단계의 오류와 책임 범위를 분리해야 한다. 다음 중 '통화 녹취 전사 워크플로우'에 대한 설명으로 가장 적절한 것은?", "opts": ["음성 파일을 텍스트로 변환한 뒤 요약, 감성 분석, 저장으로 이어지는 처리 흐름", "통화 중 발생하는 백그라운드 노이즈와 주변 소음을 물리적으로 상쇄하는 필터링 흐름", "녹음된 파일의 주파수 대역을 스캔하여 특정 인물의 목소리 일치 여부를 판별하는 흐름", "보안 취약점 진단을 위해 대규모 통화 서버의 암호화 네트워크 세션을 모니터링하는 흐름"], "a": 0, "expl": "**정답인 이유**: '음성 파일을 텍스트로 변환한 뒤 요약, 감성 분석, 저장으로 이어지는 처리 흐름'은 오디오 원본 파일을 문자열 (텍스트)로 번역하는 단순 전사 작업을 시작으로, 요약 및 2차 감성 판독 후 저장소로 넘겨주는 데이터 가치 사슬 흐름을 순차적으로 명확히 서술하고 있습니다. **오답인 이유**: '통화 중 발생하는 백그라운드 노이즈와 주변...'은 하드웨어 노이즈 캔슬링 필터, '녹음된 파일의 주파수 대역을 스캔하여 특정 인물의...'는 화자 식별 바이오 보안, '보안 취약점 진단을 위해 대규모 통화 서버의 암호화...'는 네트워크 패킷에 관한 망 모니터링 기술이므로 오답입니다."}, {"id": "W008", "src": "word", "lec": 0, "cat": "생성형AI활용", "diff": "중", "type": "mcq", "q": "문서 검색형 AI를 설계할 때는 원문을 어떻게 나누고 찾고 모델에 전달하는지에 따라 정확도, 비용, 운영 난도가 달라진다. 다음 중 'RAG'에 대한 설명으로 가장 적절한 것은?", "opts": ["AI 모델의 가중치를 도메인 문서로 재학습시켜 내부의 내부 지식을 고착화하는 방식", "검색된 근거 문서를 LLM 입력에 결합해 답변의 정확성과 신뢰성 있는 근거성을 높이는 방식", "문서 가독성을 높이기 위해 그래픽 디자인과 레이아웃을 인공지능으로 자동 재배치하는 방식", "인터넷 연결 없이 프롬프트 명령어의 조합만으로 모델의 추론 논리를 강제 통제하는 방식"], "a": 1, "expl": "**정답인 이유**: '검색된 근거 문서를 LLM 입력에 결합해 답변의 정확성과 신뢰성 있는 근거성을 높이는 방식'은 정보 저장고 (벡터DB 등)에서 질의어 관련 원본 문서를 검색해 낸 뒤, 그 객관적 지식을 초거대 언어 모델 (LLM)의 컨텍스트 창에 주입하여 신뢰성 있는 응답을 내도록 유도하는 RAG (검색 증강 생성)의 핵심 작동 원리입니다. **오답인 이유**: 'AI 모델의 가중치를 도메인 문서로 재학습시켜...'는 파인튜닝 (Fine-Tuning), '문서 가독성을 높이기 위해 그래픽 디자인과 레이아웃을...'는 서식 레이아웃 렌더링 툴, '인터넷 연결 없이 프롬프트 명령어의 조합만으로...'는 순수 수동 프롬프트 규칙 설계에 머물러 오답입니다."}, {"id": "W009", "src": "word", "lec": 0, "cat": "서비스구현", "diff": "하", "type": "mcq", "q": "웹 기반 업무 도구를 만들 때는 화면에서 처리할 일, 서버가 맡을 일, 내부망 제약과 배포 방식을 함께 구분해야 한다. 다음 중 'HTML·CSS·JavaScript 단일 파일'에 대한 설명으로 가장 적절한 것은?", "opts": ["브라우저만으로 실행되도록 구조, 디자인, 기능을 하나의 정적 웹 파일에 담는 방식", "웹 백엔드 서버의 쿼리 최적화 속도를 극대화하기 위한 백엔드 전용 아카이브 방식", "컴파일러 없이 모바일 앱을 독립적으로 즉각 실행시켜주는 바이너리 실행 파일 방식", "인터넷망과 내부망을 번갈아가며 스위칭할 수 있도록 경로 지정을 도와주는 설정 방식"], "a": 0, "expl": "**정답인 이유**: '브라우저만으로 실행되도록 구조, 디자인, 기능을 하나의 정적 웹 파일에 담는 방식'은 별도의 복잡한 백엔드 서버나 복수 파일 설치 경로 관리가 필요 없도록 구조 (HTML), 양식 (CSS), 로직 (JS)을 통째로 묶어 로컬 브라우저 단독으로 무조건 구동되게 만드는 정적 산출물의 명료한 정의입니다. **오답인 이유**: '웹 백엔드 서버의 쿼리 최적화 속도를 극대화하기...'은 DBMS 스키마 패키징, '컴파일러 없이 모바일 앱을 독립적으로 즉각 실행시켜주는...'은 모바일 실행 바이너리 (APK 등), '인터넷망과 내부망을 번갈아가며 스위칭할 수 있도록...'은 라우팅 라인 게이트웨이 정책에 기반한 서술이므로 오답입니다."}, {"id": "W010", "src": "word", "lec": 0, "cat": "데이터분석", "diff": "하", "type": "mcq", "q": "데이터 분석 업무에서는 파일을 바로 읽을지, DB에 적재해 조회할지, 어떤 기준으로 검증할지에 따라 성능과 재현성이 달라진다. 다음 중 '데이터베이스 저장과 조회'에 대한 설명으로 가장 적절한 것은?", "opts": ["메모리 내 물리 장치의 섹터 불량을 파악하여 데이터를 다른 저장 매체로 원격 복사하는 복구 프로세스", "데이터베이스의 핵심 기능을 데이터를 안전하게 저장하고 필요한 조건으로 조회하는 일로 보는 관점", "대용량 비정형 데이터를 수집하여 딥러닝 인공신경망의 가중치로 전환하는 분석 파이프라인 관점", "로컬 텍스트 파일의 문자열 에러를 자동으로 검출하여 다국어 코드로 변환해주는 전처리 라이브러리 관점"], "a": 1, "expl": "**정답인 이유**: '데이터베이스의 핵심 기능을 데이터를 안전하게 저장하고 필요한 조건으로 조회하는 일로 보는 관점'은 데이터를 하드디스크 등 물리 공간에 유실 없이 보관 (안전 저장)하고, 사용자가 원하는 필터식과 매칭 조건을 동원해 고속 검색 (조건 조회)해 낸다는 DBMS의 본질적이고 상식적인 효용을 강조합니다. **오답인 이유**: '메모리 내 물리 장치의 섹터 불량을 파악하여 데이터를...'은 디스크 물리 섹터 복구 기술, '대용량 비정형 데이터를 수집하여 딥러닝 인공신경망의...'은 엔드투엔드 딥러닝 훈련 프레임워크, '로컬 텍스트 파일의 문자열 에러를 자동으로 검출하여...'는 텍스트 인코딩 디코딩 전처리 툴에 불과하여 오답입니다."}, {"id": "W011", "src": "word", "lec": 0, "cat": "생성형AI활용", "diff": "중", "type": "mcq", "q": "문서 검색형 AI를 설계할 때는 원문을 어떻게 나누고 찾고 모델에 전달하는지에 따라 정확도, 비용, 운영 난도가 달라진다. 다음 중 '청크 분할'에 대한 설명으로 가장 적절한 것은?", "opts": ["분산 컴퓨팅 환경에서 데이터를 여러 서버 노드로 물리적으로 쪼개어 스토리지에 백업하는 기법", "딥러닝 임베딩 연산 과정에서 다차원 벡터의 소수점 자릿수를 줄여 메모리 사용량을 줄이는 기법", "긴 문서를 인공지능 검색과 임베딩에 적합한 작은 의미 단위 조각으로 쪼개어 관리하는 기법", "텍스트 내의 특수문자와 이메일, 전화번호 등 불필요한 개인정보를 안전하게 제거하는 전처리 기법"], "a": 2, "expl": "**정답인 이유**: '긴 문서를 인공지능 검색과 임베딩에 적합한 작은 의미 단위 조각으로 쪼개어 관리하는 기법'은 컨텍스트 입력 한계를 넘는 두꺼운 텍스트 문서를 정보 유실이 없는 한도 내에서 작고 압축적인 의미 단위 조각 (Chunk)으로 토막 치는 전처리 절차를 정확히 가리키고 있습니다. **오답인 이유**: '분산 컴퓨팅 환경에서 데이터를 여러 서버 노드로 물리적으로...'는 분산 파일 시스템 (HDFS 등)의 데이터 블록 분산 백업, '딥러닝 임베딩 연산 과정에서 다차원 벡터의 소수점...'은 모델 양자화 (Quantization), '텍스트 내의 특수문자와 이메일, 전화번호 등 불필요한...'은 개인정보 가명화 정제 기술이므로 오답입니다."}, {"id": "W012", "src": "word", "lec": 0, "cat": "서비스구현", "diff": "하", "type": "mcq", "q": "웹 기반 업무 도구를 만들 때는 화면에서 처리할 일, 서버가 맡을 일, 내부망 제약과 배포 방식을 함께 구분해야 한다. 다음 중 'HTML·CSS·JavaScript 역할 분리'에 대한 설명으로 가장 적절한 것은?", "opts": ["백엔드 데이터베이스의 저장, 검색, 인덱싱 역할을 개별 파일로 분할하여 성능을 높이는 아키텍처 원칙", "HTML은 구조, CSS는 표현, JavaScript는 기능을 담당하게 명확히 책임을 나누는 웹 프론트엔드 기본 원칙", "네트워크 레이어에서 하이퍼텍스트 전송의 암호화 키 관리, 세션 유지, 에러 검출을 개별 통제하는 원칙", "UI/UX 디자이너와 서버 개발자 간의 작업 충돌을 완화하기 위해 소스코드 저장소를 물리 분리하는 원칙"], "a": 1, "expl": "**정답인 이유**: 'HTML은 구조, CSS는 표현, JavaScript는 기능을 담당하게 명확히 책임을 나누는 웹 프론트엔드 기본 원칙'은 웹 표준의 기본 수칙인 문서의 의미적 유연성 배치 (HTML 구조), 비주얼 테마 연출 (CSS 표현), 그리고 인터랙티브 비즈니스 동작 (JS 기능)의 관심사 분리 대원칙을 정확하게 명시합니다. **오답인 이유**: '백엔드 데이터베이스의 저장, 검색, 인덱싱 역할을 개별...'은 데이터베이스 물리 튜닝 구조화, '네트워크 레이어에서 하이퍼텍스트 전송의 암호화 키...'는 OSI 7계층 내 통신 프로토콜 통제, 'UI/UX 디자이너와 서버 개발자 간의 작업 충돌을...'은 팀 거버넌스용 형상 관리 레포지토리 정책이므로 관계가 멉니다."}, {"id": "W013", "src": "word", "lec": 0, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "데이터 기반 업무 판단에서는 처리 방식과 검증 기준이 결과의 정확도와 신뢰성에 직접 영향을 준다. 다음 중 '벌크 인서트'에 대한 설명으로 가장 적절한 것은?", "opts": ["관계형 데이터베이스 구조를 변경하기 위해 기존 컬럼들의 데이터 타입을 대형 크기로 자동 마이그레이션하는 작업", "인덱스 검색 속도를 높이기 위해 물리 테이블의 데이터를 역순으로 재배치하여 파일 전체 용량을 키우는 기법", "대량의 데이터를 한 행씩 개별 입력하지 않고 하나의 큰 단위로 묶어서 스토리지에 빠르게 적재하는 방식", "데이터베이스의 동시성 제어를 위해 특정 트랜잭션이 완료될 때까지 테이블 전체에 강한 잠금을 거는 행위"], "a": 2, "expl": "**정답인 이유**: '대량의 데이터를 한 행씩 개별 입력하지 않고 하나의 큰 단위로 묶어서 스토리지에 빠르게 적재하는 방식'은 수만 건 단위의 빅데이터 행을 포문 루프를 돌며 개별적으로 삽입하는 무모한 비효율을 막고자, 한꺼번에 하나의 대용량 청크 어레이로 일괄 처리·인서트 시키는 성능 튜닝 기법을 직관적으로 설명합니다. **오답인 이유**: '관계형 데이터베이스 구조를 변경하기 위해 기존 컬럼들의...'은 스키마 데이터 마이그레이션 변경, '인덱스 검색 속도를 높이기 위해 물리 테이블의 데이터를...'은 물리적 클러스터링 단편화 정렬, '데이터베이스의 동시성 제어를 위해 특정 트랜잭션이...'는 데이터베이스 배타적 잠금 (Table Lock)을 설명하므로 오답입니다."}, {"id": "W014", "src": "word", "lec": 0, "cat": "생성형AI활용", "diff": "중", "type": "mcq", "q": "문서 검색형 AI를 설계할 때는 원문을 어떻게 나누고 찾고 모델에 전달하는지에 따라 정확도, 비용, 운영 난도가 달라진다. 다음 중 '오버랩'에 대한 설명으로 가장 적절한 것은?", "opts": ["임베딩 벡터의 차원이 할당된 메모리 한계를 초과하여 서브 메모리로 누수되는 시스템 에러 현상", "두 개 이상의 프롬프트 명령어가 충돌하여 LLM이 답변 출력을 거부하고 타임아웃 오류를 내는 현상", "비정형 문서 스캔 과정에서 광학 문자 인식 엔진이 동일 글자를 반복해서 중복 판독하는 에러 현상", "청크를 분할하는 경계면에서 발생하는 정보 문맥 손실을 줄이기 위해 앞뒤 내용을 일부 중첩하는 기법"], "a": 3, "expl": "**정답인 이유**: '청크를 분할하는 경계면에서 발생하는 정보 문맥 손실을 줄이기 위해 앞뒤 내용을 일부 중첩하는 기법'은 텍스트 문서를 인위적으로 분할 적재했을 때 칼로 자른 경계 부분의 단어들이 고유의 문맥 의미를 소실할 위험을 완화코자, 앞 청크의 끝과 뒤 청크의 머리 부분을 의도적으로 일정 바이트 중복하여 교집합을 주는 오버랩 (Overlap) 매커니즘입니다. **오답인 이유**: '임베딩 벡터의 차원이 할당된 메모리 한계를 초과하여...'는 힙 메모리 릭 (Leak), '두 개 이상의 프롬프트 명령어가 충돌하여 LLM이 답변...'은 프롬프트 경합 타임아웃, '비정형 문서 스캔 과정에서 광학 문자 인식 엔진이...'는 OCR 해독 스캔 오류를 나타냅니다."}, {"id": "W015", "src": "word", "lec": 0, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "웹 기반 업무 도구를 만들 때는 화면에서 처리할 일, 서버가 맡을 일, 내부망 제약과 배포 방식을 함께 구분해야 한다. 다음 중 'CDN 방식'에 대한 설명으로 가장 적절한 것은?", "opts": ["로컬 내부의 캐시 경로 지정을 최적화하여 브라우저의 렌더링 속도를 제어하는 아키텍처", "웹 소스코드를 주기적으로 난독화하여 외부 해킹 세력의 무단 분석을 방어하는 프레임워크", "물리적으로 분산된 외부 서버에서 라이브러리를 네트워크를 통해 실시간으로 불러와 사용하는 방식", "네트워크 스위치의 하드웨어 포트를 가상화하여 대역폭 제한을 우회하는 네트워크 망 스위칭 기술"], "a": 2, "expl": "**정답인 이유**: '물리적으로 분산된 외부 서버에서 라이브러리를 네트워크를 통해 실시간으로 불러와 사용하는 방식'은 소스코드를 자신의 로컬 물리 하드디스크 공간에 일일이 받아 배치하는 번잡함을 피하고, 지리적으로 분산 구축된 원격 캐시 서버 네트워크망 (CDN 주소)에서 필요한 자바스크립트 등 라이브러리를 동적으로 로딩해 연결 구동하는 웹 배포 아키텍처입니다. **오답인 이유**: '로컬 내부의 캐시 경로 지정을 최적화하여 브라우저의...'는 디스크 I/O 최적화, '웹 소스코드를 주기적으로 난독화하여 외부 해킹 세력의...'는 소스코드 컴파일 난독화 기술, '네트워크 스위치의 하드웨어 포트를 가상화하여 대역폭...'는 가상 로컬 네트워크 (VLAN) 영역의 스위칭에 해당하므로 무관합니다."}, {"id": "W016", "src": "word", "lec": 0, "cat": "데이터분석", "diff": "상", "type": "mcq", "q": "데이터 분석 업무에서는 파일을 바로 읽을지, DB에 적재해 조회할지, 어떤 기준으로 검증할지에 따라 성능과 재현성이 달라진다. 다음 중 '인덱스 전략'에 대한 설명으로 가장 적절한 것은?", "opts": ["데이터 무결성을 지키기 위해 테이블의 제약 조건을 엄격하게 정의하는 물리 스키마 설계", "테이블 내 중복 적재된 행 데이터를 찾아내어 주기적으로 완전 삭제하는 데이터 정리 지침", "메모리 절약을 위해 자주 사용되지 않는 파티션을 물리적 세컨더리 디스크로 밀어내는 기법", "특정 조회 조건에 자주 쓰이는 컬럼을 고속으로 찾도록 별도의 탐색 데이터 구조를 만드는 전략"], "a": 3, "expl": "**정답인 이유**: '특정 조회 조건에 자주 쓰이는 컬럼을 고속으로 찾도록 별도의 탐색 데이터 구조를 만드는 전략'은 수천만 건에 달하는 대용량 테이블에서 특정 레코드를 실시간 색인·서칭해 낼 수 있도록, 다차원 검색 조건 칼럼을 대상으로 B-Tree 등의 영구적인 주소 색인 데이터 구조를 생성 가동하는 쿼리 가속화 기법입니다. **오답인 이유**: '데이터 무결성을 지키기 위해 테이블의 제약 조건을...'는 무결성 참조 제약조건 (Cascading) 스키마, '테이블 내 중복 적재된 행 데이터를 찾아내어 주기적으로...'는 중복 데이터 클렌징 툴, '메모리 절약을 위해 자주 사용되지 않는 파티션을...'은 콜드 데이터 스토리지 이관 아카이빙 가이드이므로 오답입니다."}, {"id": "W017", "src": "word", "lec": 0, "cat": "생성형AI활용", "diff": "중", "type": "mcq", "q": "문서 검색형 AI를 설계할 때는 원문을 어떻게 나누고 찾고 모델에 전달하는지에 따라 정확도, 비용, 운영 난도가 달라진다. 다음 중 '임베딩 모델'에 대한 설명으로 가장 적절한 것은?", "opts": ["텍스트 의미를 다차원 벡터 좌표로 변환하여 문맥적 유사도 검색을 가능하게 하는 신경망 모델", "영문 텍스트 문서를 한글이나 타국 언어로 번역하여 최종 출력의 일치성을 검증하는 번역 모델", "이미지와 비디오 파일 내부의 특정 객체 경계선을 감지하여 레이블 픽셀을 정형화하는 비전 모델", "생성형 AI 모델의 답변 톤앤매너와 말투를 격식체나 공공기관 서식체로 강제 교정해주는 규칙 모델"], "a": 0, "expl": "**정답인 이유**: '텍스트 의미를 다차원 벡터 좌표로 변환하여 문맥적 유사도 검색을 가능하게 하는 신경망 모델'은 인간의 문맥 텍스트가 보유한 어휘 지식의 유사성과 의미론적 연결 상태를 컴퓨터가 정밀 계산 가능한 고차원 공간 상의 실수 배열 매트릭스 (벡터 좌표)로 압축 트랜스폼해 내는 인공지능 모듈의 개념을 완전하게 나타냅니다. **오답인 이유**: '영문 텍스트 문서를 한글이나 타국 언어로 번역하여...'는 다국어 번역 엔진, '이미지와 비디오 파일 내부의 특정 객체 경계선을...'은 컴퓨터 비전 객체 세그멘테이션 신경망, '생성형 AI 모델의 답변 톤앤매너와 말투를 격식체나...'는 단순 후처리 출력 가이드 필터이므로 기술 내용이 상이합니다."}, {"id": "W018", "src": "word", "lec": 0, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "웹 기반 업무 도구를 만들 때는 화면에서 처리할 일, 서버가 맡을 일, 내부망 제약과 배포 방식을 함께 구분해야 한다. 다음 중 '인라인 방식'에 대한 설명으로 가장 적절한 것은?", "opts": ["클라우드 API 공급업체의 중계 서버  형태로 아카이빙한 뒤, 단순 오타나 글자 일치를 넘어 개념적 맥락의 거리상 코사인 유사도를 기준으로 검색하는 전용 데이터 인프라 스토리지의 속성입니다. **오답인 이유**: '엑셀이나 CSV 같은 정형 행렬 데이터를 행과...'은 MySQL 등 전통적 RDBMS, '텍스트 문서의 단순 포함 단어를 매칭하기 위해...'은 엘라스틱서치류 키워드 검색 엔진, '비디오 및 고해상도 그래픽 파일의 픽셀 좌표 정보를...'는 이미지 파일 서버의 백업 구조를 설명한 것입니다."}, {"id": "W021", "src": "word", "lec": 0, "cat": "서비스구현", "diff": "하", "type": "mcq", "q": "웹 기반 업무 도구를 만들 때는 화면에서 처리할 일, 서버가 맡을 일, 내부망 제약과 배포 방식을 함께 구분해야 한다. 다음 중 'CodePen 기반 프로토타이핑'에 대한 설명으로 가장 적절한 것은?", "opts": ["웹 브라우저에서 HTML, CSS, JavaScript를 실험하고 실시간 결과를 확인하는 개발 방식", "서버의 운영체제 커널 코드를 빌드하여 가상화 환경 하드웨어를 직접 제어하고 테스트하는 방식", "클라우드 레포지토리에서 멀티 스레드 패키지의 네트워크 유입 부하를 실시간 테스트하는 방식", "폐쇄망 내부 서버의 보안 취약점 경로 및 소스코드 위변조 여부를 원격으로 진단하는 방식"], "a": 0, "expl": "**정답인 이유**: '웹 브라우저에서 HTML, CSS, JavaScript를 실험하고 실시간 결과를 확인하는 개발 방식'은 귀찮은 IDE 다운로드나 백엔드 로컬 아키텍처 환경 셋팅 단계를 스킵하고 웹 화면으로 직통 연동되는 온라인 컴파일창 (CodePen)에서 실시간 렌더링 피드백을 수령하며 신속히 기능 모듈을 다듬어 내는 초동 프로토타입 전략입니다. **오답인 이유**: '서버의 운영체제 커널 코드를 빌드하여...'는 임베디드 리눅스 커널 빌드, '클라우드 레포지토리에서 멀티 스레드 패키지의...'는 분산 스트레스 트래픽 테스트, '폐쇄망 내부 서버의 보안 취약점 경로 및...'는 소스코드 정적 취약점 보안 감사에 해당하여 틀린 선지입니다."}, {"id": "W022", "src": "word", "lec": 0, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "데이터 분석 업무에서는 파일을 바로 읽을지, DB에 적재해 조회할지, 어떤 기준으로 검증할지에 따라 성능과 재현성이 달라진다. 다음 중 '메타데이터 프로파일링'에 대한 설명으로 가장 적절한 것은?", "opts": ["데이터베이스 가동 중 하드웨어 오작동 로그를 추적하여 백업 세션으로 인계하는 분석 절차", "본격 분석 전에 컬럼명, 샘플 값, 단위, 결측률 등 데이터 내부의 구조 정보를 점검하는 절차", "딥러닝 모델의 학습에 사용된 피처 가중치 매트릭스를 다차원 평면 상에 가시화하는 분석 절차", "개인정보 유출 차단을 위해 텍스트 내부의 식별 정보를 난수 코드로 암호화하는 전처리 절차"], "a": 1, "expl": "**정답인 이유**: '본격 분석 전에 컬럼명, 샘플 값, 단위, 결측률 등 데이터 내부의 구조 정보를 점검하는 절차'는 본격적인 고급 알고리즘 연산이나 집계식 투입 이전에, 로드된 원천 파일의 컬럼 헤더 이름 일치성, 비어있는 널값 비율, 자료형 포맷, 값의 바운더리를 종합 점검하여 무결성을 선 확보하는 데이터 진단 기초 작업입니다. **오답인 이유**: '데이터베이스 가동 중 하드웨어 오작동 로그를...'은 인프라 장애 조치 (Failover), '딥러닝 모델의 학습에 사용된 피처 가중치 매트릭스를...'은 하이퍼파라미터 차원 튜닝 시각화, '개인정보 유출 차단을 위해 텍스트 내부의 식별...'은 데이터 가명화 비식별 정제를 뜻하므로 무관합니다."}, {"id": "W023", "src": "word", "lec": 0, "cat": "생성형AI활용", "diff": "중", "type": "mcq", "q": "문서 검색형 AI를 설계할 때는 원문을 어떻게 나누고 찾고 모델에 전달하는지에 따라 정확도, 비용, 운영 난도가 달라진다. 다음 중 '컨텍스트 윈도우'에 대한 설명으로 가장 적절한 것은?", "opts": ["OS GUI 화면에서 다중 텍스트 창을 활성화하여 개별 모델의 답변 속도를 대조하는 기준 범위", "RAG 파이프라인에서 벡터 데이터베이스의 검색 정밀도를 늘리기 위해 설정하는 필터링 범위", "거대 언어 모델이 단일 추론 과정에서 한 번에 기억하고 참고할 수 있는 입력 데이터 길이의 한계", "인터넷 보안 브라우저 환경에서 공공 인증서 연동을 강제하기 위해 활성화하는 암호화 범위"], "a": 2, "expl": "**정답인 이유**: '거대 언어 모델이 단일 추론 과정에서 한 번에 기억하고 참고할 수 있는 입력 데이터 길이의 한계'는 특정 생성형 인공지능 모델 (LLM)이 단 1회의 응답 시퀀스를 형성하기 위해 주의 깊게 한꺼번에 읽어 들이고해독할 수 있는 입력 토큰 어휘 문자열의 수학적인 상한 임계선을 명시합니다. **오답인 이유**: 'OS GUI 화면에서 다중 텍스트 창을 활성화하여...'는 윈도우 멀티 태스킹 화면 분할, 'RAG 파이프라인에서 벡터 데이터베이스의 검색 정밀도를...'는 유사도 매칭 필터링 탑케이 (Top-K) 스코어, '인터넷 보안 브라우저 환경에서 공공 인증서 연동을...'은 브라우저 가상 키보드 보안 프로그램 작동 구조에 지나지 않아 오답입니다."}, {"id": "W024", "src": "word", "lec": 0, "cat": "서비스구현", "diff": "하", "type": "mcq", "q": "웹 기반 업무 도구를 만들 때는 화면에서 처리할 일, 서버가 맡을 일, 내부망 제약과 배포 방식을 함께 구분해야 한다. 다음 중 '정적 웹 배포'에 대한 설명으로 가장 적절한 것은?", "opts": ["대용량 사용자 질의를 처리하도록 백엔드 SQL 연산 서버 로직을 컨테이너 단위로 제어하는 방식", "동적 연산을 수행하는 서버 사이드 로직 없이 정적 파일만을 웹 주소로 공개하여 배포하는 방식", "브라우저 세션의 쿠키 데이터를 가로채 서버 캐시 메모리에 강제 상주시키는 다이나믹 렌더링 방식", "보안 승인을 획득하지 못한 미검증 소스코드를 네트워크 게이트웨이 레벨에서 자동 차단하는 방식"], "a": 1, "expl": "**정답인 이유**: '동적 연산을 수행하는 서버 사이드 로직 없이 정적 파일만을 웹 주소로 공개하여 배포하는 방식'은 실시간 유동적인 DB 쿼리를 직접 수행하는 서버 연산 파트 (Java, Node 백엔드 등)의 조력 없이 오직 HTML, CSS 파일 그 자체를 퍼블릭 웹 주소 공간에 안착시켜 브라우저 지시대로 즉각 뿌려내는 경량 배포 전략입니다. **오답인 이유**: '대용량 사용자 질의를 처리하도록 백엔드 SQL 연산...'은 컨테이너 기반 클라우드 오토스케일링, '브라우저 세션의 쿠키 데이터를 가로채 서버 캐시...'는 서버 사이드 렌더링 (SSR) 아키텍처, '보안 승인을 획득하지 못한 미검증 소스코드를 네트워크...'는 공급망 보안 솔루션의 탐지 제어문이므로 틀렸습니다."}, {"id": "W025", "src": "word", "lec": 0, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "데이터 분석 업무에서는 파일을 바로 읽을지, DB에 적재해 조회할지, 어떤 기준으로 검증할지에 따라 성능과 재현성이 달라진다. 다음 중 '단위 정규화'에 대한 설명으로 가장 적절한 것은?", "opts": ["관계형 데이터베이스의 중복 테이블을 완전 분리하여 논리적 이상 현상을 제거하는 전처리 기법", "파이썬 소스코드의 가독성을 높이기 위해 공백 포맷을 글로벌 표준 규칙으로 일치시키는 전처리 기법", "서로 다른 척도의 단위 체계를 하나의 공통 기준으로 변환해 상호 비교 가능하게 만드는 전처리 기법", "대용량 CSV 파일의 깨짐 오류를 복원하기 위해 인코딩 체계를 고정 문자셋으로 복원하는 전처리 기법"], "a": 2, "expl": "**정답인 이유**: '서로 다른 척도의 단위 체계를 하나의 공통 기준으로 변환해 상호 비교 가능하게 만드는 전처리 기법'은 상이한 단위 체계로 구성되어 통계 왜곡이 의심될 때 이를 단일한 척도 기준으로 일치 환산 처리하여 비교 연산이 성립되게 유도하는 전처리입니다. **오답인 이유**: '관계형 데이터베이스의 중복 테이블을 완전 분리하여...'는 데이터베이스 1, 2, 3차 정규화 (Normalization), '파이썬 소스코드의 가독성을 높이기 위해 공백 포맷을...'은 PEP8 등 코딩 스타일 린팅 포맷팅, '대용량 CSV 파일의 깨짐 오류를 복원하기 위해...'는 다국어 유니코드 (UTF-8) 디코딩 기술을 서술하여 탈락입니다."}, {"id": "W026", "src": "word", "lec": 0, "cat": "생성형AI활용", "diff": "상", "type": "mcq", "q": "문서 검색형 AI를 설계할 때는 원문을 어떻게 나누고 찾고 모델에 전달하는지에 따라 정확도, 비용, 운영 난도가 달라진다. 다음 중 'RAG 오버 엔지니어링 경계'에 대한 설명으로 가장 적절한 것은?", "opts": ["RAG 인프라망을 다중 네트워크로 격리할 때 발생하는 트래픽 지연의 임계 상한선", "임베딩 벡터의 유사도 스코어 기준을 정밀 강제하여 시스템을 과적합하게 튜닝하는 판단 기준", "간단한 파일 검색을 위해 대형 모델을 중복 가동하여 질의 응답 속도를 올리는 최적화 기준", "해결하려는 당면 문제 규모보다 불필요하게 과도한 검색 및 인프라 구조를 피하는 판단 기준"], "a": 3, "expl": "**정답인 이유**: '해결하려는 당면 문제 규모보다 불필요하게 과도한 검색 및 인프라 구조를 피하는 판단 기준'은 복잡하지 않은 소규모 문서 시스템을 구축하면서 과도하게 비싼 비용의 오버스펙 분산 인프라를 도입하는 행위를 예방하기 위한 지표입니다. **오답인 이유**: 'RAG 인프라망을 다중 네트워크로 격리할 때 발생하는...'는 폐쇄망 레이턴시 임계 상한, '임베딩 벡터의 유사도 스코어 기준을 정밀 강제하여...'는 임베딩 하이퍼파라미터 세밀 과적합, '간단한 파일 검색을 위해 대형 모델을 중복 가동하여...'는 잘못된 모델 앙상블 기법 설명이므로 오답입니다."}, {"id": "W027", "src": "word", "lec": 0, "cat": "서비스구현", "diff": "상", "type": "mcq", "q": "문서 자동화에서는 파일 확장자보다 내부 구조와 수정 방식이 중요하며, 잘못 변경하면 결과 문서가 열리지 않을 수 있다. 다음 중 'HWPX XML 구조'에 대한 설명으로 가장 적절한 것은?", "opts": ["한글 HWPX 문서 내의 바이너리 서식 파일들을 파이썬 코드로 완전히 치환한 텍스트 뼈대 구조", "데이터 시각화를 처리할 수 있도록 공공기관 개방형 문서의 관계형 데이터베이스 명세 스키마 구조", "HWPX 가상의 문서가 단일 압축 컨테이너 파일 내부의 독립적인 XML 파트 조합으로 구성되는 구조", "보안 위반 사항이나 유출 대상 개인정보를 실시간으로 스캔해주는 브라우저 내장 스크립트 구조"], "a": 2, "expl": "**정답인 이유**: 'HWPX 가상의 문서가 단일 압축 컨테이너 파일 내부의 독립적인 XML 파트 조합으로 구성되는 구조'는 국가 개방형 아래한글 문서 포맷 (HWPX)의 내장 작동 원리로서, 파일 실체는 하나의 ZIP 포맷 압축 컨테이너 박스이며 내부 콘텐츠들이 XML 문서 조각들로 조립되어 존재한다는 사실을 올바르게 규정합니다. **오답인 이유**: '한글 HWPX 문서 내의 바이너리 서식 파일들을 파이썬...'은 바이너리 인코딩 변환, '데이터 시각화를 처리할 수 있도록 공공기관 개방형...'은 정형 DB 테이블 기술서, '보안 위반 사항이나 유출 대상 개인정보를 실시간으로...'는 프론트엔드용 개인정보 탐지 스크립트이므로 무관합니다."}, {"id": "W028", "src": "word", "lec": 0, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "데이터 분석 업무에서는 파일을 바로 읽을지, DB에 적재해 조회할지, 어떤 기준으로 검증할지에 따라 성능과 재현성이 달라진다. 다음 중 '컬럼 불일치 탐지'에 대한 설명으로 가장 적절한 것은?", "opts": ["저장 장치의 단편화 현상을 주기적으로 감사하여 디스크의 가용 성능 저하를 방지하는 절차", "동일한 스키마 평면 상에서 고유 키가 중복 적재되어 연산 에러를 유발하는 현상을 추적하는 절차", "차원 축소 과정에서 정형 행렬 매트릭스의 유실 정보 유무를 파악하여 유효성을 계산하는 절차", "취합 대상 파일별로 상이한 컬럼 명칭이나 필드 데이터 구조적 차이를 확인하여 오류를 예방하는 점검"], "a": 3, "expl": "**정답인 이유**: '취합 대상 파일별로 상이한 컬럼 명칭이나 필드 데이터 구조적 차이를 확인하여 오류를 예방하는 점검'은 여러 부서에서 무작위 취합된 데이터셋을 병합하기에 앞서, 개별 파일의 컬럼 구조적 이질성을 확인하여 적재 에러를 원천 차단하는 무결성 전처리입니다. **오답인 이유**: '저장 장치의 단편화 현상을 주기적으로 감사하여...'는 디스크 단편화 스캔, '동일한 스키마 평면 상에서 고유 키가 중복...'은 PK 중복 무결성 제약 오류, '차원 축소 과정에서 정형 행렬 매트릭스의 유실...'는 차원 축소 모델 검증론에 해당하여 오답입니다."}, {"id": "W029", "src": "word", "lec": 0, "cat": "생성형AI활용", "diff": "하", "type": "mcq", "q": "문서 검색형 AI를 설계할 때는 원문을 어떻게 나누고 찾고 모델에 전달하는지에 따라 정확도, 비용, 운영 난도가 달라진다. 다음 중 'LLM-Free 퍼지 검색'에 대한 설명으로 가장 적절한 것은?", "opts": ["고비용의 LLM 호출 없이 문자열 유사도 알고리즘에 기반하여 필요한 텍스트 단락을 찾는 방식", "오픈소스 언어 모델의 가중치 자체를 로컬 단말 디바이스에 강제 복사하여 다운로드하는 방식", "RAG 아키텍처 설계 시 벡터 인덱싱의 서칭 속도 효율을 높이기 위해 유료 검색 엔진을 쓰는 방식", "보안 정책망을 우회하기 위해 외부 상용 AI 서버에 문서 원본 데이터를 평문으로 통신하는 방식"], "a": 0, "expl": "**정답인 이유**: '고비용의 LLM 호출 없이 문자열 유사도 알고리즘에 기반하여 필요한 텍스트 단락을 찾는 방식'은 건당 과금이 부과되는 고가의 상용 AI 호출 없이, 문자열 유사도 매칭 수학식만으로 필요한 지침 단락을 신속히 찾는 비용 제로 검색법입니다. **오답인 이유**: '오픈소스 언어 모델의 가중치 자체를 로컬 단말...'은 오픈소스 가중치 배포 기술, 'RAG 아키텍처 설계 시 벡터 인덱싱의 서칭 속도...'는 하이브리드 클라우드 서칭 설계, '보안 정책망을 우회하기 위해 외부 상용 AI 서버에...'는 공공 보안 규정을 위반하는 무단 유출 경로를 기술하여 오답입니다."}, {"id": "W030", "src": "word", "lec": 0, "cat": "서비스구현", "diff": "상", "type": "mcq", "q": "문서 자동화에서는 파일 확장자보다 내부 구조와 수정 방식이 중요하며, 잘못 변경하면 결과 문서가 열리지 않을 수 있다. 다음 중 '압축 컨테이너 직접 수정 원칙'에 대한 설명으로 가장 적절한 것은?", "opts": ["스토리지 공간을 확보하기 위해 대용량 보관용 파일의 물리 경로를 원격 드라이브로 이관하는 수칙", "소스코드 보안을 강화하기 위해 웹 자원을 임의의 고정 확장자 포맷 패키지로 강제 배포하는 수칙", "문서 구조의 무결성 검증을 위해 타사 전용 뷰어 프로그램을 가상환경 백엔드에 상주시키는 수칙", "압축 패키지 구조의 고유한 물리 순서와 메타 디렉토리를 훼손하지 않고 세부 파일만 교체하는 수칙"], "a": 3, "expl": "**정답인 이유**: '압축 패키지 구조의 고유한 물리 순서와 메타 디렉토리를 훼 "a": 2, "expl": "**정답인 이유**: 'AI 에이전트의 페르소나, 행동 규칙, 금지 금지사항, 마크다운 출력 양식을 최상위 규칙 지침으로 박제 고정하는 프롬프트 설계'는 일반 사용자의 무작위성 채팅 입력 내용물에 휘둘려 인공지능이 탈옥하거나 공공기관 내부 보안 수칙을 누설하지 않도록, 개발자가 애플리케이션 백엔드단에 보이지 않게 감추어 고정 설치해 둔 최고 권력 상위 지시문 (System Prompt) 구조를 정밀 구축하는 핵심 설계입니다. **오답인 이유**: '인공지능 모델 내부의 세부 신경망 가중치...'는 가중치 변형 파인튜닝, '현업 사용자가 실시간 웹 인터페이스 채팅창...'는 일반 유저 프롬프트 (User Prompt), '관계형 데이터웨어하우스 보안 스키마 검색을...'는 쿼리 최적화 뷰 스키마이므로 오답입니다."}, {"id": "W054", "src": "word", "lec": 0, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "공공기관 AI 활용에서는 편의성뿐 아니라 망 분리, 실행 권한, 검증 절차, 변경 이력 관리가 함께 요구된다. 다음 중 '샌드박스 실행'에 대한 설명으로 가장 적절한 것은?", "opts": ["인공지능 에이전트가 자동 생성해 낸 미검증 코드 스크립트가 호스트 서버 인프라를 보호하도록 격리된 가상 공간에서 돌려보는 방식", "공동 레포지토리 배포 배포전 다중 접속 개발 세션단에서 소스코드 머지 충돌을 감지해내는 분산 버전 제어 아키텍처 방식", "보안 거버넌스 승인을 획득하지 못한 오픈소스 외부 모듈의 카피라이트 위반 요소를 스캔해 내는 컴플라이언스 진단 방식", "브라우저의 하드웨어 가속기 옵션을 강제 활성화하여 단일 파일 자바스크립트 프레임워크 차트의 렌더링 부하를 조율하는 방식"], "a": 0, "expl": "**정답인 이유**: '인공지능 에이전트가 자동 생성해 낸 미검증 코드 스크립트가 호스트 서버 인프라를 보호하도록 격리된 가상 공간에서 돌려보는 방식'은 인공지능 에이전트가 자동 생성해 낸 코딩 결과물 내부에 혹여 숨어있을 서버 공격용 파괴 지시나 무단 파일 포맷 삭제 테러 행위가 원본 호스트 OS 커널을 전염 훼손하지 못하도록, 일시적으로 개설된 독립 가상화 격리 가동 수용소 (Sandbox) 내부에서만 시험 수행시켜 안전성을 판별하는 통제 기술입니다. **오답인 이유**: '공동 레포지토리 배포 배포전 다중 접속 개발...'는 형상 관리 브랜치 병합 (Merge), '보안 거버넌스 승인을 획득하지 못한 오픈소스...'는 라이선스 검수용 도구, '브라우저의 하드웨어 가속기 옵션을 강제 활성화하여...'는 GPU 렌더링 조작에 속해 정답이 아닙니다."}, {"id": "W055", "src": "word", "lec": 0, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "데이터 분석 업무에서는 파일을 바로 읽을지, DB에 적재해 조회할지, 어떤 기준으로 검증할지에 따라 성능과 재현성이 달라진다. 다음 중 '캐시 히트'에 대한 설명으로 가장 적절한 것은?", "opts": ["디바이스 단편화 단편화 에러로 RAM 버퍼 내부에 상주 중이던 정형 원천 관측치가 완전 증발하는 메모리 크래시 현상", "동일 조건 조회 질의가 재투입되었을 때 하드디스크 드라이브 접근 없이 고속 메모리 캐시 데이터를 즉시 반환하는 현상", "인덱싱 전략 전략 부재 탓에 대규모 레코드를 풀 스캔 연산하면서 물리디스크 세션 I/O 트래픽 부하 최고조 찍는 현상", "파이썬 판다스 스크립트 모듈이 부적절한 구조의 이종 확장자 파일을 해독하다 입출력 버퍼가 멈춰 서는 타임아웃 현상"], "a": 1, "expl": "**정답인 이유**: '동일 조건 조회 질의가 재투입되었을 때 하드디스크 드라이브 접근 없이 고속 메모리 캐시 데이터를 즉시 반환하는 현상'은 사용자가 똑같은 조건식의 대형 조회 질의를 재차 던졌을 때, 느려터진 영구 저장용 물리디스크 섹터 영역을 다시금 긁어오는 연산 낭비를 지양 부하 통제론이므로 탈락입니다."}, {"id": "W120", "src": "word", "lec": 0, "cat": "서비스구현", "diff": "상", "type": "mcq", "q": "웹 기반 업무 도구를 만들 때는 화면에서 처리할 일, 서버가 맡을 일, 내부망 제약과 배포 방식을 함께 구분해야 한다. 공공기관 업무에 'CDN 방식' 개념을 적용할 때의 통제 원칙으로 가장 적절한 것은?", "opts": ["대용량 블록 데이터베이스 고속 인서트 기법 적용 전, 기존 물리 테이블의 클러스터드 인덱스 재구성 영향도를 하드웨어단에서 시뮬레이션한다 원칙", "RAG 파이프라인 구현 중 문서 단락의 분할 중첩 가용 임계치 크기와 이에 수반되는 임베딩 연산 인프라 용량 예산의 조화로운 마일스톤을 짠다 원칙", "외부 퍼블릭 인터넷 웹 경로로부터 모듈 주소를 끌어올 시 초래될 보안 침해 예방 차원에서 인터넷 연결과 출처 신뢰성을 확인한 뒤 사용한다 원칙", "장문 행정 백서의 슬라이싱 파이프라인 구성 시 고유한 문맥 논리, 핵심 정보 단락이 의미적으로 조각나 유실되지 않도록 정밀 튜닝 분할한다 원칙"], "a": 2, "expl": "**정답인 이유**: '외부 퍼블릭 인터넷 웹 경로로부터 모듈 주소를 끌어올 시 초래될 보안 침해 예방 차원에서 인터넷 연결과 출처 신뢰성을 확인한 뒤 사용한다 원칙'은 외부 퍼블릭 인터넷 웹 경로로부터 실시간 차트 등 오픈소스 종속 모듈 주소를 끌어올 시 초래될 보안 침해 사고를 제약코자, 현재 내 단말기의 공공 인터넷 통신망 개방 유무를 확인하는 것은 물론 원격 서버 자원의 무결성, 디지털 인증서 서명의 신뢰 유효성을 방화벽단에서 전수 검증 승인한 뒤 가동해야 한다는 통제 원칙입니다. **오답인 이유**: '대용량 블록 데이터베이스 고속 인서트 기법 적용 전...'은 벌크 인서트 사전 시뮬레이션 원칙, 'RAG 파이프라인 구현 중 문서 단락의 분할 중첩...'은 RAG 오버랩 안배 수칙, '장문 행정 백서의 슬라이싱 파이프라인 구성 시 고유한...'은 청크 분할 단락 수호 원칙이므로 오답입니다."}, {"id": "L001", "src": "lec", "lec": 1, "cat": "AI트렌드", "diff": "하", "type": "mcq", "q": "1회차 강의에서 강조한 '더닝-크루거 효과'에 대한 설명으로 가장 적절한 것은?", "opts": ["많이 배울수록 자신감이 무한히 상승하는 현상", "조금 배운 사람일수록 자신을 과대평가하는 심리 현상", "전문가일수록 새 기술을 거부하는 현상", "AI가 스스로 능력을 과대평가하는 환각 현상"], "a": 1, "expl": "더닝-크루거 효과는 조금 배운 사람일수록 자신을 과대평가하는 심리 현상입니다. 강의에서는 '우매함의 봉우리'를 지나 '절망의 계곡'에 이르는데, 이 계곡을 '겸손'으로 바꿔 읽으라고 강조했습니다. 진짜 전문가는 만족 없이 계속 배우는 태도(attitude)를 유지하며, 이것이 knowledge보다 attitude가 먼저라는 강의 핵심 메시지와 연결됩니다."}, {"id": "L002", "src": "lec", "lec": 1, "cat": "AI트렌드", "diff": "중", "type": "mcq", "q": "강의에서 말한 '미시적 혁신'의 의미로 가장 적절한 것은?", "opts": ["수십억 원 규모의 대형 AX 전환사업을 우선 기획하는 것", "최신 기술을 모두 도입한 뒤 문제를 찾는 것", "내 책상 위 2~5분짜리 작은 문제부터 AI로 푸는 것", "혁신을 미시경제학 이론으로 분석하는 것"], "a": 2, "expl": "미시적 혁신은 거대한 AX 사업이 아니라 압축파일 일괄 해제, 파일명 200개 일괄 변경 같은 책상 위 작은 문제부터 AI로 푸는 접근입니다. 강의는 '몇십억 들여야 AI가 도입된다'는 생각(진격의 거인 콤플렉스)을 경계하라고 했으며, 기존 레거시 워크플로우 + LLM의 결합이 진짜 실력이라고 강조했습니다."}, {"id": "L003", "src": "lec", "lec": 1, "cat": "AI트렌드", "diff": "중", "type": "mcq", "q": "LLM의 '파라미터'에 대한 설명으로 가장 적절한 것은?", "opts": ["모델이 학습한 문서의 총 개수", "모델이 곱셈·덧셈에 사용하는 가중치(weight)의 총 개수", "모델이 하루에 처리할 수 있는 질문 수", "모델이 지원하는 언어의 개수"], "a": 1, "expl": "파라미터는 신경망이 입력에 곱하고 더하는 가중치(weight)의 총 개수입니다. Y=WX+b에서 W(기울기)와 b(절편)에 해당하는 값이며, 이런 1차식 수천억 개를 엮은 것이 모델입니다. 파라미터가 많을수록 복잡한 패턴을 더 잘 이해하므로 '모델이 크다'고 표현합니다. 학습이란 답이 틀렸을 때 이 가중치를 조금씩 고쳐가는 과정입니다."}, {"id": "L004", "src": "lec", "lec": 1, "cat": "AI트렌드", "diff": "상", "type": "mcq", "q": "트랜스포머의 어텐션 메커니즘에서 Query·Key·Value(Q·K·V)의 역할로 가장 적절한 것은?", "opts": ["문장을 세 개의 언어로 번역하는 병렬 처리 단위", "한 단어가 문장 내 어떤 단어와 가장 관련 있는지 계산하는 변환 벡터", "모델의 입력·출력·저장을 담당하는 하드웨어 모듈", "질문·정답·오답을 구분하는 학습 라벨"], "a": 1, "expl": "어텐션은 단어를 임베딩 벡터로 바꾼 뒤 Query·Key·Value 세 벡터로 변환해 '이 단어가 어떤 단어와 가장 관련 있나'를 계산하는 메커니즘입니다. GPT-2 small 기준 768차원 임베딩이 Q·K·V로 3배(2304) 변환되고, 이 어텐션 블록이 12층 쌓여 반복됩니다. 트랜스포머(2017, Attention Is All You Need)의 핵심 구조입니다."}, {"id": "L005", "src": "lec", "lec": 1, "cat": "AI트렌드", "diff": "중", "type": "mcq", "q": "'소버린 AI(Sovereign AI)'에서 강사가 가장 핵심으로 꼽은 요소는?", "opts": ["GPU 등 하드웨어 자원의 최대 확보", "자국 도메인 데이터로 튜닝한 모델의 다양성 확보", "해외 빅테크 모델의 전면 도입", "모든 모델의 오픈소스 공개 의무화"], "a": 1, "expl": "소버린 AI는 자국이 통제하는 AI 역량을 뜻합니다. GPU 같은 하드웨어도 중요하지만, 강사는 조선·제조·철강·농업 등 우리 도메인 데이터로 튜닝한 다양한 모델의 확보가 진짜 핵심이라고 강조했습니다. 특정 해외 모델에 종속되면 가격 인상이나 사용 차단 같은 리스크에 그대로 노출되기 때문입니다."}, {"id": "L006", "src": "lec", "lec": 1, "cat": "AI트렌드", "diff": "중", "type": "mcq", "q": "SLM(Small Language Model)과 온디바이스 AI에 대한 설명으로 가장 적절한 것은?", "opts": ["반드시 데이터센터의 대형 GPU 클러스터에서만 실행된다", "클라우드 없이 내 PC·폰·엣지 기기에서 도는 1B~4B급 작은 언어모델이다", "파라미터가 1조 개 이상인 모델을 말한다", "텍스트를 처리할 수 없는 이미지 전용 모델이다"], "a": 1, "expl": "SLM은 1B·4B처럼 작은 크기의 언어모델로, 클라우드 없이 내 폰·라즈베리파이·일반 PC에서 돌 수 있습니다(온디바이스/엣지 AI). 폐쇄망 환경에서 '민원 분류만 잘하는 1~2B 모델' 같은 특화 모델로 업무를 지원할 수 있어 공공에 특히 유용합니다. 구글 Gemma 3n E4B가 대표 사례로, MatFormer 구조로 원본 8B가 effective 4B로 동작합니다."}, {"id": "L007", "src": "lec", "lec": 1, "cat": "AI트렌드", "diff": "하", "type": "mcq", "q": "로컬 PC에서 오픈소스 LLM을 가장 간단히 실행하는 도구로 강의에서 소개한 것은?", "opts": ["Ollama", "Photoshop", "Tableau", "VMware"], "a": 0, "expl": "Ollama는 'ollama run gemma3:1b'처럼 명령 한 줄로 오픈소스 모델을 받아 로컬에서 실행하는 도구입니다. 인터넷 없이 돌아가므로 폐쇄망 환경에서도 활용할 수 있습니다. 모델 파일은 Hugging Face에서 받을 수 있고 보통 GGUF 포맷(양자화 포맷)을 사용합니다. LM Studio, MSTY, llama.cpp도 같은 계열의 로컬 실행기입니다."}, {"id": "L008", "src": "lec", "lec": 1, "cat": "AI트렌드", "diff": "중", "type": "mcq", "q": "'컨텍스트 윈도우'와 KV 캐시에 대한 설명으로 가장 적절한 것은?", "opts": ["컨텍스트가 길수록 이미 계산한 Key·Value를 저장하는 메모리 사용량이 늘어난다", "컨텍스트 윈도우는 모델의 학습 데이터 총량을 뜻한다", "KV 캐시는 하드디스크 용량을 줄이는 압축 기술이다", "컨텍스트 윈도우가 크면 응답이 항상 정확해진다"], "a": 0, "expl": "컨텍스트 윈도우는 모델이 한 번에 다룰 수 있는 입력(대화) 길이입니다. 대화가 길어지면 이미 계산한 Key·Value를 저장해 재사용하는 KV 캐시가 커져 메모리를 많이 차지합니다. '컨텍스트가 길수록 메모리를 먹는다'는 말이 여기서 나오며, 이는 컨텍스트 엔지니어링(무엇을 넣고 뺄지 설계)의 필요성과 연결됩니다."}, {"id": "L009", "src": "lec", "lec": 1, "cat": "생성형AI활용", "diff": "하", "type": "mcq", "q": "'바이브 코딩(Vibe Coding)'의 의미로 가장 적절한 것은?", "opts": ["음악을 들으며 코딩해 집중력을 높이는 기법", "코드 문법을 몰라도 자연어로 AI에게 시켜 프로그램을 만드는 방식", "코드의 분위기(vibe)를 분석하는 정적 분석 도구", "진동 센서로 입력하는 하드웨어 코딩"], "a": 1, "expl": "바이브 코딩은 안드레이 카파시가 만든 말로, 코드 문법을 몰라도 자연어로 AI에게 지시해 프로그램을 만드는 방식입니다. '가장 핫한 개발 언어는 영어(자연어)'라는 그의 말처럼, 코딩 실력보다 생각의 명료함과 정밀한 지시가 중요해졌습니다. 이 과정 전체의 핵심 도구 개념입니다."}, {"id": "L010", "src": "lec", "lec": 1, "cat": "생성형AI활용", "diff": "중", "type": "mcq", "q": "'메타 프롬프트'에 대한 설명으로 가장 적절한 것은?", "opts": ["프롬프트를 짧게 줄여주는 압축 알고리즘", "AI에게 최적의 프롬프트(시스템 프롬프트)를 대신 짜게 시키는 기법", "여러 AI의 답변을 평균 내는 앙상블 기법", "프롬프트를 메타버스에서 입력하는 방식"], "a": 1, "expl": "메타 프롬프트는 '프롬프트를 만드는 프롬프트'입니다. 좋은 프롬프트를 직접 짜기 어려우니 '이런 워크플로우/봇을 만들려는데 최적의 프롬프트를 네가 짜라'고 AI에게 시키는 기법입니다. 마케팅 3C 같은 프레임워크와 결합하면 더 강력하며, 멀티 에이전트의 플랜 작성 등 과정 전반에서 반복 활용됩니다."}, {"id": "L011", "src": "lec", "lec": 1, "cat": "AI트렌드", "diff": "중", "type": "mcq", "q": "AI 모델 비교·순위 사이트에 대한 설명으로 옳은 것은?", "opts": ["LMArena는 사람이 두 모델의 답을 블라인드 비교·투표해 Elo 점수로 순위를 매긴다", "Artificial Analysis는 회사들이 자랑한 논문 지표만 모아 놓은 곳이다", "LifeArchitect Models Table은 AI가 자동으로 갱신하는 표다", "모델 순위는 한번 정해지면 바뀌지 않는다"], "a": 0, "expl": "LMArena(옛 Chatbot Arena)는 사람이 두 모델의 답변을 블라인드로 비교·투표해 Elo 점수 기반 순위를 매기므로 실사용 만족도에 가깝습니다. Artificial Analysis는 자체 독립 벤치마크를 직접 측정해 싣는 사이트이고(논문 모음이 아님), LifeArchitect Models Table은 Alan D. Thompson 박사가 수작업으로 갱신합니다. 순위는 계속 바뀌므로 직접 확인하는 습관이 중요합니다."}, {"id": "L012", "src": "lec", "lec": 1, "cat": "AI트렌드", "diff": "하", "type": "mcq", "q": "'레고 블록 오케스트레이션' 비유가 의미하는 것은?", "opts": ["도구들을 난이도순으로 하나씩 정복해야 한다는 뜻", "API·RSS·MCP·프롬프트 등 도구를 조합 가능한 부품으로 쌓아 문제를 푼다는 뜻", "레고 회사의 AI 도입 사례를 배우라는 뜻", "한 가지 도구만 깊이 파야 한다는 뜻"], "a": 1, "expl": "레고 블록 8개로 수억 개 형상을 만들 수 있듯, 회차마다 배우는 도구(API, RSS, MCP, 플러그인, 스킬, 프롬프트, 코딩 에이전트 등)를 난이도순 정복 대상이 아니라 조합 가능한 부품으로 쌓으라는 비유입니다. 여러 도구를 겸손하게 모아 오케스트레이션하는 것이 이 시대 전문가의 태도라는 1회차 핵심 메시지입니다."}, {"id": "L013", "src": "lec", "lec": 1, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "강의 교안 사이트(워크벤치)의 구성에서 각 요소의 역할이 잘못 짝지어진 것은?", "opts": ["HTML — 브라우저에서 도는 화면 언어(페이지의 뼈대)", "GitHub Pages — 무료 정적 사이트 호스팅", "Supabase — 백엔드 데이터베이스(BaaS)", "Claude Sonnet — 서버의 네트워크 방화벽 관리"], "a": 3, "expl": "교안 사이트는 HTML(화면) + Claude Sonnet(교안 내용을 생성·수정하는 LLM 두뇌) + GitHub Pages(무료 정적 호스팅) + Supabase(백엔드 DB) 조합입니다. Claude는 방화벽 관리가 아니라 콘텐츠 생성·수정을 담당합니다. 'HTML 한 장 + LLM + 무료 호스팅 + 가벼운 DB만으로 협업 공간을 만들 수 있다'는 감각이 핵심입니다."}, {"id": "L014", "src": "lec", "lec": 1, "cat": "AI트렌드", "diff": "중", "type": "mcq", "q": "1~3회차에 코딩 에이전트를 쓰지 않고 '어시스트형 바이브 코딩'부터 배우는 이유로 강의가 제시한 것은?", "opts": ["코딩 에이전트가 유료라서 비용을 아끼기 위해", "폐쇄망에서는 외부 LLM 도움으로 코드를 만들어 내부로 이식해 실행하는 워크플로우가 필요하기 때문", "코딩 에이전트는 배우기 너무 쉬워서 나중에 해도 되기 때문", "어시스트형이 항상 더 좋은 코드를 만들기 때문"], "a": 1, "expl": "공공 폐쇄망/보안망에서는 코딩 에이전트 설치·실행이 막힐 수 있습니다. '외부에서 LLM 도움으로 코드를 만들어 → 내부로 이식해 실행'하는 워크플로우를 익혀두면 망 환경과 무관하게 일할 수 있습니다. '폐쇄망이니 외부 건 안 배워도 돼'가 강사가 가장 말린 태도입니다. 4회차부터 Claude Code·Cursor 등 코딩 에이전트로 전환합니다."}, {"id": "L015", "src": "lec", "lec": 1, "cat": "AI트렌드", "diff": "하", "type": "mcq", "q": "DX와 AX의 관계에 대한 강의 설명으로 가장 적절한 것은?", "opts": ["DX와 AX는 완전히 단절된 별개 개념이다", "AX가 끝나야 DX를 시작할 수 있다", "DX(디지털 전환)와 AX(AI 전환)는 단절이 아니라 한 라인으로 이어진다", "X는 eXtreme의 약자다"], "a": 2, "expl": "DX(Digital Transformation)와 AX(AI Transformation)는 단절된 개념이 아니라 한 라인으로 이어집니다. 종이를 디지털로 바꾸는 DX가 선행돼야 그 데이터 위에 AI를 얹는 AX가 가능합니다. X는 미국식으로 Transformation을 줄인 표기입니다. 당연하게 쓰는 용어도 내 업무·현상에 맞춰 스스로 재정의해보는 응용력을 기르라는 것이 강사의 메시지입니다."}, {"id": "L016", "src": "lec", "lec": 1, "cat": "AI트렌드", "diff": "중", "type": "mcq", "q": "'망치를 들고 있으면 모든 게 못으로 보인다'는 카파시 인용구를 통해 강의가 경계한 것은?", "opts": ["도구를 전혀 쓰지 않는 태도", "하나의 도구에 매몰돼 모든 문제를 그 도구로만 풀려는 편식", "망치 같은 물리적 도구의 위험성", "AI 도구의 가격 상승"], "a": 1, "expl": "이 인용구는 도구 편식에 대한 경고입니다. 압축파일에서 회의 일시를 찾는 워밍업 문제에서, 반디집으로 30초면 풀 일을 굳이 코딩 에이전트를 띄워 푸는 것이 바로 이 함정입니다. 반대로 50개 파일 중 어디 있는지 모를 때는 AI로 빠르게 찾는 것도 미시적 혁신입니다. 상황에 맞는 도구를 고르는 판단이 핵심입니다."}, {"id": "L017", "src": "lec", "lec": 1, "cat": "AI트렌드", "diff": "상", "type": "mcq", "q": "토큰(token)과 파라미터의 구분으로 가장 적절한 것은?", "opts": ["토큰은 모델 크기, 파라미터는 학습 데이터 양을 뜻한다", "파라미터는 모델의 방정식 계수 총개수(모델 크기), 토큰은 모델이 학습·처리하는 단어 조각의 양이다", "둘은 완전히 같은 개념이다", "토큰은 유료 결제 수단만을 의미한다"], "a": 1, "expl": "파라미터는 모델의 '방정식 계수' 총개수로 모델 크기를 나타내고, 토큰은 단어가 음절/어절 단위로 쪼개진 조각으로 모델이 학습하거나 입출력하는 텍스트의 양을 셉니다. 많이 학습할수록(토큰이 많을수록) 유창해지고, 파라미터가 많을수록 복잡한 패턴을 이해합니다. API 과금도 입력·출력 토큰 수 기준으로 이뤄집니다."}, {"id": "L018", "src": "lec", "lec": 2, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "강사가 만든 'Who am I' 검색 시스템이 보통의 RAG와 다른 점은?", "opts": ["더 큰 LLM을 사용했다", "LLM 없이 Fuse.js(퍼지 검색)·BM25·레벤슈타인 등 룰 기반 부품으로 검색을 구현했다", "검색 없이 생성만 한다", "클라우드 GPU를 대량으로 사용했다"], "a": 1, "expl": "보통의 RAG는 검색된 문서를 LLM에 넣어 답을 생성하지만, 강사의 시스템은 LLM 없이 RSS 수집 + Fuse.js 퍼지 검색 + BM25 + 레벤슈타인 거리 같은 룰 기반 부품만으로 검색을 구현했습니다. AI가 다 해결해주는 시대일수록 룰 기반이 오히려 예측 가능하고 유지보수가 쉬울 수 있다는 '거꾸로 보기'의 사례입니다."}, {"id": "L019", "src": "lec", "lec": 2, "cat": "AI트렌드", "diff": "중", "type": "mcq", "q": "NLP·NLU·NLG의 관계에 대한 설명으로 옳은 것은?", "opts": ["NLP가 큰 우산이고 그 아래 NLU(이해)와 NLG(생성)가 있으며, 트랜스포머 인코더는 NLU, 디코더는 NLG에 대응한다", "NLU가 최상위 개념이고 NLP는 그 하위 분야다", "NLG는 자연어를 그래프로 바꾸는 기술이다", "셋은 서로 무관한 별개 분야다"], "a": 0, "expl": "NLP(자연어 처리)가 큰 우산이고, 그 아래 입력을 해석하는 NLU(자연어 이해)와 출력을 만드는 NLG(자연어 생성)가 있습니다. 트랜스포머의 인코더는 NLU 쪽(BERT 계열), 디코더는 NLG 쪽(GPT 계열)에 대응합니다. ChatGPT는 디코더 계열(생성 특화) 모델입니다."}, {"id": "L020", "src": "lec", "lec": 2, "cat": "AI트렌드", "diff": "상", "type": "mcq", "q": "ChatGPT(GPT-3.5)에서 체감 성능이 폭발한 결정적 계기로 강의가 짚은 것은?", "opts": ["파라미터 수를 10배로 늘려서", "RLHF(인간 피드백 기반 강화학습)를 얹어서", "한국어 데이터를 추가 학습해서", "GPU를 신형으로 교체해서"], "a": 1, "expl": "GPT-3까지는 주어진 지문 안에서만 잘 푸는 인컨텍스트 러닝 수준이었으나, 여기에 RLHF(인간 피드백 기반 강화학습)를 얹은 GPT-3.5에서 체감 성능이 폭발했고 2022년 말 ChatGPT 공개로 이어졌습니다. 참고로 트랜스포머는 2017년 구글 논문 'Attention Is All You Need'에서 나왔지만, 디코더 부분을 픽업해 키운 것은 OpenAI였습니다."}, {"id": "L021", "src": "lec", "lec": 2, "cat": "생성형AI활용", "diff": "상", "type": "mcq", "q": "OpenAI Privacy Filter에 대한 설명으로 가장 적절한 것은?", "opts": ["클라우드 LLM에 보내기 전 로컬에서 개인정보(PII)를 찾아 마스킹하는 토큰 분류 모델이다", "이미지를 고해상도로 복원하는 업스케일링 모델이다", "LLM의 답변 속도를 높이는 캐싱 서버다", "웹 브라우저의 광고를 차단하는 확장 프로그램이다"], "a": 0, "expl": "OpenAI Privacy Filter는 1.5B 파라미터(활성 50M)의 양방향 토큰 분류 모델로, 이름·주소·이메일·전화·URL·날짜·계좌·비밀번호 8개 범주의 개인정보를 찾아 가립니다. 사용자가 입력하자마자 클라우드 LLM에 보내기 전 단계에서 로컬(온프레미스)로 돌며 마스킹하는 것이 핵심 가치입니다. 참고로 강사가 Claude에 물었을 때 '없는 모델'이라 답한 일화는 LLM 환각의 교훈 사례입니다."}, {"id": "L022", "src": "lec", "lec": 2, "cat": "생성형AI활용", "diff": "중", "type": "mcq", "q": "LLM이 자기가 모르는 대상을 단정적으로 '없다'고 답하는 현상에서 얻을 교훈은?", "opts": ["AI가 없다고 하면 실제로 없는 것이니 믿어도 된다", "환각(hallucination)일 수 있으므로 직접 한 번 더 확인하는 습관이 필요하다", "질문을 영어로 하면 환각이 사라진다", "환각은 유료 모델에서는 발생하지 않는다"], "a": 1, "expl": "LLM은 학습 시점 이후의 정보나 모르는 것을 종종 단정적으로 '없다'고 지어냅니다(환각). 실제로 존재하는 OpenAI Privacy Filter를 Claude가 '없는 모델'이라 답한 사례처럼, 'AI가 아니라고 했으니 없는 거겠지'라고 믿지 말고 직접 검색·확인하는 습관이 필요합니다. 환각은 모델 등급과 무관하게 발생할 수 있는 확률 모델의 본질적 특성입니다."}, {"id": "L023", "src": "lec", "lec": 2, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "opencode 개발 환경 3종 세트의 역할 연결이 옳은 것은?", "opts": ["VS Code=모델 공급자, opencode=IDE, OpenRouter=터미널", "VS Code=IDE(편집기), opencode=터미널 코딩 에이전트, OpenRouter=여러 LLM을 하나의 API 창구로 묶는 모델 공급자", "VS Code=클라우드 서버, opencode=데이터베이스, OpenRouter=백신", "셋 모두 같은 회사의 동일 제품이다"], "a": 1, "expl": "VS Code는 코드 편집기(IDE), opencode는 터미널에서 도는 오픈소스 AI 코딩 에이전트(npm 패키지명은 opencode-ai), OpenRouter는 여러 AI 모델을 하나의 API 창구로 묶어주는 모델 공급자입니다. opencode 안에서 /connect로 OpenRouter 키를 연결하고 /models로 모델을 바꿉니다. Node.js 18+가 설치 선행 조건입니다."}, {"id": "L024", "src": "lec", "lec": 2, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "파이썬 프로그램을 배포하는 방법에 대한 설명으로 옳지 않은 것은?", "opts": ["PyInstaller --onefile로 단일 EXE 파일을 만들 수 있다", "Flask로 로컬 웹앱을 띄우면 기본 포트는 127.0.0.1:5000이다", "GitHub Pages는 프론트(정적 HTML) 페이지를 무료로 호스팅한다", "사용자 입력을 eval()로 실행하는 것은 실제 서비스에서 권장되는 안전한 방식이다"], "a": 3, "expl": "사용자 입력을 그대로 eval()로 실행하면 임의 코드가 실행될 수 있어 실제 서비스에서는 절대 금지입니다(데모용으로만 잠깐 등장). PyInstaller는 --onefile --noconsole 옵션으로 단일 EXE를 만들고, Flask 기본 포트는 5000, GitHub Pages는 정적 페이지 무료 호스팅(username.github.io)입니다. 기획→코딩→테스트→배포 풀 사이클을 MVP로 겪어보는 것이 실습의 목적입니다."}, {"id": "L025", "src": "lec", "lec": 2, "cat": "생성형AI활용", "diff": "중", "type": "mcq", "q": "AI로 PPT 장표를 만들 때 강사가 SVG 방식을 '비밀 무기'로 꼽은 이유는?", "opts": ["SVG가 이미지보다 파일 용량이 항상 크기 때문", "SVG는 PPT에 넣고 그룹 해제하면 개체별 편집이 가능하기 때문", "SVG는 자동으로 애니메이션이 되기 때문", "SVG는 저작권이 없기 때문"], "a": 1, "expl": "AI가 PPT를 이미지로 뽑으면 수정이 안 되지만, SVG(벡터)로 렌더링해 받으면 PPT에 넣고 우클릭→그룹 해제로 텍스트·도형을 개체별로 편집할 수 있습니다. 프롬프트에 원페이지 원메시지, 거버닝 센텐스, As-Is/To-Be, HEX 색상 코드 같은 컨설팅식 약속을 넣으면 품질이 올라갑니다. 강사 체감상 Claude가 SVG를 가장 안 깨지게 만든다고 평했습니다."}, {"id": "L026", "src": "lec", "lec": 2, "cat": "서비스구현", "diff": "하", "type": "mcq", "q": "Mermaid에 대한 설명으로 가장 적절한 것은?", "opts": ["텍스트 문법으로 플로우차트 등 다이어그램을 그리는 도구다", "인어공주를 그려주는 이미지 생성 모델이다", "데이터베이스 백업 프로그램이다", "음성을 텍스트로 바꾸는 STT 엔진이다"], "a": 0, "expl": "Mermaid는 'flowchart TD / A --> B' 같은 텍스트 문법으로 플로우차트·다이어그램을 그리는 도구입니다. LLM에게 '머메이드 문법으로 N단계 플로우차트를 그려줘'라고 시키면 코드로 그려주고, Mermaid Live Editor(mermaid.live)에 붙여넣으면 즉시 렌더링됩니다. 폐쇄망에서는 mermaid.min.js + index.html만으로 오프라인 에디터를 만들어 쓸 수도 있습니다."}, {"id": "L027", "src": "lec", "lec": 2, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "MCP(Model Context Protocol)에 대한 설명으로 가장 적절한 것은?", "opts": ["AI에게 외부 도구·데이터를 연결해주는 표준 규격이다", "모델을 압축하는 양자화 포맷이다", "GPU 메모리를 관리하는 드라이버다", "이미지 생성 전용 프로토콜이다"], "a": 0, "expl": "MCP는 AI(호스트)에게 Notion, Gmail, 법령정보 같은 외부 도구·데이터를 연결해주는 표준 규격입니다. ChatGPT 앱 커넥터의 바탕 규약이며, 하나씩 붙이면 멀티로 확장됩니다. 응답 중 '도구 호출(tool call)' 형식이 떠야 MCP가 실제 동작한 것이고, 그것 없이 결과만 나오면 웹 검색일 수 있다는 구분법도 함께 소개됐습니다."}, {"id": "L028", "src": "lec", "lec": 2, "cat": "서비스구현", "diff": "상", "type": "mcq", "q": "'MCP를 쓰면 다 된다'는 주장에 대해 강의가 제시한 현실적 점검 항목이 아닌 것은?", "opts": ["그 DB가 MCP를 붙일 수 있는 구조인지", "권한(role)으로 접근 가능한지와 외부 호출 가능 여부", "스키마(schema)가 맞는지", "MCP 로고의 디자인 품질"], "a": 3, "expl": "MCP는 만능이 아니라 ① 대상 DB가 MCP를 붙일 수 있는지 ② 권한(role)으로 접근되는지 ③ 외부에서 호출 가능한지 ④ 스키마가 맞는지를 하나하나 따져야 합니다. 기술만으로 밀면 헤매고, 도메인 전문가와 함께 업무를 정확히 알면 구조가 간결해진다는 것이 핵심 교훈입니다. 로고 디자인은 무관합니다."}, {"id": "L029", "src": "lec", "lec": 2, "cat": "생성형AI활용", "diff": "중", "type": "mcq", "q": "GPTs의 Actions 기능에 대한 설명으로 가장 적절한 것은?", "opts": ["GPT의 답변 말투를 바꾸는 기능이다", "OpenAPI 스키마를 넣어 외부 API를 GPTs가 호출하게 하는 기능이다", "GPT를 오프라인에서 실행하는 기능이다", "화면을 녹화하는 기능이다"], "a": 1, "expl": "Actions는 OpenAPI 스키마를 등록해 외부 API를 GPTs가 직접 호출하게 하는 기능입니다. 강의에서는 인증 없이 쓰는 무료 날씨 API인 Open-Meteo로 시연했고(Authentication: None), 스키마 작성 자체도 GPT에게 시키면 됩니다. 같은 방식으로 공공데이터포털(data.go.kr) API를 붙이면 공공정보를 챗봇 안에서 바로 다룰 수 있습니다."}, {"id": "L030", "src": "lec", "lec": 2, "cat": "생성형AI활용", "diff": "중", "type": "mcq", "q": "GPT 프로젝트/GPTs 운용 시 강사가 찾아낸 '메모리 분리' 설정의 효과는?", "opts": ["응답 속도가 2배 빨라진다", "다른 대화 맥락이 섞여 들어와 봇이 이상해지는 것을 막는다", "토큰 비용이 무료가 된다", "이미지 생성 화질이 좋아진다"], "a": 1, "expl": "프로젝트 설정의 메모리(memory) 옵션이 기본값이면 다른 대화의 맥락이 섞여 들어와 전용 봇의 동작이 오염될 수 있습니다. 메모리를 해당 프로젝트 안에서만 독립적으로 작동하게 분리하면 봇이 깔끔하게 동작합니다. 이 설정이 깊이 숨어 있어 모르고 지나치기 쉽다는 점을 강사가 강조했습니다."}, {"id": "L031", "src": "lec", "lec": 2, "cat": "AI트렌드", "diff": "하", "type": "mcq", "q": "구글 Gemini 생태계에 대한 설명으로 옳지 않은 것은?", "opts": ["Gemini는 태생부터 멀티모달로 설계되었다", "구글은 TPU 등 자체 칩을 설계해 하드웨어에 최적화한다", "Gems는 GPTs와 같은 개념의 '나만의 봇' 기능이다", "NotebookLM은 게임 스트리밍 전용 플랫폼이다"], "a": 3, "expl": "NotebookLM은 자료(소스)를 넣으면 요약·질의응답을 해주는 도구로, 오디오(팟캐스트) 자동 생성 기능이 유명하며 슬라이드·마인드맵 생성도 지원합니다. Gemini는 태생이 멀티모달이고, 구글은 TPU 자체 칩으로 최적화하며, Gems는 나만의 Gemini 봇 기능입니다. 초기 이름은 바드(Bard)였습니다."}, {"id": "L032", "src": "lec", "lec": 2, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "구글의 '기획→개발→배포' 워크플로우에서 Stitch와 AI Studio의 관계로 옳은 것은?", "opts": ["Stitch로 UI 시안을 만들고 AI Studio(Build)로 핸드오프해 동작 앱으로 발전시킨다", "AI Studio가 디자인을, Stitch가 백엔드를 담당한다", "둘은 경쟁 관계라 함께 쓸 수 없다", "Stitch는 동영상 편집 전용 도구다"], "a": 0, "expl": "Stitch는 구글의 AI UI 디자인 도구로 프롬프트로 화면 시안을 만들고 HTML+Tailwind CSS 코드로 내보낼 수 있습니다. 'AI Studio로 내보내기'를 하면 AI Studio의 Build가 시안을 받아 백엔드·API까지 붙여 동작 앱으로 만듭니다. 이렇게 기획(디자인)에서 개발로 바통을 넘기는 이음매를 핸드오프(handoff)라고 합니다."}, {"id": "L033", "src": "lec", "lec": 2, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "Lovable 같은 클라우드 바이브 코딩 플랫폼을 공공 업무에 쓸 때 반드시 확인해야 할 사항으로 강의가 짚은 것은?", "opts": ["플랫폼 UI의 색상 테마", "데이터가 외부 클라우드(Supabase 등)에 저장되므로 데이터 주권·보안 요건 충족 여부", "개발사 대표의 국적", "월 결제일이 며칠인지"], "a": 1, "expl": "Lovable은 프론트+백엔드(기본 Supabase 연동)까지 프롬프트로 만들어 배포하는 플랫폼이지만, 데이터가 외부 클라우드에 저장됩니다. 데이터 주권·보안이 중요한 공공/민감 업무라면 데이터가 어디에 쌓이는지 반드시 확인해야 합니다. 편의성과 보안 요건을 함께 따지는 것이 공공 AI 활용의 기본 원칙입니다."}, {"id": "L034", "src": "lec", "lec": 2, "cat": "생성형AI활용", "diff": "하", "type": "mcq", "q": "'딥리서치(Deep Research)' 기능에 대한 설명으로 가장 적절한 것은?", "opts": ["한 주제를 멀티스텝으로 깊게 조사해 보고서 형태로 만들어주는 기능", "바다 심해 데이터를 분석하는 전용 모델", "코드를 자동으로 배포하는 CI/CD 도구", "화면 해상도를 높이는 기능"], "a": 0, "expl": "딥리서치는 한 주제를 여러 단계(멀티스텝)로 깊게 파고들어 조사한 뒤 보고서로 만들어주는 기능으로, 거의 모든 주요 AI 서비스에 탑재됐습니다. '활용 방안 5개' 같은 식으로 구체적으로 시키면 좋습니다. 모델 티어(소형/표준/리즈닝)와 함께 서비스를 깊게 쓰는 방법의 하나로 소개됐습니다."}, {"id": "L035", "src": "lec", "lec": 3, "cat": "생성형AI활용", "diff": "중", "type": "mcq", "q": "'프리모텀(Pre-mortem)' 질문법의 목적으로 가장 적절한 것은?", "opts": ["프로젝트 성공을 미리 축하하는 의식", "AI의 아첨을 깨고 '이 계획이 실패했다면 왜였을까'를 미리 따져 리스크를 드러내는 것", "사후에 실패 원인을 보고서로 쓰는 절차", "AI 모델의 사망 시점을 예측하는 기법"], "a": 1, "expl": "프리모텀은 '이 계획이 이미 실패했다고 가정하고, 왜 실패했는지 말해보라'고 묻는 기법입니다. AI는 사용자 계획에 동조(아첨)하는 경향이 있어, 이 질문으로 숨은 리스크와 약점을 미리 드러낼 수 있습니다. 스텝 바이 스텝으로 AI를 리드하고, Q&A 프롬프트로 AI가 먼저 물어보게 하는 것과 함께 3회차 프롬프트 기법의 핵심입니다."}, {"id": "L036", "src": "lec", "lec": 3, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "여러 개의 연도별 CSV를 분석하기 전에 VBA로 '메타데이터'를 모으는 목적은?", "opts": ["파일을 암호화하기 위해", "각 파일의 헤더와 샘플 행을 한눈에 비교해 데이터 구조를 먼저 파악하기 위해", "CSV를 이미지로 변환하기 위해", "파일 용량을 줄이기 위해"], "a": 1, "expl": "연도별로 쪼개진 CSV들의 헤더 + 데이터 5행만 모아 한 엑셀로 만들면 '내 데이터가 어떻게 생겼나'를 분석 전에 파악할 수 있습니다(메타인지). 이 과정에서 단위 불일치(천원/만원), 컬럼명 불일치(연도 vs 조사연도), 코드 불일치 같은 공공 데이터의 함정이 드러납니다. 엑셀은 모든 PC에 있으므로 파이썬을 못 깔아도 VBA로 자동화할 수 있다는 점도 포인트입니다."}, {"id": "L037", "src": "lec", "lec": 3, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "공공 데이터 전처리에서 '원천(CSV)에서 고쳐라'라고 강조한 이유는?", "opts": ["SQL 임포트에는 단위 변환 같은 옵션이 없고, 매번 프롬프트로 제어하는 것보다 원본 통일이 깔끔하기 때문", "CSV 파일이 SQL보다 용량이 작기 때문", "원본을 고치면 백업이 자동으로 되기 때문", "데이터베이스는 수정이 불가능하기 때문"], "a": 0, "expl": "SQL 임포트에는 '이 컬럼에 1000을 곱해라' 같은 변환 옵션이 없습니다. 단위(천원/만원)와 컬럼명(연도 vs 조사연도)을 원본에서 통일하는 것이 매번 프롬프트로 제어하는 것보다 깔끔합니다. 사람은 '연도=조사연도'임을 알지만 기계는 철자·띄어쓰기까지 정확히 맞아야 같은 컬럼으로 인식합니다."}, {"id": "L038", "src": "lec", "lec": 3, "cat": "데이터분석", "diff": "하", "type": "mcq", "q": "SQLite의 특징으로 가장 적절한 것은?", "opts": ["대규모 클러스터 서버가 반드시 필요하다", "파일 하나로 끝나는 초경량 DB로, 원격 접속 자체가 없어 보안 부담이 적다", "월 사용료를 내야 하는 상용 클라우드 DB다", "이미지 데이터만 저장할 수 있다"], "a": 1, "expl": "SQLite는 파일 하나(.db)로 끝나는 초경량 DB로, 원격 접속 개념 자체가 없어 보안 부담이 적고 설치도 압축 해제가 전부입니다. 다른 PC로 .db 파일만 복사하면 그대로 쓸 수 있습니다. 여기서 익힌 SQL 개념은 PostgreSQL·SQL Server·Oracle에 그대로 통하므로 '연습용'이 아니라 '입문용'입니다."}, {"id": "L039", "src": "lec", "lec": 3, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "Text-to-SQL을 정확히 쓰기 위해 GPT에게 반드시 함께 줘야 하는 두 가지는?", "opts": ["테이블 정의서(DDL)와 어떤 DB 엔진(SQLite 등)에서 실행되는지", "개발자의 이름과 소속", "서버의 IP 주소와 비밀번호", "모니터 해상도와 OS 버전"], "a": 0, "expl": "GPT가 올바른 SQL을 만들려면 ① 테이블 구조를 담은 DDL(CREATE TABLE 구문, DB Browser에서 '생성 구문 복사하기') ② 실행될 DB 엔진 명시('SQLite에서 수행될')가 필요합니다. 엔진마다 함수·문법이 달라서 엔진을 못 박지 않으면 틀린 SQL이 나옵니다. 이 'DDL+질문' 조합을 GPTs로 만들어두면 전용 SQL 도우미가 됩니다."}, {"id": "L040", "src": "lec", "lec": 3, "cat": "데이터분석", "diff": "상", "type": "mcq", "q": "SQL 윈도우 함수와 그 기능의 연결이 옳지 않은 것은?", "opts": ["RANK — 순위 매기기", "LAG — 이전 행 값 가져오기(전년 대비 계산)", "NTILE(n) — 전체를 n개 그룹으로 분할", "DROP — 이동평균 구간 지정"], "a": 3, "expl": "DROP은 윈도우 함수가 아니라 테이블을 삭제하는 DDL 명령입니다. 이동 구간(이동평균) 지정은 ROWS BETWEEN 구문이 담당합니다. 윈도우 함수는 RANK/DENSE_RANK(순위), PERCENT_RANK/CUME_DIST(백분위), NTILE(그룹 분할), LAG/LEAD(이전/다음 행)로, 주식의 60일 이동평균선 같은 계산을 SQL 한 줄로 해내는 분석의 진짜 무기입니다."}, {"id": "L041", "src": "lec", "lec": 3, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "'pip install sqlite3'가 오류 나는 이유는?", "opts": ["sqlite3는 파이썬에 기본 내장된 표준 라이브러리라 PyPI에 설치 패키지가 없기 때문", "인터넷 연결이 항상 필요하기 때문", "sqlite3는 자바 라이브러리이기 때문", "pip가 유료 서비스이기 때문"], "a": 0, "expl": "sqlite3는 파이썬 표준 라이브러리(내장 모듈)라서 별도 설치 없이 import만 하면 됩니다. PyPI에 설치용 패키지가 없어 pip install sqlite3는 오류가 납니다. 파이썬 설치 시 표준 라이브러리 약 200개가 함께 깔리고, 그 외 60만 개 이상의 외부 패키지는 pip install 후 import해서 씁니다. 빨간 오류 메시지는 캡처해 AI에게 물어보는 것이 표준 디버깅 루프입니다."}, {"id": "L042", "src": "lec", "lec": 3, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "'WHERE 없는 SELECT *'가 위험한 이유로 강의가 설명한 것은?", "opts": ["문법 오류로 실행이 안 되기 때문", "대용량 테이블을 통째로 메모리에 올리면 캐시를 밀어내고 전체 성능이 느려지기 때문", "결과가 항상 0건이기 때문", "데이터가 자동 삭제되기 때문"], "a": 1, "expl": "하드웨어 속도는 CPU > 메모리 > 디스크 > 네트워크 순입니다. 1억 건 테이블을 조건 없이 통째로 부르면 메모리 한계를 넘겨 기존 캐시 데이터를 디스크로 밀어내고 시스템 전체가 느려집니다. 큰 테이블은 반드시 WHERE로 좁혀 필요한 부분만 가져와야 합니다. 같은 쿼리를 다시 실행할 때 빨라지는 것은 메모리 캐시 히트 덕분입니다."}, {"id": "L043", "src": "lec", "lec": 3, "cat": "생성형AI활용", "diff": "중", "type": "mcq", "q": "GEO(Generative Engine Optimization)와 SEO의 차이로 가장 적절한 것은?", "opts": ["GEO는 지리정보 최적화, SEO는 보안 최적화다", "SEO는 검색 결과 상위 노출·클릭 유도, GEO는 생성형 AI가 답변에 내 콘텐츠를 인용·추천하게 만드는 것", "둘은 완전히 같은 개념의 다른 표기다", "GEO는 게임 엔진 최적화 기술이다"], "a": 1, "expl": "SEO는 검색엔진 결과(SERP) 상위 노출과 클릭을 노리지만, GEO는 ChatGPT·Perplexity·Gemini 같은 생성형 AI가 답변을 만들 때 내 콘텐츠를 인용·추천하게 만드는 것입니다. 목표가 '클릭 유도'에서 'AI 답변에 포함되기'로 바뀝니다. GEO는 명확한 정보 위계(H1·H2·H3), 질문-답변형, 두괄식, 구조화 데이터(JSON-LD)를 선호합니다."}, {"id": "L044", "src": "lec", "lec": 3, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "콜센터 녹취 분석 워크플로우의 처리 순서로 가장 자연스러운 것은?", "opts": ["감성 분석 → 녹음 → 저장 → 요약", "음성(STT 텍스트 변환) → 요약 → 감성 분석 → 저장·대시보드", "저장 → 삭제 → 복원 → 분석", "시각화 → 녹음 → 텍스트 변환"], "a": 1, "expl": "음성 파일을 STT로 텍스트로 변환한 뒤, LLM으로 요약하고, 감성 분석을 거쳐 DB에 저장하고 대시보드로 잇는 것이 표준 흐름입니다. 각 단계가 레고 블록처럼 독립 부품이라 필요에 따라 교체·확장할 수 있습니다. 워드파일 문제은행의 '음성 파일을 텍스트로 변환한 뒤 요약, 감성 분석, 저장으로 이어지는 처리 흐름'(STT 파이프라인)과 같은 개념입니다."}, {"id": "L045", "src": "lec", "lec": 3, "cat": "생성형AI활용", "diff": "하", "type": "mcq", "q": "NotebookLM으로 카드뉴스를 기획할 때 카드 한 장마다 뽑게 한 네 가지 요소에 포함되지 않는 것은?", "opts": ["이미지 프롬프트(글자 없이)", "나레이션 스크립트", "다음 컷 전환 효과", "서버 방화벽 설정값"], "a": 3, "expl": "카드 한 장마다 ① 이미지 프롬프트(글자 없이) ② 이미지에 못 넣은 문구 ③ 나레이션 스크립트 ④ 다음 컷 전환 효과를 뽑게 합니다. 이후 '이미지 프롬프트만 모아줘'로 정리하고 슬라이드·AI 오디오까지 확장합니다. 소스 이름 앞에 !를 붙여 정렬 순서를 올리면 생성 품질이 좋아진다는 팁도 함께 소개됐습니다. 방화벽 설정은 무관합니다."}, {"id": "L046", "src": "lec", "lec": 3, "cat": "생성형AI활용", "diff": "중", "type": "mcq", "q": "'Q&A 프롬프트' 기법에 대한 설명으로 가장 적절한 것은?", "opts": ["AI가 먼저 객관식으로 질문하게 해서 요구사항을 명확히 좁혀가는 기법", "AI에게 퀴즈를 내서 성능을 시험하는 기법", "질문과 답을 동시에 입력하는 압축 기법", "답변을 Q&A 게시판에 자동 등록하는 기능"], "a": 0, "expl": "Q&A 프롬프트는 '작업 전에 네가 먼저 나에게 객관식으로 질문하라'고 지시해, AI가 요구사항을 스스로 좁혀가게 하는 기법입니다. 사용자가 미처 명시하지 못한 제약·선호를 AI가 끌어내므로 결과 품질이 올라갑니다. AI에 끌려가지 말고 리드하라는 '스텝 바이 스텝' 원칙, 프리모텀과 함께 메타 프롬프트 활용의 3종 세트입니다."}, {"id": "L047", "src": "lec", "lec": 3, "cat": "데이터분석", "diff": "상", "type": "mcq", "q": "200명 이상 기관에서 Anaconda 사용 시 주의할 점으로 강의가 짚은 것은?", "opts": ["Anaconda는 2020년 9월부터 직원 200명 이상 기업·정부기관에 상업 라이선스(유료)를 요구한다", "Anaconda는 한글을 지원하지 않는다", "Anaconda 설치 시 컴퓨터가 포맷된다", "Anaconda는 파이썬과 호환되지 않는다"], "a": 0, "expl": "2020년 9월부터 직원 200명 이상 기업·정부기관이 Anaconda를 쓰면 상업 라이선스를 구매해야 합니다. 기관에서는 주피터 노트북을 단독 설치하거나 Miniconda + conda-forge / Miniforge 조합으로 쓰는 것이 안전합니다. 오픈소스 도구라도 라이선스 조건(MIT/GPL, 상업용 조항)을 확인하는 것이 공공 도입의 기본 점검 사항입니다."}, {"id": "L048", "src": "lec", "lec": 3, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "DB Browser에서 CSV 임포트 시 '필드명 포함' 옵션을 켜지 않으면 생기는 문제는?", "opts": ["파일이 열리지 않는다", "첫 행(컬럼명)이 데이터 레코드로 잘못 들어간다", "한글이 모두 영어로 번역된다", "테이블이 자동 삭제된다"], "a": 1, "expl": "'필드명 포함(첫 행을 컬럼명으로)' 옵션을 켜지 않으면 첫 행의 컬럼명이 일반 데이터 레코드로 들어가 버립니다. 임포트 전 미리보기로 옵션에 따라 어떻게 바뀌는지 확인해야 합니다. 또 '3,417'처럼 천단위 콤마가 든 숫자는 텍스트로 인식돼 계산이 안 되므로 임포트 전에 콤마를 제거하거나 자료형을 맞춰야 합니다."}, {"id": "L049", "src": "lec", "lec": 3, "cat": "생성형AI활용", "diff": "중", "type": "mcq", "q": "행정안전부 'AI 시대 문서 작성 가이드라인'의 방향으로 가장 적절한 것은?", "opts": ["표와 데코레이션을 최대한 화려하게 꾸민다", "주어·서술어를 생략한 개조식 문장을 권장한다", "사람과 AI가 모두 읽기 쉬운 명확한 구조의 문서를 권장한다", "모든 문서를 이미지 파일로 저장하게 한다"], "a": 2, "expl": "이 가이드라인은 예쁘게 꾸민 표·데코레이션과 주어/서술어를 생략한 복잡한 개조식 문장을 지양하고, 사람과 AI가 모두 읽기 쉬운 문서를 권장합니다. GEO가 선호하는 명확한 위계·두괄식 구조와 같은 맥락이며, HWPX 의무화와 한 묶음으로 공공 문서의 기계 가독성(machine-readability)을 높이는 흐름입니다."}, {"id": "L050", "src": "lec", "lec": 3, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "주피터에서 SQLite 데이터를 분석하는 권장 패턴으로 가장 적절한 것은?", "opts": ["모든 테이블을 통째로 파이썬 리스트에 복사한다", "DB에서 SQL로 필요한 결과만 추린 뒤 pd.read_sql로 데이터프레임에 가져온다", "CSV를 매번 다시 다운로드한다", "엑셀에 붙여넣은 뒤 수작업으로 옮긴다"], "a": 1, "expl": "sqlite3.connect로 DB에 연결한 뒤, SQL로 필요한 결과만 추려 pd.read_sql로 데이터프레임에 가져오는 것이 메모리를 최소로 쓰는 핵심 패턴입니다. 무거운 집계·필터링은 DB가 하고 파이썬은 분석·시각화에 집중하는 역할 분담입니다. sqlite3는 내장 모듈이라 설치가 필요 없다는 점도 기억해야 합니다."}, {"id": "L051", "src": "lec", "lec": 3, "cat": "생성형AI활용", "diff": "하", "type": "mcq", "q": "메타 프롬프트의 구조에서 '상황'에 포함되는 3요소는?", "opts": ["업무·제약·목표", "이름·나이·직급", "날씨·기분·시간", "색상·폰트·크기"], "a": 0, "expl": "메타 프롬프트에 상황을 줄 때는 업무(무슨 일인지)·제약(폐쇄망, 도구 제한 등)·목표(무엇을 달성할지) 세 가지를 담습니다. 상황이 구체적일수록 AI가 만들어주는 프롬프트의 품질이 올라갑니다. 프레임워크(3C, As-Is/To-Be 등)를 함께 심으면 컨설팅식 사고를 AI로 가속할 수 있습니다."}, {"id": "L052", "src": "lec", "lec": 4, "cat": "데이터분석", "diff": "하", "type": "mcq", "q": "지도학습에서 회귀(regression)와 분류(classification)의 구분으로 옳은 것은?", "opts": ["회귀는 연속값(집값·점수) 예측, 분류는 범주(개/고양이, 고위험/저위험) 예측", "회귀는 범주 예측, 분류는 연속값 예측", "둘 다 정답 없이 군집을 묶는 방법이다", "회귀는 이미지 전용, 분류는 텍스트 전용이다"], "a": 0, "expl": "지도학습은 정답(타겟)이 있는 학습으로, 연속값을 예측하면 회귀(집값·시험점수·내일 주가), 범주를 예측하면 분류(개/고양이, 고위험/저위험)입니다. 실전 분류는 이진(binary)보다 멀티클래스가 많습니다. 정답 없이 군집을 묶는 것은 비지도학습(클러스터링), 보상으로 학습하는 것은 강화학습입니다."}, {"id": "L053", "src": "lec", "lec": 4, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "오버피팅(과적합)에 대한 설명으로 가장 적절한 것은?", "opts": ["학습 데이터를 너무 적게 써서 아무것도 못 배우는 상태", "모의고사만 외워 수능(새 데이터)을 못 푸는 것처럼 학습 데이터에만 과도하게 맞춰진 상태", "모델의 파라미터가 부족한 상태", "데이터에 결측치가 많은 상태"], "a": 1, "expl": "오버피팅은 '모의고사만 외워 수능을 못 푸는' 상태로, 학습 데이터에 과도하게 맞춰져 새 데이터에 일반화가 안 되는 문제입니다. 반대로 너무 안 풀어본 상태가 언더피팅입니다. 완화 기법으로 드롭아웃 등이 있으며, 이상치에 덜 흔들리고 일반화가 잘 되는 모델을 로버스트(robust)하다고 합니다."}, {"id": "L054", "src": "lec", "lec": 4, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "회귀 모델 평가에서 MSE를 쓰는 이유와 특성으로 가장 적절한 것은?", "opts": ["제곱 형태라 미분 가능해 경사하강법에 쓸 수 있지만 이상치에 민감하다", "절댓값이라 이상치에 강건하다", "분류 전용 지표라 회귀에는 못 쓴다", "값이 클수록 좋은 모델이다"], "a": 0, "expl": "MSE(평균제곱오차)는 오차를 제곱해 평균 내므로 미분 가능해 경사하강법 최적화에 적합하지만, 제곱 때문에 이상치에 민감합니다. 회귀 지표로는 MSE·RMSE·MAE·R²가 있고, 분류는 혼동행렬(confusion matrix)에서 accuracy·precision·recall·F1 score를 씁니다. F1은 실무 프로젝트에서 가장 많이 쓰는 분류 지표입니다."}, {"id": "L055", "src": "lec", "lec": 4, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "Parquet 포맷에 대한 설명으로 가장 적절한 것은?", "opts": ["행 기반의 텍스트 포맷으로 메모장에서 편집하기 좋다", "컬럼 기반의 빅데이터 형식으로 CSV보다 읽기 속도가 빠르며 클라우드 전처리에서 사실상 기본이다", "이미지 압축 전용 포맷이다", "한글 문서 전용 포맷이다"], "a": 1, "expl": "Parquet은 컬럼(열) 기반 저장 형식으로, 필요한 컬럼만 읽을 수 있어 CSV보다 적재·조회가 빠르고(강사 환경 60만 줄 기준 약 2.6배) 클라우드 전처리에서 사실상 표준입니다. pandas에서 to_parquet/read_parquet로 변환·로드하며 pyarrow 설치가 필요합니다. 대용량 파이프라인의 CSV→Parquet→DB 흐름에서 중간 단계를 담당합니다."}, {"id": "L056", "src": "lec", "lec": 4, "cat": "데이터분석", "diff": "상", "type": "mcq", "q": "메달리온 아키텍처(Medallion Architecture)의 3계층 구성으로 옳은 것은?", "opts": ["브론즈=원본 보존, 실버=정제된 데이터(스키마 표준화·결측 처리), 골드=분석용 집계·데이터 마트", "브론즈=분석 결과, 실버=원본, 골드=백업", "브론즈=이미지, 실버=텍스트, 골드=음성", "계층 구분 없이 하나의 테이블에 모두 저장"], "a": 0, "expl": "메달리온 아키텍처는 데이터를 3층으로 관리합니다. 브론즈는 원본 그대로 보존(CSV), 실버는 스키마 표준화·결측·중복을 처리한 정제 데이터(Parquet), 골드는 부서별 분석용 집계(데이터 마트)입니다. 원본을 건드리지 않고 단계를 나눠 장애와 재처리에 대비하는 것이 핵심이며, 랜딩 존/스테이징, ETL vs ELT, CDC(증분 적재) 개념과 함께 데이터 엔지니어링의 표준 설계입니다."}, {"id": "L057", "src": "lec", "lec": 4, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "RAG 챗봇 구축에서 품질을 가장 크게 좌우한다고 강의가 강조한 요소는?", "opts": ["GPU의 브랜드", "청킹(chunking) 전략 — 맥락을 살려 데이터를 자르는 방식", "챗봇 UI의 색상", "서버의 물리적 위치"], "a": 1, "expl": "RAG 품질의 핵심은 모델보다 청킹 전략입니다. 기계적으로 '10줄마다' 자르면 검색이 엉뚱한 답을 가져오고, 법령이라면 조·절 단위처럼 맥락을 살려 잘라야 합니다. 구분자 옆에 '## 법인세법 부당행위계산 부인 관련' 같은 맥락 레이블을 달아주면 품질이 급상승합니다. 우리나라 법령은 맥락 단위가 섞여 있어 라벨링을 LLM에 맡기기 어렵고 결국 사람 검수가 필요합니다."}, {"id": "L058", "src": "lec", "lec": 4, "cat": "생성형AI활용", "diff": "상", "type": "mcq", "q": "'AI 부채'의 유형과 설명의 연결이 옳지 않은 것은?", "opts": ["프롬프트 부채 — 잘 먹히던 프롬프트가 버전관리 없이 누적돼 어느 날 안 먹히는 문제", "모델 의존성 — 특정 회사 API에 종속돼 모델 버전이 바뀌면 답이 달라지는 문제", "검색 부채 — RAG가 오래된 정보를 사실처럼 제시하는 문제", "전기 부채 — 데이터센터 전기요금이 밀리는 문제"], "a": 3, "expl": "AI 부채는 확률 기반 시스템 특유의 미묘하고 비선형적인 오류에서 옵니다. 프롬프트 부채(버전관리 없는 프롬프트 누적), 모델 의존성(API 종속·버전 변경 리스크), 검색 부채(RAG 리트리버 불안정·낡은 정보), 평가 부채(LLM 품질 기준의 모호함)가 대표 유형입니다. '전기 부채'는 강의에 없는 개념입니다. 모니터링 도구로 Langfuse(토큰·비용·프롬프트 기록, LLM-as-judge)가 소개됐습니다."}, {"id": "L059", "src": "lec", "lec": 4, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "시각화 라이브러리와 특징의 연결이 옳은 것은?", "opts": ["Folium — 위경도 기반 지도 시각화, 결과를 단일 HTML로 저장 가능", "Matplotlib — 인터랙티브 클릭·줌 전용", "Plotly — 파이썬 기본 내장이라 설치 불필요", "Seaborn — 지도 전용 라이브러리"], "a": 0, "expl": "Folium은 위경도만 있으면 지도에 마커를 찍고 결과를 단일 HTML로 저장할 수 있는 지도 시각화 라이브러리입니다(OpenStreetMap과 궁합이 좋음). Matplotlib은 파이썬 기본 시각화(문법이 까다롭지만 다 그려짐), Seaborn은 통계 시각화(갤러리 코드 제공), Plotly는 인터랙티브(클릭·줌, Dash로 대시보드)입니다. 어떤 차트가 좋을지는 AI에게 묻는 것이 빠릅니다."}, {"id": "L060", "src": "lec", "lec": 4, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "'LLM을 우리가 학습시킨다'는 말이 틀린 이유로 강의가 설명한 것은?", "opts": ["LLM은 이미 완벽해서 학습이 필요 없기 때문", "우리가 하는 것은 RAG(데이터 참조)이지 학습이 아니며, 진짜 학습(백프로파게이션)은 개인 컴퓨터로 불가능한 규모이기 때문", "LLM은 법적으로 학습이 금지돼 있기 때문", "학습은 GPU 없이 CPU로만 해야 하기 때문"], "a": 1, "expl": "일반 사용자가 문서를 넣어 쓰는 것은 RAG(참조)이지 학습이 아닙니다. 진짜 '학습'은 수십~수백조 파라미터에 백프로파게이션을 돌리는 것으로 개인 컴퓨터로는 초기화조차 안 됩니다. 또 모델이 값을 내는 인퍼런스(예측)와 LLM의 리즈닝(CoT 추론)은 다른 개념이며, 최신 LLM은 분야별 서브셋이 모인 MoE(Mixture of Experts) 구조로 만들어집니다."}, {"id": "L061", "src": "lec", "lec": 4, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "앙상블 기법 중 'soft voting'에 대한 설명으로 가장 적절한 것은?", "opts": ["여러 모델의 예측 확률을 평균 내어 최종 판단하는 방식", "가장 목소리 큰 모델 하나만 쓰는 방식", "모델을 부드러운 재질의 서버에서 돌리는 방식", "데이터를 절반만 사용하는 방식"], "a": 0, "expl": "soft voting은 RandomForest·XGBoost·LightGBM 같은 여러 모델의 예측 확률을 (가중) 평균 내어 최종 판단하는 앙상블 기법입니다. sklearn의 VotingClassifier(voting='soft', weights=[1,1,1])로 구현하며, 단일 모델보다 안정적인 성능을 내는 경우가 많습니다. 학습된 모델은 joblib으로 pickle 저장해 다음엔 학습 없이 즉시 로드합니다."}, {"id": "L062", "src": "lec", "lec": 4, "cat": "데이터분석", "diff": "하", "type": "mcq", "q": "피처 엔지니어링(feature engineering)에서 '피처'의 의미는?", "opts": ["소프트웨어의 신기능", "모델 입력에 쓰는 변수(파생변수 포함)", "GPU의 코어 수", "화면의 특수효과"], "a": 1, "expl": "머신러닝에서 피처는 개발의 '기능'이 아니라 모델 입력에 쓰는 변수를 뜻합니다. 피처 엔지니어링은 기존 변수의 곱·나눗셈으로 파생변수를 만들거나, 이미지에 '반지 꼈음' 같은 자연어 묘사를 추가하는 등 모델이 더 잘 학습하도록 입력을 가공하는 작업입니다. 어떤 변수가 예측에 가장 영향을 줬는지는 피처 임포턴스로 확인합니다."}, {"id": "L063", "src": "lec", "lec": 4, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "620만 건 데이터가 부담될 때 레이블 비율을 유지하며 표본을 뽑는 방법은?", "opts": ["무조건 앞에서 100건만 자르기", "층화 추출(stratified sampling)", "가장 큰 값만 골라내기", "알파벳순 정렬 후 상위 10%"], "a": 1, "expl": "층화 추출은 레이블(클래스)별 비율을 유지하면서 표본을 뽑는 방법으로, 대용량 데이터를 줄이면서도 분포 왜곡을 막습니다. 분포가 치우쳐 있으면(왜도, skewness) 로그 변환 등을 검토합니다. 클래스 불균형 상태에서 무작정 자르면 소수 클래스가 사라져 모델이 왜곡되므로, 샘플링 전략은 데이터 품질 관리의 기본입니다."}, {"id": "L064", "src": "lec", "lec": 4, "cat": "생성형AI활용", "diff": "중", "type": "mcq", "q": "PRD(요구사항 정의서) 작성의 핵심 두 가지로 강의가 강조한 것은?", "opts": ["KPI를 반드시 숫자로 정량화하고, 아웃 오브 스코프(하지 않을 것)를 명시한다", "분량을 최대한 길게 쓰고 전문용어를 많이 넣는다", "디자인 시안을 먼저 완성하고 요구사항은 나중에 쓴다", "작성자를 익명으로 하고 날짜를 뺀다"], "a": 0, "expl": "PRD의 핵심은 ① KPI를 반드시 숫자로(quantify) ② 아웃 오브 스코프('이건 안 한다')의 명시입니다. 범위를 못 박지 않으면 요구가 계속 늘어나 끝이 없어집니다. PRD는 SOW(작업 범위서)에 가깝게 디테일해야 하며, 분석은 딜리버러블(끝점)을 먼저 상상하고 시작해야 시간 낭비를 막습니다."}, {"id": "L065", "src": "lec", "lec": 4, "cat": "생성형AI활용", "diff": "중", "type": "mcq", "q": "폐쇄망 때문에 실데이터를 못 꺼낼 때 강의가 제시한 우회 전략은?", "opts": ["보안 규정을 무시하고 USB로 복사한다", "컬럼 구조만 주고 비슷한 합성(가상) 데이터를 AI로 생성해 바깥에서 테스트한 뒤 코드를 안으로 들여온다", "분석을 포기한다", "종이에 출력해 손으로 옮긴다"], "a": 1, "expl": "실데이터 반출이 불가하면 엑셀 헤더(컬럼 구조)만 주거나 기억하는 필드값으로 '비슷하게 500줄만 가상 생성해줘'라고 하면 됩니다. 폐쇄망 밖에서 합성 데이터로 테스트·조립한 뒤 검증된 코드를 안으로 들여오는 전략입니다. 강의의 민원 620만 건 케이스 데이터 자체도 시나리오를 먼저 짜고 AI로 역설계 생성한 합성 데이터입니다."}, {"id": "L066", "src": "lec", "lec": 4, "cat": "데이터분석", "diff": "하", "type": "mcq", "q": "Colab에서 Matplotlib 그래프의 한글이 □□□로 깨질 때의 해결책은?", "opts": ["나눔 폰트를 설치하고 plt.rcParams의 font.family를 NanumGothic으로 지정한다", "그래프를 영어로만 그린다", "해상도를 낮춘다", "Colab을 재구매한다"], "a": 0, "expl": "Colab에는 한글 폰트가 기본 설치돼 있지 않아 fonts-nanum을 설치(!apt-get install -y fonts-nanum)하고, fontManager에 폰트를 추가한 뒤 plt.rcParams['font.family']='NanumGothic'으로 지정합니다. axes.unicode_minus=False로 마이너스 부호 깨짐도 함께 방지합니다. 자주 겪는 함정이므로 코드 스니펫을 떠 두면 편합니다."}, {"id": "L067", "src": "lec", "lec": 4, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "데이터 파이프라인에서 CDC(Change Data Capture)의 의미는?", "opts": ["전체 데이터를 매번 통째로 덮어쓰는 방식", "변경분(증분)만 잡아 처리하는 적재 방식", "데이터를 CD에 굽는 백업 방식", "질병 통제 데이터 표준"], "a": 1, "expl": "CDC는 변경된 데이터(증분)만 잡아 처리하는 적재 방식입니다. 매번 전체를 덮어쓰면(오버라이트) DB에 무리가 가므로, 운영 환경에서는 증분 적재가 표준입니다. 운영 DB에 직접 붙지 않고 연계 서버를 두어 파일을 떨궈 가져가는 구조, 파이프라인 장애 재처리·모니터링을 담당하는 Apache Airflow와 함께 데이터 엔지니어링 실무 개념입니다."}, {"id": "L068", "src": "lec", "lec": 4, "cat": "AI트렌드", "diff": "중", "type": "mcq", "q": "카파시의 'LLM은 새로운 운영체제(OS)'라는 말의 의미로 가장 적절한 것은?", "opts": ["LLM이 윈도우를 대체해 부팅을 담당한다는 뜻", "LLM이 텍스트로 검색·계산·코드실행 등 모든 도구를 조율하는 중심 두뇌가 된다는 뜻", "LLM을 설치하면 OS 라이선스가 무료라는 뜻", "LLM이 하드웨어 드라이버를 직접 만든다는 뜻"], "a": 1, "expl": "지금의 AI 채팅창은 1960년대 메인프레임 터미널 수준이고, LLM 자체가 텍스트로 검색·계산·코드실행 등 모든 도구를 조율하는 새로운 OS(중심 두뇌)라는 비유입니다. 개인용 컴퓨터·마우스·아이폰에 해당하는 것은 아직 발명도 안 됐다는 것이 카파시의 관점입니다. '코드는 이제 공짜고 일회용'이라는 어록과 함께, 오케스트레이션 역량의 중요성을 강조하는 맥락입니다."}, {"id": "L069", "src": "lec", "lec": 5, "cat": "서비스구현", "diff": "하", "type": "mcq", "q": "Ollama의 기본 포트 번호는?", "opts": ["8080", "5000", "11434", "3306"], "a": 2, "expl": "Ollama는 로컬에서 http://localhost:11434 로 API 서버를 엽니다. VBA·파이썬 등에서 이 주소의 /api/generate 엔드포인트로 POST 요청을 보내 로컬 LLM을 호출할 수 있습니다. 참고로 5000은 Flask 기본 포트, 3306은 MySQL, 8080은 웹 서버 대체 포트로 자주 쓰입니다."}, {"id": "L070", "src": "lec", "lec": 5, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "Ollama 핵심 명령어와 기능의 연결이 옳지 않은 것은?", "opts": ["ollama run — 모델을 받아 바로 대화 시작", "ollama pull — 모델을 받아만 두기", "ollama list — 설치된 모델 목록 확인", "ollama fly — 모델을 클라우드로 전송"], "a": 3, "expl": "Ollama의 핵심 명령은 run(실행·대화), pull(다운로드만), list(설치 목록), ps(실행 중 확인), rm(삭제) 5개면 충분합니다. 'ollama fly'라는 명령은 없습니다. Ollama는 인터넷 없이 로컬에서 돌아 폐쇄망 활용의 표준 출발점이며, 모델 태그는 ollama.com/library에서 확인합니다."}, {"id": "L071", "src": "lec", "lec": 5, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "Ollama를 엑셀과 결합해 =AI_Summarize() 같은 함수를 만드는 방법으로 강의가 소개한 것은?", "opts": ["엑셀 추가 기능 스토어에서 유료 구매", "VBA 사용자 정의 함수에서 MSXML2.XMLHTTP로 localhost:11434 API를 호출", "엑셀을 파이썬으로 재작성", "셀에 URL을 직접 입력"], "a": 1, "expl": "VBA 사용자 정의 함수 안에서 MSXML2.XMLHTTP 객체로 Ollama API(localhost:11434/api/generate)에 POST 요청을 보내면 셀에서 =AI_Summarize(A1)처럼 로컬 LLM을 쓸 수 있습니다. .xlsm으로 저장해 내가 쓰고, 배포하려면 .xlam(엑셀 추가 기능)으로 저장해 동료가 옵션→추가 기능에서 등록합니다. URL과 인증 헤더만 바꾸면 외부 모델(GPT 등)도 같은 구조로 연동됩니다."}, {"id": "L072", "src": "lec", "lec": 5, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "구글 설문(Forms)을 코드로 자동 생성할 때 사용하는 구글의 자동화 언어는?", "opts": ["Apps Script", "VBScript", "COBOL", "Assembly"], "a": 0, "expl": "Apps Script는 구글이 제공하는 자동화 언어(VBA의 구글판)로 script.google.com에서 실행합니다. FormApp.create()로 설문을 만들고 addMultipleChoiceItem 등으로 문항을 추가하며, getPublishedUrl()로 배포 주소를 얻습니다. LLM으로 문항을 기획하고 'Apps Script로 작성해줘'라고 시키면 15문항이든 100문항이든 한 번에 생성됩니다. 응답은 구글 시트에 쌓여 Gemini나 파이썬으로 바로 분석할 수 있습니다."}, {"id": "L073", "src": "lec", "lec": 5, "cat": "서비스구현", "diff": "하", "type": "mcq", "q": "브라우저 개발자 도구(F12) 콘솔에 코드 붙여넣기가 막혔을 때의 해결 방법은?", "opts": ["브라우저를 재설치한다", "콘솔에 allow pasting을 입력하고 엔터 친 뒤 붙여넣는다", "다른 컴퓨터를 사용한다", "관리자에게 공문을 보낸다"], "a": 1, "expl": "크롬·엣지는 보안상 콘솔 첫 붙여넣기를 막는 경우가 있는데, 콘솔에 allow pasting을 타이핑하고 엔터를 친 뒤 붙여넣으면 됩니다. 콘솔 자동화의 기본 워크플로우는 F12 → 요소 선택으로 대상 캡처(Name/Role 팝업) → ChatGPT에 이미지+URL 전달 → 생성된 JS를 콘솔에 붙여 실행입니다. 콘솔 코드는 매번 휘발되므로 자주 쓰면 확장 프로그램으로 영속화합니다."}, {"id": "L074", "src": "lec", "lec": 5, "cat": "서비스구현", "diff": "상", "type": "mcq", "q": "파이썬 크롤러 대신 브라우저 콘솔(JS) 자동화가 유리한 경우로 강의가 짚은 것은?", "opts": ["서버가 IP를 차단하는 크롤링 방어가 있는 사이트 — 콘솔 코드는 내 브라우저(클라이언트) 안에서 실행되므로 우회가 쉽다", "데이터가 1억 건 이상인 경우", "GPU 연산이 필요한 경우", "서버 관리자 권한이 있는 경우"], "a": 0, "expl": "콘솔 코드는 지금 내가 보고 있는 브라우저(클라이언트) 안에서 실행되므로, 네이버처럼 서버에서 IP를 차단하는 크롤링 방어를 우회하기 쉽습니다. 파이썬 크롤러보다 기능은 제한적이지만 막히는 사이트에는 이 방식이 통하며, RAG용 자료 대량 수집에 유용합니다. 첨부파일 일괄 다운로드, 2단계 클릭 자동화 등이 실전 사례입니다."}, {"id": "L075", "src": "lec", "lec": 5, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "종이 양식 → OCR → 웹 폼 자동 입력 사례(농촌진흥청 흙 시료)가 보여주는 핵심 메시지는?", "opts": ["OCR은 오류가 많아 쓰면 안 된다", "AX보다 DX가 먼저 — 종이를 디지털로 바꾸는 것이 선결 과제", "손글씨는 반드시 타이피스트가 입력해야 한다", "웹 폼은 자동화가 불가능하다"], "a": 1, "expl": "농민이 손글씨로 쓴 시료 정보를 접수자가 두 번 옮겨 적던 업무를, 웹 폼 구조를 F12로 캡처하고 이미지 인식 API를 붙인 콘솔 코드로 자동 입력하게 만든 사례입니다. 핵심 메시지는 'AX보다 DX가 먼저' — 종이 문서를 디지털로 바꾸는 것이 선결이라는 점입니다. 사용자는 자동 입력된 값을 눈으로 확인 후 제출하므로 human-in-the-loop도 유지됩니다."}, {"id": "L076", "src": "lec", "lec": 5, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "브라우저 확장 프로그램(manifest v3)을 만들어 등록하는 절차로 옳은 것은?", "opts": ["manifest.json과 popup.html 폴더를 만들고, 확장 프로그램 페이지에서 개발자 모드 ON 후 '압축 해제된 확장 프로그램 로드'로 폴더 선택", "앱스토어에 애플 개발자 계정으로 업로드", "윈도우 제어판에서 프로그램 추가", "레지스트리를 직접 수정"], "a": 0, "expl": "자주 쓰는 콘솔 코드는 manifest.json(manifest_version 3, action.default_popup 등)과 팝업 html로 폴더를 구성한 뒤, 브라우저 확장 프로그램 페이지에서 개발자 모드를 켜고 '압축 해제된 확장 프로그램 로드'로 폴더를 선택하면 등록됩니다. 남에게 배포하려면 크롬 웹스토어 심사가 필요합니다. 콘솔 코드의 휘발성을 해결하는 영속화 방법입니다."}, {"id": "L077", "src": "lec", "lec": 5, "cat": "생성형AI활용", "diff": "중", "type": "mcq", "q": "temperature 파라미터에 대한 설명으로 가장 적절한 것은?", "opts": ["0에 가까울수록 가장 확률 높은 토큰만 골라 결정적이 되므로 코딩처럼 정확성이 중요한 작업에 적합하다", "높을수록 항상 정확한 답이 나온다", "GPU 온도를 조절하는 하드웨어 설정이다", "응답 길이를 조절하는 파라미터다"], "a": 0, "expl": "temperature는 토큰 선택의 무작위성을 조절합니다. 0에 가까우면 가장 확률 높은 토큰만 골라 결정적(deterministic)이 되어 코딩·정확성 작업에 적합하고 환각·버그가 줄어듭니다. 창의적 작업에는 1 근처를 씁니다. 코딩 에이전트는 보통 0에 가깝게 설정돼 있으며, 버그가 잦으면 temperature를 낮춰 다시 시도하는 것이 요령입니다."}, {"id": "L078", "src": "lec", "lec": 5, "cat": "데이터분석", "diff": "중", "type": "mcq", "q": "Power Query의 '폴더에서 가져오기'가 해결하는 문제는?", "opts": ["엑셀이 여러 파일을 한 번에 못 여는 한계 — 폴더 단위로 월별 파일들을 연결해 하나로 통합", "이미지 파일의 해상도 저하", "프린터 용지 걸림", "이메일 스팸 필터링"], "a": 0, "expl": "엑셀은 파일을 하나씩만 열 수 있어 월별 CSV 12개를 합치려면 노가다였습니다. Power Query의 데이터 가져오기→파일에서→폴더에서를 쓰면 폴더 단위로 연결(connect)해 파일들을 병합·전처리할 수 있습니다. 여기서 '가져오기'는 열기(open)가 아니라 연결 개념이며, 폴더에 새 파일을 넣고 '모두 새로 고침'만 누르면 통합본이 자동 갱신됩니다. 가져올 파일이 열려 있으면 안 된다는 함정도 주의해야 합니다."}, {"id": "L079", "src": "lec", "lec": 5, "cat": "데이터분석", "diff": "하", "type": "mcq", "q": "한 셀에 '서비스;정보'처럼 여러 값이 섞인 데이터를 Power Query에서 함수 없이 나누는 기능은?", "opts": ["열 분할(구분 기호 기준)", "셀 병합", "피벗 해제", "조건부 서식"], "a": 0, "expl": "Power Query의 열 분할 기능은 세미콜론·파이프(|) 같은 구분 기호를 기준으로 클릭만으로 열을 나눕니다. 엑셀 함수(FIND/LEFT)를 쓸 필요가 없습니다. 이는 '원-셀-원-데이터' 원칙 위반을 바로잡는 전처리이며, 작업 후 '닫기 및 로드'를 눌러야 결과가 실제 시트로 내려온다는 점을 기억해야 합니다."}, {"id": "L080", "src": "lec", "lec": 5, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "엑셀을 열지 않고 '모두 새로 고침'을 무인 실행하기 위해 강의가 사용한 방법은?", "opts": ["PowerShell 스크립트에서 COM(Excel.Application)으로 RefreshAll()을 호출", "마우스 매크로 녹화 프로그램", "매일 아침 직원이 수동 클릭", "엑셀을 24시간 켜 둠"], "a": 0, "expl": "PowerShell에서 New-Object -ComObject Excel.Application으로 엑셀을 화면에 띄우지 않고($excel.Visible=$false) 열어 $wb.RefreshAll()을 호출하면 '모두 새로 고침'이 무인 실행됩니다. 이 .ps1 스크립트를 작업 스케줄러(taskschd.msc 또는 schtasks /create)에 등록하면 매월 지정일에 자동으로 통합·전처리·갱신이 돌아갑니다. 남는 수작업은 폴더에 새 파일을 넣는 것뿐입니다."}, {"id": "L081", "src": "lec", "lec": 5, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "'토큰 0 자동화'(Power Query + PowerShell + 작업 스케줄러)를 권한 강의의 의도로 가장 적절한 것은?", "opts": ["AI 도구가 항상 열등하기 때문", "개인 PC의 반복 업무는 윈도우 내장 기능으로 충분한 경우가 많으므로 MCP·에이전트로 오버엔지니어링하지 말라는 것", "파이썬이 유료화됐기 때문", "클라우드가 법으로 금지됐기 때문"], "a": 1, "expl": "개인 PC에서 도는 반복 업무라면 파이썬(인메모리 부담)이나 MCP·에이전트로 오버엔지니어링하지 말고 윈도우 내장 기능(Power Query+PowerShell+스케줄러)으로 충분할 때가 많습니다. 토큰 비용 0, 파이썬 설치도 불필요합니다. '이걸 해보면 오히려 AI가 들어가면 좋을 지점이 보인다'는 것이 강사의 의도이며, old is best의 실용주의입니다."}, {"id": "L082", "src": "lec", "lec": 5, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "PowerShell 자동화에서 가장 흔한 오류 원인과 예방책으로 강의가 짚은 것은?", "opts": ["경로(path) 오류 — 손으로 치지 말고 폴더 화면을 캡처해 AI에 주고, 한글 깨짐은 UTF-8 인코딩(chcp 65001)으로 예방", "CPU 과열 — 냉각팬 교체", "마우스 배터리 방전", "모니터 케이블 불량"], "a": 0, "expl": "파이썬이든 PowerShell이든 가장 흔한 오류는 경로 오류(그리고 'No module named ○○')입니다. 경로를 손으로 치지 말고 폴더 화면을 캡처해 'AI야 내 경로 이거야'라고 주면 한 글자 실수가 줄어듭니다. PowerShell 한글 깨짐은 chcp 65001 또는 [Console]::OutputEncoding 설정으로 잡고, 붙여넣기 시 따옴표·틸드가 깨지는 것도 주의합니다."}, {"id": "L083", "src": "lec", "lec": 5, "cat": "서비스구현", "diff": "상", "type": "mcq", "q": "콘솔로 웹페이지의 숫자·텍스트를 바꿔치기할 수 있다는 사실이 주는 교훈은?", "opts": ["URL이 그대로여도 화면 표시값은 조작 가능하므로, '통장 인증' 캡처 등은 새로고침 검증 없이 믿으면 안 된다", "콘솔을 쓰면 실제 서버 데이터도 바뀐다", "웹페이지의 모든 정보는 항상 정확하다", "F12는 해킹 도구라 사용이 금지된다"], "a": 0, "expl": "콘솔(JS)로는 화면에 표시된 값(DOM)을 그 자리에서 바꿀 수 있습니다. 서버 데이터가 아닌 클라이언트 표시만 바뀌므로 새로고침하면 원래대로 돌아옵니다. 따라서 '통장 잔고 인증' 같은 캡처를 곧이곧대로 믿으면 안 되고, '리프레시 해봐'가 검증법입니다. 클라이언트/서버 구분을 이해하는 좋은 사례입니다."}, {"id": "L084", "src": "lec", "lec": 5, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "5회차 강의에서 소개한 Gemma 4 E4B 같은 로컬 모델을 고를 때의 관점으로 가장 적절한 것은?", "opts": ["무조건 가장 큰 모델을 받는다", "내 PC 사양(RAM 등)에서 돌아가는 크기이면서 업무(요약·분류 등)에 충분한 멀티모달·성능인지 확인한다", "이름이 예쁜 모델을 고른다", "해외 모델은 모두 금지다"], "a": 1, "expl": "로컬 LLM은 내 PC 사양에서 돌아가는 크기(강사 경험상 RAM 32GB는 돼야 쾌적, 16GB는 빠듯)와 업무 요구(요약·분류·멀티모달)를 함께 따져 고릅니다. Gemma 4 E4B는 멀티모달 지원의 효율적 소형 모델로 소개됐습니다. '민원 분류만 잘하는 작은 모델'처럼 스페시픽한 SLM이 폐쇄망 업무의 숨통을 틔울 수 있으며, 설치 전 보안 점검은 필수입니다."}, {"id": "L085", "src": "lec", "lec": 6, "cat": "AI트렌드", "diff": "중", "type": "mcq", "q": "AI 에이전트의 구성 3요소로 강의가 제시한 것은?", "opts": ["두뇌(LLM)·도구·기억", "CPU·RAM·SSD", "입력·출력·저장", "기획·개발·운영"], "a": 0, "expl": "AI 에이전트는 두뇌(LLM, 어떤 도구를 쓸지 판단하는 주체), 도구(검색·계산·외부 API 등 두뇌가 못하는 일을 맡김), 기억(컨텍스트·메모리, 대화와 결과를 담아둠)으로 구성됩니다. Anthropic의 'Building Effective Agents'는 증강된 LLM = LLM+검색+도구+기억으로 정의하는데, 검색을 도구에 포함시키면 강사의 3요소와 일치합니다."}, {"id": "L086", "src": "lec", "lec": 6, "cat": "AI트렌드", "diff": "상", "type": "mcq", "q": "에이전트에서 '기억 설계'가 1순위인 진짜 이유로 강의가 강조한 것은?", "opts": ["기억이 없으면 매번 초기화돼 같은 작업을 반복하고, 그때마다 LLM 호출 토큰 비용이 나가기 때문", "기억은 법적 의무사항이기 때문", "기억이 있어야 UI가 예뻐지기 때문", "기억이 GPU 온도를 낮추기 때문"], "a": 0, "expl": "기억이 없는 에이전트는 매번 초기화되는 '붕어 같은 존재'가 되어, 바로 전 단계 결과를 가져오면 될 일을 반복합니다. 그때마다 두뇌(LLM) 호출 = 토큰 = 돈이 나갑니다. 일관성·일회성 문제도 있지만 가장 근본 이유는 비용 효율입니다. '에이전트를 만들 때 1순위로 생각할 것 = 기억 설계'라고 강사가 못 박았습니다."}, {"id": "L087", "src": "lec", "lec": 6, "cat": "AI트렌드", "diff": "중", "type": "mcq", "q": "RPA와 AI 에이전트의 결정적 차이는?", "opts": ["RPA는 룰(규칙) 기반이라 예상 밖 값에 무너지지만, AI 에이전트는 두뇌(LLM)의 자율 판단이 있다", "RPA가 항상 더 지능적이다", "AI 에이전트는 규칙을 절대 따르지 않는다", "둘은 완전히 같은 기술이다"], "a": 0, "expl": "RPA(Robotic Process Automation)는 룰 베이스라 예상 밖(튀는) 값이 들어오면 무너집니다. AI 에이전트는 두뇌(LLM)가 상황을 판단해 필요한 도구를 알아서 골라 쓰는 것이 핵심 차이입니다. 두뇌(자율 판단)가 빠지면 그냥 RPA입니다. 알고리즘도 규칙 기반이므로 그 자체는 AI 에이전트가 아닙니다."}, {"id": "L088", "src": "lec", "lec": 6, "cat": "AI트렌드", "diff": "중", "type": "mcq", "q": "멀티 에이전트 구조 중 '네트워크' 구조의 약점으로 강의가 짚은 것은?", "opts": ["리더(결정권자)가 없어 헤매고, 이상치 하나가 전체로 번져 오염되며 코드가 수백 줄로 복잡해진다", "항상 가장 저렴하다", "단 하나의 에이전트만 쓸 수 있다", "도구를 전혀 연결할 수 없다"], "a": 0, "expl": "네트워크 구조는 모든 에이전트가 그물망처럼 서로 직접 대화해 병렬·유연하지만, 리더가 없어 서로 헤매고 이상치 하나가 옆으로 번져 전체가 오염됩니다. 같은 일을 싱글은 100줄, 네트워크는 수백 줄이 필요할 만큼 복잡해집니다. 이 '리더 없음'을 푸는 것이 슈퍼바이저(팀장)를 두는 오케스트레이션입니다."}, {"id": "L089", "src": "lec", "lec": 6, "cat": "AI트렌드", "diff": "중", "type": "mcq", "q": "슈퍼바이저 구조의 대표적 약점은?", "opts": ["요청이 몰리면 팀장(슈퍼바이저)이 병목이 되고, 팀장에 붙인 모델의 API 비용이 급증한다", "서브 에이전트를 둘 수 없다", "반드시 무료 모델만 써야 한다", "코드를 1줄 이상 쓸 수 없다"], "a": 0, "expl": "슈퍼바이저 구조는 팀장이 요청을 나눠주고 조율해 병렬·유지보수에 유리하지만, 요청이 몰리면 팀장이 병목에 빠지고 팀장에 붙인 모델의 API 비용이 기하급수적으로 듭니다. 서브를 '도구'로만 취급하는 '슈퍼바이저 as 툴'은 통제가 강한 대신 사실상 싱글과 유사해지는 '폭군' 구조입니다. 계층형은 전문성 있게 돌지만 비용·시간이 큽니다."}, {"id": "L090", "src": "lec", "lec": 6, "cat": "AI트렌드", "diff": "상", "type": "mcq", "q": "'핸드오프'와 '델리게이트'의 구분으로 옳은 것은?", "opts": ["결과를 넘기고 손을 털면 핸드오프, 반려돼 되돌아와 다시 하면 델리게이트(위임)", "핸드오프는 하드웨어 교체, 델리게이트는 소프트웨어 업데이트", "둘 다 데이터 암호화 기법이다", "핸드오프는 사람만, 델리게이트는 AI만 할 수 있다"], "a": 0, "expl": "팀장에게 보고서를 올리고 손을 털면 핸드오프, 팀장이 '다시 해'라고 해서 되돌아와 다시 하면 델리게이트(위임)입니다. 일반 멀티 에이전트는 되돌아올 수 있으므로 100% 핸드오프가 아닙니다. 순차(탑다운) 에이전트만 무조건 아래로 흐르는 100% 핸드오프인데, 앞 단계가 잘못 넘기면 뒤가 전부 무너진다는 것이 최대 약점입니다."}, {"id": "L091", "src": "lec", "lec": 6, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "민원 초안 생성 멀티 에이전트 실습에서 '챗봇'과 '에이전트'를 가르는 기준으로 강의가 제시한 것은?", "opts": ["페르소나만 주면 챗봇이고, 도구까지 줘서 결과를 만들어내야 에이전트다", "응답 속도가 1초 미만이면 에이전트다", "한국어를 쓰면 챗봇, 영어를 쓰면 에이전트다", "GPU를 쓰면 에이전트다"], "a": 0, "expl": "'너는 분류 담당이야'라고 페르소나만 주면 전용 챗봇에 그치고, 도구를 붙여 실제로 행동해 결과를 만들어내야 에이전트입니다. 실습(민원 접수→분류→검색→작성→검수)에서는 각 에이전트에 페르소나+사용 가능한 도구를 함께 부여했으며, 법령 API 같은 무거운 도구는 '예시 도구'로 대체해도 됩니다."}, {"id": "L092", "src": "lec", "lec": 6, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "OpenRouter에 대한 설명으로 가장 적절한 것은?", "opts": ["키 하나로 수백 개 모델(여러 공급자)을 OpenAI 호환 방식으로 부르는 통합 게이트웨이", "GPU를 물리적으로 라우팅하는 네트워크 장비", "오픈소스 공유기 펌웨어", "모델을 학습시키는 클라우드 GPU 팜"], "a": 0, "expl": "OpenRouter는 API 키 하나로 60여 개 공급자의 수백 개 모델(OpenAI·Anthropic·Google·Meta 등)을 OpenAI 호환 방식으로 호출하는 통합 게이트웨이입니다. 공급자별 인증·결제·SDK를 따로 만들 필요가 없고 장애 시 폴백도 가능하며, 대시보드에서 사용 모델·비용을 확인할 수 있습니다. base_url을 openrouter.ai/api/v1로 바꾸고 모델 문자열만 지정하면 됩니다."}, {"id": "L093", "src": "lec", "lec": 6, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "API 키 관리의 표준 방법으로 강의가 강조한 것은?", "opts": ["코드에 직접 하드코딩한다", "HTML 프론트에 넣어 공유한다", ".env 파일에 넣고 .gitignore로 깃 추적에서 제외하며, 키를 쓰는 호출은 서버·로컬 스크립트에서 한다", "포스트잇에 적어 모니터에 붙인다"], "a": 2, "expl": "API 키는 코드에 박지 말고 .env(환경변수 파일)에 두고, .gitignore에 .env를 추가해 깃에 올라가지 않게 합니다. HTML 프론트에서 직접 키를 부르면 브라우저에 그대로 노출되므로, 키를 쓰는 호출은 서버(백엔드)나 로컬 스크립트에서 해야 합니다. python-dotenv의 load_dotenv()로 읽어 os.environ으로 사용하는 것이 표준 패턴입니다."}, {"id": "L094", "src": "lec", "lec": 6, "cat": "생성형AI활용", "diff": "중", "type": "mcq", "q": "'적정 에이전트 수'에 대한 강의 지침으로 가장 적절한 것은?", "opts": ["에이전트는 많을수록 무조건 좋다", "역할이 명확하지 않으면 에이전트끼리 계속 왔다 갔다 하므로, 의심스러우면 수를 줄이고 비용·정확도를 측정해 최적을 찾는다", "에이전트는 반드시 정확히 7개여야 한다", "에이전트 수는 한 번 정하면 바꿀 수 없다"], "a": 1, "expl": "'백지장도 맞들면 낫다'지만 너무 잘게 쪼개면 '사공이 많으면 배가 산으로' 갑니다. 에이전트가 7~8개로 계속 오가는 것은 각자 일이 명확하지 않다는 신호이며, 의심스러우면 줄이는 게 최선입니다. 최적값은 에이전트별 비용을 기록하고 민원 100건 등으로 구조별 비용·정확도를 비교하는 경험(측정)으로 찾습니다. 의사결정나무의 depth처럼 너무 적어도 많아도 안 됩니다."}, {"id": "L095", "src": "lec", "lec": 6, "cat": "생성형AI활용", "diff": "중", "type": "mcq", "q": "'무조건 플랜 먼저' 원칙에서 플랜에 담을 4가지 요소는?", "opts": ["목표·범위·단계·완료 기준", "이름·주소·연락처·이메일", "색상·폰트·여백·아이콘", "서론·본론·결론·참고문헌"], "a": 0, "expl": "'뭐 만들어줘'라고 바로 시키지 말고 ① 목표 ② 범위 ③ 단계 ④ 완료 기준을 먼저 세우게 해야 합니다. 처음 보는 개념도 메타 프롬프트('내 상황이 이러니 플랜 프롬프트를 네가 만들어줘')로 시작할 수 있고, 만든 플랜은 다른 AI에게 '가장 크리티컬한 부분이 뭐야? 냉정하게 검토해'로 교차 검토시킵니다. 3살 아이 심부름 비유처럼 지시는 생각보다 명확하지 않기 때문입니다."}, {"id": "L096", "src": "lec", "lec": 6, "cat": "생성형AI활용", "diff": "중", "type": "mcq", "q": "plan.md와 Git으로 개발 이력을 남기는 이유로 강의가 강조한 것은?", "opts": ["계획은 변해도 되지만 '바뀐 이유'가 사라지면 안 되기 때문", "파일 용량을 줄이기 위해", "상급자 결재를 생략하기 위해", "코드를 암호화하기 위해"], "a": 0, "expl": "계획은 바뀔 수 있지만 언제·왜·어디를 바꿨는지의 기록이 사라지면 유지보수가 불가능해집니다. plan.md에 목표·범위·단계·완료 기준·변경 이력을 남기고, Git 커밋으로 '언제 뭘 했다'를 영구 기록합니다(git add → commit). 픽셀 에이전트 원저자의 커밋 145개가 모두 그 이력이며, 개발자가 GitHub를 쓰는 가장 큰 이유가 이 관리 편의성입니다."}, {"id": "L097", "src": "lec", "lec": 6, "cat": "AI트렌드", "diff": "상", "type": "mcq", "q": "멀티 에이전트 비용이 '토큰 스노우볼'처럼 불어나는 구조적 이유는?", "opts": ["핸드오프마다 이전 작업 내용 전체가 다음 에이전트의 입력 토큰이 되고, 추론(Thinking) 토큰과 출력 토큰이 단계마다 누적되기 때문", "전기요금이 누진제이기 때문", "에이전트가 많으면 세금이 붙기 때문", "GPU 가격이 매일 오르기 때문"], "a": 0, "expl": "A가 작업 파일을 넘기면 B는 그것 전체를 입력 토큰으로 받고, 다시 추론(Thinking) 토큰과 출력 토큰을 씁니다. 이것이 다음 에이전트로 계속 누적되며 비용이 일차함수가 아니라 눈덩이처럼 붑니다. 요즘 모델은 Thinking이 기본이라 추론 과정도 전부 과금되며(effort 레벨이 추론량 조절 장치), 에이전트를 과도하게 늘리면 과금 폭탄이 되는 이유입니다."}, {"id": "L098", "src": "lec", "lec": 6, "cat": "AI트렌드", "diff": "상", "type": "mcq", "q": "LatentMAS 논문의 핵심 아이디어는?", "opts": ["에이전트 간 통신을 사람 말(텍스트 디코딩)로 하지 않고 잠재(latent) 표현을 그대로 넘겨 토큰을 크게 절감한다", "에이전트를 잠수함에서 실행한다", "모든 에이전트를 하나로 합쳐 싱글로 만든다", "토큰 가격을 정부가 규제한다"], "a": 0, "expl": "LatentMAS는 모델 사이 통신에서 굳이 텍스트로 디코딩하지 않고 마지막 층의 잠재(latent) 표현을 공유 잠재 메모리로 그대로 넘기는 접근입니다. 논문은 토큰 70.8~83.7% 절감, 속도 4배 이상을 보고했습니다. 다만 모델마다 토크나이저·임베딩이 달라 이종(heterogeneous) 모델 간 전달에서는 열화가 연구 쟁점이며, 어휘 통일이 이론상 해법이지만 회사 간 표준 통일은 현실적으로 어렵다는 열린 문제도 함께 소개됐습니다."}, {"id": "L099", "src": "lec", "lec": 6, "cat": "AI트렌드", "diff": "중", "type": "mcq", "q": "퍼셉트론·임베딩·RNN·트랜스포머의 발전 흐름에 대한 설명으로 옳지 않은 것은?", "opts": ["퍼셉트론은 가중치를 고쳐가며 학습하는 딥러닝의 최소 단위다", "임베딩은 단어·이미지를 숫자 벡터(좌표)로 바꾸는 것이다", "RNN/LSTM은 긴 문맥 처리에 한계가 있었다", "트랜스포머는 2017년 OpenAI가 발표한 구조다"], "a": 3, "expl": "트랜스포머는 2017년 구글의 'Attention Is All You Need' 논문에서 나왔습니다. 정작 구글은 공개 정책 탓에 선점하지 못했고 OpenAI가 디코더 부분을 픽업해 GPT로 키웠습니다. 퍼셉트론(최소 단위)→임베딩(벡터화)→N-gram→RNN/LSTM(시간·기억 추가, 긴 문맥 한계)→트랜스포머(어텐션)의 흐름으로 모델이 '말'을 배웠습니다."}, {"id": "L100", "src": "lec", "lec": 6, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "남이 만든 오픈소스(픽셀 에이전트)를 내 PC로 가져와 수정하는 표준 절차의 시작은?", "opts": ["git clone으로 레포를 복제한 뒤 의존성 설치(npm install 등) 후 실행해 보고, 순서와 요령을 지켜 뜯어고친다", "소스코드를 화면 캡처해 다시 타이핑한다", "개발자에게 우편으로 CD를 요청한다", "웹사이트를 통째로 인쇄한다"], "a": 0, "expl": "git clone으로 레포를 내 PC에 복제하고, Node.js 프로젝트라면 npm install로 의존성을 설치한 뒤 실행해 봅니다. 그다음 구조를 파악하며 순서대로 뜯어고칩니다(리버스 엔지니어링 — '모방은 창조의 어머니'). 잘 만든 오픈 멀티 에이전트를 하나 뜯어보며 구성을 따라가는 것도 훌륭한 학습법이며, 과제도 결과물을 GitHub에 올려 주소를 제출하는 방식이었습니다."}, {"id": "C001", "src": "custom", "lec": 0, "cat": "생성형AI활용", "diff": "하", "type": "mcq", "q": "[테스트] AI 챔피언 역량평가 문제은행에 성공적으로 등록된 커스텀 문제입니다. 다음 중 인공지능 에이전트를 설계할 때 가장 바람직한 문제 해결 자세는 무엇인가요?", "opts": ["거대하고 복잡한 시스템부터 완벽하게 설계하여 한 번에 도입한다.", "기술의 엄밀성보다는 가용한 도구와 지식을 조화롭게 이어 붙여 책상 위의 실질적인 작은 문제부터 빠르게 해결해 나간다.", "오픈소스 모델의 한계점에 대한 학술적 논리 분석에 집중하여 프로토타이핑을 미룬다.", "가장 비싼 상용 엔터프라이즈 솔루션을 무조건적으로 구매하여 시스템을 의존적으로 구축한다."], "a": 1, "expl": "이 문제는 '브리콜라주 사고'와 '미시적 혁신'을 테스트하기 위해 작성된 커스텀 예제입니다. 가용한 도구를 레고 블록처럼 모아서 오케스트레이션하여 내 책상 위의 작고 확실한 문제부터 기민하게 푸는 방식(1장, 3장 핵심 주제)이 가장 바람직한 에이전트 개발 태도입니다."}, {"id": "NL001", "src": "custom", "lec": 1, "cat": "AI트렌드", "diff": "상", "type": "mcq", "q": "강의에서 언급된 구글 Gemma 3n 모델의 'MatFormer(Matryoshka Transformer)' 구조가 가지는 기술적 특징으로 가장 적절한 것은?", "opts": ["모든 레이어를 병렬로 복사하여 연산 속도를 8배 향상시키는 구조다", "큰 모델 내부에 작은 모델이 중첩되어 있어 자원을 아끼며 실효(effective) 크기로 추론할 수 있다", "텍스트 인코더와 이미지 디코더를 완전히 물리적으로 분리한 구조다", "인간의 뇌 뉴런 개수인 860억 개를 컴퓨터 칩 하나에 그대로 모방한 구조다"], "a": 1, "expl": "Gemma 3n E4B 등에 적용된 MatFormer(마트료시카 트랜스포머) 구조는 큰 모델 내에 작은 모델이 중첩되어 있는 형태를 취합니다. 이를 통해 원본은 8B 크기이지만 메모리와 배터리를 아끼면서 'effective 4B(실효 4B)'로 동작할 수 있게 해주는 최신 SLM 기술입니다."}, {"id": "NL002", "src": "custom", "lec": 1, "cat": "AI트렌드", "diff": "상", "type": "mcq", "q": "트럼프 행정부와 앤스로픽(Anthropic) 간의 미 국방부(DoD) 관련 실제 법적 분쟁의 핵심 쟁점으로 옳은 것은?", "opts": ["앤스로픽이 모델의 소스코드를 오픈소스로 공개하는 것을 거부했기 때문", "미 국방부의 자율무기 및 대량감시 등 모든 합법적 목적 사용 요구를 앤스로픽이 거부했기 때문", "베네수엘라 지도자 검거 과정에서 Claude가 오작동하여 군사적 피해를 입혔기 때문", "앤스로픽이 중국 빅테크 기업에 GPU 인프라를 무단으로 대여했기 때문"], "a": 1, "expl": "실제 사실관계에 따르면, 미 국방부가 Claude 모델을 자율무기 및 국내 대량감시를 포함한 '모든 합법적 목적'에 사용할 수 있도록 요구했으나 앤스로픽이 이를 거부했습니다. 이에 트럼프 행정부가 사용 중단 및 공급망 위험 지정을 단행하자 앤스로픽이 소송을 제기한 흐름이며, 이는 소버린 AI 및 모델 다양성의 필요성을 보여주는 사례입니다."}, {"id": "NL003", "src": "custom", "lec": 1, "cat": "AI트렌드", "diff": "중", "type": "mcq", "q": "강의록에서 전문가의 스펙트럼과 관련하여 경계한 '진격의 거인 콤플렉스'에 대한 설명으로 가장 적절한 것은?", "opts": ["성능이 가장 좋은 대형 프론티어 모델만 고집하며 예산을 낭비하는 현상", "수십억 원 이상의 거대한 AX 사업에 함몰되어 정작 내 책상 위의 작은 문제를 풀 에너지를 잃는 것", "오픈소스 모델의 크기를 무분별하게 키워 로컬 PC의 메모리를 초과시키는 상태", "보안 규정을 무시하고 대용량의 공공 데이터를 외부 클라우드로 유출하는 태도"], "a": 1, "expl": "진격의 거인 콤플렉스는 거대한 규모의 AX(AI 전환) 사업이 구축되어야만 AI 도입이 가능하다고 착각하여, 정작 내 책상 위에서 2~5분 내에 풀 수 있는 미시적 혁신과 작은 문제 해결 과제를 간과하는 마인드셋을 경계하는 표현입니다."}, {"id": "NL004", "src": "custom", "lec": 1, "cat": "AI트렌드", "diff": "중", "type": "mcq", "q": "강의에서 '인간이 감각으로 아는 현상이나 암묵지를 컴퓨터가 이해할 수 있도록 정량화하는 모든 노력'으로 정의한 개념은?", "opts": ["AX (AI Transformation)", "DX (Digital Transformation)", "RAG (Retrieval-Augmented Generation)", "GEO (Generative Engine Optimization)"], "a": 1, "expl": "강의에서는 응급실의 '통증 1~10점 척도' 비유를 들어, 인간의 감각적 현상과 암묵지를 컴퓨터가 인식할 수 있도록 정량 데이터화하는 노력을 DX(디지털 전환)로 정의했습니다. AX는 이 정량화된 데이터 위에 비정형 표현까지 세밀하게 분석하는 한 라인의 흐름입니다."}, {"id": "NL005", "src": "custom", "lec": 1, "cat": "AI트렌드", "diff": "상", "type": "mcq", "q": "Brendan Bycroft의 3D 시각화 데모(bbycroft.net/llm) 구조의 기준이 되는 GPT-2 small 모델의 수치적 특징으로 옳은 것은?", "opts": ["임베딩 차원이 4096차원이며 어텐션 블록이 96층 쌓여 있다", "단어를 768차원 좌표로 임베딩하며 어텐션 블록이 12층 쌓여 있다", "Query, Key, Value 벡터로 변환될 때 총 1036차원으로 고정된다", "파라미터 수가 공식적으로 3조(3000 빌리언) 개에 달한다"], "a": 1, "expl": "GPT-2 small 모델은 단어를 768차원의 벡터 공간으로 임베딩하며, Q·K·V 세 벡터로 변환 시 768 × 3 = 2304차원이 됩니다. 이 구조를 처리하는 어텐션 블록이 12층 쌓여 반복되는 메커니즘을 가집니다."}, {"id": "NL006", "src": "custom", "lec": 1, "cat": "AI트렌드", "diff": "중", "type": "mcq", "q": "모델 비교 및 순위 사이트 중 Alan D. Thompson 박사가 직접 수작업으로 매일 갱신하며, 데이터 표에서 '기울임 글씨'를 추정치로 표시하는 곳은?", "opts": ["Artificial Analysis", "LMArena", "LifeArchitect Models Table", "Hugging Face Leaderboard"], "a": 2, "expl": "LifeArchitect Models Table은 Alan D. Thompson 박사가 수작업으로 800개 이상의 모델 정보를 갱신하는 구글 시트 기반 표입니다. 이 표에서 보통 글씨는 공개된 사실, 기울임 글씨는 추정치를 의미합니다."}, {"id": "NL007", "src": "custom", "lec": 1, "cat": "생성형AI활용", "diff": "중", "type": "mcq", "q": "프롬프트를 작성할 때 이전 대화 맥락이나 작성 과정의 서술로 인해 대화창이 오염되는 것을 방지하기 위한 올바른 작업 습관은?", "opts": ["하나의 채팅창에서 수정 버튼을 누르지 않고 끝까지 대화를 이어간다", "메타 프롬프트로 완성된 최종 지침 프롬프트는 반드시 '새 창'을 열어 실행한다", "영어로 작성된 시스템 프롬프트는 항상 한국어로 번역한 뒤 같은 창에 실행한다", "동일한 프롬프트를 3개 이상의 모델에 동시에 번역 요청하여 병합한다"], "a": 1, "expl": "프롬프트를 만드는 과정에서 발생한 대화 맥락(컨텍스트)이 대화창에 누적되면 모델이 오염된 맥락의 영향을 받아 엉뚱한 답을 낼 수 있습니다. 따라서 정제된 최종 프롬프트는 반드시 깨끗한 '새 창'으로 옮겨 실행하는 것이 권장됩니다."}, {"id": "NL008", "src": "custom", "lec": 1, "cat": "AI트렌드", "diff": "상", "type": "mcq", "q": "인공신경망 학습 과정에서 정답과 출력이 얼마나 틀렸는지를 계산하는 '손실함수(Loss)'의 오차를 바탕으로, 가중치(Weight)를 거꾸로 전파하여 수정해 나가는 알고리즘의 명칭은?", "opts": ["순전파 (Forward Propagation)", "백프로파게이션 (Backpropagation, 역전파)", "도구 호출 (Tool Calling)", "퍼지 매칭 (Fuzzy Matching)"], "a": 1, "expl": "정답과 모델의 출력 간 오차를 역방향으로 전파하여 신경망의 방정식 계수인 가중치(Weight)를 조금씩 고쳐나가는 결정을 수행하는 알고리즘을 백프로파게이션(역전파)이라고 합니다. 제프리 힌턴 교수가 이 연구 등으로 2024년 노벨 물리학상을 수상했습니다."}, {"id": "NL009", "src": "custom", "lec": 1, "cat": "AI트렌드", "diff": "중", "type": "mcq", "q": "2026년 기준 프론티어 LLM의 기술 트렌드 중, 사용자가 지시한 자동화를 넘어서 '무엇을 할지 판단하고 의사결정까지 내리는 단계'를 지칭하는 용어는?", "opts": ["룰 베이스 자동화 (RPA)", "에이전틱 AI (Agentic AI)", "인컨텍스트 러닝 (In-context Learning)", "소버린 인프라 (Sovereign Infrastructure)"], "a": 2, "expl": "단순히 지시된 태스크를 수행하는 에이전트 수준을 넘어, 자율적으로 무엇을 왜 해야 하는지 스스로 판단하고 최종 의사결정까지 위임받는 단계를 '에이전틱 AI(Agentic AI)'라고 부르며, 실무 적용 시에는 인간 승인(Approval) 단계를 결합하는 거버넌스가 중요합니다."}, {"id": "NL010", "src": "custom", "lec": 1, "cat": "생성형AI활용", "diff": "하", "type": "mcq", "q": "1회차 환경설정 체크리스트 및 강의 안내에서, 외부망이 엄격하게 차단된 공공 폐쇄망 환경의 대안으로 제시한 로컬 오프라인 STT(음성-텍스트 변환) 엔진 도구는?", "opts": ["Ollama", "faster-whisper", "Antigravity", "Supabase"], "a": 1, "expl": "폐쇄망이나 외부망 차단 환경에서 로컬 언어모델 구동에 Ollama를 쓴다면, 오프라인 환경에서 고속으로 음성을 텍스트로 변환하는 기능을 구현하기 위한 대안으로는 faster-whisper 엔진을 로컬에 올려 활용할 수 있습니다."}, {"id": "NL011", "src": "custom", "lec": 2, "cat": "서비스구현", "diff": "상", "type": "mcq", "q": "강사가 구현한 'Who am I' 검색 시스템(LLM-free)의 구조와 컴포넌트에 대한 설명으로 옳은 것은?", "opts": ["사용자의 질문과 텍스트 정보를 벡터 DB에 임베딩하여 시맨틱 서치를 수행한다", "외부 클라우드 AI API에 실시간 통신하여 토큰 비용을 발생시킨다", "RSS(XML) 통로와 Fuse.js 퍼지 검색, BM25, 레벤슈타인 거리 등 룰 기반 알고리즘으로만 동작한다", "다국어 동의어 처리와 맥락적 의미 이해 능력이 매우 뛰어나다"], "a": 2, "expl": "강사의 'Who am I' 시스템은 임베딩 모델이나 LLM을 전혀 쓰지 않고(LLM-free), 구식 표준인 RSS 데이터와 Fuse.js(자바스크립트 퍼지 검색 라이브러리), BM25, 레벤슈타인 거리 같은 고전적 문자열 매칭 규칙으로만 구현되어 비용이 없고 폐쇄망 이식이 쉽습니다."}, {"id": "NL012", "src": "custom", "lec": 2, "cat": "AI트렌드", "diff": "하", "type": "mcq", "q": "강사가 최신 AI 동향을 가장 빠르게 수집하는 '비밀 장소'로 꼽았으며, 하루 5~10개씩 GIF와 함께 정보가 공유되는 스레드(Threads)의 익명 추천 계정명은?", "opts": ["AI 타임즈", "오픈AI 초이", "안드레이 카파시", "Alan D. Thompson"], "a": 1, "expl": "강사는 공식 신문이나 유튜브보다 빠르게 최신 AI 소식을 카드뉴스 및 GIF 형태로 공유해 주는 스레드의 '오픈AI 초이' 계정을 강력 추천하며, 이러한 개인 채널을 트렌드 파이프라인에 편입시킬 것을 권장했습니다."}, {"id": "NL013", "src": "custom", "lec": 2, "cat": "생성형AI활용", "diff": "상", "type": "mcq", "q": "2026년 4월 공개된 오픈소스 모델 'OpenAI Privacy Filter'의 동작 매커니즘 및 목적으로 가장 올바른 것은?", "opts": ["1536차원의 벡터 임베딩 후 다차원 데이터를 시각화 다이어그램으로 변환하는 모델이다", "클라우드 LLM으로 텍스트를 전송하기 직전, 로컬(온프레미스) 단계에서 8개 범주의 개인정보(PII)를 분류해 가려주는 모델이다", "웹페이지의 악성 광고 스크립트와 방화벽 침입 시도를 실시간으로 탐지하는 보안 필터다", "입력 토큰과 출력 토큰의 비율을 조정하여 API 청구 과금액을 70% 이상 절감하는 알고리즘이다"], "a": 1, "expl": "OpenAI Privacy Filter는 1.5B(활성 50M) 크기의 양방향 토큰 분류 모델로, 사용자가 외부 클라우드 LLM으로 텍스트를 보내기 전 로컬 환경에서 이름·주소·계좌·비밀번호 등 8개 범주의 개인정보(PII)를 찾아 자동으로 마스킹(가림)해 주는 역할을 수행합니다."}, {"id": "NL014", "src": "custom", "lec": 2, "cat": "서비스구현", "diff": "중", "type": "mcq", "q": "op
